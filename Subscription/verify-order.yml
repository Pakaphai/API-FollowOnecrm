http:
  method: POST
  url: "{{sale_uat}}/api/v1/subscription/orders/verify"
  body:
    type: json
    data: |-
      {
        "platform": "google_play",
        "product_id": "basic_monthly_pack",
        "purchase_token": "fake-token",
        "order_id": 16
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # POST /api/v1/subscription/orders/verify — ส่งใบเสร็จจากร้านมาตรวจและเปิดใช้งาน

  เส้นที่สำคัญที่สุดของกลุ่ม เซิร์ฟเวอร์**ตรวจใบเสร็จกับร้านเอง** (ไม่เชื่อค่าที่แอปส่ง) แล้ว
  จับคู่กับออเดอร์ → เปิดใช้งานแพ็กเกจ → ปิดงานกับร้าน (Google: consume ให้ · Apple: บอกให้แอป finish)

  **ส่งซ้ำได้ไม่จำกัด (idempotent)** ใบเสร็จที่เปิดใช้งานไปแล้วตอบ `200` พร้อมสถานะปัจจุบันอีกครั้ง
  **เฉพาะแอดมิน (level 0/1)** · standalone ได้ `404`

  ```
  POST /api/v1/subscription/orders/verify
  Authorization: Bearer <token>
  Content-Type: application/json
  ```

  ---

  ## Request

  Android:
  ```json
  { "platform": "google_play", "product_id": "basic_monthly_pack", "purchase_token": "<Purchase.purchaseToken>", "order_id": 42 }
  ```

  iOS:
  ```json
  { "platform": "app_store", "signed_transaction": "<Transaction.jwsRepresentation>", "order_id": 42 }
  ```

  | ฟิลด์ | บังคับ | กติกา | เอามาจาก |
  |---|:---:|---|---|
  | `platform` | ✅ | `google_play` / `app_store` | |
  | `product_id` | Android | string ≤ 120 | `Purchase.products[0]` |
  | `purchase_token` | Android | string ≤ 4000 | `Purchase.purchaseToken` |
  | `signed_transaction` | iOS | string ≤ 20000 | `Transaction.jwsRepresentation` ของ `VerificationResult.verified` |
  | `order_id` | — | int | `order.id` จาก create-order · ไม่บังคับ แต่**แนะนำให้ส่งเสมอ** |

  `order_id` ใช้เฉพาะเมื่อใบเสร็จไม่มี `account_token` (แอปลืมแนบตอนซื้อ) ถ้าใบเสร็จมี token เซิร์ฟเวอร์ยึด token ก่อน

  ---

  ## เซิร์ฟเวอร์ทำอะไรบ้าง (ลำดับจริง)

  ### 1. ตรวจใบเสร็จกับร้าน

  | ร้าน | วิธี | สิ่งที่ได้ |
  |---|---|---|
  | Google Play | เรียก Google Play Developer API `purchases.products.get` ด้วย service account | `purchaseState` (0 ซื้อแล้ว / 1 ยกเลิก / 2 รอจ่าย) · `quantity` · `orderId` · `obfuscatedExternalAccountId` · `purchaseType` (0 = license tester → sandbox) |
  | App Store | ตรวจลายเซ็น JWS ออฟไลน์ด้วย certificate chain ที่จบที่ Apple Root CA G3 | `bundleId` ต้องตรงแอปเรา · `type` ต้องเป็น `Consumable` / `Non-Renewing Subscription` · `quantity` · `transactionId` · `appAccountToken` · `revocationDate` (มี = คืนเงินแล้ว) · `environment` (ไม่ใช่ Production → sandbox) |

  ตรวจไม่ผ่าน → `422 store_purchase_invalid` · ร้านล่ม/สิทธิ์ไม่พอ → `503 store_unavailable` / `502 store_error`

  ### 2. ใบเสร็จทดสอบ

  ถ้า `environment = sandbox` และเซิร์ฟเวอร์ไม่เปิด `STORE_BILLING_ALLOW_TEST_PURCHASES` → `422 store_test_purchase_rejected`
  (UAT เปิด · production ปิด)

  ### 3. หาออเดอร์

  1. เคยผูก `transactionId` นี้แล้ว → ใช้ออเดอร์เดิม (กรณีส่งซ้ำ) · ถ้าเป็นของบริษัทอื่น → `404 order_not_found`
  2. ยังไม่เคย → หาจาก `account_token` ในใบเสร็จ → ไม่มีค่อยใช้ `order_id` ที่แอปส่ง → ต้องเป็นของบริษัทเดียวกัน ไม่งั้น `404 order_not_found`
  3. ตรวจว่าใบเสร็จตรงออเดอร์: ร้านเดียวกัน · `product_id` เดียวกัน → ไม่ตรง `409 purchase_mismatch` (**จำนวนไม่ตรวจ** ดูข้อ 5)
  4. ออเดอร์เคยจ่ายด้วยใบเสร็จอื่น → `409 order_already_paid` · ออเดอร์ถูกคืนเงินไปแล้ว → `409 order_reversed`
  5. **จำนวนในใบเสร็จไม่เท่าที่สั่ง** (Android ผู้ใช้เลือกจำนวนเองในหน้า Google) → ปรับ `seats` / `extra_seats` / `amount` ของออเดอร์ตามที่จ่ายจริง เก็บที่สั่งไว้ใน `store_quantity_ordered` แล้วเปิดใช้งานตามนั้น — ลูกค้าจ่ายเท่าไรได้เท่านั้น ไม่ปฏิเสธ (จ่ายมากกว่าก็ได้มากกว่า) · คิดราคาไม่ได้ → `409 purchase_mismatch`

  ### 4. เดินสถานะตามใบเสร็จ

  | ใบเสร็จบอกว่า | เซิร์ฟเวอร์ทำ | ตอบ |
  |---|---|---|
  | ยกเลิก / คืนเงิน | ออเดอร์ที่ `paid` อยู่ → `reversed` (แพ็กเกจ**ไม่ถูกลด** ให้เจ้าหน้าที่ดู) · ที่ยังไม่จ่าย → `canceled` | `409 purchase_canceled` |
  | รอจ่าย (Google pending purchase เช่น จ่ายเงินสดที่ร้านสะดวกซื้อ) | เก็บ `purchase_token` ไว้ให้การแจ้งเตือนรอบหน้าหาเจอ ยังไม่ผูก transaction id | `202 purchase_pending` |
  | ซื้อสำเร็จ | ถ้าออเดอร์ถูกปิดไปแล้ว (`canceled` / `expired` / `failed`) **เปิดกลับ** → ผูกใบเสร็จ (unique ที่ DB) → เปิดใช้งานแพ็กเกจ → consume (Google) | `200` |

  เปิดใช้งาน = ตรรกะเดียวกับเว็บ: `subscription` ต่ออายุ/เริ่มรอบใหม่ · `seats_addon` บวกที่นั่งอย่างเดียว (ดู create-order / add-seats)

  ---

  ## Response (200 OK) — จ่ายสำเร็จ เปิดใช้งานแล้ว

  ```json
  {
    "success": true,
    "message": "ชำระเงินสำเร็จ เปิดใช้งานแพ็กเกจให้แล้ว",
    "order": {
      "id": 42, "kind": "subscription", "status": "paid", "status_label": "ชำระเงินสำเร็จ",
      "is_final": true, "is_paid": true, "seats": 6, "billing_cycle": "monthly",
      "store_transaction_id": "GPA.3333-4444-5555-66666", "store_environment": "production",
      "store_quantity": 2, "store_quantity_ordered": 2, "quantity_adjusted": false,
      "paid_at": "2026-10-16T18:35:10+07:00", "…": "…"
    },
    "purchase": {
      "platform": "google_play",
      "transaction_id": "GPA.3333-4444-5555-66666",
      "finish_transaction": false,
      "consumed": true
    },
    "quantity_adjusted": false,
    "quantity": { "ordered": 2, "paid": 2, "ordered_seats": 6, "paid_seats": 6 }
  }
  ```

  | ฟิลด์ | แอปควรทำ |
  |---|---|
  | `purchase.finish_transaction` | iOS = `true` → เรียก `transaction.finish()` ได้แล้ว · Android = `false` เสมอ (ไม่ต้องทำอะไรกับ Play) |
  | `purchase.consumed` | Android: `true` = เซิร์ฟเวอร์ consume กับ Google แล้ว · `false` = เปิดใช้งานแล้วแต่ consume ไม่สำเร็จ **ให้ส่ง verify ซ้ำภายหลัง** (ไม่งั้น Google คืนเงินอัตโนมัติใน 3 วัน) · iOS = `true` เสมอ |
  | `purchase.transaction_id` | เลขธุรกรรมของร้าน เก็บไว้ให้ลูกค้าอ้างอิงตอนติดต่อเจ้าหน้าที่ |
  | `quantity_adjusted` | `true` = จำนวนที่จ่ายกับร้านไม่เท่าที่สั่ง **เปิดใช้งานตามที่จ่ายจริงแล้ว** และ `message` บอกว่าได้เท่าไร → **แสดง `message` แทนข้อความสำเร็จปกติ** |
  | `quantity` | `ordered` / `paid` = ชิ้นที่สั่ง / จ่ายจริง · `ordered_seats` / `paid_seats` = คิดเป็นผู้ใช้แล้ว |

  จากนั้น**โหลด `subscription/status` และ `seats` ใหม่** เพราะแพ็กเกจ/โควตาเปลี่ยนแล้ว

  ### กรณี `quantity_adjusted = true` — จ่ายไม่เท่าที่สั่ง (Android เท่านั้น)

  Play Billing ไม่มี `setQuantity()` ผู้ใช้ต้องแก้จำนวนเองในหน้าจ่ายเงินของ Google ซึ่งขึ้นมา 1 ชิ้น ออเดอร์ที่ต้องซื้อ 2 ชิ้นจึงมีใบเสร็จ 1 ชิ้นมาได้
  เซิร์ฟเวอร์**ไม่ปฏิเสธ** — ลูกค้าจ่ายเท่าไรได้เท่านั้น ปรับที่นั่ง/ยอดเงินตามใบเสร็จ เปิดใช้งาน consume ตามปกติ แล้วตอบ

  ```json
  {
    "success": true,
    "message": "ชำระเงินสำเร็จ ได้รับ 1 แพ็ก (3 ผู้ใช้) จากที่เลือกไว้ 2 แพ็ก (6 ผู้ใช้) เพราะจำนวนที่ชำระกับร้านต่างจากที่เลือก ซื้อเพิ่มได้จากหน้าจัดการที่นั่ง",
    "order": { "id": 42, "status": "paid", "seats": 3, "store_quantity": 1, "store_quantity_ordered": 2, "quantity_adjusted": true, "…": "…" },
    "purchase": { "platform": "google_play", "finish_transaction": false, "consumed": true },
    "quantity_adjusted": true,
    "quantity": { "ordered": 2, "paid": 1, "ordered_seats": 6, "paid_seats": 3 }
  }
  ```

  แอป: แสดง `message` ให้ชัด แล้วพาไป `add-seats` ถ้าต้องการที่เหลือ · จ่ายมากกว่าที่สั่ง (เช่น 3 ชิ้น) ก็ได้ 3 แพ็กเช่นกัน
  iOS ไม่เกิด (`.quantity(n)` กำหนดจำนวนได้) จะได้ `quantity_adjusted = false` ตลอด

  ## Response (202 Accepted) — ร้านรับคำสั่งซื้อแล้ว เงินยังไม่เข้า

  ```json
  {
    "success": true,
    "code": "purchase_pending",
    "message": "ร้านค้ารับคำสั่งซื้อแล้ว กำลังรอการชำระเงิน — ระบบจะเปิดใช้งานให้เมื่อได้รับเงิน",
    "order": { "id": 42, "status": "pending", "is_final": false, "…": "…" },
    "purchase": { "platform": "google_play", "finish_transaction": false, "consumed": false }
  }
  ```

  เกิดเฉพาะ Google (`purchaseState = 2`) ยังไม่ต้องทำอะไร เมื่อเงินเข้า Google จะแจ้งเซิร์ฟเวอร์เองทาง RTDN
  และแอปจะเห็น `Purchase` สถานะใหม่ใน `queryPurchasesAsync` → ส่ง verify ซ้ำ

  ---

  ## Error

  | HTTP | `code` | เมื่อไหร่ | แอปควรทำ |
  |:---:|---|---|---|
  | 422 | — (มี `errors`) | ฟิลด์ไม่ครบตาม platform | แก้ request |
  | 422 | `store_purchase_invalid` | ใบเสร็จปลอม / ไม่มีในร้าน / bundleId ไม่ตรง / ชนิดสินค้าไม่รองรับ / JWS ไม่มี transactionId | โชว์ `message` · ถ้าซื้อจริงให้ติดต่อเจ้าหน้าที่พร้อมเลขคำสั่งซื้อของร้าน |
  | 422 | `store_test_purchase_rejected` | ใบเสร็จ sandbox แต่เซิร์ฟเวอร์รับเฉพาะของจริง | เกิดเฉพาะตอนทดสอบ ใช้เซิร์ฟเวอร์ UAT |
  | 404 | `order_not_found` | ไม่มี token ในใบเสร็จและไม่ได้ส่ง `order_id` / ออเดอร์ของบริษัทอื่น | ส่งซ้ำพร้อม `order_id` |
  | 409 | `purchase_mismatch` | ร้าน / *สินค้า* ในใบเสร็จไม่ตรงออเดอร์ (แอปส่ง product id ผิดตัว) — จำนวนไม่ตรง**ไม่**เข้าข้อนี้แล้ว (ดู `quantity_adjusted`) | **อย่า finish / consume** ติดต่อเจ้าหน้าที่ |
  | 409 | `purchase_already_used` | ใบเสร็จนี้ถูกใช้เปิดใช้งาน**ออเดอร์อื่น**ไปแล้ว | finish ได้ ไม่มีอะไรต้องทำ |
  | 409 | `order_already_paid` | **ออเดอร์นี้**จ่ายด้วยใบเสร็จอื่นไปแล้ว | ติดต่อเจ้าหน้าที่ (อาจซื้อซ้ำ) |
  | 409 | `order_reversed` | ออเดอร์นี้ถูกคืนเงินไปแล้ว | สร้างออเดอร์ใหม่ |
  | 409 | `purchase_canceled` | ร้านยกเลิก / คืนเงินใบเสร็จนี้แล้ว | แสดงสถานะ |
  | 500 | `activation_failed` | ตรวจผ่านแต่เปิดใช้งานไม่สำเร็จ (เช่น หา tenant ไม่เจอ) | **อย่า finish / consume** ติดต่อเจ้าหน้าที่ |
  | 503 | `store_unavailable` | เซิร์ฟเวอร์ยังไม่ได้ตั้งค่าร้าน / ร้านปฏิเสธสิทธิ์ (401/403 จาก Google) | เก็บใบเสร็จไว้ส่งซ้ำภายหลัง |
  | 502 | `store_error` / `store_bad_response` | ร้านล่ม / ตอบรูปแบบแปลก | เก็บใบเสร็จไว้ส่งซ้ำภายหลัง |

  > หลักง่าย ๆ: ได้ `200` เท่านั้นถึง finish/consume ได้ · `409 purchase_already_used` finish ได้ · ที่เหลือเก็บใบเสร็จไว้ส่งซ้ำหรือให้คนดู

  ---

  ## กรณีที่แอปต้องรองรับ

  - **แอปปิดก่อนส่งใบเสร็จ**: ตอนเปิดแอปไล่ `queryPurchasesAsync` (Android) / `Transaction.unfinished` (iOS) แล้วส่ง verify ทุกใบ ไม่ต้องรู้ `order_id` เพราะมี `account_token`
  - **ร้านแจ้งผลมาถึงเซิร์ฟเวอร์ก่อนแอป** (RTDN / App Store Server Notification): เซิร์ฟเวอร์เปิดใช้งานไปแล้ว แอปส่ง verify มาจะได้ `200` ซ้ำ ปกติ
  - **ลูกค้ากด cancel-order แล้วเพิ่งไปจ่ายกับร้าน**: ใบเสร็จมาถึง → ออเดอร์เปิดกลับและเปิดใช้งานให้ เพราะเงินออกจากกระเป๋าลูกค้าแล้ว
  - **Google ตอบ `consumed: false`**: ตั้ง retry ส่ง verify ซ้ำ (เช่น ตอนเปิดแอปครั้งถัดไป) ภายใน 3 วัน

  📄 เอกสารเต็ม: `docs/api-subscription-purchase.md` หัวข้อ 5 · โค้ด: `StoreBillingService::settle()`

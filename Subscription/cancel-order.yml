docs: |
  # POST /api/v1/subscription/orders/{id}/cancel — ลูกค้าเปลี่ยนใจก่อนกดซื้อกับร้าน

  ปิดออเดอร์ `pending` ฝั่งเรา**ที่ยังไม่มีเงินเข้า** ใช้ตอนลูกค้ากดออกจากหน้าซื้อ หรือปิด dialog ของร้านโดยไม่ซื้อ
  ไม่มี body · **ส่งซ้ำได้** · **เฉพาะแอดมิน (level 0/1)** · standalone ได้ `404`

  ```
  POST /api/v1/subscription/orders/42/cancel
  Authorization: Bearer <token>
  Accept: application/json
  ```

  **ยกเลิกแค่ออเดอร์ฝั่งเราเท่านั้น** ไม่ได้ไปยกเลิกอะไรที่ร้าน
  ถ้าลูกค้ากดซื้อกับร้านไปแล้วและอยากได้เงินคืน ต้องขอคืนเงินผ่าน Google Play / App Store ตามขั้นตอนของร้าน

  ---

  ## เซิร์ฟเวอร์ตัดสินใจอย่างไร

  | สถานะออเดอร์ตอนเรียก | ผล | ตอบ |
  |---|---|---|
  | `pending` และ `store_transaction_id` ว่าง | เปลี่ยนเป็น `canceled` · `message = "รายการถูกยกเลิก"` · บันทึก log | `200` "ยกเลิกรายการแล้ว ยังไม่มีการตัดเงินจากบัญชีของคุณ" |
  | `pending` แต่ `store_transaction_id` มีค่าแล้ว (ร้านรับเงินแล้ว กำลังเปิดใช้งาน) | ไม่ทำอะไร | `409 not_cancelable` |
  | `paid` / `canceled` / `failed` / `expired` / `reversed` | ไม่ทำอะไร | `200` "รายการนี้จบไปแล้ว ไม่มีอะไรให้ยกเลิก" |

  ---

  ## Response (200 OK) — เพิ่งยกเลิก

  ```json
  {
    "success": true,
    "message": "ยกเลิกรายการแล้ว ยังไม่มีการตัดเงินจากบัญชีของคุณ",
    "order": {
      "id": 42,
      "status": "canceled",
      "status_label": "ยกเลิกรายการ",
      "is_final": true,
      "is_paid": false,
      "message": "รายการถูกยกเลิก",
      "…": "…"
    }
  }
  ```

  ## Response (200 OK) — ออเดอร์จบไปแล้ว (ส่งซ้ำ / จ่ายไปแล้ว)

  ```json
  {
    "success": true,
    "message": "รายการนี้จบไปแล้ว ไม่มีอะไรให้ยกเลิก",
    "order": { "id": 42, "status": "paid", "is_final": true, "is_paid": true, "…": "…" }
  }
  ```

  ให้ดู `order.status` ที่ส่งกลับมา ไม่ใช่แค่ `success` เพราะ `success: true` ไม่ได้แปลว่ายกเลิกสำเร็จเสมอ

  ## Response (409) — ร้านรับเงินแล้ว

  ```json
  {
    "success": false,
    "message": "ยกเลิกไม่ได้ — ร้านค้ารับชำระเงินของรายการนี้แล้ว",
    "code": "not_cancelable",
    "order": { "id": 42, "status": "pending", "store_transaction_id": "GPA.3333-…", "…": "…" }
  }
  ```

  error ตัวนี้แนบ `order` มาด้วย (ต่างจาก error อื่นในกลุ่ม) ให้แอปส่ง `verify-order` ต่อด้วยใบเสร็จที่มี เพื่อให้เปิดใช้งานจบ

  ---

  ## Error

  | HTTP | `code` | เมื่อไหร่ | แอปควรทำ |
  |:---:|---|---|---|
  | 409 | `not_cancelable` | ร้านรับเงินแล้ว | ส่ง `verify-order` ต่อ |
  | 404 | `not_found` | ไม่มีออเดอร์นี้ในบริษัท / standalone | ปิดหน้า |
  | 403 | `forbidden` | ไม่ใช่ level 0/1 | ซ่อนปุ่ม |

  ---

  ## ข้อควรรู้

  - **ออเดอร์ที่ยกเลิกแล้วยังฟื้นได้**: ถ้าลูกค้ากดยกเลิกฝั่งเราแต่เผลอจ่ายกับร้านไปแล้ว (หรือ Google pending purchase ที่เงินเข้าทีหลัง) ใบเสร็จมาถึง → เซิร์ฟเวอร์เปิดออเดอร์กลับและเปิดใช้งานให้ เพราะเงินออกจากกระเป๋าลูกค้าแล้ว
  - ออเดอร์ที่ได้ `202 purchase_pending` จาก verify ยัง `store_transaction_id` ว่าง จึง**ยกเลิกได้** แต่ถ้าเงินเข้าทีหลังก็จะถูกเปิดกลับตามข้อบน
  - แนะนำให้เรียกเส้นนี้ทุกครั้งที่ลูกค้าออกจาก flow ซื้อโดยไม่ได้ใบเสร็จ จะได้ไม่มีออเดอร์ `pending` ค้างในหลังบ้าน

  📄 เอกสารเต็ม: `docs/api-subscription-purchase.md` หัวข้อ 7

  content: |
    # Subscription — ซื้อแพ็กเกจ / ซื้อที่นั่งเพิ่ม จากแอปมือถือ

    แอปซื้อผ่าน **ร้านค้าของแพลตฟอร์มเท่านั้น** ไม่มีหน้าเว็บ checkout, บัตร, PromptPay, Apple Pay หรือ Google Pay ในแอป

    | แพลตฟอร์ม | ร้าน | ชนิดสินค้า | ใบเสร็จที่ต้องส่งให้เซิร์ฟเวอร์ |
    |---|---|---|---|
    | Android | Google Play Billing | In-app product (one-time) เปิด multi-quantity | `product_id` + `purchase_token` จาก `Purchase` |
    | iOS | Apple In-App Purchase (StoreKit 2) | Consumable | `signed_transaction` = `Transaction.jwsRepresentation` |

    ## อัปเดต 16/10/2569 — สิ่งที่เปลี่ยนจากรอบ 14/10

    | เรื่อง | เดิม | ใหม่ |
    |---|---|---|
    | จำนวนในใบเสร็จไม่ตรงออเดอร์ | `409 purchase_mismatch` ไม่ consume | **ยึดใบเสร็จ** ปรับออเดอร์ตามที่จ่ายจริงแล้วเปิดใช้งาน · verify ตอบ `quantity_adjusted` + `message` |
    | บริษัทหมดอายุเกิน 3 วัน | ทุกเส้นโดน `403 subscription_expired` | **ยกเว้น** `subscription/status`, `products`, `orders*` → ต่ออายุจากแอปได้ |

    ## อัปเดต 29/10/2569 — แพ็กละ 5 ผู้ใช้ · รายเดือนอย่างเดียว · รหัสสินค้าใหม่ `monthly_basic_5`

    | เรื่อง | เดิม | ใหม่ |
    |---|---|---|
    | `product_id` | `basic_monthly` / `basic_semiannual` / `basic_yearly` | **`monthly_basic_5`** ตัวเดียว ทุกเส้น (products, create-order, add-seats, order-status, verify) |
    | สินค้าในร้าน | 3 ตัว (1 แพ็ก = 3 ผู้ใช้) | สร้างใหม่ 1 ตัว `monthly_basic_5` = 1 แพ็ก = **5 ผู้ใช้** ราคา rate card 199 ทั้ง Play Console และ App Store Connect (Consumable) · ชื่อเก่าเซิร์ฟเวอร์ไม่รับแล้ว ปิดการขายได้ |
    | `billing_cycle` | `monthly` / `semiannual` / `yearly` | **`monthly` เท่านั้น** — ส่งรอบอื่นได้ 422 · เอาตัวเลือก 6 เดือน / รายปี ออกจากแอป |
    | `pack_size` | 3 (3, 6, 9 …) | **5** (5, 10, 15 …) |
    | `max_quantity` (ทั้งสองร้าน) | Google 99 · Apple 10 | **2** = ซื้อได้ครั้งละไม่เกิน 2 แพ็ก (10 ผู้ใช้) |
    | ทดลองใช้ฟรี | 30 วัน | **60 วัน** (2 เดือน) ผู้ใช้สูงสุด 10 คน |
    | ต่ออายุผ่านแอป | ได้ทุกบริษัท | **ต่อเป็นแพ็กเกจ 10 ผู้ใช้เสมอ** ได้เมื่อแพ็กเกจไม่เกิน 10 ที่นั่งและผู้ใช้งานไม่เกิน 10 คน · เกินนั้นต่อได้แค่เว็บ · **เพิ่มผู้ใช้ผ่านแอปไม่ได้** (`orders/seats` ตอบ 403) · ดู `package_renewal` ใน subscription/status |
    | `add-seats` กลางรอบ | — | ที่นั่งที่เพิ่มหมดอายุพร้อมรอบเดิม (ร้านค้าแอปคิดเต็มแพ็ก) |

    ## อัปเดต 26/10/2569 — iOS ใช้สินค้า Consumable ซื้อหลายชิ้นได้

    | เรื่อง | ใหม่ |
    |---|---|
    | ชนิดสินค้า iOS | **Consumable** (ยกเลิก Non-Renewing Subscription 45 ตัว) · ต้องสร้างสินค้า Consumable ใหม่ใน App Store Connect 3 ตัว (1 แพ็กต่อรอบบิล) |
    | จำนวนชิ้น iOS | `max_quantity` = 10 → ส่ง `.quantity(purchase.quantity)` ตอนซื้อ · สูงสุด 10 แพ็ก = 30 ผู้ใช้ต่อครั้ง |
    | `GET subscription/products` | เพิ่ม `product_type`, `price_markup_percent`, `rate_card_price` · `reference_price` = rate card (ไม่บวก 37%) · `product_id` เปลี่ยนเป็น `basic_monthly` / `basic_semiannual` / `basic_yearly` ทุกเส้น (ตรงชื่อในร้าน) |

    **ห้าม hardcode product_id ในแอป** — ตอนซื้อใช้ `purchase.product_id` จาก `create-order` / `add-seats` เสมอ

    **ราคาที่ลูกค้าจ่ายจริงคือราคาที่ตั้งในร้าน** (Play Console / App Store Connect) เซิร์ฟเวอร์ควบคุมไม่ได้
    ค่า `amount` / `reference_price` ที่ API คืนมาเป็นแค่ราคาตาม rate card ฝั่งเราไว้เทียบ **ห้ามเอาไปโชว์เป็นราคาขาย**
    ให้โชว์ `ProductDetails.oneTimePurchaseOfferDetails.formattedPrice` (Android) / `Product.displayPrice` (iOS) แทน

    ---

    ## เส้นทั้งหมดในกลุ่มนี้

    | ลำดับ | เส้น | ทำอะไร | ใครเรียกได้ |
    |:---:|---|---|---|
    | 1 | `GET subscription/products` | รหัสสินค้าในร้านทุกตัว ให้แอปไป query ราคาจากร้านล่วงหน้า | ทุก level ที่ล็อกอิน |
    | 2 | `POST subscription/orders` | ซื้อ / ต่ออายุแพ็กเกจ Basic → ได้ `purchase{product_id, quantity, account_token}` | แอดมิน (level 0/1) |
    | 3 | `POST subscription/orders/seats` | ซื้อที่นั่งเพิ่มกลางรอบ (ไม่ต่อวันหมดอายุ) → ได้ `purchase{…}` | แอดมิน |
    | 4 | `POST subscription/orders/verify` | ส่งใบเสร็จจากร้านมาตรวจ → เซิร์ฟเวอร์เปิดใช้งานแพ็กเกจ | แอดมิน |
    | 5 | `GET subscription/orders/{id}` | สถานะออเดอร์ (source of truth) + คำสั่งซื้อที่ต้องทำกับร้าน | แอดมิน |
    | 6 | `POST subscription/orders/{id}/cancel` | ยกเลิกออเดอร์ที่ยังไม่ได้ซื้อกับร้าน | แอดมิน |

    `GET subscription/status` (สถานะแพ็กเกจ + คำเตือนต่ออายุ) อยู่ใน folder นี้ด้วยแต่เป็นคนละเรื่อง ดู `docs/api-subscription-status.md`

    ---

    ## ลำดับที่แอปต้องทำ (happy path)

    ```
    แอป                                      เซิร์ฟเวอร์เรา                        ร้าน (Google Play / App Store)
     │  0. GET subscription/products             │                                     │
     │ ───────────────────────────────────────▶  │                                     │
     │  ◀── product_id ทุกตัว ────────────────── │                                     │
     │  query ราคาจากร้านด้วย product_id ─────────────────────────────────────────────▶│
     │  ◀────────────────────── ProductDetails / Product (ราคาจริง) ────────────────── │
     │                                           │                                     │
     │  1. POST subscription/orders (หรือ /seats) │                                     │
     │ ───────────────────────────────────────▶  │  สร้างออเดอร์ pending + account_token │
     │  ◀── order + purchase{product_id,         │                                     │
     │        quantity, account_token} ───────── │                                     │
     │                                           │                                     │
     │  2. กดซื้อกับร้าน แนบ account_token ──────────────────────────────────────────▶│
     │  ◀──────────────────── ใบเสร็จ (purchaseToken / JWS) ───────────────────────── │
     │                                           │                                     │
     │  3. POST subscription/orders/verify        │                                     │
     │ ───────────────────────────────────────▶  │  ตรวจใบเสร็จกับร้าน ────────────────▶│
     │                                           │  เปิดใช้งานแพ็กเกจ · consume (Google) │
     │  ◀── 200 order.status = paid ──────────── │                                     │
     │  4. iOS: transaction.finish()              │  ◀── แจ้งเตือนจากร้าน (คืนเงิน ฯลฯ) ── │
     │  5. โหลด subscription/status + seats ใหม่  │                                     │
    ```

    ## กฎ 5 ข้อที่ห้ามพลาด

    1. **สร้างออเดอร์ก่อนกดซื้อเสมอ แล้วแนบ `purchase.account_token` ไปกับการซื้อ**
       - Android: `BillingFlowParams.Builder().setObfuscatedAccountId(account_token)`
       - iOS: `product.purchase(options: [.appAccountToken(UUID(uuidString: account_token)!)])`
       เซิร์ฟเวอร์ใช้ token นี้หาออเดอร์จากใบเสร็จ แม้แอปปิดไปก่อนส่งใบเสร็จ หรือร้านแจ้งผลมาเองทางหลังบ้าน ก็ยังเปิดใช้งานให้ถูกบริษัท
    2. **ซื้อสินค้าตาม `purchase.product_id` เท่านั้น** ใบเสร็จที่*สินค้า*ไม่ตรงออเดอร์ (เช่น สั่งรายเดือนแต่ซื้อรายปี) จะถูกปฏิเสธ (`purchase_mismatch`) และไม่ถูก consume
       ส่วน*จำนวน* เซิร์ฟเวอร์ยึดตามใบเสร็จของร้าน ไม่ปฏิเสธ (ดู `quantity_adjusted` ใน verify-order)
       - Android: Play Billing **ไม่มี `setQuantity()`** ผู้ใช้ต้องเปลี่ยนจำนวนเองในหน้าจ่ายเงินของ Google (ขึ้นมาเป็น 1 ชิ้นเสมอ) → ถ้า `purchase.quantity > 1` **แสดงข้อความก่อนเปิดหน้าจ่ายเงิน** เช่น "ในหน้าชำระเงินของ Google กรุณาเปลี่ยนจำนวนเป็น 2 ชิ้น" (เซิร์ฟเวอร์เลือกสินค้าขนาดพอดีให้ก่อนเสมอ กรณีนี้จึงเกิดน้อย)
       - iOS: ใช้ `.quantity(n)` ได้เลย ไม่มีปัญหานี้
    3. **ส่งใบเสร็จให้เซิร์ฟเวอร์ก่อน finish / consume**
       - Android: เซิร์ฟเวอร์ consume ให้เอง **ห้าม** แอปเรียก `consumeAsync` เอง
       - iOS: เรียก `transaction.finish()` **หลัง** ได้ `200` จาก `/verify` เท่านั้น
    4. **ส่งใบเสร็จซ้ำได้** (`/verify` idempotent) ตอนเปิดแอปให้ไล่ใบเสร็จที่ค้าง (Android `queryPurchasesAsync` ที่ยังไม่ consume · iOS `Transaction.unfinished`) แล้วส่ง `/verify` ซ้ำทุกใบ
    5. **ราคาที่โชว์ต้องเป็นราคาจากร้าน** ไม่ใช่ `amount` / `reference_price`

    ---

    ## สิทธิ์และด่านที่ทุกเส้นต้องผ่าน

    ทุกเส้นอยู่ใต้ middleware `auth_api` เหมือน API อื่น แล้ว controller ตรวจเพิ่มเอง (ยกเว้น `products` ที่ตรวจแค่ล็อกอิน)

    | ลำดับตรวจ | ไม่ผ่านตอบ | `code` | เงื่อนไข |
    |:---:|:---:|---|---|
    | 1 | 401 | `token_invalid` / `token_blacklisted` | ไม่มี token / token ผิด / ออกจากระบบไปแล้ว (รูปแบบ `{status:"error"}` ของ middleware) |
    | 2 | — | — | ด่าน `subscription_expired` **ยกเว้น** ให้กลุ่มนี้ทั้งหมด + `subscription/status` (บริษัทที่หมดอายุเกิน 3 วันต้องต่ออายุจากแอปได้) |
    | 3 | 403 | `seat_suspended` | บัญชีคนนี้ถูกระงับเพราะโควตาไม่พอ |
    | 4 | — | — | ด่าน `seat_quota_exceeded` **ยกเว้น** ให้กลุ่มนี้ทั้งหมด (บริษัทที่เกินโควตาต้องซื้อที่นั่งเพิ่มได้) |
    | 5 | 404 | `not_found` | บริษัทโหมด standalone (ขายเป็นสัญญารายลูกค้า ไม่มีแพ็กเกจให้ซื้อ) |
    | 6 | 403 | `forbidden` | ผู้ใช้ไม่ใช่ level 0/1 (เซลส์ซื้อแพ็กเกจแทนบริษัทไม่ได้) |

    ### บริษัทที่หมดอายุแล้ว (ต่ออายุจากแอป)

    เลยกำหนดเกิน 3 วัน → เส้นงานทั่วไปโดน `403 subscription_expired` แต่กลุ่มนี้ + `subscription/status` ยังเรียกได้
    flow: `subscription/status` (`is_blocked: true`) → แสดงหน้าต่ออายุ → แอดมินซื้อผ่าน `create-order` ตามปกติ → verify ผ่าน = ทุกเส้นกลับมาใช้ได้ทันที ไม่ต้องล็อกอินใหม่
    แพ็กเกจเริ่มนับจากวันที่จ่าย (ไม่ต่อท้ายวันหมดอายุเดิมที่เลยไปแล้ว) · ผู้ใช้ที่ไม่ใช่แอดมินยังโดน `403` ทุกเส้น → แสดง "กรุณาติดต่อผู้ดูแลระบบของบริษัทเพื่อต่ออายุ"

    ## รูปแบบ error

    มี 3 รูปแบบ แอปควร parse ให้ครบ

    ```json
    { "success": false, "message": "ข้อความไทยพร้อมแสดง", "code": "store_unavailable" }          // error จาก controller / service
    { "success": false, "message": "กรุณาระบุจำนวนผู้ใช้", "errors": { "seats": ["…"] } }        // 422 validation (ไม่มี code)
    { "status": "error",  "message": "Token invalid", "code": "token_invalid" }                  // error จาก middleware auth_api
    ```

    `message` ทุกตัวเป็นภาษาไทยพร้อมแสดงผู้ใช้ได้เลย ส่วน `code` ไว้ให้แอปแยก flow

    ---

    ## โครง `order` ที่คืนทุกเส้น (create / seats / verify / show / cancel)

    | ฟิลด์ | ชนิด | ความหมาย |
    |---|---|---|
    | `id` | int | เลขออเดอร์ฝั่งเรา ใช้กับ `/orders/{id}` และ `order_id` ใน `/verify` |
    | `kind` | string | `subscription` = ซื้อ/ต่อแพ็กเกจ · `seats_addon` = ซื้อที่นั่งเพิ่ม |
    | `status` | string | `pending` / `paid` / `failed` / `expired` / `reversed` / `canceled` |
    | `status_label` | string | ป้ายไทยของ `status` พร้อมแสดง |
    | `is_final` | bool | `true` = ไม่ใช่ `pending` แล้ว จบแล้วไม่ว่าทางไหน |
    | `is_paid` | bool | `true` = `status == paid` เปิดใช้งานให้แล้ว |
    | `seats` | int | ยอดผู้ใช้**รวม**หลังเปิดใช้งาน (seats_addon = ที่นั่งเดิม + ที่เพิ่ม) |
    | `extra_seats` | int \| null | จำนวนที่เพิ่ม เฉพาะ `kind = seats_addon` ไม่งั้น `null` |
    | `billing_cycle` | string | `monthly` / `semiannual` / `yearly` |
    | `amount` | float | ราคาอ้างอิงตาม rate card (บาท) ไม่ใช่ยอดที่ร้านเก็บ |
    | `amount_display` | string | `amount` ใส่ทศนิยม 2 ตำแหน่งแล้ว เช่น `"398.00"` |
    | `currency` | string | `THB` เสมอ |
    | `payment_method` | string | `google_play` / `app_store` ออเดอร์ใบนี้จ่ายได้เฉพาะร้านนี้ |
    | `refund_state` | string \| null | `null` / `pending` / `failed` / `succeeded` |
    | `message` | string \| null | ข้อความไทยเมื่อออเดอร์ไม่สำเร็จ/ถูกยกเลิก เช่น "รายการถูกยกเลิก" |
    | `store_transaction_id` | string \| null | Google `orderId` (GPA.xxxx) / Apple `transactionId` หลังตรวจใบเสร็จผ่าน |
    | `store_environment` | string \| null | `production` / `sandbox` (ซื้อทดสอบ) |
    | `store_quantity` | int \| null | จำนวนชิ้นที่**จ่ายจริง**กับร้าน (ก่อน verify = ที่สั่ง) |
    | `store_quantity_ordered` | int \| null | จำนวนชิ้นที่สั่งตอนสร้างออเดอร์ |
    | `quantity_adjusted` | bool | `true` = จ่ายไม่เท่าที่สั่ง เปิดใช้งานตามที่จ่ายจริงแล้ว (Android เท่านั้น) |
    | `paid_at` | ISO 8601 \| null | เวลาเปิดใช้งาน |
    | `created_at` | ISO 8601 | เวลาสร้างออเดอร์ |

    ## โครง `purchase` (create / seats / show)

    | ฟิลด์ | ความหมาย |
    |---|---|
    | `platform` | ร้านที่ต้องซื้อ |
    | `product_id` | รหัสสินค้าในร้านที่ต้องซื้อ (เซิร์ฟเวอร์เลือกสินค้าที่แพ็กตรงพอดีให้ก่อนเสมอ) |
    | `quantity` | จำนวนชิ้นที่ต้องซื้อ · iOS `.quantity(n)` · Android ถ้า `> 1` ต้องบอกผู้ใช้ไปเปลี่ยนในหน้าจ่ายเงินของ Google (ไม่มี `setQuantity`) |
    | `account_token` | UUID ที่ต้องแนบไปกับการซื้อ (กฎข้อ 1) |
    | `product_type` | `consumable` เสมอ |

    ---

    ## สภาพแวดล้อมทดสอบ (UAT)

    - UAT ตั้ง `STORE_BILLING_ALLOW_TEST_PURCHASES=true` จึงรับใบเสร็จจาก Apple Sandbox / Google license tester ได้ · production ปฏิเสธด้วย `store_test_purchase_rejected`
    - ราคาแพ็กบน UAT เป็นราคาจริงแล้ว 199 บาท/แพ็ก/เดือน (ตาราง `packages` ตั้งแต่ 29/10/2569 — เดิมตั้ง 10 บาทไว้ทดสอบ)
    - ออเดอร์ที่ซื้อทดสอบจะมี `store_environment = sandbox` และขึ้นป้าย "ทดสอบ" ในหลังบ้าน Central

    📄 เอกสารเต็มฝั่งเซิร์ฟเวอร์: `docs/api-subscription-purchase.md` · โค้ด: `ApiSubscriptionOrderController`, `Services/Payment/Store/StoreBillingService`

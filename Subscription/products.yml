docs: |
  # GET /api/v1/subscription/products — รหัสสินค้าในร้าน (Google Play / App Store)

  คืนรายการ `product_id` ทุกตัวที่เซิร์ฟเวอร์รู้จัก ทั้งสองร้าน
  ให้แอปเรียก**ตั้งแต่เปิดหน้าแพ็กเกจ** แล้วเอา `product_id` ไป query ราคาจริงจากร้าน

  - Android: `BillingClient.queryProductDetailsAsync()` ด้วย `ProductType.INAPP`
  - iOS: `Product.products(for: [product_id…])`

  ไม่มี body / query param · ไม่ต้องเป็นแอดมิน (**ทุก level** ที่ล็อกอินเรียกได้ ต่างจากเส้นอื่นในกลุ่ม)
  ไม่ตรวจโหมด standalone (บริษัท standalone ก็ได้รายการ แต่ไปสร้างออเดอร์ไม่ได้อยู่ดี)

  ```
  GET /api/v1/subscription/products
  Authorization: Bearer <token>
  Accept: application/json
  ```

  ---

  ## Response (200 OK)

  ```json
  {
    "success": true,
    "pack_size": 3,
    "stores": {
      "google_play": {
        "product_type": "consumable",
        "max_quantity": 99,
        "products": [
          { "product_id": "basic_monthly_pack",   "billing_cycle": "monthly", "packs": 1,  "seats": 3,  "reference_price": 199 },
          { "product_id": "basic_monthly_pack2",  "billing_cycle": "monthly", "packs": 2,  "seats": 6,  "reference_price": 398 },
          { "product_id": "basic_monthly_pack3",  "billing_cycle": "monthly", "packs": 3,  "seats": 9,  "reference_price": 597 },
          { "product_id": "basic_monthly_pack10", "billing_cycle": "monthly", "packs": 10, "seats": 30, "reference_price": 1990 },
          { "product_id": "basic_monthly_pack15", "billing_cycle": "monthly", "packs": 15, "seats": 45, "reference_price": 2985 },
          { "product_id": "basic_semiannual_pack", "billing_cycle": "semiannual", "packs": 1, "seats": 3, "reference_price": 995 },
          { "product_id": "basic_yearly_pack",     "billing_cycle": "yearly",     "packs": 1, "seats": 3, "reference_price": 1990 },
          "… รวม 39 รายการ (13 ขนาด × 3 รอบบิล)"
        ]
      },
      "app_store": {
        "product_type": "non_renewing_subscription",
        "max_quantity": 1,
        "products": [ "… รหัสชุดเดียวกับ google_play ทั้ง 39 รายการ …" ]
      }
    }
  }
  ```

  ### ฟิลด์

  | ฟิลด์ | ชนิด | ความหมาย |
  |---|---|---|
  | `pack_size` | int | ผู้ใช้ต่อ 1 แพ็ก (ตั้งที่หลังบ้าน `packages.seats_per_pack` ของ Basic · ค่าเริ่มต้น 3) ใช้เป็นขั้นของ stepper เลือกจำนวนผู้ใช้ |
  | `stores.<platform>.product_type` | string | `consumable` (Google: one-time product ผู้ใช้เลือกจำนวนในหน้าจ่ายเงิน) · `non_renewing_subscription` (Apple: ซื้อได้ครั้งละ 1 ชิ้น ห้ามส่ง `.quantity`) |
  | `stores.<platform>.max_quantity` | int | จำนวนชิ้นสูงสุดที่ร้านนั้นยอมให้ซื้อต่อครั้ง · Google 99 · **Apple 1** |
  | `products[].product_id` | string | รหัสสินค้าที่ต้องสร้างให้ตรงกันใน Play Console / App Store Connect · รหัส = `basic_<รอบบิล>_pack<N>` (N = จำนวนแพ็ก · 1 แพ็กไม่มีเลขต่อท้าย) |
  | `products[].billing_cycle` | string | รอบบิลที่สินค้านี้ให้ `monthly` / `semiannual` / `yearly` |
  | `products[].packs` | int | 1 ชิ้นของสินค้านี้ = กี่แพ็ก · มี 13 ขนาด: 1–10, 15, 20, 30 |
  | `products[].seats` | int | `packs × pack_size` = 1 ชิ้นได้ผู้ใช้กี่คน |
  | `products[].reference_price` | float \| null | ราคาตาม rate card ฝั่งเรา (บาท) ต่อ 1 ชิ้น = ราคาแพ็ก/เดือน × เดือนที่จ่ายจริง × `packs` · `null` = คิดไม่ได้ |

  ### วิธีคิด `reference_price`

  | รอบบิล | ใช้งานได้ | จ่ายจริง | reference_price (ราคาแพ็ก 199) |
  |---|:---:|:---:|:---:|
  | `monthly` | 1 เดือน | 1 เดือน | 199 |
  | `semiannual` | 6 เดือน | 5 เดือน (ฟรี 1) | 995 |
  | `yearly` | 12 เดือน | 10 เดือน (ฟรี 2) | 1,990 |

  ราคาแพ็ก/เดือนอ่านจาก `packages.price` ของ Basic ที่หลังบ้าน (บน UAT ตั้งไว้ 10 บาท จึงเห็น 10 / 50 / 100)
  **ราคาที่โชว์และเก็บจริงต้องเป็นของร้าน** ค่านี้มีไว้ให้ทีมเทียบว่าตั้งราคาในร้านตรงหรือยัง

  ---

  ## เซิร์ฟเวอร์เลือกสินค้าให้ตอนสร้างออเดอร์อย่างไร

  แอปไม่ต้องเลือกสินค้าเอง แค่ส่ง `seats` + `billing_cycle` ไปที่ `create-order` แล้วเซิร์ฟเวอร์จะตอบกลับว่าต้องซื้อ `product_id` ไหน กี่ชิ้น

  1. แปลง `seats` เป็นจำนวนแพ็ก (`seats ÷ pack_size`)
  2. ในสินค้าที่รอบบิลตรงกัน คิดว่าแต่ละตัวต้องซื้อกี่ชิ้นถึงได้**อย่างน้อย**เท่าที่ขอ (ปัดขึ้น) ตัดตัวที่เกิน `max_quantity`
  3. เลือกตัวที่ได้แพ็ก**เกินน้อยที่สุด** (พอดี = 0) ถ้าเท่ากันเอาตัวที่**ชิ้นน้อยที่สุด** → สินค้าขนาดพอดี `quantity = 1` ชนะเสมอ
  4. ได้มากกว่าที่ขอ → `seats_rounded_up = true` ใน create-order · ไม่มีตัวไหนเข้าเงื่อนไขเลย → `422 product_unavailable`

  ตัวอย่าง (13 ขนาด):
  - 6 ผู้ใช้ = 2 แพ็ก → `basic_monthly_pack2 × 1` (ทั้งสองร้าน)
  - 45 ผู้ใช้ = 15 แพ็ก → `basic_monthly_pack15 × 1`
  - 33 ผู้ใช้ = 11 แพ็ก → iOS ไม่มี 11 → **ปัดขึ้น** `basic_monthly_pack15 × 1` (45 ผู้ใช้) · Android ได้พอดี `basic_monthly_pack × 11` (ผู้ใช้ต้องเปลี่ยนจำนวนในหน้า Google)
  - iOS ซื้อได้สูงสุด 30 แพ็ก = **90 ผู้ใช้ต่อออเดอร์** มากกว่านั้นได้ `product_unavailable` ติดต่อเจ้าหน้าที่

  ---

  ## Error

  | HTTP | `code` | เมื่อไหร่ |
  |:---:|---|---|
  | 401 | `unauthorized` / `token_invalid` | ไม่ได้ล็อกอิน |

  เส้นนี้**ยกเว้นจาก** `403 subscription_expired` และ `seat_quota_exceeded` — บริษัทที่หมดอายุ/เกินโควตายังดึงรายการมาซื้อได้

  ---

  ## แอปควรทำ

  - cache ผลไว้ต่อ session แล้ว query ราคาจากร้านครั้งเดียวตอนเปิดหน้า (39 รหัสต่อร้าน query ได้ในครั้งเดียว)
  - ถ้าร้านคืน product ไม่ครบ (ยังไม่ได้สร้างใน console / ยัง review ไม่ผ่าน) ให้ซ่อนขนาดนั้น อย่าโชว์ `reference_price` แทน
  - stepper จำนวนผู้ใช้เพิ่มทีละ `pack_size` · ขนาดที่ไม่มีสินค้าเซิร์ฟเวอร์ปัดขึ้นให้ แต่ควรแสดงราคาจากร้านของสินค้าที่ได้จริงก่อนกดซื้อ (ดู `seats_rounded_up`)
  - **ห้าม hardcode รหัสสินค้า** ขนาดเพิ่ม/ลดได้จาก config ฝั่งเซิร์ฟเวอร์โดยไม่แก้แอป

  📄 เอกสารเต็ม: `docs/api-subscription-purchase.md` หัวข้อ 2 · config สินค้า: `config/store_billing.php`

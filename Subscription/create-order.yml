http:
  method: POST
  url: "{{sale_uat}}/api/v1/subscription/orders"
  body:
    type: json
    data: |-
      {
        "platform": "google_play ",
        "seats": 12,
        "billing_cycle": "monthly"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # POST /api/v1/subscription/orders — ซื้อ / ต่ออายุแพ็กเกจ Basic

  สร้างออเดอร์สถานะ `pending` ฝั่งเรา แล้วบอกแอปว่า**ต้องซื้อสินค้าอะไร กี่ชิ้น แนบ token อะไร** กับร้าน
  ยังไม่มีเงินเข้าในขั้นนี้ เงินจะเข้าตอนแอปกดซื้อกับร้าน และแพ็กเกจจะเปิดใช้งานตอน `verify-order` ผ่าน

  **เฉพาะแอดมิน (level 0/1)** · บริษัท standalone ได้ `404` · ยกเว้นจากด่าน `seat_quota_exceeded`

  ```
  POST /api/v1/subscription/orders
  Authorization: Bearer <token>
  Content-Type: application/json
  ```

  ---

  ## Request

  ```json
  { "platform": "google_play", "seats": 6, "billing_cycle": "monthly" }
  ```

  | ฟิลด์ | ชนิด | บังคับ | กติกา |
  |---|---|:---:|---|
  | `platform` | string | ✅ | `google_play` (Android) / `app_store` (iOS) ออเดอร์ใบนี้จ่ายได้เฉพาะร้านนี้ ส่งใบเสร็จจากอีกร้านมาจะโดน `purchase_mismatch` |
  | `seats` | int | ✅ | จำนวนผู้ใช้**ทั้งหมด**ที่ต้องการหลังจ่าย (ไม่ใช่จำนวนที่เพิ่ม) · ต้องลงตัวทีละแพ็ก (3, 6, 9 …) · ขั้นต่ำ 1 แพ็ก · สูงสุด 999 |
  | `billing_cycle` | string | ✅ | `monthly` / `semiannual` / `yearly` |

  > `seats` ตีความเป็น "ยอดใหม่ทั้งก้อน" ถ้าบริษัทมี 6 ที่นั่งแล้วอยากได้ 9 ตอนต่ออายุ ให้ส่ง 9
  > ถ้าแค่อยากเพิ่มที่นั่งกลางรอบโดยไม่ต่ออายุ ให้ใช้ `add-seats` แทน

  ### ลำดับที่เซิร์ฟเวอร์ตรวจ (หยุดที่ข้อแรกที่ไม่ผ่าน)

  1. ด่านสิทธิ์ (401 / 404 standalone / 403 forbidden)
  2. validation ของ 3 ฟิลด์ → `422` + `errors`
  3. ร้านนี้ตั้งค่าฝั่งเซิร์ฟเวอร์ครบหรือยัง (Google service account / Apple root CA + bundle id) → `503 store_unavailable`
  4. หาสินค้าในร้านที่ประกอบจำนวนแพ็ก + รอบบิลนี้ได้ (ดูวิธีเลือกใน `products`) — ไม่มีขนาดพอดีจะ**ปัดขึ้น**เป็นขนาดใกล้ที่สุดที่ซื้อได้ · ปัดแล้วยังไม่มี → `422 product_unavailable`
  5. คิดราคาอ้างอิงตาม rate card จากจำนวนที่จะซื้อจริง → `422 quote_unavailable`
  6. สร้างออเดอร์ (`seats` = จำนวนที่ซื้อได้จริง อาจมากกว่าที่ขอ) + สุ่ม `account_token` (UUID) ผูกกับออเดอร์

  ไม่มีการกันออเดอร์ `pending` ซ้ำ สร้างกี่ใบก็ได้ แต่ละใบมี `account_token` ของตัวเอง
  ใบที่ลูกค้าไม่ได้ซื้อควร `cancel-order` ทิ้ง จะได้ไม่ค้างในหลังบ้าน

  ---

  ## Response (200 OK)

  ```json
  {
    "success": true,
    "order": {
      "id": 42,
      "kind": "subscription",
      "status": "pending",
      "status_label": "รอชำระเงิน",
      "is_final": false,
      "is_paid": false,
      "seats": 6,
      "extra_seats": null,
      "billing_cycle": "monthly",
      "amount": 398,
      "amount_display": "398.00",
      "currency": "THB",
      "payment_method": "google_play",
      "refund_state": null,
      "message": null,
      "store_transaction_id": null,
      "store_environment": null,
      "store_quantity": 1,
      "store_quantity_ordered": 1,
      "quantity_adjusted": false,
      "paid_at": null,
      "created_at": "2026-10-16T18:30:00+07:00"
    },
    "purchase": {
      "platform": "google_play",
      "product_id": "basic_monthly_pack2",
      "quantity": 1,
      "account_token": "0f9c2c7a-5b1e-4c7d-9b2a-1c2d3e4f5a6b",
      "product_type": "consumable"
    },
    "seats_requested": 6,
    "seats_rounded_up": false,
    "message": null
  }
  ```

  | ฟิลด์ | ใช้ทำอะไร |
  |---|---|
  | `order.id` | เก็บไว้ ใช้ส่ง `order_id` ตอน verify (เผื่อใบเสร็จไม่มี token) และดูสถานะ |
  | `order.seats` / `order.amount` | **จำนวนและราคาอ้างอิงที่จะซื้อจริง** (อาจมากกว่า `seats` ที่ส่งมา ดู `seats_rounded_up`) · `amount` ไม่ใช่ยอดที่ร้านเก็บ ห้ามโชว์เป็นราคาขาย |
  | `purchase.product_id` × `purchase.quantity` | สิ่งที่ต้องซื้อกับร้าน · เซิร์ฟเวอร์เลือกสินค้าขนาดพอดี (`quantity = 1`) ก่อนเสมอ · iOS = 1 เสมอ |
  | `purchase.product_type` | `consumable` (Android) / `non_renewing_subscription` (iOS) |
  | `purchase.account_token` | UUID ที่ต้องแนบตอนซื้อ |
  | `seats_rounded_up` | `true` = ร้านไม่มีขนาดพอดี ปัดขึ้นให้แล้ว → **แสดง `message` + ราคาจากร้าน ให้ลูกค้ายืนยันก่อนเปิดหน้าจ่ายเงิน** หรือ `cancel-order` |

  โครง `order` เต็มดูที่ doc ของ folder

  ### กรณี `seats_rounded_up = true` (เจอบน iPhone เป็นหลัก)

  iPhone ซื้อได้ครั้งละ 1 ชิ้น จึงซื้อได้เฉพาะขนาดที่มีสินค้า (1–10, 15, 20, 30 แพ็ก) บริษัท 33 ผู้ใช้ (11 แพ็ก) ต่ออายุ → ไม่มี 11 แพ็ก → ได้ 15 แพ็ก

  ```json
  {
    "success": true,
    "order": { "id": 43, "seats": 45, "amount": 2985, "payment_method": "app_store", "…": "…" },
    "purchase": { "platform": "app_store", "product_id": "basic_monthly_pack15", "quantity": 1, "product_type": "non_renewing_subscription", "account_token": "…" },
    "seats_requested": 33,
    "seats_rounded_up": true,
    "message": "ร้านค้าไม่มีแพ็กเกจขนาด 33 ผู้ใช้พอดี ระบบเลือกขนาดใกล้ที่สุดให้คือ 45 ผู้ใช้ กรุณาตรวจสอบจำนวนและราคาก่อนชำระเงิน"
  }
  ```

  ลูกค้าจ่ายและได้ 45 ที่นั่งจริง (ไม่ใช่จ่าย 45 ได้ 33) · Android แทบไม่เจอเพราะซื้อได้ถึง 99 ชิ้น

  ---

  ## แอปต้องทำต่อ

  ### Android (Play Billing)

  ```kotlin
  // Play Billing ไม่มี setQuantity() — ถ้า purchase.quantity > 1 ต้องบอกผู้ใช้ให้เปลี่ยนจำนวนเองในหน้าจ่ายเงินของ Google
  if (purchase.quantity > 1) showHint("ในหน้าชำระเงินของ Google กรุณาเปลี่ยนจำนวนเป็น ${purchase.quantity} ชิ้น")

  val params = BillingFlowParams.newBuilder()
      .setProductDetailsParamsList(listOf(
          ProductDetailsParams.newBuilder().setProductDetails(details /* ของ purchase.product_id */).build()
      ))
      .setObfuscatedAccountId(purchase.account_token)   // กฎข้อ 1
      .build()
  billingClient.launchBillingFlow(activity, params)
  ```

  ได้ `Purchase` แล้ว → ส่ง `purchase.products[0]` + `purchase.purchaseToken` ไป `verify-order` · **ห้าม** `consumeAsync` เอง
  ผู้ใช้จ่ายไม่เท่าที่สั่ง (ลืมแก้จำนวน) เซิร์ฟเวอร์เปิดให้ตามที่จ่ายจริงและตอบ `quantity_adjusted` — ดู verify-order

  ### iOS (StoreKit 2)

  ```swift
  // Non-Renewing Subscription ซื้อได้ 1 ชิ้น — ห้ามใส่ .quantity(n) ขนาดแพ็กอยู่ที่ตัวสินค้าแล้ว
  let result = try await product.purchase(options: [
      .appAccountToken(UUID(uuidString: purchase.account_token)!)   // กฎข้อ 1
  ])
  if case .success(let verification) = result, case .verified(let tx) = verification {
      // ส่ง tx.jwsRepresentation ไป verify-order ก่อน แล้วค่อย tx.finish() หลังได้ 200
  }
  ```

  ---

  ## ผลหลังจ่ายสำเร็จ (ตอน verify ผ่าน)

  | สถานะบริษัทตอนนี้ | ผล |
  |---|---|
  | ทดลองใช้ฟรี / หมดอายุแล้ว / แพ็กเกจอื่น | เริ่มรอบใหม่**นับจากวันนี้** · ที่นั่ง = `seats` · วันทดลองที่เหลือไม่นำมาต่อ |
  | ใช้ Basic อยู่และยังไม่หมดอายุ | **ต่ออายุ** นับต่อจากวันหมดอายุเดิม (ไม่เสียวันที่เหลือ) · วันเริ่มต้นคงเดิม · ที่นั่ง = `seats` (ทับยอดเดิม) |

  `price_snapshot` ของบริษัทจะถูกบันทึกเป็น `amount` ของออเดอร์ (ไม่คิดใหม่จาก rate card ณ ตอนจ่าย)

  ---

  ## Error

  | HTTP | `code` | เมื่อไหร่ | แอปควรทำ |
  |:---:|---|---|---|
  | 422 | — (มี `errors`) | `platform` / `seats` / `billing_cycle` ผิด `message` เป็นไทยพร้อมแสดง | โชว์ `message` |
  | 422 | `product_unavailable` | ร้านไม่มีสินค้าที่ประกอบจำนวนนี้ได้แม้ปัดขึ้นแล้ว เช่น iOS เกินขนาดใหญ่สุด (30 แพ็ก = 90 ผู้ใช้) | ให้เลือกจำนวนอื่น / ติดต่อเจ้าหน้าที่ |
  | 422 | `quote_unavailable` | คิดราคาไม่ได้ (ตั้งค่าแพ็กเกจผิดฝั่งเรา) | ติดต่อเจ้าหน้าที่ |
  | 403 | `forbidden` | ไม่ใช่ level 0/1 | ซ่อนปุ่มซื้อสำหรับเซลส์ |
  | 404 | `not_found` | บริษัท standalone | ซ่อนเมนูแพ็กเกจ |
  | 503 | `store_unavailable` | เซิร์ฟเวอร์ยังไม่ได้ตั้งค่าร้านนี้ | แจ้งว่ายังไม่เปิดให้ซื้อ ลองใหม่ภายหลัง |

  ตัวอย่าง `message` จาก validation:
  - `ขายเป็นแพ็กละ 3 ผู้ใช้ — จำนวนผู้ใช้ต้องเป็น 3, 6, 9 …`
  - `ซื้อแพ็กเกจได้ขั้นต่ำ 3 ผู้ใช้`
  - `ซื้อได้ครั้งละไม่เกิน 999 ผู้ใช้ หากต้องการมากกว่านี้ กรุณาติดต่อเจ้าหน้าที่`

  📄 เอกสารเต็ม: `docs/api-subscription-purchase.md` หัวข้อ 3

docs: |
  # API — สถานะแพ็กเกจ / วันใช้งาน / สิทธิ์ใช้ฟีเจอร์

  ให้แอปมือถือแสดงตัวนับ "วันใช้งาน" แบบเดียวกับแถบบน navbar ของเว็บ
  และเช็คว่าหมดช่วงทดลองใช้แล้วหรือยัง เพื่อปิดปุ่มสร้างใบเสนอราคา / นัดหมาย

  **อัปเดต 29/10/2569:** แพ็กละ **5 ผู้ใช้** · ขาย**รายเดือนอย่างเดียว** (ตัด `semiannual` / `yearly`) · ทดลองใช้ฟรี **60 วัน**
  · เพิ่ม `seat_quota.pack_size` และ `package_renewal` (ต่ออายุผ่านแอปได้เฉพาะบริษัทที่ยังไม่เคยใช้ Basic)

  **อัปเดต 16/10/2569:** เส้นนี้**ยกเว้นจากด่าน `403 subscription_expired`** แล้ว (เช่นเดียวกับ `subscription/products` และ `subscription/orders*`)
  บริษัทที่หมดอายุเกิน 3 วันจึงเรียกได้ → เมื่อ `is_blocked: true` ให้แสดงหน้าต่ออายุด้วยข้อมูลจาก response นี้

  ```
  GET /api/v1/subscription/status
  Authorization: Bearer <token>
  Accept: application/json
  ```

  ---

  ## ตัวอย่าง response

  ```json

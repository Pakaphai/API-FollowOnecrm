docs: |
  # ลบการแจ้งเตือน 1 รายการ

  ```
  DELETE /api/v1/notifications/{id}
  Authorization: Bearer {{token}}
  ```

  `{id}` เป็น **UUID** ไม่ใช่ integer — เอาค่ามาจาก `GET notifications`
  ใส่ค่าที่ไม่ใช่รูปแบบ UUID จะได้ `404` ตั้งแต่ชั้น route

  ## สำเร็จ `200`

  ```json
  {
    "status": "success",
    "message": "ลบการแจ้งเตือนเรียบร้อยแล้ว",
    "data": { "deleted_count": 1, "unread_count": 3 }
  }
  ```

  `unread_count` คือจำนวนที่ยังไม่อ่าน **หลังลบแล้ว** เอาไปอัปเดตกระดิ่งได้เลย
  ไม่ต้องยิง `notifications/unread-count` ซ้ำ

  ## ไม่สำเร็จ

  | HTTP | เมื่อไร |
  |:---:|---|
  | `401` | ไม่มี token / token หมดอายุ |
  | `404` | ลบไปแล้ว, ไม่มีอยู่จริง, **หรือเป็นของผู้ใช้คนอื่น** |

  ---

  ⚠️ **ลบแล้วกู้คืนไม่ได้** ตาราง `notifications` ไม่มี soft delete

  📄 รายละเอียด → [api-notification-delete.md](api-notification-delete.md)

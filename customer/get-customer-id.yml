docs: |-
  ### 3.4 รายการนัดหมายพร้อม flag — `GET getcustomer/detail/byid/{id}`

  ```bash
  curl -s "$BASE/getcustomer/detail/byid/17" -H "$AUTH" -H "Accept: application/json" \
    | jq '.data.relationship_details_scheduled[] | {id, is_late, can_submit, can_request_late, visit_pic_url, late_request}'
  ```

  เส้นนี้คืนข้อมูลครบทุกแถวในรอบเดียว **แอปไม่ต้องยิง `late-status` รายแถว** — เก็บเส้น `late-status` ไว้ใช้ตอนต้องรีเฟรชสถานะเฉพาะรายการเดียว

  **ฟิลด์ที่แนบมาให้ในแต่ละแถว**

  | ฟิลด์ | อยู่ใน | ความหมาย |
  |---|---|---|
  | `is_late` | scheduled, global_schedule | นัดหมายเลยกำหนดแล้วหรือยัง |
  | `can_submit` | scheduled | กดบันทึกปิดงานเองได้ไหม |
  | `can_request_late` | scheduled | ยื่นคำขอได้ไหม (ยังไม่มีใบที่รออนุมัติค้างอยู่) |
  | `visit_pic` | scheduled | path ดิบบน S3 |
  | `visit_pic_url` | scheduled, completed, global_schedule | **signed URL อายุ 10 นาที** เอาไปแสดงรูปได้เลย |
  | `late_request_status` | ทั้ง 3 ชุด | `pending` / `approved` / `rejected` / `null` |
  | `late_request_note` | scheduled | `admin_note` ของใบล่าสุด (เหตุผลที่ถูกตีกลับ) |
  | `late_request` | ทั้ง 3 ชุด | อ็อบเจกต์คำขอเต็มใบ (ดูด้านล่าง) — `null` ถ้าไม่เคยยื่น |
  | `is_not_visited` | scheduled, global_schedule | **ไม่ได้เข้าพบลูกค้า** (เพิ่ม 2026-09-21) — `true` = แอดมินไม่อนุมัติคำขอล่าช้า **ปฏิทินให้แสดงเป็นสีแดง** ไม่ใช่สีของนัดที่ยังต้องตาม |
  | `not_visited_label` | scheduled, global_schedule | ป้ายภาษาไทย `"ไม่ได้เข้าพบลูกค้า"` — `null` ถ้าไม่ได้อยู่ในสถานะนี้ |
  | `can_cancel` · `can_restore` | scheduled, global_schedule | โชว์ปุ่มยกเลิกนัด / คืนสถานะได้ไหม · นัดที่ `is_not_visited = true` เป็น `false` ทั้งคู่ |

  > `is_not_visited` ดูผลคำขอล่าสุดควบกับ `follow_status_id` — นัดที่ถูกตีกลับก่อนระบบจะตั้งสถานะให้
  > (ข้อมูลเก่า) จึงได้ `true` เหมือนกัน แอปไม่ต้องไปเทียบ `late_request_status` เอง
  >
  > เป็นสถานะปลายทาง — `can_submit` / `can_request_late` / `can_cancel` เป็น `false` หมด และไม่มีปุ่มคืนสถานะ
  > ถ้าจะตามลูกค้ารายนั้นต่อต้องสร้างนัดใหม่ · ยิงเส้น 10 / 11 / 12 / 17 ทับจะได้ `422` พร้อม `is_not_visited: true`

  **โครงสร้าง `late_request`**

  ```json
  {
    "id": 12,
    "status": "pending",
    "reason": "ลูกค้าเลื่อนนัดกะทันหัน เข้าพบไม่ทันตามกำหนด",
    "admin_note": null,
    "late_days": 9,
    "follow_date": "2026-08-02",
    "visit_pic": "crm/visit_pics/1786427242-206a9fd0....jpg",
    "visit_pic_url": "https://inet-s3-object-gw.inet.co.th/...?X-Amz-Signature=...",
    "reviewed_by": null,
    "reviewed_at": null,
    "created_by": 4,
    "created_at": "2026-08-11 05:47:23"
  }
  ```

  **ตัวอย่างผลจริง** (ลูกค้า 17 — 4 นัดหมาย ล่าช้าหมด)

  ```
  id=9  is_late=true can_submit=false can_request_late=true  late_request=null
  id=8  is_late=true can_submit=false can_request_late=true  late_request=null
  id=10 is_late=true can_submit=false can_request_late=false late_request={status:"pending", late_days:9,  visit_pic_url:"https://..."}
  id=11 is_late=true can_submit=false can_request_late=false late_request={status:"pending", late_days:10, visit_pic_url:null}
  ```

  **`relationship_details_completed` ก็มี `late_request` ด้วย** — ใช้ดูว่านัดหมายใบไหนปิดงานเพราะแอดมินอนุมัติคำขอล่าช้า

  ```bash
  curl -s "$BASE/getcustomer/detail/byid/3" -H "$AUTH" -H "Accept: application/json" \
    | jq '.data.relationship_details_completed[] | select(.late_request != null)
          | {id, status: .late_request.status, reviewed_by: .late_request.reviewed_by, reason: .late_request.reason}'
  # { "id": 4, "status": "approved", "reviewed_by": 1, "reason": "ลืม" }
  ```

  **`global_schedule`** (ฟีดปฏิทิน รวมลูกค้ารายอื่นของเซลส์คนนี้) ได้ `is_late`, `late_request_status`, `late_request` ไปด้วย
  เอาไปขึ้นป้าย "ล่าช้า / รออนุมัติ" บนปฏิทินได้เลย

  ---

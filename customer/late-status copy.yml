info:
  name: late-status copy
  type: http
  seq: 11

http:
  method: GET
  url: "{{sale_uat}}/api/v1/relationship-detail/late-status/1"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  หมายที่จะเช็ค — ไม่ใช่ `customer_id` |
  | Header `Authorization` | 🔴 `Bearer <access_token>` | ใช้เช็คสิทธิ์ว่านัดหมายนี้เป็นของเซลส์คนนี้จริง |
  | Header `Accept` | 🔴 `application/json` | กัน error กลับมาเป็น HTML |

  ```bash
  curl -s "$BASE/relationship-detail/late-status/88" -H "$AUTH" -H "Accept: application/json" | jq
  ```

  ### ผลลัพธ์ — `200`

  ```json
  {
    "success": true,
    "relationship_detail_id": 88,
    "mode": "scheduled",
    "is_late": true,
    "can_submit": false,
    "can_request_late": false,
    "visit_pic": "crm/visit_pics/1786425354-....jpg",
    "visit_pic_url": "https://inet-s3-object-gw.inet.co.th/...?X-Amz-Signature=...",
    "late_request": {
      "id": 9, "status": "pending", "status_label": "รออนุมัติ",
      "reason": "ลืมบันทึก...", "admin_note": null,
      "late_days": 11, "follow_date": "2026-08-07",
      "visit_pic": "crm/visit_pics/1786425354-....jpg",
      "visit_pic_url": "https://...",
      "reviewed_by": null, "reviewed_at": null,
      "created_by": 2, "created_at": "2026-08-18 05:15:56"
    }
  }
  ```

  ### อธิบายตัวแปรใน response ทุกตัว

  | ฟิลด์ | ชนิด | ความสำคัญ | อธิบาย |
  |---|---|:---:|---|
  | `success` | boolean | 🟡 | `true` = อ่านสำเร็จ · `false` เฉพาะตอน 403 ไม่มีสิทธิ์ |
  | `relationship_detail_id` | integer | 🟡 | echo `{id}` ที่ถามมา (cast เป็น int แล้ว) ใช้จับคู่ผลลัพธ์ตอนยิงหลายเส้นพร้อมกัน |
  | `mode` | string | 🔴 | `scheduled` / `completed` — ใบที่ `completed` แล้วไม่ต้องทำอะไรต่อ |
  | `is_late` | boolean | 🔴 | **เลยวันนัดแล้วหรือยัง** — `true` ก็ต่อเมื่อ `mode = scheduled` **และ** `follow_date < วันนี้` · ใบที่ปิดงานแล้วจะเป็น `false` เสมอ ต่อให้วันนัดผ่านไปนานแค่ไหน |
  | `can_submit` | boolean | 🔴 | กดปุ่ม "บันทึก" ([เส้น 11](#11-post-apiv1relationship-detailsubmit-contactid)) ได้ไหม — ค่าคือ `!is_late` ตรง ๆ |
  | `can_request_late` | boolean | 🔴 | โชว์ปุ่ม "ขออนุมัติล่าช้า" ได้ไหม — `true` เมื่อ **ล่าช้า + ยังไม่ปิดงาน + ไม่มีคำขอที่ค้าง `pending` อยู่** |
  | `visit_pic` | string \| null | 🟢 | path ดิบบน S3 ของรูปในนัดหมาย |
  | `visit_pic_url` | string \| null | 🔴 | **signed URL อายุ 10 นาที** เอาไปแสดงรูปได้เลย · ไม่มีรูป = `null` |
  | `late_request` | object \| null | 🔴 | **คำขอล่าสุด** ของนัดหมายนี้ (เรียงตาม id มากสุด) · ยังไม่เคยยื่น = `null` — ต้องเช็ค null ก่อนอ่านข้างใน |

  **ฟิลด์ใน `late_request`**

  | ฟิลด์ | ชนิด | อธิบาย |
  |---|---|---|
  | `id` | integer | id ของคำขอ |
  | `status` | string | 🔴 `pending` / `approved` / `rejected` — ตัวชี้ขาดว่าจะโชว์ปุ่มอะไร |
  | `status_label` | string | ป้ายภาษาไทยพร้อมแสดง — `รออนุมัติ` / `อนุมัติแล้ว` / `ไม่อนุมัติ` (มาจากที่เดียวกับเว็บและการแจ้งเตือน ไม่ต้องแปลเอง) |
  | `reason` | string | เหตุผลที่เซลส์เขียนตอนยื่น |
  | `admin_note` | string \| null | 🔴 **หมายเหตุจากแอดมิน** — ตอน `rejected` คือเหตุผลที่ถูกตีกลับ ต้องเอาไปโชว์ให้เซลส์เห็น |
  | `late_days` | integer | ล่าช้ากี่วัน ณ ตอนยื่น (snapshot ไม่ขยับตามเวลา) |
  | `follow_date` | date | วันนัดเดิม ณ ตอนยื่นคำขอ |
  | `visit_pic` / `visit_pic_url` | string \| null | รูปที่แนบมากับคำขอ + signed URL 10 นาที · เก็บซ้ำไว้ที่คำขอเพื่อย้อนดูได้ เผื่อรูปในนัดหมายถูกทับจากการยื่นรอบใหม่ |
  | `reviewed_by` | integer \| null | id แอดมินที่พิจารณา — `null` = ยังไม่มีใครดู |
  | `reviewed_at` | datetime \| null | เวลาที่พิจารณา |
  | `created_by` | integer \| null | id เซลส์ที่ยื่น |
  | `created_at` | datetime | เวลาที่ยื่นคำขอ |

  **ตารางตัดสินใจของแอป**

  | เงื่อนไข | ปุ่มที่โชว์ |
  |---|---|
  | `can_submit = true` | **บันทึก** (ยิงเส้น 11) |
  | `can_request_late = true` | **ขออนุมัติล่าช้า** (ยิงเส้น 12) |
  | `late_request.status = "pending"` | **รออนุมัติ** (disable ทั้งคู่) |
  | `late_request.status = "rejected"` | **ขออนุมัติล่าช้า** อีกครั้ง + โชว์ `admin_note` เป็นเหตุผลที่ถูกตีกลับ |
  | `late_request.status = "approved"` แต่ `mode` ยังเป็น `scheduled` | **บันทึก** ได้แล้ว (ยิงเส้น 11 ผ่านเพราะมีคำขอที่อนุมัติแล้ว) |

  ### กรณีที่ยังไม่เคยยื่นคำขอ

  ```json
  {
    "success": true,
    "relationship_detail_id": 88,
    "mode": "scheduled",
    "is_late": false,
    "can_submit": true,
    "can_request_late": false,
    "visit_pic": null,
    "visit_pic_url": null,
    "late_request": null
  }
  ```

  เป็นเคสปกติของนัดหมายที่ยังไม่ถึงวันนัด — โชว์ปุ่ม "บันทึก" ได้เลย

  ### Error

  | HTTP | ก้อนที่ได้ | เกิดเมื่อ |
  |:---:|---|---|
  | `403` | `{"success": false, "message": "คุณไม่มีสิทธิ์เข้าถึงบันทึกนี้"}` | นัดหมายนี้ไม่ใช่ของลูกค้าที่เซลส์คนนี้ถืออยู่ (แอดมิน level 0/1 ผ่านหมด) |
  | `404` | `{"message": "No query results for model [App\\Models\\RelationshipDetailModel] 999"}` | ไม่พบ `{id}` — เส้นนี้ไม่มี try/catch ครอบ Laravel จึงเรนเดอร์เป็น 404 มาตรฐาน **ไม่มีคีย์ `success`** |
  | `401` | จาก middleware `auth_api` | token หมดอายุ/ไม่ถูกต้อง |

  ---

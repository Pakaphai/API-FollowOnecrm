http:
  method: GET
  url: "{{sale_uat}}/api/v1/getCustomer-detail?page=1&per_page=20&q=&business_type_id="
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true

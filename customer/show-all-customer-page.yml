info:
  name: show-all-customer-page
  type: http
  seq: 5

http:
  method: GET
  url: "{{sale_uat}}/api/v1/getCustomer-detail?page=1&per_page=20&q=&business_type_id="
  params:
    - name: customer_filter
      value: active
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## 5. `GET /api/v1/getCustomer-detail`

  รายชื่อลูกค้า **ของตัวเอง** เรียงตาม `customer_code` — แบ่งหน้าและค้นหาได้

  ```json
  { "datas": [ {...}, {...} ], "user": 4,
    "summary": { "total": 42, "new": 2, "active": 7, "active_within_days": 30 },
    "page": 1, "size": 20, "total_elements": 137, "total_pages": 7,
    "has_next": true, "has_prev": false }
  ```

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >=1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <=100 | - ค้นจาก รหัสลูกค้า - ชื่อลูกค้า - ชื่อผู้ติดต่อ - เบอร์โทร - เลขผู้เสียภาษี - **ชื่อประเภทธุรกิจ** |
  | `business_type_id` | integer >=1 หรือ array | - กรองตามประเภทธุรกิจแบบเจาะจง |
  | `customer_filter` | `new` หรือ `active` | - ตัวกรองจากการ์ดสรุปด้านบน (ว่าง = ทั้งหมด) |

  ### กรองตามประเภทธุรกิจ

  ทำได้ 2 แบบ ใช้ร่วมกันได้ (เป็น AND)

  | วิธี | เหมาะกับ | ตัวอย่าง |
  |---|---|---|
  | `q` | ช่องค้นหาข้อความช่องเดียว | `?q=บริษัทจำกัด` |
  | `business_type_id` | dropdown หรือชิปตัวกรอง | `?business_type_id=3` - `?business_type_id[]=3&business_type_id[]=4` |

  รายการ id กับชื่อประเภทธุรกิจดึงจาก `GET master-data` คีย์ `business_types`

  > `q` ต้องค้นถึงตาราง `business_types` เพราะ **ชื่อลูกค้าในฐานข้อมูลไม่มีคำนำหน้านิติบุคคล**
  > คำนำหน้าถูกประกอบตอนแสดงผล (`customer_name_full`) เท่านั้น พิมพ์ "บริษัท" จึงไม่แมตช์ชื่อลูกค้า

  | กรณี | ผล |
  |---|---|
  | `business_type_id=` (ว่าง) | ถือว่าไม่ได้กรอง คืนลูกค้าทั้งหมด |
  | `business_type_id=abc` หรือ `=0` | **422** พร้อมข้อความไทย ไม่ใช่เมินเงียบ ๆ |
  | `business_type_id=999` (ไม่มีในระบบ) | **200** และได้ 0 รายการ |

  ### การ์ดสรุป (`summary`) และตัวกรองจากการ์ด (`customer_filter`)

  `summary` เป็นตัวเลขการ์ด KPI ของหน้ารายชื่อลูกค้า ชุดเดียวกับฝั่งเว็บ

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `total` | ลูกค้าทั้งหมดของเซลส์คนนี้ |
  | `new` | สร้างตั้งแต่วันแรกของเดือนนี้ (เวลาไทย) |
  | `active` | มีออเดอร์หรือบันทึกการติดต่อภายใน 30 วันที่ผ่านมา |
  | `active_within_days` | จำนวนวันที่ใช้เป็นเกณฑ์ของ `active` (30) — อ่านจากที่นี่ อย่าฮาร์ดโค้ด |

  ตัวเลขทั้งชุด **นับจากลูกค้าของผู้ใช้คนนี้ทั้งหมด** ไม่ใช่เฉพาะหน้าที่ขอมา และ**ไม่ขึ้นกับ**
  `q` / `business_type_id` / `customer_filter` เพื่อให้กดการ์ดสลับไปมาแล้วตัวเลขไม่กระโดด

  กดการ์ดแล้วส่ง `customer_filter` กลับมาเพื่อกรองรายชื่อให้เหลือเฉพาะกลุ่มนั้น

  | ค่า | ผล |
  |---|---|
  | ไม่ส่ง / ส่งค่าว่าง | ลูกค้าทั้งหมด |
  | `new` | ลูกค้าใหม่เดือนนี้ — ตรงกับ `summary.new` |
  | `active` | ลูกค้าที่มีการเคลื่อนไหวใน 30 วัน — ตรงกับ `summary.active` |
  | ค่าอื่น | **422** `"ตัวกรองลูกค้าต้องเป็น new หรือ active เท่านั้น"` |

  > เกณฑ์ของตัวกรองกับของการ์ดเป็นโค้ดตัวเดียวกัน (`CustomerModel::activeCustomerIds()` /
  > `newThisMonthSince()`) ตัวเลขบนการ์ดกับจำนวนรายชื่อที่กดดูจึงตรงกันเสมอ

  แต่ละแถวมีฟิลด์คำนวณเพิ่ม 3 ตัว:

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `customer_name_full` | ชื่อเติมคำนำหน้าตามประเภทธุรกิจ (ตรรกะเดียวกับ `formatted_name`) |
  | `customer_scope_label` | ชื่อไทยของประเภทลูกค้า |
  | `is_address_incomplete` | `true` = ที่อยู่ไม่ครบ (ขาด address / province / district / subdistrict) — ใช้ขึ้นป้ายเตือนให้ผู้ใช้ไปกรอกเพิ่ม |

  พร้อม `business_type_name` จาก join และชื่อจังหวัด/อำเภอ/ตำบล

  | HTTP | เงื่อนไข |
  |:---:|---|
  | `401` | `{success:false, message:"Token expired or invalid"}` |
  | `500` | `{status:"error", message:"..."}` |

  > `q` ถูกส่งไปกรองที่ฐานข้อมูล จึงค้นเจอลูกค้าทุกรายที่ตรงคีย์เวิร์ด ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว

  ---

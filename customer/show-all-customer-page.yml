info:
  name: show-all-customer-page
  type: http
  seq: 5

http:
  method: GET
  url: "{{sale_uat}}/api/v1/getCustomer-detail?page=1&per_page=20&q="
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## 5. `GET /api/v1/getCustomer-detail`

  รายชื่อลูกค้า **ของตัวเอง** เรียงตาม `customer_code` — แบ่งหน้าและค้นหาได้

  ```json
  { "datas": [ {...}, {...} ], "user": 4,
    "page": 1, "size": 20, "total_elements": 137, "total_pages": 7,
    "has_next": true, "has_prev": false }
  ```

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >=1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <=100 | - ค้นจาก รหัสลูกค้า - ชื่อลูกค้า - ชื่อผู้ติดต่อ - เบอร์โทร - เลขผู้เสียภาษี |

  แต่ละแถวมีฟิลด์คำนวณเพิ่ม 3 ตัว:

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `customer_name_full` | ชื่อเติมคำนำหน้าตามประเภทธุรกิจ (ตรรกะเดียวกับ `formatted_name`) |
  | `customer_scope_label` | ชื่อไทยของประเภทลูกค้า |
  | `is_address_incomplete` | `true` = ที่อยู่ไม่ครบ (ขาด address / province / district / subdistrict) — ใช้ขึ้นป้ายเตือนให้ผู้ใช้ไปกรอกเพิ่ม |

  พร้อม `business_type_name` จาก join และชื่อจังหวัด/อำเภอ/ตำบล

  | HTTP | เงื่อนไข |
  |:---:|---|
  | `401` | `{success:false, message:"Token expired or invalid"}` |
  | `500` | `{status:"error", message:"..."}` |

  > `q` ถูกส่งไปกรองที่ฐานข้อมูล จึงค้นเจอลูกค้าทุกรายที่ตรงคีย์เวิร์ด ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว

  ---

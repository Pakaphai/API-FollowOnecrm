docs: |-
  ## 3. `DELETE /api/v1/customer/delete/{id}`

  soft delete — ตั้ง `is_delete = true` เฉพาะแถวลูกค้า ข้อมูลที่ผูกอยู่ (นัดหมาย ใบเสนอราคา ใบสั่งขาย) **ยังอยู่ครบ** ตามตั้งใจ

  ```json
  { "success": true, "message": "ปิดใช้งานลูกค้าเรียบร้อยแล้ว" }
  ```

  | HTTP | เงื่อนไข | body |
  |:---:|---|---|
  | `200` | สำเร็จ | `{success:true, message:"ปิดใช้งานลูกค้าเรียบร้อยแล้ว"}` |
  | `403` | ลูกค้าของเซลส์คนอื่น (แอดมิน level 0/1 ลบแทนได้) | `{success:false, message:"คุณไม่มีสิทธิ์ลบลูกค้ารายนี้"}` |
  | `404` | ไม่พบลูกค้า หรือถูกปิดใช้งานไปแล้ว | `{success:false, message:"ไม่พบข้อมูลลูกค้าที่ต้องการลบ"}` |
  | `500` | exception อื่น | `{error:"เกิดข้อผิดพลาดในการลบข้อมูล", message:"..."}` |

  🔐 เซลส์ลบได้เฉพาะลูกค้าของตัวเอง (`customers.user_id`) แอดมิน level 0/1 ลบแทนได้ทุกราย — เริ่มตรวจเมื่อ 10/11/2569

  ---

docs: |-
  ## 3. `DELETE /api/v1/customer/delete/{id}`

  soft delete — ตั้ง `is_delete = true` เท่านั้น ข้อมูลที่ผูกอยู่ (นัดหมาย ใบเสนอราคา ใบสั่งขาย) **ยังอยู่ครบ**

  ```json
  { "success": true, "message": "ลบลูกค้าและข้อมูลที่เกี่ยวข้องเรียบร้อยแล้ว" }
  ```

  ⚠️ **ข้อความบอกว่า "และข้อมูลที่เกี่ยวข้อง" แต่โค้ดแตะแค่ตาราง `customers`** — ไม่ได้ลบอะไรที่ผูกอยู่เลย ข้อความชวนเข้าใจผิด

  ```php
  CustomerModel::where('id', $id)->update(['is_delete' => true]);   // ทั้งหมดที่ทำ
  ```

  ⚠️ **ไม่เช็คว่ามีลูกค้าอยู่จริง** — ส่ง id ที่ไม่มีก็ยังได้ 200 `success: true` (`update()` คืน 0 แถวแต่ไม่ error)

  ⚠️ **ไม่เช็คความเป็นเจ้าของ** — ลบลูกค้าของเซลส์คนอื่นได้

  | HTTP | เงื่อนไข |
  |:---:|---|
  | `200` | สำเร็จ — **รวมกรณีที่ id ไม่มีอยู่จริง** |
  | `500` | `{error:"เกิดข้อผิดพลาดในการลบข้อมูล", message:"..."}` |

  ---

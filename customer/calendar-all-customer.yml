docs: |-
  ## 7. `GET /api/v1/calendar/all/customer`

  นัดหมาย **ทั้งบริษัท ทุกเซลส์ ทุกเดือน** (ไม่กรองอะไรเลยนอกจาก `is_delete`) — ตั้งใจให้เห็นภาพรวม

  ```json
  { "global_schedule": [
    { "id": 5, "customer_id": 3, "customer_name": "อนัญพร",
      "formatted_name": "บริษัท อนัญพร จำกัด",
      "contact_name": "...", "customer_tel": "...",
      "contact_type_name": "โทรศัพท์ (Phone Call)",
      "relationship_topic": "...",
      "sale_name": "นิชาพร พินิจนันท์",
      "follow_date": "2026-08-15", "time_start": "09:00", "mode": "scheduled",
      "visit_pic": "crm/visit_pics/...",
      "visit_pic_url": "https://...&X-Amz-Expires=600&..." } ] }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `formatted_name` | ชื่อลูกค้าเติมคำนำหน้าตามประเภทธุรกิจ |
  | `sale_name` | ชื่อเต็มของเซลส์ที่รับผิดชอบลูกค้ารายนั้น |
  | `visit_pic_url` | presigned 10 นาที (`null` ถ้าไม่มีรูป) |
  | `early_close_reason` · `early_closed_at` | เหตุผลและเวลาที่ปิดงานก่อนถึงวันนัด — ใบที่ไม่ได้ปิดก่อนกำหนดเป็น `null` ทั้งคู่ |
  | `closed_early` | **ธงปิดงานก่อนกำหนด** (เพิ่ม 2026-09-17) — `true` = ปิดงานแล้วและตอนปิดยังไม่ถึงวันนัด |
  | `closed_early_days` · `closed_early_label` | ปิดก่อนวันนัดกี่วัน (วันไทย) · ป้าย `"ปิดงานก่อนวันนัด"` — ไม่ได้ปิดก่อนกำหนดเป็น `null` ทั้งคู่ |
  | `closed_late` | **ธงปิดงานล่าช้า** (เพิ่ม 2026-09-17) — `true` = ปิดงานได้เพราะแอดมินอนุมัติคำขอล่าช้า |
  | `closed_late_days` · `closed_late_label` | จำนวนวันที่ล่าช้า · ป้ายชุดเดียวกับเว็บ เช่น `"ปิดงานล่าช้า 5 วัน"` — ไม่ได้ปิดงานล่าช้าเป็น `null` ทั้งคู่ |
  | `is_late` | นัดเลยวันนัดแล้วแต่ยังไม่ปิดงาน |
  | `is_not_visited` | **ไม่ได้เข้าพบลูกค้า** (เพิ่ม 2026-09-21) — `true` = แอดมินไม่อนุมัติคำขอล่าช้า นัดใบนี้จบแบบไม่ได้เข้าพบ · **ปฏิทินให้ระบายสีแดง** |
  | `not_visited_label` | ป้ายภาษาไทย `"ไม่ได้เข้าพบลูกค้า"` — ไม่ได้อยู่ในสถานะนี้ = `null` |

  เรียงตาม `created_at` ล่าสุดก่อน · **ไม่แบ่งหน้าและไม่กรองเดือน** — บริษัทที่ใช้งานมานานจะได้ข้อมูลก้อนใหญ่มาก

  > ถ้าต้องการเฉพาะนัดหมายของตัวเองในเดือนปัจจุบัน ใช้ `GET calendar` แทน — ดู [api-dashboard.md](api-dashboard.md#6-get-apiv1calendar)


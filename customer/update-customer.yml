docs: |-
  ## 2. `POST /api/v1/customer/update/{id}`

  พารามิเตอร์ **เหมือน `create-customer` ทุกตัว** แต่พฤติกรรมภายในต่างกันมาก — อ่าน [หมายเหตุ](#-หมายเหตุ) ก่อนใช้

  ```json
  { "success": true, "message": "บันทึกข้อมูลสำเร็จ", "data": { ...ลูกค้าหลังอัปเดต... } }
  ```

  | HTTP | เงื่อนไข |
  |:---:|---|
  | `401` | `{error:"ไม่พบผู้ใช้หรือ token หมดอายุ"}` |
  | `404` | ไม่พบลูกค้า (`findOrFail`) หรือ `business_type_id` ไม่มีในระบบ |
  | `422` | ผิดกติกา |
  | `500` | exception อื่น |

  ### ⚠️ ต่างจาก `create` 5 จุด — ทุกจุดคือบั๊ก

  | | `create` | `update` |
  |---|---|---|
  | `customer_code` | gen ใหม่ (ถูกต้อง) | **gen ใหม่ทับของเดิม** ← [ข้อ 1](#1-แกไขลกคาแลว-customer_code-เปลยน) |
  | `user_id` | = ผู้สร้าง | **= คนที่กดแก้** ← [ข้อ 2](#2-แกไขลกคาแลวเจาของถกโอน) |
  | `credit_type` | คำนวณจาก `credit` | ใช้ค่าที่ส่งมาตรง ๆ ← [ข้อ 3](#3-credit_type-ไมสอดคลองกนระหวาง-create-กบ-update) |
  | ตรวจที่อยู่ | ✅ `validateAddress()` | ❌ **ไม่ตรวจ** |
  | `customer_rate` | ตั้งค่าให้ | ไม่แตะ (คงค่าเดิม) |

  **ฟิลด์ที่คงค่าเดิมได้ถ้าไม่ส่งมา** มีแค่ 2 ตัว: `customer_detail` (ใช้ `$request->has()`) และ `customer_scope` (มี fallback เป็นค่าเดิม)

  ฟิลด์อื่นทั้งหมดถูกเขียนด้วย `$request->x` ตรง ๆ — **ไม่ส่งมา = กลายเป็น `null`** เหมือนกรณี [`user/update/{id}`](api-user-profile.md#-สงไมครบ--ขอมลเดมถกลบ)

  ---

docs: |-
  ## 2. `POST /api/v1/customer/update/{id}`

  พารามิเตอร์ **เหมือน `create-customer` ทุกตัว** แต่พฤติกรรมภายในต่างกันมาก — อ่าน [หมายเหตุ](#-หมายเหตุ) ก่อนใช้

  ```json
  { "success": true, "message": "บันทึกข้อมูลสำเร็จ", "data": { ...ลูกค้าหลังอัปเดต... } }
  ```

  | HTTP | เงื่อนไข |
  |:---:|---|
  | `401` | `{error:"ไม่พบผู้ใช้หรือ token หมดอายุ"}` |
  | `403` | `{success:false, message:"คุณไม่มีสิทธิ์แก้ไขลูกค้ารายนี้"}` — ลูกค้าของเซลส์คนอื่น (แอดมิน level 0/1 แก้แทนได้) |
  | `404` | `{success:false, message:"ไม่พบข้อมูลลูกค้า"}` ไม่พบลูกค้าหรือถูกปิดใช้งานแล้ว · หรือ `business_type_id` ไม่มีในระบบ |
  | `422` | ผิดกติกา |
  | `500` | exception อื่น |

  ### เทียบกับ `create`

  | | `create` | `update` |
  |---|---|---|
  | `customer_code` | gen ใหม่ | **ไม่แตะ — คงรหัสเดิมตลอดอายุลูกค้า** |
  | `user_id` (เจ้าของ) | = ผู้สร้าง | **ไม่แตะ — เจ้าของเดิมไม่เปลี่ยน** |
  | `updated_by` | — | = คนที่กดแก้ |
  | `credit_type` | คำนวณจาก `credit` | **คำนวณจาก `credit` (สูตรเดียวกัน)** |
  | ตรวจที่อยู่ | ✅ `validateAddress()` | ✅ `validateAddress()` |
  | `customer_rate` | ตั้งค่าให้ | ไม่แตะ (คงค่าเดิม) |

  **ฟิลด์ที่คงค่าเดิมได้ถ้าไม่ส่งมา** มีแค่ 2 ตัว: `customer_detail` (ใช้ `$request->has()`) และ `customer_scope` (มี fallback เป็นค่าเดิม)

  ฟิลด์อื่นทั้งหมดถูกเขียนด้วย `$request->x` ตรง ๆ — **ไม่ส่งมา = กลายเป็น `null`** เหมือนกรณี [`user/update/{id}`](api-user-profile.md#-สงไมครบ--ขอมลเดมถกลบ) ฝั่งแอปจึงต้องส่งค่าเดิมกลับมาให้ครบทุกครั้ง

  ---

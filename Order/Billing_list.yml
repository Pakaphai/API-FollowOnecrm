info:
  name: Billing_list
  type: http
  seq: 5

http:
  method: GET
  url: "{{sale_uat}}/api/v1/billing/list?page=1&per_page=20&q="
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
    - name: q
      value: ""
      type: query
    - name: customer_id
      value: "4"
      type: query
      disabled: true
    - name: start_date
      value: 2026-01-01
      type: query
      disabled: true
    - name: end_date
      value: 2026-12-31
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## การแบ่งหน้า (pagination)

  เส้นนี้แบ่งหน้าเสมอ ไม่ส่งอะไรมาก็ได้ 20 รายการแรก

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >= 1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <= 100 | - |
  | `customer_id` | integer | - |
  | `start_date` / `end_date` | date | - |

  ส่ง `per_page` เกิน 200 หรือ `q` ยาวเกิน 100 ตัว จะได้ 422

  ## การค้นหา (q)

  `q` ถูกส่งไปกรองที่ฐานข้อมูล **ก่อน** แบ่งหน้า จึงค้นเจอทุกรายการที่ตรงคีย์เวิร์ด
  ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว ค้นแบบไม่แยกตัวพิมพ์เล็กใหญ่ (ILIKE) และมีคำนี้อยู่ตรงไหนก็ได้

  ค้นจาก: เลขที่ใบสั่งขาย - **เลขที่ใบกำกับภาษี** - **เลขที่ใบเสนอราคา** - ชื่อลูกค้า

  ## ข้อมูลเอกสารในแต่ละรายการ

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `order_number` | เลขที่ใบสั่งขาย |
  | `quotation_number` | เลขที่ใบเสนอราคาต้นทาง |
  | `invoice_number` | เลขที่ใบกำกับภาษี |
  | `invoice_attachment_url` | ลิงก์ไฟล์ใบกำกับภาษี (S3 10 นาที · `null` = ไม่ได้แนบ) |
  | `receipt_url` | ลิงก์ไฟล์ใบเสร็จ แนบตอนผ่านขั้น "ตรวจสอบการชำระเงิน" (S3 10 นาที · `null` = ไม่ได้แนบ) |
  | `documents` | เอกสารแนบทั้งชุด (ใบกำกับภาษี / ใบเสร็จ / สลิป) — ดูหัวข้อถัดไป |
  | `quotation` | ข้อมูลหัวใบเสนอราคาต้นทาง — ดูหัวข้อ `quotation` ด้านล่าง |
  | `credit_note_numbers` | เลขที่ใบลดหนี้ของใบสั่งขายนี้ (`SR-xxxxxx-xxxx`) ตัดใบยกเลิก/ไม่อนุมัติ · `[]` = ไม่มี |

  ## `documents` — เอกสารแนบทั้งชุด (เพิ่ม 2026-09-17)

  ชุดเดียวกับส่วน "เอกสารแนบ" ในแผงรายละเอียดฝั่งเว็บ — รูปแบบเดียวกันใน `order/list`, `order/edit-api`, `billing/list`, `order/details`

  ```json
  "documents": {
    "invoice": { "number": "IV-2569-0123", "url": "https://…", "type": "pdf" },
    "receipt": { "url": "https://…", "type": "pdf" },
    "slips": [ { "id": 12, "url": "https://…", "type": "jpg", "amount": 1500.00, "uploaded_at": "2026-09-17 10:21:00" } ]
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `invoice` | เลขที่ (`number` ค่าเดียวกับ `invoice_number`) + ไฟล์ใบกำกับภาษี แนบตอนผ่านขั้น "เปิดบิล" |
  | `receipt` | ไฟล์ใบเสร็จ แนบตอนผ่านขั้น "ตรวจสอบการชำระเงิน" |
  | `slips[]` | สลิปโอนเงินทั้งหมดของใบ เรียงตามลำดับที่อัปโหลด |
  | `slips[].amount` | ยอดในสลิป หน่วยเป็น **บาท** |
  | `*.url` | ลิงก์ S3 อายุ 10 นาที · `null` = ไม่ได้แนบ |
  | `*.type` | นามสกุลไฟล์ (`pdf` · `jpg` · `png` …) ใช้เลือกแสดงเป็นรูปหรือ PDF · `null` = ไม่ได้แนบ |

  > 🔻 **Breaking (2026-09-17)** — ถอด `sales_document_no` / `sales_document_url` (เอกสารการขาย) ออกแล้ว
  > ใช้ไฟล์ใบเสร็จ `receipt_url` แทน · ค้นหาด้วยเลขที่เอกสารการขายไม่ได้แล้ว

  ## `quotation` — ข้อมูลใบเสนอราคาต้นทาง (เพิ่ม 2026-09-17)

  `null` = ใบสั่งขายเก่าที่ไม่ได้มาจากใบเสนอราคา

  ```json
  "quotation": {
    "id": 2692,
    "quotation_number": "QT-2026-0059",
    "quotation_date": "2026-09-17",
    "status": "completed",
    "status_label": "การขายเสร็จสิ้น",
    "price_mode": "novat",
    "total_before_discount": 156445,
    "total_discount": 555,
    "vat_amount": 10951.15,
    "total_after_discount": 167396.15,
    "note": "สามารถจัดส่งสินค้าได้ภายในสิ้นเดือนนี้",
    "quotation_image_url": null
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `id` | รหัสใบเสนอราคา — ใช้เรียก `quotation/edit/{id}` เมื่อต้องการรายการสินค้า |
  | `status` · `status_label` | คีย์อังกฤษ + ป้ายไทยชุดเดียวกับฝั่งเว็บ (สถานะเดินตามใบสั่งขาย) |
  | `price_mode` | โหมดภาษีของใบ |
  | `total_before_discount` · `total_discount` · `vat_amount` · `total_after_discount` | ยอดของ **ใบเสนอราคา** หน่วย **บาท** (อาจต่างจาก `total_after_discount` ระดับรายการซึ่งเป็นยอดของใบสั่งขาย) |
  | `note` | หมายเหตุในใบเสนอราคา |
  | `quotation_image_url` | รูปใบเสนอราคาแบบแนบรูป (S3 60 นาที · `null` = ไม่มี) |

  > `quotation_image_url` ระดับรายการเดิมเป็น `null` ตลอด — แก้แล้ว ค่าเดียวกับใน `quotation`

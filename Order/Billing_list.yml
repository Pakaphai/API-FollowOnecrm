info:
  name: Billing_list
  type: http
  seq: 5

http:
  method: GET
  url: "{{sale_uat}}/api/v1/billing/list?page=1&per_page=20&q="
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
    - name: q
      value: ""
      type: query
    - name: customer_id
      value: "4"
      type: query
      disabled: true
    - name: start_date
      value: 2026-01-01
      type: query
      disabled: true
    - name: end_date
      value: 2026-12-31
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## การแบ่งหน้า (pagination)

  เส้นนี้แบ่งหน้าเสมอ ไม่ส่งอะไรมาก็ได้ 20 รายการแรก

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >= 1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <= 100 | - |
  | `customer_id` | integer | - |
  | `start_date` / `end_date` | date | - |

  ส่ง `per_page` เกิน 200 หรือ `q` ยาวเกิน 100 ตัว จะได้ 422

  ## การค้นหา (q)

  `q` ถูกส่งไปกรองที่ฐานข้อมูล **ก่อน** แบ่งหน้า จึงค้นเจอทุกรายการที่ตรงคีย์เวิร์ด
  ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว ค้นแบบไม่แยกตัวพิมพ์เล็กใหญ่ (ILIKE) และมีคำนี้อยู่ตรงไหนก็ได้

  ค้นจาก: เลขที่ใบสั่งขาย - **เลขที่ใบกำกับภาษี** - **เลขที่ใบเสนอราคา** - **เลขที่เอกสารการขาย** - ชื่อลูกค้า

  ## ข้อมูลเอกสารในแต่ละรายการ

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `order_number` | เลขที่ใบสั่งขาย |
  | `quotation_number` | เลขที่ใบเสนอราคาต้นทาง |
  | `invoice_number` | เลขที่ใบกำกับภาษี |
  | `sales_document_no` | เลขที่เอกสารการขาย |
  | `invoice_attachment_url` | ลิงก์ไฟล์ใบกำกับภาษี (S3 10 นาที · `null` = ไม่ได้แนบ) |
  | `sales_document_url` | ลิงก์ไฟล์เอกสารการขาย (S3 10 นาที · `null` = ไม่ได้แนบ) |

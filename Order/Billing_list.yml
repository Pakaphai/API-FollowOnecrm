docs: |
  # API — รายการติดตามเก็บเงิน / วางบิล (Billing List)

  ดึงรายการใบสั่งขายสำหรับการติดตามเก็บเงินและการวางบิล พร้อมสรุปยอดเงินที่ชำระแล้ว (`total_paid`) และยอดที่ยังค้างชำระ (`total_unpaid`) ตามผลการค้นหาจริง เรียงตามรายการที่อัปเดตล่าสุด (`updated_at DESC`)

  ```
  GET /api/v1/billing/list
  Authorization: Bearer <token>
  Accept: application/json
  ```

  ---

  ## 1. พารามิเตอร์การค้นหาและแบ่งหน้า (Query String)

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น | รายละเอียด |
  |---|---|---|---|
  | `page` | integer ≥ 1 | `1` | หน้าที่ต้องการดูข้อมูล |
  | `per_page` | integer 1–200 | `20` | จำนวนรายการต่อหน้า (สูงสุด 200) |
  | `q` / `keyword` / `search` | string ≤ 100 | — | คำค้นหา (ค้นจาก **เลขที่ใบสั่งขาย, ชื่อลูกค้า, รหัสลูกค้า, ชื่อผู้ติดต่อ, เบอร์โทรศัพท์, เลขประจำตัวผู้เสียภาษี**) ค้นแบบไม่แยกตัวพิมพ์เล็ก-ใหญ่ |

  ---

  ## 2. ตัวอย่าง Response (200 OK)

  ```json
  {
    "order_dispatch": [
      {
        "id": 9,
        "order_number": "PO-260822-0006",
        "order_date": "2026-08-22",
        "delivery_date": "2026-08-25",
        "total_after_discount": 30688.35,
        "payment_status": "unpaid",
        "status": "รอการยืนยันคำสั่งซื้อ",
        "created_at": "2026-08-22T08:00:00.000000Z",
        "updated_at": "2026-08-24T16:20:00.000000Z",
        "customer_name": "บริษัท อนัญพร จำกัด",
        "business_type_id": 3,
        "credit_type": 1,
        "credit_type_name": "เครดิต",
        "credit": 30,
        "quotation_image_url": null
      }
    ],
    "total_paid": 150000.00,
    "total_unpaid": 30688.35,
    "page": 1,
    "size": 20,
    "total_elements": 1,
    "total_pages": 1,
    "has_next": false,
    "has_prev": false
  }
  ```

  ---

  ## 3. คำอธิบายตัวแปรใน Response

  ### ข้อมูลรายการวางบิลใน `order_dispatch[]`:
  * **`id`**: รหัสใบสั่งขาย (Order ID)
  * **`order_number`**: เลขที่ใบสั่งขาย (เช่น `PO-260822-0006`)
  * **`order_date`**: วันที่เปิดคำสั่งซื้อ
  * **`delivery_date`**: วันที่นัดหมายส่งมอบสินค้า
  * **`total_after_discount`**: ยอดเงินสุทธิที่ต้องเรียกเก็บ (บาท)
  * **`payment_status`**: สถานะการชำระเงิน (`paid` = ชำระเงินเรียบร้อยแล้ว, `unpaid` = ยังไม่ชำระ / รอเก็บเงิน)
  * **`status`**: สถานะขั้นตอนคำสั่งซื้อ (เช่น `รอการยืนยันคำสั่งซื้อ`, `จัดส่งสินค้าแล้ว`, `การขายเสร็จสิ้น`)
  * **`customer_name`**: ชื่อลูกค้าพร้อมคำนำหน้าตามประเภทธุรกิจ
  * **`business_type_id`**: รหัสประเภทธุรกิจ
  * **`credit_type`**: รหัสประเภทการชำระ (`1` = เครดิตเทอม, `2` = เงินสด / โอน)
  * **`credit_type_name`**: ข้อความประเภทการชำระ (`เครดิต` หรือ `เงินโอน / เงินสด`)
  * **`credit`**: จำนวนวันเครดิตเทอมที่ให้ลูกค้า (เช่น `30` วัน)
  * **`quotation_image_url`**: URL รูปภาพกรณีเป็นเอกสารแบบแนบรูป
  * **`created_at` / `updated_at`**: วันที่สร้างและแก้ไขเอกสารล่าสุด

  ### ยอดสรุปภาพรวม (Summary Amounts):
  * **`total_paid`**: ยอดเงินรวมทั้งหมดที่ **ชำระเงินแล้ว** (บาท) — คำนวณจากทุกรายการที่ตรงตามคำค้นหา
  * **`total_unpaid`**: ยอดเงินรวมทั้งหมดที่ **ยังค้างชำระ** (บาท) — คำนวณจากทุกรายการที่ตรงตามคำค้นหา

  ### ข้อมูลการแบ่งหน้า (Pagination):
  * **`page`**: หน้าปัจจุบัน
  * **`size`**: จำนวนรายการต่อหน้า
  * **`total_elements`**: จำนวนรายการทั้งหมด
  * **`total_pages`**: จำนวนหน้าทั้งหมด
  * **`has_next` / `has_prev`**: สถานะการมีหน้าถัดไป / หน้าก่อนหน้า

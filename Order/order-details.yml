docs: |
  # API — รายละเอียดใบสั่งขาย 1 ใบ

  ```
  GET /api/v1/api/order/details/{id}
  Authorization: Bearer <token>
  ```

  | | |
  |---|---|
  | Route | [`routes/api/api_v1.php`](../routes/api/api_v1.php) — อยู่ในกลุ่ม `auth_api` |
  | Controller | [`Api\ApiOrderController::getOrderDetails()`](../app/Http/Controllers/Api/ApiOrderController.php) |
  | ตารางหลัก | `orders` + `order_lines` + `order_line_options` + `customers` + `order_slips` |

  > ⚠️ **URL มี `api` ซ้ำสองครั้ง** (`/api/v1/api/order/details/{id}`) — ผิดรูปแบบจากเส้นอื่นทั้งหมด
  > แต่แอปที่ปล่อยไปแล้วเรียกแบบนี้อยู่ แก้เป็น `/api/v1/order/details/{id}` = breaking change

  ---

  ## Response

  คืน **object ดิบ** ไม่มี wrapper `{status, data}` เหมือนเส้นอื่น

  ```json
  {
    "id": 12,
    "order_number": "PO-260822-0002",
    "quotation_number": "QT-2026-0011",
    "invoice_number": "INV-2026-0007",
    "sales_document_no": "SD-2026-0005",
    "invoice_attachment_url": null,
    "sales_document_url": null,
    "seller_name": "สมชาย ใจดี",
    "status": "pending_billing",
    "status_label": "เปิดบิล",
    "customer": { ... },
    "customer_name_formatted": "บริษัท สยาม นวัตกรรม เทคโนโลยี จำกัด",
    "total_before_discount": 353694000,
    "total_after_discount": 353694000,
    "header_discount_type": "amount",
    "quotation_image_url": null,
    "conditions": [ ... ],
    "slips": [ ... ],
    "order_lines": [
      {
        "id": 16,
        "qty": 100,
        "unit_price": 353694000,
        "total_line": 353694000,
        "product": { "id": 126, "name": "VF-4" },
        "options_list": [
          { "id": 3, "group": "Through-Spindle Coolant", "name": "TSC READY-3RD PARTY",
            "price": 16813500, "usd": "5095.0000" }
        ]
      }
    ]
  }
  ```

  ---

  ## เลขเอกสารและข้อมูลเพิ่มเติม

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `quotation_number` | **เลขที่ใบเสนอราคาต้นทาง** · `null` = ใบเก่าที่ไม่มีต้นทาง ให้ตกไปใช้ `order_number` |
  | `invoice_number` | เลขที่ใบกำกับภาษี |
  | `sales_document_no` | เลขที่เอกสารการขาย |
  | `invoice_attachment_url` | ลิงก์ S3 ไฟล์ใบกำกับภาษี (10 นาที · `null` = ไม่ได้แนบ) |
  | `sales_document_url` | ลิงก์ S3 ไฟล์เอกสารการขาย (10 นาที · `null` = ไม่ได้แนบ) |
  | `seller_name` | ชื่อพนักงานขายเจ้าของเอกสาร |
  | `header_discount_type` | ประเภทส่วนลดท้ายบิล `amount` หรือ `percent` |
  | `status_label` | ป้ายภาษาไทยของ `status` ชุดเดียวกับฝั่งเว็บ |

  ---

  ## `order_lines[].options_list[]` — ตัวเลือกสินค้าที่ลูกค้าเลือก

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `id` | id ของตัวเลือกใน `product_options` (ส่งกลับไปที่ `option_ids` ตอนแก้ไขได้ตรง ๆ) |
  | `group` | ชื่อหมวดหมู่ **ณ วันที่ออกเอกสาร** |
  | `name` | ชื่อตัวเลือก **ณ วันที่ออกเอกสาร** |
  | `price` | ราคาที่บวกเพิ่ม หน่วยเป็น **สตางค์** (16813500 = ฿168,135.00) |
  | `usd` | ราคาที่บวกเพิ่มสกุล USD (`null` = ตัวเลือกนี้ไม่ได้ตั้งราคา USD ไว้) |

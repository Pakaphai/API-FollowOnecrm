info:
  name: update-payment-status
  type: http
  seq: 8

http:
  method: POST
  url: "{{sale_uat}}/api/v1/order/update/status/payment/1"
  body:
    type: json
    data: |-
      {
        "payment_status": "paid"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # API — ปรับปรุงสถานะการชำระเงินของใบสั่งขาย (Update Payment Status)

  ```
  POST /api/v1/order/update/status/payment/{id}
  Authorization: Bearer <token>
  Accept: application/json
  Content-Type: application/json
  ```

  | ฟิลด์ | บังคับ | ชนิด | หมายเหตุ |
  |---|:---:|---|---|
  | `payment_status` | ✅ | enum | `unpaid`, `partial_paid`, `paid` |

info:
  name: Order_list
  type: http
  seq: 1

http:
  method: GET
  url: "{{sale_uat}}/api/v1/order/list?page=1&per_page=20&q="
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
    - name: q
      value: ""
      type: query
    - name: customer_id
      value: "4"
      type: query
      disabled: true
    - name: status
      value: completed
      type: query
      disabled: true
    - name: payment_status
      value: paid
      type: query
      disabled: true
    - name: start_date
      value: 2026-01-01
      type: query
      disabled: true
    - name: end_date
      value: 2026-12-31
      type: query
      disabled: true
    - name: price_mode
      value: price
      type: query
      disabled: true
    - name: is_usd
      value: "1"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## ค่าคอมมิชชั่นของเอกสาร (`commission`) — เพิ่ม 22/09/2569

  ทุกแถวมี `commission` เพื่อใช้แสดงค่าคอมมิชชั่นของเอกสารขายโดยไม่ต้องเรียก API เพิ่ม

  ```json
  "commission": {
    "is_issued": true,
    "document_numbers": ["CM-202609-0002"],
    "rate_percent": 10,
    "before_withholding": 28284.20,
    "withholding_tax": 848.53,
    "net_commission": 27435.67
  }
  ```

  - เงินทั้งหมดเป็น **บาท** แล้ว
  - `is_issued: false` หมายถึงเอกสารยังไม่ถูกนำไปออกใบค่าคอม ฟิลด์ยอดจะเป็น `null`
  - `net_commission = before_withholding - withholding_tax`

  ## การแบ่งหน้า (pagination)

  เส้นนี้แบ่งหน้าเสมอ ไม่ส่งอะไรมาก็ได้ 20 รายการแรก

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >= 1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <= 100 | - |
  | `customer_id` | integer | - |
  | `status` | string | - |
  | `payment_status` | string | - |
  | `start_date` / `end_date` | date | - |
  | `price_mode` | string | - |
  | `is_usd` | boolean (0/1) | - |

  ส่ง `per_page` เกิน 200 หรือ `q` ยาวเกิน 100 ตัว จะได้ 422

  ## การค้นหา (q)

  `q` ถูกส่งไปกรองที่ฐานข้อมูล **ก่อน** แบ่งหน้า จึงค้นเจอทุกรายการที่ตรงคีย์เวิร์ด
  ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว ค้นแบบไม่แยกตัวพิมพ์เล็กใหญ่ (ILIKE) และมีคำนี้อยู่ตรงไหนก็ได้

  ค้นจาก: เลขที่ใบสั่งขาย - **เลขที่ใบกำกับภาษี** - ชื่อลูกค้า - รหัสลูกค้า - เบอร์โทร

  meta ที่แนบกลับมาทุกครั้ง (ระดับเดียวกับ key ของรายการ):

  ```json
  { "page": 1, "size": 20, "total_elements": 137, "total_pages": 7,
    "has_next": true, "has_prev": false }
  ```

  ## เลขเอกสารและไฟล์แนบในแต่ละใบ

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `order_number` | เลขที่หลักสำหรับแสดง — เลข QT ก่อน ไม่มีจึงตกไปใช้เลข PO |
  | `sale_order_number` | เลข PO จริงของใบสั่งขาย |
  | `quotation_number` | **เลขที่ใบเสนอราคาต้นทาง** — `null` = ใบเก่าที่ไม่มีต้นทาง |
  | `invoice_number` | เลขที่ใบกำกับภาษี (กรอกตอนอนุมัติผ่านขั้น "เปิดบิล") |
  | `invoice_attachment_url` | ไฟล์ใบกำกับภาษี (ลิงก์ S3 อายุ 10 นาที · `null` = ไม่ได้แนบ) |
  | `receipt_url` | ไฟล์ใบเสร็จ แนบตอนผ่านขั้น "ตรวจสอบการชำระเงิน" (ค่าเดียวกับ `receipt` · ลิงก์ S3 อายุ 10 นาที · `null` = ไม่ได้แนบ) |
  | `documents` | เอกสารแนบทั้งชุด (ใบกำกับภาษี / ใบเสร็จ / สลิป) — ดูหัวข้อถัดไป |
  | `status_en` / `status` | สถานะภาษาอังกฤษ / ป้ายภาษาไทย |
  | `header_discount_type` | `amount` หรือ `percent` |

  ## `documents` — เอกสารแนบทั้งชุด (เพิ่ม 2026-09-17)

  ชุดเดียวกับส่วน "เอกสารแนบ" ในแผงรายละเอียดฝั่งเว็บ — รูปแบบเดียวกันใน `order/list`, `order/edit-api`, `billing/list`, `order/details`

  ```json
  "documents": {
    "invoice": { "number": "IV-2569-0123", "url": "https://…", "type": "pdf" },
    "receipt": { "url": "https://…", "type": "pdf" },
    "slips": [ { "id": 12, "url": "https://…", "type": "jpg", "amount": 1500.00, "uploaded_at": "2026-09-17 10:21:00" } ]
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `invoice` | เลขที่ (`number` ค่าเดียวกับ `invoice_number`) + ไฟล์ใบกำกับภาษี แนบตอนผ่านขั้น "เปิดบิล" |
  | `receipt` | ไฟล์ใบเสร็จ แนบตอนผ่านขั้น "ตรวจสอบการชำระเงิน" |
  | `slips[]` | สลิปโอนเงินทั้งหมดของใบ เรียงตามลำดับที่อัปโหลด |
  | `slips[].amount` | ยอดในสลิป หน่วยเป็น **บาท** |
  | `*.url` | ลิงก์ S3 อายุ 10 นาที · `null` = ไม่ได้แนบ |
  | `*.type` | นามสกุลไฟล์ (`pdf` · `jpg` · `png` …) ใช้เลือกแสดงเป็นรูปหรือ PDF · `null` = ไม่ได้แนบ |

  > 🔻 **Breaking (2026-09-17)** — ถอด `sales_document_no` / `sales_document_url` (เอกสารการขาย) ออกแล้ว
  > ใช้ไฟล์ใบเสร็จ `receipt_url` แทน · ค้นหาด้วยเลขที่เอกสารการขายไม่ได้แล้ว

  ## ป้ายสถานะ (`status` / `status_en`)

  `status_en` คือคีย์อังกฤษ ส่วน `status` คือป้ายภาษาไทยซึ่งตรงกับฝั่งเว็บ (`OrderModel::STATUS_LABELS`)

  ตั้งแต่ 23/09/2569 มี `status_color` มาด้วย — สี hex ของ badge ชุดเดียวกับเว็บ
  (`OrderModel::STATUS_COLORS`) เช่น `"#56ca00"` สำหรับ "การขายเสร็จสิ้น" เอาไปทาสีป้ายในแอปได้เลย
  ไม่ต้อง map สีเอง สถานะที่ระบบไม่รู้จักจะได้สีเทา `#969191`

  ## ยอดในกล่องสรุป (เพิ่ม 23/09/2569)

  เดิมแอปต้องคำนวณยอดกลาง ๆ เองจาก `total_before_discount` กับ `header_discount`
  ตอนนี้เซิร์ฟเวอร์คิดมาให้ครบ ตรงกับกล่องสรุปในแผงรายละเอียดฝั่งเว็บบรรทัดต่อบรรทัด

  | ฟิลด์ | บรรทัดบนเว็บ | ความหมาย |
  |---|---|---|
  | `total_before_discount` | รวมเป็นเงิน | ยอดรวมหลังหักส่วนลดรายบรรทัดแล้ว |
  | `header_discount` | ส่วนลดท้ายบิล | จำนวนเงินที่ลด (บาท) แม้กรอกมาเป็น % |
  | `header_discount_percent` | ตัวเลขในวงเล็บ | เช่น `10` = ส่วนลดท้ายบิล (10%) · `null` = กรอกเป็นบาท |
  | `total_after_bill_discount` | ยอดรวมหลังหักส่วนลด | `total_before_discount - header_discount` |
  | `total_before_vat` | มูลค่าก่อนภาษี | ฐานภาษีของใบนี้ — **ไม่เท่ากันทุกโหมด ดูด้านล่าง** |
  | `vat_amount` | ภาษีมูลค่าเพิ่ม (7%) | ภาษีของทั้งใบ |
  | `vat_rate` | ตัวเลขในวงเล็บของบรรทัด VAT | `7` หรือ `0` เมื่อใบนี้ไม่คิดภาษี |
  | `total_after_discount` | จำนวนเงินรวมทั้งสิ้น | ยอดสุทธิที่ลูกค้าต้องจ่าย |

  เงินทุกช่องเป็น **บาท** แล้ว

  ### ฐานภาษีต่างกันตามโหมดราคา

  `total_before_vat` **ไม่ใช่** `total_after_bill_discount - vat_amount` เสมอไป ขึ้นกับ `price_mode` ของใบ

  | `price_mode` | `price_mode_label` | ฐานภาษี | ยอดสุทธิ |
  |---|---|---|---|
  | `novat` | ราคาแยกภาษีมูลค่าเพิ่ม 7% (Exclude) | = ยอดรวมหลังหักส่วนลด | ฐาน **+** VAT |
  | `vat` | ราคารวมภาษีมูลค่าเพิ่ม 7% (Include) | = ยอดรวมหลังหักส่วนลด **−** VAT (ถอด 7/107) | = ยอดรวมหลังหักส่วนลด |
  | `price` | ราคาไม่มีภาษี | = ยอดรวมหลังหักส่วนลด | = ยอดรวมหลังหักส่วนลด (VAT = 0) |

  ระวังชื่อ: `novat` คือ **แยกภาษี** ไม่ใช่ "ไม่มีภาษี" — ใบที่ไม่คิดภาษีคือ `price`

  ```json
  "price_mode": "novat", "price_mode_label": "ราคาแยกภาษีมูลค่าเพิ่ม 7% (Exclude)",
  "total_before_discount": 900.00, "header_discount": 90.00, "header_discount_percent": 10,
  "total_after_bill_discount": 810.00, "total_before_vat": 810.00,
  "vat_amount": 56.70, "vat_rate": 7, "total_after_discount": 866.70
  ```

  เว็บซ่อนบรรทัด "มูลค่าก่อนภาษี" ในโหมด `novat` / `price` เพราะจะซ้ำกับบรรทัดเหนือมัน
  แอปทำแบบเดียวกันได้ — แสดงบรรทัดนี้เฉพาะเมื่อ `price_mode === "vat"` และ `vat_amount > 0`

  ## ใบลดหนี้และยอดที่ต้องชำระ (เพิ่ม 23/09/2569)

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `credit_note_numbers` | เลขที่ใบลดหนี้ (`SR-xxxxxx-xxxx`) ของใบนี้ · `[]` = ไม่มี · ตัดใบที่ยกเลิก/ไม่อนุมัติออก |
  | `credit_note_total` | ยอดใบลดหนี้ที่อนุมัติแล้ว (บาท) · `0` = ไม่มี |
  | `payable_amount` | ยอดที่ต้องชำระจริง = `total_after_discount - credit_note_total` · **`null` = ไม่มีใบลดหนี้** ใช้ `total_after_discount` ได้เลย |

  ฝั่งเว็บแสดง `payable_amount` เป็นบรรทัดรองใต้ยอดรวมสุทธิ และไม่แสดงอะไรเมื่อไม่มีใบลดหนี้

  ## วันครบกำหนดชำระ (`due`) — เพิ่ม 23/09/2569

  ```json
  "due": {
    "credit_days": 30, "due_date": "2026-09-19", "text": "เกินกำหนด 4 วัน",
    "days_remaining": 0, "days_overdue": 4, "is_overdue": true, "level": "danger"
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `credit_days` | จำนวนวันเครดิตของลูกค้า · `0` = ไม่ได้ให้เครดิต |
  | `due_date` | วันครบกำหนด (`YYYY-MM-DD`) · `null` = ไม่เข้าเงื่อนไข |
  | `text` | ข้อความสำเร็จรูป เช่น "อีก 16 วันครบกำหนด" / "ครบกำหนดวันนี้" / "เกินกำหนด 4 วัน" · **`""` = ไม่ต้องแสดงอะไร** |
  | `days_remaining` | วันที่เหลือ · `0` เมื่อถึงหรือเลยกำหนดแล้ว |
  | `days_overdue` | จำนวนวันที่เลยกำหนด · `0` = ยังไม่เลย |
  | `is_overdue` | ถึงกำหนดวันนี้หรือเลยมาแล้ว (ใช้ทำสีเตือน) |
  | `level` | `danger` / `warning` / `success` สำหรับเลือกสี · `null` = ไม่ต้องแสดง |

  มีค่าเฉพาะใบที่ **ให้เครดิตไว้ + ยังไม่ชำระ (`payment_status: "unpaid"`) + อยู่ขั้น `shipped`**
  นอกเงื่อนไขนี้ `text` จะเป็นค่าว่าง นับจากวันส่งของ (`delivery_date`) ไม่มีจึงใช้วันที่เอกสาร
  แล้วจึงวันที่สร้าง — ตัวคำนวณตัวเดียวกับเว็บ (`OrderModel::creditDueInfo`)

  `level` มาจากเกณฑ์เดียวกับสีบนเว็บ: เลยกำหนด/ครบวันนี้ = `danger` · เหลือไม่เกิน 30% ของวันเครดิต = `warning` · นอกนั้น `success`

  ## ฟิลด์อื่นที่เพิ่มพร้อมกัน (23/09/2569)

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `payment_status` | `unpaid` · `partial_paid` · `paid` |
  | `credit_days` | จำนวนวันเครดิตของลูกค้า · `0` = ไม่ได้ให้เครดิต — ค่าเดียวกับ `due.credit_days` แต่อยู่ระดับบนให้ตรงกับ `quotation/list` (ก้อน `due` มีค่าเฉพาะใบที่ถึงขั้นรอชำระ ส่วนเงื่อนไขเครดิตมีตั้งแต่ต้น) |
  | `delivery_date` | วันส่งของ (`YYYY-MM-DD`) · `null` = ยังไม่ส่ง |
  | `reject_reason` | เหตุผลที่คลังแจ้งว่าสินค้าไม่เพียงพอ (สถานะ `rejected`) · `null` = ไม่ได้ถูกตีกลับ |

info:
  name: Order_list
  type: http
  seq: 1

http:
  method: GET
  url: "{{sale_uat}}/api/v1/order/list?page=1&per_page=20&q="
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## การแบ่งหน้า (pagination)

  เส้นนี้แบ่งหน้าเสมอ ไม่ส่งอะไรมาก็ได้ 20 รายการแรก

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >= 1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <= 100 | - |

  ส่ง `per_page` เกิน 200 หรือ `q` ยาวเกิน 100 ตัว จะได้ 422

  ## การค้นหา (q)

  `q` ถูกส่งไปกรองที่ฐานข้อมูล **ก่อน** แบ่งหน้า จึงค้นเจอทุกรายการที่ตรงคีย์เวิร์ด
  ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว ค้นแบบไม่แยกตัวพิมพ์เล็กใหญ่ (ILIKE) และมีคำนี้อยู่ตรงไหนก็ได้

  ค้นจาก: เลขที่ใบสั่งขาย - **เลขที่ใบกำกับภาษี** - ชื่อลูกค้า - รหัสลูกค้า - เบอร์โทร

  meta ที่แนบกลับมาทุกครั้ง (ระดับเดียวกับ key ของรายการ):

  ```json
  { "page": 1, "size": 20, "total_elements": 137, "total_pages": 7,
    "has_next": true, "has_prev": false }
  ```

  ต้องวนดึงต่อตาม `has_next` / `total_pages` ถ้าอยากได้ครบทุกรายการ
  รายละเอียดทั้งหมดอยู่ที่ docs/api-reference.md หัวข้อ "การแบ่งหน้า (pagination)"

  ## เลขเอกสาร 3 ตัวในแต่ละใบ

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `order_number` | เลขที่ใบสั่งขาย `PO-<YYMMDD>-<running>` |
  | `quotation_number` | **เลขที่ใบเสนอราคาต้นทาง** — เอกสารอ้างอิงที่ระบบยึดเป็นหลักและฝั่งเว็บแสดงในตาราง · `null` = ใบเก่าที่ไม่มีต้นทาง ให้ตกไปใช้ `order_number` |
  | `invoice_number` | เลขที่ใบกำกับภาษี — แอดมินกรอกตอนอนุมัติผ่านขั้น "เปิดบิล" · `null` = ยังไม่ถึงขั้นนั้น · ค้นด้วย `q` ได้ |

  ## ป้ายสถานะ (`status` / `status_en`)

  `status_en` คือคีย์อังกฤษ ส่วน `status` คือป้ายภาษาไทย ซึ่งตอนนี้ใช้**ชุดเดียวกับฝั่งเว็บ**แล้ว
  (`OrderModel::STATUS_LABELS`) ของเดิม API เขียนคำเอง จึงเพี้ยนไปคนละความหมายกับหน้าจอเว็บ

  | `status_en` | `status` (ป้ายไทย) |
  |---|---|
  | `open` | เปิดใบเสนอราคา |
  | `confirmed` | ยืนยันใบเสนอราคา |
  | `pending_billing` | เปิดบิล |
  | `dispatch` | รอส่งของ |
  | `shipped` | รอบัญชีแจ้งยอด |
  | `pending_slip` | รอแนบสลิป |
  | `pending_receipt` | รอออกใบเสร็จ |
  | `completed` | การขายเสร็จสิ้น |
  | `rejected` | สินค้าไม่เพียงพอ |
  | `cancelled` | ยกเลิก |

  > ⚠️ ที่เปลี่ยนไปจากเดิม — `dispatch` เคยส่งว่า "จัดส่งสินค้าแล้ว" ทั้งที่ของยังอยู่บนชั้น
  > (ของออกจากคลังตอนเข้าขั้น `shipped`) · `pending_slip` / `pending_receipt` เคยหลุดเป็นคีย์อังกฤษดิบ
  > · ขั้น `approved` (ตรวจสอบสินค้า) **ถูกตัดออกจากกระบวนการขายแล้ว** ใบที่ค้างถูกย้ายไป `pending_billing`


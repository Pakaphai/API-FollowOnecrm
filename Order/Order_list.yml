  ## 3. คำอธิบายตัวแปรใน Response

  ### ข้อมูลหัวใบสั่งขาย (`orders[]`):
  * **`id`**: รหัสใบสั่งขาย (Order ID)
  * **`order_number`**: เลขที่ใบสั่งขาย (เช่น `PO-260822-0006`)
  * **`order_date`**: วันที่สั่งซื้อ
  * **`status`**: ข้อความสถานะภาษาไทย (เช่น `รอการยืนยันคำสั่งซื้อ`, `ยืนยันคำสั่งซื้อแล้ว`, `เปิดบิลแล้ว`, `จัดส่งสินค้าแล้ว`, `การขายเสร็จสิ้น`)
  * **`status_en`**: รหัสสถานะภาษาอังกฤษ (`open`, `confirmed`, `approved`, `pending_billing`, `dispatch`, `shipped`, `completed`, `rejected`, `cancelled`)
  * **`total_before_discount`**: ยอดรวมราคาสินค้าก่อนหักส่วนลด (บาท)
  * **`header_discount`**: ส่วนลดท้ายใบสั่งขาย (บาท)
  * **`total_discount`**: ส่วนลดรวมทั้งหมด (บาท)
  * **`total_after_discount`**: ยอดรวมสุทธิหลังหักส่วนลด (บาท)
  * **`total_after_discount_usd`**: ยอดรวมสุทธิเทียบเป็นดอลลาร์ USD (คำนวณตามอัตราแลกเปลี่ยนของใบนี้)
  * **`usd_rate_used`**: อัตราแลกเปลี่ยน USD ที่ใช้คำนวณในเอกสารนี้ (เช่น `34.00`)
  * **`usd_rate_from_document`**: บ่งบอกว่าอัตรานี้ถูกตรึงและบันทึกไว้ในเอกสารแล้วหรือไม่
  * **`vat_amount`**: มูลค่าภาษีมูลค่าเพิ่ม (บาท)
  * **`note`**: หมายเหตุคำสั่งซื้อ
  * **`customer_name`**: ชื่อลูกค้า/บริษัทพร้อมคำนำหน้า
  * **`customer_code`**: รหัสอ้างอิงลูกค้า
  * **`contact_name`**: ชื่อผู้ติดต่อ
  * **`customer_phone`**: เบอร์โทรศัพท์ลูกค้า
  * **`tax_id`**: เลขประจำตัวผู้เสียภาษี 13 หลัก
  * **`customer_address` / `province_name` / `district_name` / `subdistrict_name` / `zip_code`**: ที่อยู่ในการจัดส่ง/ออกบิล
  * **`sale_order_pdf`**: URL ลิงก์ดาวน์โหลดไฟล์ PDF ใบสั่งขาย
  * **`reduction_pdf`**: URL ลิงก์ดาวน์โหลดไฟล์ PDF ใบลดหนี้ (กรณีมีใบลดหนี้ผูกกับออเดอร์นี้)
  * **`receipt`**: URL ลิงก์ไฟล์แนบสลิป/หลักฐานการชำระเงิน
  * **`quotation_image`**: URL รูปภาพกรณีเป็นใบสั่งขายแบบแนบรูปภาพ

  ### ข้อมูลรายการสินค้าในคำสั่งซื้อ (`order_lines[]`):
  * **`id`**: รหัสรายการสินค้า (Order Line ID)
  * **`product_id`**: รหัสสินค้า
  * **`qty`**: จำนวนสินค้าที่สั่งซื้อ
  * **`uom_code`**: หน่วยนับสินค้า (เช่น `EA`, `BOX`)
  * **`discount_type`**: ประเภทส่วนลด (`amount` = จำนวนเงิน, `percent` = เปอร์เซ็นต์)
  * **`manual_discount`**: ส่วนลดต่อชิ้นที่ระบุ
  * **`unit_price`**: ราคาต่อหน่วยของตัวสินค้าพื้นฐาน (ไม่รวมราคา Option) (บาท)
  * **`unit_price_total`**: ราคาต่อหน่วยรวมตัวเลือกแล้ว (บาท)
  * **`discount`**: จำนวนเงินส่วนลดรวมของรายการนี้ (บาท)
  * **`total_line`**: ยอดรวมของรายการนี้หลังหักส่วนลด (บาท)
  * **`usd_price`**: ราคาต่อหน่วยเฉพาะสินค้าในสกุล USD
  * **`usd_price_total`**: ราคาต่อหน่วยรวม Option ในสกุล USD
  * **`total_line_usd`**: ยอดรวมของรายการนี้แปลงเป็นสกุล USD
  * **`main_image_url`**: URL รูปภาพหลักของสินค้า
  * **`options[]`**: รายการตัวเลือกสินค้า (Option) ที่ลูกค้าเลือก (`id`, `group_name`, `name`, `price`, `usd`)

  ### ข้อมูลการแบ่งหน้า (Pagination):
  * **`page`**: หน้าปัจจุบัน
  * **`size`**: จำนวนรายการต่อหน้า
  * **`total_elements`**: จำนวนคำสั่งซื้อทั้งหมดที่ตรงตามเงื่อนไข
  * **`total_pages`**: จำนวนหน้าทั้งหมด
  * **`has_next` / `has_prev`**: สถานะการมีหน้าถัดไป / หน้าก่อนหน้า

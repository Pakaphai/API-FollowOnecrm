docs: |
  # API Specification: POST /api/v1/order/update-api/{id}

  แก้ไขข้อมูลใบสั่งขาย (Sale Order) พร้อมทำการ **ปรับปรุงยอดเงิน, รายการสินค้า, การหักลดหนี้, และซิงก์ข้อมูลกลับไปยังใบเสนอราคาต้นทาง (Quotation)**

  ---

  ## 1. ภาพรวมและกระบวนการทำงาน (Order Update Workflow)

  ```
  [ผู้ใช้ส่งคำขอแก้ไขใบสั่งขาย]
                │
                ▼
  [1. ตรวจสอบสิทธิ์และสถานะของเอกสาร (Permission & Policy Guard)]
       ├─ ตรวจสอบระดับผู้ใช้งาน (Actor Level) และสถานะใบสั่งขาย (OrderModel::isEditableBy)
       ├─ ป้องกันการแก้ไขเอกสารที่ปิดการขายแล้ว หรือส่งของเรียบร้อยแล้วโดยผู้ไม่มีสิทธิ์ (403 Forbidden)
       └─ รองรับทั้งโหมดมีรายการสินค้า และโหมดแนบรูปภาพ
                │
                ▼
  [2. การซิงก์รายการสินค้า (Order Lines Replacement)]
       ├─ รองรับชื่อคีย์ทั้ง 'order_lines' และ 'quotation_lines'
       ├─ ตรวจจับคู่รายการเดิมด้วย product_id + uom_code
       ├─ สินค้าที่ไม่อยู่ใน Payload จะถูก Soft Delete ทั้งใน order_lines และ quotation_lines
       └─ อัปเดต Option สินค้า (option_ids) และคำนวณราคา Option ให้อัตโนมัติ
                │
                ▼
  [3. การจัดการส่วนลด, ภาษี, และการหักลดหนี้ (Discounts & Deductions)]
       ├─ ส่วนลดท้ายบิล: คำนวณตาม header_discount_type (amount หรือ percent)
       ├─ การหักลดหนี้ (Reduction): ตรวจสอบยอด reduction ต้องไม่เกินยอดรวมสุทธิของบิล
       └─ จัดเก็บไฟล์แนบลดหนี้ (reduction_pdf) ลง S3
                │
                ▼
  [4. DB Commit และส่ง Response 200 OK พร้อมข้อมูลใบสั่งขายทั้งใบ]
  ```

  ---

  ## 2. พจนานุกรมตัวแปร Request (Request Parameters Dictionary)

  ### 2.1 ข้อมูลระดับหัวเอกสาร (Header Parameters)

  | ชื่อตัวแปร | ชนิดข้อมูล | จำเป็น | รายละเอียดและคำอธิบายทางธุรกิจ |
  |---|---|:---:|---|
  | `customer_id` | integer | ✅ | รหัสลูกค้า (`customers.id`) สามารถเปลี่ยนลูกค้าได้ |
  | `order_date` | string (date) | ✅ | วันที่บนใบสั่งขาย `YYYY-MM-DD` (ปี ค.ศ.) |
  | `quotation_id` | integer | | รหัสใบเสนอราคาต้นทาง (`quotation_headers.id`) |
  | `price_mode` | string (enum) | | โหมดภาษี: `price` (ไม่มีภาษี), `vat` (รวมภาษี 7%), `novat` (แยกภาษี 7%) |
  | `header_discount` | numeric | | ส่วนลดท้ายบิล (หน่วยบาท หรือเปอร์เซ็นต์ตาม `header_discount_type`) |
  | `header_discount_type` | string (enum) | | ประเภทส่วนลดท้ายบิล: `amount` (บาท) หรือ `percent` (% ของยอดรวม 0–100) |
  | `vat_amount` | numeric | | จำนวนภาษีมูลค่าเพิ่ม |
  | `note` | string | | หมายเหตุท้ายเอกสาร |
  | `reduction` | numeric | | จำนวนเงินหักลดหนี้ (หน่วยบาท ต้องไม่เกินยอดรวมสุทธิของใบสั่งขาย) |
  | `reduction_pdf` | file | | ไฟล์เอกสารแนบการหักลดหนี้ (jpg, jpeg, png, pdf ขนาด ≤5MB) |
  | `quotation_image` | file | | ไฟล์รูปภาพใบเสนอราคา (jpg, jpeg, png, gif, webp, pdf ขนาด ≤5MB) สำหรับใบที่ออกจากใบเสนอราคา |
  | `conditions` | array\<int\> | | รายการรหัสเงื่อนไขท้ายเอกสาร (`conditions.id`) |

  ---

  ### 2.2 ข้อมูลระดับรายการสินค้า (`order_lines[]` หรือ `quotation_lines[]`)

  | ชื่อตัวแปร | ชนิดข้อมูล | จำเป็น | รายละเอียดและคำอธิบาย |
  |---|---|:---:|---|
  | `order_lines` | array | ✅* | รายการสินค้าทั้งหมดของใบสั่งขาย (*เว้นได้เมื่อเป็นใบแบบแนบรูปภาพ) |
  | `order_lines[N][product_id]` | integer | ✅ | รหัสสินค้า (`products.id`) |
  | `order_lines[N][qty]` | numeric | ✅ | จำนวนสินค้าที่สั่งซื้อ (ขั้นต่ำ 1) |
  | `order_lines[N][uom_code]` | string | ✅ | รหัสหน่วยนับ (`EA`, `BX`, `SET` ฯลฯ) |
  | `order_lines[N][usd_price]` | numeric | | ราคาต่อหน่วยสกุล USD — **หากขายเป็น USD ต้องส่งค่านี้กลับมาเพื่อไม่ให้ราคาเด้งกลับเป็นบาท** |
  | `order_lines[N][manual_discount]` | numeric | | ส่วนลดพิเศษของบรรทัดสินค้า |
  | `order_lines[N][discount_type]` | string (enum) | | `amount` (บาท) หรือ `percent` (%) |
  | `order_lines[N][option_ids]` | array\<int\> | | รหัส Option สินค้าที่เลือก (**ไม่ส่ง = คง Option เดิมไว้**) |

  ---

  ## 3. โครงสร้าง Response (200 OK)

  Response จะส่งข้อมูลใบสั่งขายทั้งใบกลับมาในรูปแบบเดียวกับ `GET order/edit-api/{id}` เพื่อให้หน้าจอนำไปแสดงผลต่อได้ทันที:

  ```json
  {
    "success": true,
    "message": "แก้ไขข้อมูลสำเร็จ",
    "data": {
      "quotation_header": {
        "id": 6,
        "order_number": "PO-260911-0002",
        "quotation_number": "QT-2026-0006",
        "invoice_number": null,
        "sales_document_no": null,
        "order_date": "2026-09-11",
        "status": "open",
        "status_label": "เปิดใบสั่งขาย",
        "customer_id": 4,
        "customer_name": "บริษัท ตัวอย่าง จำกัด",
        "price_mode": "price",
        "total_before_discount": 5000.00,
        "header_discount": 0,
        "header_discount_type": "amount",
        "total_discount": 0,
        "vat_amount": 0,
        "total_after_discount": 5000,
        "total_after_discount_usd": 150,
        "quotation_lines": [
          {
            "id": 10,
            "product_id": 6,
            "uom_code": "BX",
            "qty": 6,
            "unit_price": 833.33,
            "usd_price": 25,
            "manual_discount": 0,
            "discount_type": "amount",
            "discount": 0,
            "total_line": 5000,
            "options": []
          }
        ]
      }
    }
  }
  ```

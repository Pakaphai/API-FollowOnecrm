docs: |
  # API — แก้ไขใบสั่งขายพร้อมแนบรูปภาพ (Order Update with Image)

  ```
  POST /api/v1/order/update-api/{id}
  Authorization: Bearer <token>
  Accept: application/json
  Content-Type: multipart/form-data
  ```

  แก้รูป + รายการสินค้าในคำขอเดียว (multipart/form-data)

  - แนบไฟล์ที่ช่อง `quotation_image` (jpeg,png,jpg,gif,webp,pdf ≤5MB)
    รูปเก็บที่ `quotation_headers.quotation_image` ของใบเสนอราคาต้นทาง
    ใบสั่งขายที่ไม่ได้ออกจากใบเสนอราคา -> 422 `code: order_has_no_quotation`

  - `order_lines` คือ "แทนที่ทั้งชุด" ไม่ใช่เพิ่มทีละรายการ
    สินค้าที่ไม่ได้อยู่ใน payload จะถูกลบออกจากใบ (soft delete)
    ถ้าอยากแก้แค่รูป: ตัด `order_lines` ออกให้หมด รายการสินค้าและยอดเดิมจะไม่ถูกแตะ

  - `header_discount_type`: `amount` (หน่วยบาท) หรือ `percent` (% 0-100)

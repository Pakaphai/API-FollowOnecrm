docs: |
  # API Specification: GET /api/v1/productlist?low_stock=1

  ดึงเฉพาะ **รายการสินค้าที่ยอดพร้อมขายต่ำกว่าจุดแจ้งเตือน (สินค้าเหลือน้อย / Low Stock Products)**
  เกณฑ์เดียวกับปุ่ม "สินค้าเหลือน้อย" และป้ายแจ้งเตือนบนหน้าจอจัดการสินค้าฝั่งเว็บ

  ```
  GET /api/v1/productlist?low_stock=1
  Authorization: Bearer <token>
  Accept: application/json
  ```

  ---

  ## 1. นิยามและเกณฑ์การคำนวณ "สินค้าเหลือน้อย"

  ```
  [1] ยอดคงเหลือจริงบนชั้น   = products.min_stock_level (ของที่อยู่ในคลัง)
  [2] ยอดที่ถูกจองไว้        = products.reserved_qty (ใบสั่งขายที่เปิดบิลแล้วแต่ยังไม่ได้ส่งของ)
  [3] ยอดคงเหลือพร้อมขาย     = available_qty = stock_qty = (min_stock_level - reserved_qty)
  [4] จุดแจ้งเตือนของสินค้า   = low_stock_threshold (หากไม่ได้ตั้ง = ค่ามาตรฐานระบบ 100 ชิ้น)

  ⭐ เงื่อนไข Low Stock: available_qty < low_stock_threshold  (is_low_stock = true)
  ```

  ---

  ## 2. พารามิเตอร์ Query Strings

  | พารามิเตอร์ | ชนิด | จำเป็น | รายละเอียด |
  |---|---|:---:|---|
  | `low_stock` | enum (`1`, `0`, `true`, `false`) | ✅ | `1` หรือ `true` เพื่อกรองเฉพาะสินค้าที่เหลือน้อย |
  | `page` | integer ≥1 | | หน้าที่ต้องการ (ค่าเริ่มต้น: 1) |
  | `per_page` | integer 1–200 | | จำนวนต่อหน้า (ค่าเริ่มต้น: 20) |
  | `q` | string ≤100 | | ค้นหาจากชื่อสินค้า, รหัสสินค้า (`products.code`), แบรนด์, รุ่น |
  | `brand_id` | integer | | กรองตามแบรนด์ |
  | `model_id` | integer | | กรองตามรุ่น |
  | `sort` | enum | | `price_asc`, `price_desc`, `created_asc`, `created_desc` |

  ---


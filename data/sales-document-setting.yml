docs: |-
  ## 2. `GET sales-document-setting`

  ไม่รับพารามิเตอร์ · อ่านได้ทุกคนที่ล็อกอิน (พนักงานขายต้องใช้ประกอบหน้าจอ)

  ```json
  {
    "success": true,
    "data": {
      "document_actions": { "pending": true, "order": false },
      "allowed_statuses": ["open"],
      "default_status": "open",
      "is_order_only": false,
      "document_label": "ใบเสนอราคา",
      "input_modes": { "lines": true, "image": false },
      "display": {
        "actions_summary": "ต้องผ่านการอนุมัติก่อนทุกครั้ง",
        "modes_summary": "กรอกรายการสินค้าเท่านั้น"
      }
    }
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `document_actions.pending` | แสดงปุ่ม "รออนุมัติ" หรือไม่ |
  | `document_actions.order` | แสดงปุ่ม "ส่งออเดอร์" หรือไม่ |
  | `allowed_statuses` | **ค่าที่ส่งไปกับ `quotation/create` ได้** — ส่งค่าอื่นมาเซิร์ฟเวอร์จะแปลงให้เอง (ดูข้อ 4) |
  | `default_status` | ตัวแรกของ `allowed_statuses` — ใช้เป็นค่าเริ่มต้นของปุ่มหลัก |
  | `is_order_only` | `true` = เปิดเฉพาะ "ส่งออเดอร์" ไม่มีขั้นตอนเสนอราคา |
  | `document_label` | คำที่ใช้เรียกเอกสารบนหน้าจอ — `"ใบเสนอราคา"` หรือ `"ออเดอร์"` |
  | `input_modes.lines` | แสดงตารางรายการสินค้าหรือไม่ · `false` = **ส่งมาก็จะได้ `422`** |
  | `input_modes.image` | แสดงส่วนแนบรูปภาพหรือไม่ · `false` = **ส่งมาก็จะได้ `422`** |
  | `display.actions_summary` | ข้อความพร้อมแสดงใต้หัวข้อ ไม่ต้องประกอบเอง |
  | `display.modes_summary` | เช่นเดียวกัน สำหรับกลุ่มวิธีกรอก |

  > ก้อน `allowed_statuses` / `default_status` / `document_label` เป็น **คำตอบสำเร็จรูป** ที่คำนวณจากธงให้แล้ว
  > ตั้งใจส่งไปเพื่อให้แอปไม่ต้องเขียนตรรกะแปลงค่าเอง แล้วเพี้ยนไปจากที่เซิร์ฟเวอร์บังคับ

  ### ตัวอย่างค่าที่เป็นไปได้ทั้ง 3 แบบ

  | ค่าตั้ง | `document_label` | `allowed_statuses` | `input_modes` |
  |---|---|---|---|
  | เปิดหมด (ค่าเริ่มต้น) | ใบเสนอราคา | `["open", "confirmed"]` | `lines: true, image: true` |
  | รออนุมัติ + รายการสินค้า | ใบเสนอราคา | `["open"]` | `lines: true, image: false` |
  | ส่งออเดอร์ + แนบรูปภาพ | **ออเดอร์** | `["confirmed"]` | `lines: false, image: true` |

  ---

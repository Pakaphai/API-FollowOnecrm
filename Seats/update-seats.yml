docs: |
  # API — เลือกบัญชีที่จะใช้งานต่อ (Update Seat Quota)

  ใช้เมื่อบริษัทมีผู้ใช้เกินแพ็กเกจ แล้วแอดมินต้องเลือกว่าจะเก็บบัญชีไหนไว้ใช้งานต่อ
  บัญชีที่ไม่ได้เลือกจะถูก **ระงับ** — ล็อกอินไม่ได้และไม่กินโควตา
  แต่ข้อมูลลูกค้า ยอดขาย และเอกสารยังอยู่ครบ ปลดระงับเมื่อไหร่ก็กลับมาใช้ต่อได้ทันที

  **เฉพาะแอดมิน** (`level` 0 หรือ 1) เท่านั้น

  ```
  POST /api/v1/seats
  Authorization: Bearer <token>
  Content-Type: application/json
  Accept: application/json
  ```

  ---

  ## 1. Request Body

  ```json
  {
    "active_ids": [1, 2, 13]
  }
  ```

  | ฟิลด์ | ชนิด | บังคับ | หมายเหตุ |
  |---|---|:---:|---|
  | `active_ids` | array\<int\> | ✅ | id ของบัญชีที่จะให้ **ใช้งานต่อ** |

  ### ⚠️ ต้องส่ง "ชุดเต็ม" ไม่ใช่เฉพาะที่เปลี่ยน

  ทุก id ที่ไม่อยู่ใน `active_ids` จะถูกระงับทั้งหมด — ถ้าส่งมาแค่คนที่เพิ่งติ๊กเพิ่ม
  คนที่เหลือจะโดนระงับหมด

  ### ส่งซ้ำได้ปลอดภัย (idempotent)

  เพราะส่งชุดเต็มทุกครั้ง การยิงซ้ำด้วย `active_ids` เดิมจึงได้ผลลัพธ์เดิมเป๊ะ
  ถ้าเน็ตมือถือหลุดกลางคันแล้วไม่แน่ใจว่าถึงเซิร์ฟเวอร์หรือยัง **ยิงซ้ำได้เลย**
  ไม่ต้องกลัวระงับคนซ้ำซ้อน

  id ที่ไม่มีอยู่จริงหรือถูกลบไปแล้วจะถูกตัดทิ้งเงียบ ๆ (ไม่ error)
  เพราะแอปอาจถือรายชื่อเก่าค้างไว้

  ---

  ## 2. Response (200 OK)

  ```json
  {
    "success": true,
    "message": "บันทึกแล้ว — ใช้งานต่อ 3 บัญชี ระงับไว้ 2 บัญชี",
    "seats": {
      "limit": 3,
      "used": 3,
      "suspended": 2,
      "remaining": 0,
      "unlimited": false,
      "is_full": true,
      "over_by": 0,
      "is_over_limit": false,
      "percent": 100
    }
  }
  ```

  หลังบันทึกสำเร็จ ระบบปลดล็อกทันที — เรียก endpoint อื่นได้ตามปกติเลย ไม่ต้องล็อกอินใหม่

  ---

  ## 3. Error

  ทุกกรณี **ไม่เขียนอะไรลงฐานข้อมูลเลย** — ตรวจครบก่อนค่อยบันทึกในทรานแซกชันเดียว

  | HTTP | เมื่อไหร่ | ควรกันไว้ที่แอปด้วย |
  |:---:|---|---|
  | `422` | เลือกเกิน `seats.limit` | ล็อกปุ่มบันทึกเมื่อ ติ๊ก > limit |
  | `422` | ไม่มี id ของตัวเองใน `active_ids` | ล็อกช่องติ๊กของแถวที่ `is_self = true` |
  | `422` | ไม่เหลือบัญชี level 0 หรือ 1 เลย | เตือนเมื่อเอาแอดมินออกจนหมด |
  | `422` | ไม่ได้ส่ง `active_ids` มา | — |
  | `403` | ผู้ใช้ที่ยิงไม่ใช่ level 0/1 | ไม่ต้องแสดงปุ่มตั้งแต่แรก |

  ### ตัวอย่าง — เลือก 4 คน บนแพ็กเกจ 3 ที่นั่ง (422)

  ```json
  {
    "success": false,
    "message": "แพ็กเกจของคุณรองรับผู้ใช้ 3 คน แต่เลือกไว้ 4 คน กรุณาเอาออกให้เหลือตามโควตา หรือซื้อที่นั่งเพิ่ม",
    "errors": {
      "active_ids": ["แพ็กเกจของคุณรองรับผู้ใช้ 3 คน แต่เลือกไว้ 4 คน กรุณาเอาออกให้เหลือตามโควตา หรือซื้อที่นั่งเพิ่ม"]
    },
    "seats": { "limit": 3, "used": 5, "over_by": 2, "is_over_limit": true }
  }
  ```

  ### ตัวอย่าง — ไม่มี id ของตัวเอง (422)

  ```json
  {
    "success": false,
    "message": "ต้องเก็บบัญชีของคุณเองไว้ใช้งานต่อ ไม่งั้นจะไม่มีใครเข้ามาจัดการระบบได้",
    "errors": { "active_ids": ["ต้องเก็บบัญชีของคุณเองไว้ใช้งานต่อ ไม่งั้นจะไม่มีใครเข้ามาจัดการระบบได้"] },
    "seats": { "limit": 3, "used": 5, "over_by": 2, "is_over_limit": true }
  }
  ```

  > `message` เป็นภาษาไทยพร้อมแสดงผล — แสดงตรง ๆ ได้เลย ไม่ต้องแปลหรือ map
  > และ **ทุก error response แนบ `seats` ล่าสุดมาด้วย** ใช้รีเฟรชตัวเลขบนหน้าจอ
  > โดยไม่ต้องยิง `GET /seats` ซ้ำ

  ### เหตุผลของกฎกันพลาด 3 ข้อ

  - **ห้ามล็อกตัวเองออก** — กดบันทึกเสร็จจะเด้งออกทันที และอาจไม่เหลือใครเข้ามาแก้ได้อีก
  - **ต้องเหลือแอดมิน** — level 2–4 เข้าหน้าจัดการโควตาไม่ได้ บริษัทจะติดตายทั้งบริษัท
  - **ห้ามเกินโควตา** — ถ้าผ่านได้ ด่านก็ไม่มีความหมาย

  ---

  📄 เอกสารเต็ม: [`docs/api-seat-quota.md`](../docs/api-seat-quota.md)

docs: |-
  ## 14. `DELETE /api/v1/relationship-detail/delete-contact/{id}`

  ลบนัดหมาย (soft delete) — **`{id}` = `relationship_detail_id`**

  ```bash
  curl -s -X DELETE "$BASE/relationship-detail/delete-contact/88" -H "$AUTH" -H "Accept: application/json" | jq
  ```

  | HTTP | ก้อนที่ได้ |
  |:---:|---|
  | `200` | `{"success": true, "message": "ลบข้อมูลเรียบร้อยแล้ว"}` |
  | `403` | `{"success": false, "message": "คุณไม่มีสิทธิ์เข้าถึงบันทึกนี้"}` — นัดของลูกค้าที่ไม่ใช่ของเซลส์คนนี้ (แอดมิน level 0/1 ผ่านหมด) |
  | `404` | `{"success": false, "message": "ไม่พบข้อมูลที่ต้องการลบ"}` — ไม่มี `{id}` นี้ หรือถูกลบไปแล้ว |
  | `500` | `{"success": false, "message": "...", "error": "..."}` |

  ### อธิบายตัวแปรใน response ทุกตัว

  | ฟิลด์ | ชนิด | อธิบาย |
  |---|---|---|
  | `success` | boolean | 🔴 ตัวชี้ขาดว่าลบสำเร็จหรือไม่ — มีครบทุกกรณี (200 / 403 / 404 / 500) |
  | `message` | string | ข้อความภาษาไทย · ตอน 500 เป็นข้อความที่ระบบแปลงให้อ่านง่ายแล้ว (เช่น "ข้อมูลนี้ถูกใช้งานอยู่...") โชว์ผู้ใช้ได้ |
  | `error` | string | **มีเฉพาะตอน 500** — ข้อความ exception ดิบ ใช้ debug เท่านั้น |

  > เป็น **soft delete** (`is_delete = true`) ข้อมูลยังอยู่ในฐานข้อมูล แค่ไม่ถูกดึงมาแสดงอีก

  > ลบ**เฉพาะนัดที่ส่ง `{id}` มาใบเดียว** และไม่ลบไฟล์รูป (กู้แถวคืนได้ รูปก็ยังอยู่)
  > **แก้เมื่อ 10/11/2569** — เดิมโค้ดลบพ่วงนัดทุกใบที่ `relationship_id == {id}` ด้วย (เอา id ของนัดไปเทียบผิดคอลัมน์) ทำให้นัดของลูกค้ารายอื่นหายไปได้


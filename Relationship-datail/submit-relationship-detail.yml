docs: |-
  ## 11. `POST /api/v1/relationship-detail/submit-contact/{id}`

  **ปิดงานนัดหมาย** — ตั้ง `mode = 'completed'` · **`{id}` = `relationship_detail_id`**

  ### ด่านแรก: เช็คความล่าช้า (ก่อน validate)

  ถ้านัดหมายนี้ **เลยวันนัดไปแล้ว** (`mode = scheduled` และ `follow_date < วันนี้`)
  และ **ยังไม่มีคำขอล่าช้าที่แอดมินอนุมัติ** → ถูกบล็อกทันที

  ```json
  {
    "success": false,
    "message": "นัดหมายนี้ล่าช้าแล้ว ไม่สามารถบันทึกเองได้ กรุณาส่งเหตุผลและรูปภาพให้ผู้ดูแลระบบอนุมัติ",
    "require_late_request": true
  }
  ```
  **HTTP 422** → แอปเจอ `require_late_request: true` ให้เด้ง modal ไปยิง [เส้น 12](#12-post-apiv1relationship-detaillate-requestid) แทน

  **ด่านนี้เช็คเฉพาะใบที่ยังไม่ปิดงาน** — เงื่อนไขคือ `mode = scheduled` เท่านั้น
  ใบที่ `mode = completed` ไปแล้ว ต่อให้ `follow_date` เลยมานานแค่ไหนก็ **ยิงซ้ำได้ไม่โดนบล็อก** (ระบบถือว่าเสร็จแล้วจึงไม่ต้องขออนุมัติอีก)
  เป็นช่องที่ทำให้แก้ข้อมูลใบที่ปิดงานแล้วย้อนหลังได้เรื่อย ๆ — ถ้าไม่อยากให้เกิด ต้องล็อกฝั่งแอปเอง

  ### ด่านที่เช็คก่อนด่านความล่าช้า: นัดที่ถูกตีกลับเป็น "ไม่ได้เข้าพบ" (เพิ่ม 2026-09-21)

  ถ้าแอดมิน **ไม่อนุมัติ** คำขอล่าช้าของนัดใบนี้ ระบบถือว่าเซลส์ไม่ได้เข้าพบลูกค้าตามนัด
  เป็นสถานะปลายทาง — ปิดงานย้อนหลังไม่ได้อีก ต่อให้แนบรูปหรือเหตุผลมาครบก็ตาม

  ```json
  {
    "success": false,
    "message": "นัดหมายนี้ถูกบันทึกเป็น \"ไม่ได้เข้าพบลูกค้า\" เพราะผู้ดูแลระบบไม่อนุมัติคำขอล่าช้า ไม่สามารถดำเนินการต่อได้ หากต้องการติดตามลูกค้ารายนี้ กรุณาสร้างนัดหมายใหม่",
    "is_not_visited": true
  }
  ```
  **HTTP 422** → แอปไม่ควรปล่อยให้ยิงถึงตรงนี้ ให้ปิดปุ่ม "บันทึก" ไว้ตั้งแต่แรกเมื่อเห็น
  `is_not_visited = true` (มาจาก `getcustomer/detail/byid/{id}` หรือ `relationship-detail/late-status/{id}`)
  แล้วขึ้นป้าย `"ไม่ได้เข้าพบลูกค้า"` แทน · ถ้ายังต้องตามลูกค้ารายนี้ต่อ ต้องสร้างนัดหมายใหม่

  ### ด่านสอง: ปิดงานก่อนถึงวันนัด (ต้องมีเหตุผล)

  ตรงข้ามกับด่านแรก — ถ้า `follow_date` ที่ส่งมา **ยังมาไม่ถึง** (เช่น วันนี้ 27 แต่ส่ง `follow_date` เป็นวันที่ 29)
  แปลว่าเซลส์กำลังปิดงานก่อนกำหนด เช่น ลูกค้าโทรมาคุยจบก่อนถึงวันนัด

  **ปิดได้** แต่ต้องส่ง `early_close_reason` มาด้วยเสมอ ไม่งั้นตกที่ validator:

  ```json
  {
    "message": "Validation failed.",
    "errors": {
      "early_close_reason": ["ปิดงานก่อนถึงวันนัดหมาย กรุณาระบุเหตุผลที่ปิดงานก่อนกำหนด"]
    }
  }
  ```
  **HTTP 422** → แอปควรเช็คเองก่อนยิงว่า `follow_date > วันนี้` แล้วเด้งช่องกรอกเหตุผลขึ้นมา

  เทียบวันแบบตัดเวลาทิ้ง (`follow_date > วันนี้` เท่านั้นที่นับ) — ปิดตรงวันนัดพอดีไม่ถือว่าปิดก่อน ไม่ต้องส่งเหตุผล
  และด่านนี้ **แปลงปี พ.ศ. ให้ก่อนเทียบ** (ต่างจากตัวที่บันทึกลงฐานข้อมูลซึ่งยังไม่แปลง)

  ### Content-Type ใช้ได้ 2 แบบ

  | แบบ | ใช้เมื่อ |
  |---|---|
  | `multipart/form-data` | **ปกติใช้แบบนี้** เพราะการปิดงาน**ต้องมี**รูปการเข้าพบ (`visit_pic`) |
  | `application/json` | ใช้ได้เฉพาะกรณีใบนั้น**เคยแนบรูปไว้แล้ว** (ใช้รูปเดิมต่อ) |

  ```
  POST /api/v1/relationship-detail/submit-contact/3
  Authorization: Bearer <token>
  Content-Type: multipart/form-data
  Accept: application/json
  ```

  ### พารามิเตอร์ — อันไหนสำคัญ อันไหนไม่

  | ฟิลด์ | บังคับ | ความสำคัญ | กติกา / อธิบาย |
  |---|:---:|:---:|---|
  | `{id}` (ใน URL) | ✅ | 🔴 | **`relationship_detail_id`** ของนัดหมายที่จะปิดงาน — ไม่ใช่ `customer_id` · ไม่พบ → **500** |
  | `customer_id` | ✅ | 🔴 | ต้องมีอยู่จริงใน `customers` · ส่งผิดคือย้ายนัดหมายไปอยู่กับลูกค้าคนอื่นทันที |
  | `contact_type_id` | ✅ | 🔴 | integer · ⚠️ **ไม่ตรวจว่ามีจริง** ส่งเลขมั่วผ่าน validator แต่ไปตายที่ foreign key เป็น **500** |
  | `follow_date` | ✅ | 🔴 | `Y-m-d` — วันที่เข้าพบจริง · ⚠️ **เส้นนี้ไม่แปลงปี พ.ศ. ให้** (ต่างจากเส้น 8/10) ต้องส่ง ค.ศ. เท่านั้น |
  | `relationship_status_id` | | 🔴 | **ควรส่งทุกครั้งตอนปิดงาน** — สถานะความสัมพันธ์หลังเข้าพบ เป็นข้อมูลที่รายงานและ dashboard ใช้ · ไม่ส่ง = ถูกเขียนทับเป็น `null` |
  | `visit_conclusion_id` | | 🔴 | **ควรส่งทุกครั้งตอนปิดงาน** — สรุปผลการเข้าพบ (สนใจ / ขอใบเสนอราคา / ปฏิเสธ) · ไม่ส่ง = ถูกเขียนทับเป็น `null` |
  | `visit_pic` | ✅* | 🔴 | รูปหลักฐานการเข้าพบ · image ≤ **5MB** · `jpeg, jpg, png` เท่านั้น · **บังคับตอนปิดงาน** — ไม่แนบมาและใบนั้นยังไม่เคยมีรูป → **422** `"กรุณาแนบรูปภาพระหว่างติดต่อกับลูกค้าก่อนปิดงาน"` · ใบที่เคยแนบไว้แล้วไม่ต้องอัปซ้ำ (ใช้รูปเดิม ไม่ถูกล้าง) |
  | `time_start` / `time_end` | | 🟡 | `H:i` เช่น `09:00` — **ห้ามมีวินาที** ค่าที่อ่านมาจากเส้น 9 เป็น `09:00:00` ต้องตัดก่อนส่ง |
  | `contact_detail` | | 🟡 | สรุปสิ่งที่คุยกับลูกค้า · validator จำกัด 255 ตัวอักษร |
  | `early_close_reason` | ⚠️ | 🔴 | **บังคับเมื่อ `follow_date` ยังมาไม่ถึง** (ปิดงานก่อนวันนัด) · ≤1000 ตัวอักษร · ปิดตรงวันหรือหลังวันนัดไม่ต้องส่ง — ส่งมาก็ถูกล้างเป็น `null` |
  | `latitude` / `longitude` | | 🟡 | พิกัดที่เข้าพบจริง ใช้ยืนยันว่าไปถึงหน้างาน · numeric · เก็บทศนิยม 6 ตำแหน่ง |

  **ฟิลด์ที่ส่งมาก็ไม่มีผล** — `mode` (ฟิกซ์เป็น `completed` เสมอ), `visit_number` (ใช้ค่าเดิมของใบนั้น), `relationship_id`, `occasion`, `created_by`, `id`

  > ⚠️ **ไม่ใช่ partial update** — ฟิลด์ที่ไม่ส่งมาถูกเขียนทับเป็น `null` ทั้งหมด (ยกเว้น `visit_pic` และ `visit_number`)
  > ฉะนั้นตอนปิดงานต้องส่งข้อมูลเดิมกลับมาให้ครบทุกช่อง ไม่ใช่ส่งเฉพาะช่องที่แก้

  > 📸 **ปิดงานต้องมีรูปหน้างานเสมอ** ทั้งปิดตรงวันนัดและปิดก่อนถึงวันนัด — กติกาเดียวกับฝั่งเว็บ
  > เงื่อนไขที่ผ่านได้คือ แนบไฟล์มาในคำขอนี้ **หรือ** ใบนั้นมีรูปเดิมอยู่แล้ว

  > ⚠️ ข้อความ validation ของเส้นนี้เป็น **ภาษาอังกฤษ** (`"The customer id field is required."`) เพราะไม่ได้ใส่ข้อความไทยกำกับไว้เหมือนเส้น 8 — แอปควรแปลเองจากชื่อฟิลด์ใน `errors`

  ### ตัวอย่าง — multipart (แนบรูป)

  ```bash
  curl -s -X POST "$BASE/relationship-detail/submit-contact/3" \
    -H "$AUTH" -H "Accept: application/json" \
    -F "customer_id=1" \
    -F "contact_type_id=1" \
    -F "relationship_status_id=2" \
    -F "visit_conclusion_id=1" \
    -F "follow_date=2026-08-18" \
    -F "time_start=09:00" -F "time_end=10:45" \
    -F "contact_detail=เข้าพบเรียบร้อย" \
    -F "latitude=13.7563" -F "longitude=100.5018" \
    -F "visit_pic=@image33.png" | jq
  ```

  ### ตัวอย่าง — ปิดงานก่อนถึงวันนัด

  วันนี้ 27 แต่นัดไว้ 29 — ต้องแนบ `early_close_reason` มาด้วย

  ```bash
  curl -s -X POST "$BASE/relationship-detail/submit-contact/3" \
    -H "$AUTH" -H "Accept: application/json" -H "Content-Type: application/json" \
    -d '{
      "customer_id": 1,
      "contact_type_id": 1,
      "relationship_status_id": 2,
      "visit_conclusion_id": 1,
      "follow_date": "2026-08-29",
      "contact_detail": "คุยจบทางโทรศัพท์",
      "early_close_reason": "ลูกค้าโทรมาแจ้งผลก่อนถึงวันนัด"
    }' | jq
  ```

  ### ตัวอย่าง — JSON (ไม่แนบรูป)

  ```bash
  curl -s -X POST "$BASE/relationship-detail/submit-contact/3" \
    -H "$AUTH" -H "Accept: application/json" -H "Content-Type: application/json" \
    -d '{
      "customer_id": 1,
      "contact_type_id": 1,
      "relationship_status_id": 2,
      "visit_conclusion_id": 1,
      "follow_date": "2026-08-18",
      "time_start": "09:00",
      "time_end": "10:45",
      "contact_detail": "เข้าพบเรียบร้อย",
      "latitude": 13.7563,
      "longitude": 100.5018
    }' | jq
  ```

  ### ผลลัพธ์ — `200`

  ก้อนจริงจากการยิง multipart ข้างบน

  ```json
  {
    "success": true,
    "message": "บันทึกการนัดหมายสำเร็จ",
    "customer_id": "1",
    "image_path": "crm/visit_pics/1787029535-9b9a734a-80c2-4f25-abdd-525c786e7813.png",
    "relationship_status_id": {
      "mode": "completed",
      "customer_id": "1",
      "contact_type_id": "1",
      "relationship_status_id": "2",
      "visit_conclusion_id": "1",
      "follow_date": "2026-08-18",
      "visit_number": "VIS202607-0003",
      "time_start": "09:00",
      "time_end": "10:45",
      "longitude": "100.5018",
      "latitude": "13.7563",
      "contact_detail": "เข้าพบเรียบร้อย",
      "early_close_reason": null,
      "early_closed_at": null,
      "updated_by": 4,
      "updated_at": "2026-08-18T05:05:35.531581Z",
      "visit_pic": "crm/visit_pics/1787029535-9b9a734a-80c2-4f25-abdd-525c786e7813.png"
    },
    "closed_early": false,
    "closed_early_days": null,
    "closed_early_label": null,
    "closed_late": false,
    "closed_late_days": null,
    "closed_late_label": null
  }
  ```

  ปิดก่อนวันนัด (วันนี้ 27 นัดไว้ 29 พร้อมส่ง `early_close_reason`) จะได้

  ```json
  "closed_early": true,
  "closed_early_days": 2,
  "closed_early_label": "ปิดงานก่อนวันนัด"
  ```

  ปิดงานนัดที่เลยวันนัด (หลังแอดมินอนุมัติคำขอล่าช้า 5 วัน) จะได้

  ```json
  "closed_late": true,
  "closed_late_days": 5,
  "closed_late_label": "ปิดงานล่าช้า 5 วัน"
  ```

  ### อธิบายตัวแปรใน response ทุกตัว

  | ฟิลด์ | ชนิด | ความสำคัญ | อธิบาย |
  |---|---|:---:|---|
  | `success` | boolean | 🔴 | `true` = ปิดงานสำเร็จ · ถูกบล็อกเพราะล่าช้าจะได้ `false` + `require_late_request` |
  | `message` | string | 🟡 | `"บันทึกการนัดหมายสำเร็จ"` เอาไปโชว์ toast ได้ตรง ๆ |
  | `customer_id` | string \| integer | 🟡 | id ลูกค้า ใช้ redirect กลับหน้ารายละเอียด · ⚠️ **ยิง multipart จะได้ `"1"` เป็น string** เพราะ echo ค่าจาก request ที่ยังไม่ถูก cast — อย่าเทียบด้วย `===` |
  | `image_path` | string \| null | 🟡 | path ดิบบน S3 ของรูปที่อัปในรอบนี้ · ไม่ได้แนบรูปใหม่ = `null` **แม้นัดหมายจะมีรูปเดิมอยู่** · ไม่ใช่ URL แสดงรูปไม่ได้ ต้องดึง `visit_pic_url` จากเส้นอ่าน |
  | `relationship_status_id` | **object** | 🔴 | 🐞 **ชื่อผิดความหมาย** — ไม่ใช่ id สถานะ แต่เป็น **ก้อนข้อมูลทั้งชุดที่เพิ่งเขียนลงฐานข้อมูล** ใช้ตรวจว่าค่าอะไรถูกบันทึกไปบ้าง |
  | `closed_early` | boolean | 🔴 | **ผลการปิดงานรอบนี้** (เพิ่ม 2026-09-17) — `true` = ปิดก่อนถึงวันนัด ใช้โชว์ toast/ป้ายได้เลย |
  | `closed_early_days` | integer \| null | 🟡 | ปิดก่อนวันนัดกี่วัน (วันไทย) · ไม่ได้ปิดก่อนกำหนด = `null` |
  | `closed_early_label` | string \| null | 🟡 | ป้าย `"ปิดงานก่อนวันนัด"` · ไม่ได้ปิดก่อนกำหนด = `null` |
  | `closed_late` | boolean | 🔴 | **ธงปิดงานล่าช้า** (เพิ่ม 2026-09-17) — `true` = ปิดงานแล้ว และปิดได้เพราะแอดมินอนุมัติคำขอนัดหมายล่าช้า |
  | `closed_late_days` | integer \| null | 🟡 | จำนวนวันที่ล่าช้าตามคำขอ · ไม่ได้ปิดงานล่าช้า = `null` |
  | `closed_late_label` | string \| null | 🟡 | ป้ายชุดเดียวกับเว็บ เช่น `"ปิดงานล่าช้า 5 วัน"` · ไม่ได้ปิดงานล่าช้า = `null` |
  | `require_late_request` | boolean | 🔴 | **มีเฉพาะตอนถูกบล็อก (422)** — `true` = ให้แอปเด้ง modal ขออนุมัติล่าช้าแทน |
  | `is_not_visited` | boolean | 🔴 | **มีเฉพาะตอนถูกบล็อก (422)** (เพิ่ม 2026-09-21) — `true` = นัดใบนี้ถูกตีกลับเป็น "ไม่ได้เข้าพบลูกค้า" ปิดงานไม่ได้แล้ว · ต่างจาก `require_late_request` ตรงที่ **ห้ามเด้ง modal ขออนุมัติ** เพราะยื่นใหม่ไม่ได้ |

  **ฟิลด์ข้างใน `relationship_status_id`** — คือ array `$data` ที่ controller เอาไป `update()` ตรง ๆ

  | ฟิลด์ | ค่าจากตัวอย่าง | อธิบาย |
  |---|---|---|
  | `mode` | `"completed"` | 🔴 ฟิกซ์เสมอ — ยืนยันว่านัดหมายถูกปิดงานแล้ว |
  | `customer_id` | `"1"` | ลูกค้าที่บันทึกไป |
  | `contact_type_id` | `"1"` | ประเภทการติดต่อที่บันทึกไป |
  | `relationship_status_id` | `"2"` | 🔴 **ตัวนี้แหละคือ id สถานะจริง** (ซ้อนอยู่ใน key ชื่อเดียวกัน) |
  | `visit_conclusion_id` | `"1"` | สรุปผลการเข้าพบที่บันทึกไป |
  | `follow_date` | `"2026-08-18"` | วันที่เข้าพบตามที่ส่งมา — **ทับค่าเดิมของนัดหมาย** |
  | `visit_number` | `"VIS202607-0003"` | 🔴 **ค่าเดิมของใบนั้น ไม่ gen ใหม่** สังเกตว่าเป็นเดือน 07 ทั้งที่ปิดงานเดือน 08 เพราะเลขผูกกับตอนสร้าง |
  | `time_start` / `time_end` | `"09:00"` / `"10:45"` | เวลาที่ส่งมา (ไม่มีวินาที ต่างจากตอนอ่านกลับที่จะมี `:00` ต่อท้าย) |
  | `latitude` / `longitude` | `"13.7563"` / `"100.5018"` | ค่าดิบตามที่ส่งมา — **ยังไม่ถูกปัดเป็น 6 ตำแหน่ง** ตอนอ่านกลับจะกลายเป็น `"13.756300"` |
  | `contact_detail` | `"เข้าพบเรียบร้อย"` | บันทึกสรุปที่ส่งมา |
  | `early_close_reason` | `null` | 🔴 เหตุผลที่ปิดงานก่อนวันนัด — **ปิดตรงวันหรือหลังวันนัดจะเป็น `null` เสมอ** (ล้างค่าเดิมทิ้ง) |
  | `early_closed_at` | `null` | 🟢 เวลาที่กดปิดงานก่อนกำหนด (ISO 8601 UTC) — คู่กับ `early_close_reason` มีทั้งคู่หรือไม่มีทั้งคู่ |
  | `updated_by` | `4` | 🟢 id ผู้ใช้ที่กดปิดงาน — **เป็น integer จริง** (มาจาก token ไม่ได้มาจาก request) |
  | `updated_at` | `"2026-08-18T05:05:35.531581Z"` | 🟢 เวลาที่ปิดงาน (ISO 8601 UTC) |
  | `visit_pic` | `"crm/visit_pics/1787029535-....png"` | 🟡 **มีเฉพาะตอนแนบรูปใหม่** — ไม่แนบก็จะไม่มี key นี้ในก้อนเลย (ไม่ใช่ `null`) |

  > ⚠️ **ค่าในก้อนนี้เป็น string เกือบทั้งหมด** เพราะเป็นค่าที่รับมาจาก multipart form แล้ว echo กลับตรง ๆ ยังไม่ผ่านการ cast ของฐานข้อมูล
  > ถ้ายิงแบบ JSON จะได้ชนิดตามที่ส่งไป (number ก็เป็น number) — **อย่าเอาก้อนนี้ไปใช้เป็นข้อมูลอ้างอิง** ให้ยิงเส้นอ่านซ้ำแทน

  > 🐞 **`relationship_status_id` ในผลลัพธ์คืนก้อน `$data` ทั้งอัน** ไม่ใช่ตัวเลข — ชื่อ key ไม่ตรงกับค่า
  > อย่า parse เป็น int เด็ดขาด ถ้าต้องการค่าจริงให้อ่านจาก `response.relationship_status_id.relationship_status_id`
  > หรือยิงเส้นอ่านซ้ำจะปลอดภัยกว่า

  > ⚠️ เส้นนี้ก็เขียนทับฟิลด์ที่ไม่ส่งมาเป็น `null` เหมือนเส้น 10 และมีบั๊กลบรูปเก่าไม่โดนแบบเดียวกัน
  > ต่างกันตรงนี้บังคับ `mode = 'completed'` และ **ไม่ยิง notification**


docs: |-
  ## 4. `POST /api/v1/update-password`

  | ฟิลด์ | บังคับ | กติกา |
  |---|:---:|---|
  | `new_password` | ✅ | `min:8` + `confirmed` |
  | `new_password_confirmation` | ✅ | ต้องตรงกับด้านบน |

  เปลี่ยนรหัสผ่านของ **ผู้ใช้ที่ login เท่านั้น** (อ่านจาก token ไม่รับ id)

  ```json
  { "success": true, "message": "รหัสผ่านถูกเปลี่ยนเรียบร้อยแล้ว" }
  ```

  | HTTP | เงื่อนไข |
  |:---:|---|
  | `401` | `{success:false, message:"ไม่พบข้อมูลผู้ใช้งาน หรือเซสชันหมดอายุ"}` |
  | `422` | `{success:false, message:"Validation failed.", errors:{...}}` |
  | `500` | `{success:false, message:"เกิดข้อผิดพลาดในการเปลี่ยนรหัสผ่าน..."}` |

  > ⚠️ **ไม่ขอรหัสผ่านเดิม** — ใครที่ถือ token ที่ยังไม่หมดอายุเปลี่ยนรหัสผ่านได้ทันที ถ้าเครื่องหลุดมือ token ที่ค้างอยู่ใช้ยึดบัญชีได้ ถ้าจะเพิ่มความปลอดภัยควรเพิ่ม `current_password` และตรวจด้วย `Hash::check()`
  >
  > token เดิมยัง**ใช้ได้ต่อ**หลังเปลี่ยนรหัสผ่าน (JWT ไม่ผูกกับ password) — ถ้าต้องการเตะทุกอุปกรณ์ออกต้อง blacklist token เอง

  ---

docs: |-
  ## 5. `DELETE /api/v1/delete-user/{id}`

  ปิดใช้งานบัญชีพนักงาน (soft delete — ตั้ง `is_delete = true`)

  **ลูกค้า ความสัมพันธ์ และบันทึกการเข้าพบยังคงอยู่** และผูกกับรหัสพนักงานเดิม เพื่อให้แอดมินยังเข้าถึงข้อมูลได้และย้ายผู้รับผิดชอบภายหลังได้ — พฤติกรรมเดียวกับการลบผ่านหน้าเว็บ

  ```json
  { "success": true, "message": "บัญชีถูกปิดใช้งานเรียบร้อยแล้ว" }
  ```

  | HTTP | เงื่อนไข |
  |:---:|---|
  | `404` | `{error:"ไม่พบผู้ใช้งาน"}` (หรือถูกลบไปแล้ว) |
  | `403` | ลบแอดมินไม่ได้ — ดูด้านล่าง |
  | `500` | `{error:"ไม่สามารถปิดใช้งานบัญชีได้", message:"..."}` |

  ### กันไม่ให้ระบบไม่มีแอดมิน

  ถ้าเป้าหมายเป็น level 0/1 ระบบเช็ค `User::canDeleteAdmin()` ก่อน แล้วตอบ 403 พร้อมเหตุผลที่ตรงกับสถานการณ์:

  | กรณี | ข้อความ |
  |---|---|
  | เป็นแอดมิน**คนแรก** | `"ไม่สามารถปิดใช้งานบัญชีผู้ดูแลระบบคนแรกได้ เนื่องจากเป็นบัญชีเจ้าของที่ผูกกับการสมัครใช้งาน"` |
  | ลบแล้วจะไม่เหลือแอดมินที่เคย login | `"ไม่สามารถปิดใช้งานบัญชีนี้ได้ ต้องมีผู้ดูแลระบบที่เคยเข้าสู่ระบบแล้วเหลืออยู่อย่างน้อย 1 บัญชี"` |

  > แอดมินที่ยังไม่เคยเข้าสู่ระบบ (`has_logged_in = false`) **ไม่นับเป็นตัวสำรอง** เพราะบัญชีนั้นอาจตั้งรหัสผ่านไม่สำเร็จ/ไม่มีใครใช้จริง

  ---

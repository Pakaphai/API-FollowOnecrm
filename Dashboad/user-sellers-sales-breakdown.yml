info:
  name: user-sellers-sales-breakdown
  type: http
  seq: 7

http:
  method: GET
  url: "{{sale_uat}}/api/v1/user/sellers/2/sales-breakdown"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: month
      value: "9"
      type: query
      disabled: true
    - name: year
      value: "2026"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## ที่มาของยอดขาย — สิทธิ์เซลส์

  `GET /api/v1/user/sellers/{userId}/sales-breakdown`

  ข้อมูลชุดเดียวกับหน้าต่าง "ที่มาของยอดขาย" บน `/dashboarduser`
  ส่งข้อมูลเซลส์ทุกคนในตารางอันดับพร้อมรายละเอียดใน `data.sellers` ภายในคำขอเดียว
  รวมคนที่ยอดขายเป็นศูนย์ โดยเลือกบัญชีเซลส์ที่ไม่ถูกลบและเคยล็อกอินแล้วเหมือนหน้าเว็บ
  ข้อมูลแต่ละคนอยู่ใน `data.sellers` เพียงครั้งเดียว ไม่มีรายละเอียดซ้ำที่ระดับ `data`
  ลำดับ response: `data.period` → `data.ranking_period` → `data.sellers`
  แต่ละคนเรียงฟิลด์: `rank` → `seller` → `total_sales_all` → `total_sales_month` → `summary` → `contact_types` → `customers`
  ใช้ Bearer token ของบัญชีเซลส์ในตัวแปร `token`
  และตั้ง `sale_uat` ให้เป็น URL ของบริษัทที่บัญชีนี้ใช้งาน

  ### วิธีเรียก

  - เปลี่ยนเลข `2` ใน URL เป็นรหัสเซลส์ที่ต้องการดู
  - ดูของตัวเอง: ใช้ `data.user_id` จาก `GET /api/v1/user/dashboard`
  - ค่าเริ่มต้นดูสะสมทั้งหมด
  - เปิด Params `month` และ `year` พร้อมกันเพื่อกรองเดือน เช่น `month=9&year=2026` (ปี ค.ศ.)

  ### สิทธิ์ตามหน้าเว็บ

  - ดูตัวเอง: เห็นชื่อ รูปโปรไฟล์ และชื่อ/รหัสลูกค้าจริง
  - เซลส์ดูคนอื่น: เห็นสถิติ แต่ชื่อเซลส์เป็น `ไม่ระบุตัวตน` ชื่อลูกค้าเป็น `ลูกค้ารายที่ 1, 2...` และ `customer_id` เป็น null
  - แอดมิน level 0/1 เห็นชื่อจริงตามสิทธิ์เดิม

  ### ข้อมูลใน response

  Response ห่อด้วย `{success: true, message: "Success", data: {...}}`

  | ฟิลด์ใน data | ความหมาย |
  |---|---|
  | sellers | รายการเซลส์ทุกคน เรียงอันดับตามยอดเดือนที่เลือก แล้วตามยอดสะสม |
  | sellers[].rank | อันดับ เริ่มที่ 1 |
  | sellers[].total_sales_all | ยอดสะสมทั้งหมด หน่วยบาท |
  | sellers[].total_sales_month | ยอดเดือนใน ranking_period หน่วยบาท |
  | sellers[].seller | ข้อมูลเซลส์ ปกปิดชื่อ/รูปของคนอื่นตามสิทธิ์ |
  | sellers[].summary, sellers[].contact_types, sellers[].customers | รายละเอียดของแต่ละคน รวมข้อมูลลูกค้าและการติดต่อที่ปกปิดตามสิทธิ์ |
  | ranking_period | เดือน/ปีสำหรับอันดับและยอดรายเดือน ไม่ส่งตัวกรองใช้เดือนปัจจุบัน ส่วนรายละเอียดเป็นสะสมทั้งหมด |
  | sellers[].seller | รหัส ชื่อ รูปโปรไฟล์ และ is_owner |
  | period | month, year และ has_filter |
  | sellers[].summary.total_sales | ยอดขายหน่วยบาท จากบิล completed และ paid |
  | sellers[].summary.order_count | จำนวนบิล |
  | sellers[].summary.customer_count | จำนวนลูกค้าที่เปิดบิล |
  | sellers[].summary.total_contacts | จำนวนการติดต่อที่เสร็จแล้วของเซลส์ในช่วงที่เลือก รวมลูกค้าที่ไม่ได้เปิดบิลด้วย |
  | sellers[].summary.customers_without_contact | ลูกค้าที่เปิดบิลแต่ไม่มีการติดต่อที่นับได้ในช่วงที่เลือก |
  | sellers[].contact_types | สรุปจำนวนการติดต่อแยกช่องทาง |
  | sellers[].customers | รายชื่อลูกค้าที่เปิดบิล ยอดขาย จำนวนบิล ช่องทางติดต่อ และวันที่ติดต่อล่าสุด |

  แสดงตารางจาก `data.sellers` และเปิดรายละเอียดจากรายการนั้นได้ทันที:
  `seller.name`, `total_sales_all / total_sales_month`, `summary`, `contact_types`, `customers`

  `401` หมายถึงยังไม่ผ่านการยืนยันตัวตน และ `404` อาจเกิดจากไม่พบเซลส์หรือเซิร์ฟเวอร์ยังไม่มี route นี้
  หากได้รับข้อความ "ดูที่มาของยอดขายได้เฉพาะผู้ดูแลระบบเท่านั้น" ให้ตรวจว่าเลือก request นี้และ URL ไม่มี `/dashboard/admin/`

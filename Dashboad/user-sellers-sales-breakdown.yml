info:
  name: user-sellers-sales-breakdown
  type: http
  seq: 7

http:
  method: GET
  url: "{{sale_uat}}/api/v1/user/sellers/2/sales-breakdown"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: month
      value: "9"
      type: query
      disabled: true
    - name: year
      value: "2026"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## ที่มาของยอดขาย — สิทธิ์เซลส์

  `GET /api/v1/user/sellers/{userId}/sales-breakdown`

  ข้อมูลชุดเดียวกับหน้าต่าง "ที่มาของยอดขาย" บน `/dashboarduser`
  ส่งข้อมูลเซลส์ทุกคนในตารางอันดับพร้อมรายละเอียดใน `data.sellers` ภายในคำขอเดียว
  รวมคนที่ยอดขายเป็นศูนย์ โดยเลือกบัญชีเซลส์ที่ไม่ถูกลบและเคยล็อกอินแล้วเหมือนหน้าเว็บ
  ข้อมูลแต่ละคนอยู่ใน `data.sellers` เพียงครั้งเดียว ไม่มีรายละเอียดซ้ำที่ระดับ `data`
  ลำดับ response: `data.period` → `data.ranking_period` → `data.sellers`
  แต่ละคนเรียงฟิลด์: `rank` → `seller` → `total_sales_all` → `total_sales_month` → `summary` → `contact_types` → `customers`
  ใช้ Bearer token ของบัญชีเซลส์ในตัวแปร `token`
  และตั้ง `sale_uat` ให้เป็น URL ของบริษัทที่บัญชีนี้ใช้งาน

  ### วิธีเรียก

  - ใส่รหัสเซลส์ที่มีอยู่จริงแทนเลข `2` เช่น `data.user_id` จาก `GET /api/v1/user/dashboard`
  - เส้นนี้คืนรายการเซลส์ทุกคนในตาราง ไม่ต้องเปลี่ยน ID แล้วเรียกซ้ำทีละคน
  - สิทธิ์และ `is_owner` อ้างอิงบัญชีใน token ไม่ได้อ้างอิงเลขใน URL
  - ค่าเริ่มต้นดูสะสมทั้งหมด
  - เปิด Params `month` และ `year` พร้อมกันเพื่อกรองเดือน เช่น `month=9&year=2026` (ปี ค.ศ.)

  ### สิทธิ์ตามหน้าเว็บ

  - ดูตัวเอง: เห็นชื่อ รูปโปรไฟล์ และชื่อ/รหัสลูกค้าจริง
  - เซลส์ดูคนอื่น: เห็นสถิติ แต่ชื่อเซลส์เป็น `ไม่ระบุตัวตน` ชื่อลูกค้าเป็น `ลูกค้ารายที่ 1, 2...` และ `customer_id` เป็น null
  - แอดมิน level 0/1 เห็นชื่อจริงตามสิทธิ์เดิม

  ### ข้อมูลใน response

  Response ห่อด้วย `{success: true, message: "Success", data: {...}}`

  | ฟิลด์ใน data | ความหมาย |
  |---|---|
  | sellers | รายการเซลส์ทุกคน เรียงอันดับตามยอดเดือนที่เลือก แล้วตามยอดสะสม |
  | sellers[].rank | อันดับ เริ่มที่ 1 |
  | sellers[].total_sales_all | ยอดสะสมทั้งหมด หน่วยบาท |
  | sellers[].total_sales_month | ยอดเดือนใน ranking_period หน่วยบาท |
  | sellers[].seller.id | รหัสที่ใช้แยกเซลส์แต่ละคน แม้ชื่อแสดงผลจะเหมือนกัน |
  | sellers[].seller.is_owner | true = ข้อมูลของบัญชีที่ใช้ token นี้, false = ข้อมูลของคนอื่น |
  | sellers[].seller.name | ชื่อที่ใช้แสดงผล อาจเป็น "ไม่ระบุตัวตน" จึงไม่ควรใช้เป็นรหัสอ้างอิง |
  | sellers[].seller.profile_img_url | รูปโปรไฟล์หรือรูปเริ่มต้นตามสิทธิ์ |
  | ranking_period | เดือน/ปีสำหรับอันดับและยอดรายเดือน ไม่ส่งตัวกรองใช้เดือนปัจจุบัน ส่วนรายละเอียดเป็นสะสมทั้งหมด |
  | period | month, year และ has_filter |
  | sellers[].summary.total_sales | ยอดขายหน่วยบาท จากบิล completed และ paid |
  | sellers[].summary.order_count | จำนวนบิล |
  | sellers[].summary.customer_count | จำนวนลูกค้าที่เปิดบิล |
  | sellers[].summary.total_contacts | จำนวนการติดต่อที่เสร็จแล้วของเซลส์ในช่วงที่เลือก รวมลูกค้าที่ไม่ได้เปิดบิลด้วย |
  | sellers[].summary.customers_without_contact | ลูกค้าที่เปิดบิลแต่ไม่มีการติดต่อที่นับได้ในช่วงที่เลือก |
  | sellers[].contact_types | สรุปจำนวนการติดต่อแยกช่องทาง |
  | sellers[].customers | รายชื่อลูกค้าที่เปิดบิล ยอดขาย จำนวนบิล ช่องทางติดต่อ และวันที่ติดต่อล่าสุด |

  แสดงตารางจาก `data.sellers` และเปิดรายละเอียดจากรายการนั้นได้ทันที:
  `seller.name`, `total_sales_all / total_sales_month`, `summary`, `contact_types`, `customers`

  ### แยกข้อมูลของแต่ละคนอย่างไร

  หนึ่ง object ใน `data.sellers` คือข้อมูลของเซลส์หนึ่งคน
  `summary`, `contact_types` และ `customers` ภายใน object นั้นเป็นของ `seller.id` คนเดียวกันทั้งหมด
  ใช้ `seller.id` เป็น key ของแถว และใช้ `seller.is_owner` สำหรับติดดาว/ไฮไลต์แถวตัวเอง
  `rank` ใช้แสดงอันดับเท่านั้น เพราะอันดับเปลี่ยนได้ตามเดือนและยอดขาย
  หากหลายคนชื่อ "ไม่ระบุตัวตน" เหมือนกัน ให้แยกด้วย `seller.id` โดยไม่ต้องแสดงรหัสนี้บนหน้าจอ

  ตัวอย่างโครงสร้างย่อ (ข้อมูลสมมติ ตัดฟิลด์รายละเอียดบางส่วนเพื่อให้อ่านง่าย):

  ```json
  {
    "success": true,
    "message": "Success",
    "data": {
      "period": { "month": null, "year": null, "has_filter": false },
      "ranking_period": { "month": 9, "year": 2026 },
      "sellers": [
        {
          "rank": 1,
          "seller": { "id": 2, "name": "เซลส์ตัวอย่าง", "is_owner": true },
          "total_sales_all": 1000,
          "total_sales_month": 1000,
          "summary": { "total_sales": 1000, "order_count": 1, "customer_count": 1, "total_contacts": 0, "customers_without_contact": 1 },
          "contact_types": [],
          "customers": [
            { "customer_id": 10, "customer_name": "ลูกค้าตัวอย่าง", "total_sales": 1000 }
          ]
        },
        {
          "rank": 2,
          "seller": { "id": 3, "name": "ไม่ระบุตัวตน", "is_owner": false },
          "total_sales_all": 500,
          "total_sales_month": 0,
          "summary": { "total_sales": 500, "order_count": 1, "customer_count": 1, "total_contacts": 0, "customers_without_contact": 1 },
          "contact_types": [],
          "customers": [
            { "customer_id": null, "customer_name": "ลูกค้ารายที่ 1", "total_sales": 500 }
          ]
        }
      ]
    }
  }
  ```

  ### ตัวอย่างนำไปใช้ในแอป

  ```javascript
  // response คือ JSON ที่ได้จาก API
  const rows = response.data.sellers;
  const myRow = rows.find(row => row.seller.is_owner);

  // เมื่อกดแถว ให้ส่ง seller.id ของแถวนั้นมาเลือกข้อมูล
  function getSellerDetail(sellerId) {
    return rows.find(row => String(row.seller.id) === String(sellerId));
  }

  const selected = getSellerDetail(3);
  if (selected) {
    const { seller, summary, contact_types, customers } = selected;
    // ใช้ข้อมูลชุดนี้เปิดหน้าต่างรายละเอียดได้เลย ไม่ต้องเรียก API ซ้ำ
  }
  ```

  `myRow` อาจไม่มีค่า หากบัญชีใน token ไม่อยู่ในรายการเซลส์ เช่น บัญชีแอดมิน
  ช่วงเวลาใน `data.period` ใช้ร่วมกับรายละเอียดทุกคน ส่วน `data.ranking_period` ใช้กับยอดรายเดือนในตาราง

  `401` หมายถึงยังไม่ผ่านการยืนยันตัวตน และ `404` อาจเกิดจากไม่พบเซลส์หรือเซิร์ฟเวอร์ยังไม่มี route นี้
  หากได้รับข้อความ "ดูที่มาของยอดขายได้เฉพาะผู้ดูแลระบบเท่านั้น" ให้ตรวจว่าเลือก request นี้และ URL ไม่มี `/dashboard/admin/`

info:
  name: Calendar
  type: http
  seq: 2

http:
  method: GET
  url: "{{sale_uat}}/api/v1/calendar"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## สถานะปิดงานก่อนกำหนด / ล่าช้า (เพิ่ม 2026-09-17)

  ทุกนัดหมายในผลลัพธ์มีฟิลด์เหล่านี้เพิ่ม — ป้ายชุดเดียวกับการ์ดนัดหมายฝั่งเว็บ

  | ฟิลด์ | ชนิด | อธิบาย |
  |---|---|---|
  | `closed_early` | boolean | `true` = ปิดงานแล้ว (`mode = completed`) และตอนกดปิดยังไม่ถึงวันนัด |
  | `closed_early_days` | integer \| null | ปิดก่อนวันนัดกี่วัน (นับตามวันไทย) · ไม่ได้ปิดก่อนกำหนด = `null` |
  | `closed_early_label` | string \| null | ป้ายภาษาไทย `"ปิดงานก่อนวันนัด"` · ไม่ได้ปิดก่อนกำหนด = `null` |
  | `closed_late` | boolean | `true` = ปิดงานแล้ว และปิดได้เพราะแอดมินอนุมัติคำขอนัดหมายล่าช้า |
  | `closed_late_days` | integer \| null | จำนวนวันที่ล่าช้าตามคำขอ · ไม่ได้ปิดงานล่าช้า = `null` |
  | `closed_late_label` | string \| null | ป้ายชุดเดียวกับเว็บ เช่น `"ปิดงานล่าช้า 5 วัน"` · ไม่ได้ปิดงานล่าช้า = `null` |
  | `is_late` | boolean | นัดเลยวันนัดแล้วแต่ยังไม่ปิดงาน |

  ```json
  {
    "mode": "completed",
    "follow_date": "2026-08-29",
    "early_close_reason": "ลูกค้าโทรมาแจ้งผลก่อน",
    "early_closed_at": "2026-08-27T03:00:00.000000Z",
    "closed_early": true,
    "closed_early_days": 2,
    "closed_early_label": "ปิดงานก่อนวันนัด",
    "closed_late": false,
    "closed_late_days": null,
    "closed_late_label": null,
    "is_late": false
  }
  ```

  ## ไม่ได้เข้าพบลูกค้า / นัดที่ถูกยกเลิก (เพิ่ม 2026-09-21)

  ปฏิทินต้องแยกนัด 3 แบบออกจากกัน — **ยังต้องไป** / **ลูกค้ายกเลิก** / **ไม่ได้เข้าพบ**
  ทุกแถวแนบธงมาให้พร้อมระบายสี ไม่ต้องคำนวณเอง

  | ฟิลด์ | ชนิด | อธิบาย |
  |---|---|---|
  | `is_not_visited` | boolean | `true` = แอดมินไม่อนุมัติคำขอล่าช้า ถือว่าไม่ได้เข้าพบตามนัด → **ระบายสีแดง** |
  | `not_visited_label` | string \| null | ป้ายภาษาไทย `"ไม่ได้เข้าพบลูกค้า"` · ไม่ได้อยู่ในสถานะนี้ = `null` |
  | `is_cancelled` | boolean | `true` = ลูกค้ายกเลิกนัด — คนละสถานะกับไม่ได้เข้าพบ และยังกดคืนสถานะได้ |
  | `cancel_reason` | string \| null | เหตุผลที่ยกเลิก · ไม่ได้ยกเลิก = `null` |
  | `follow_status_id` | integer \| null | สถานะดิบ — `2` = ลูกค้ายกเลิก · `3` = ไม่ได้เข้าพบ · ค่าอื่นหรือ `null` = ปกติ **ให้ใช้ธง 2 ตัวข้างบนแทนการเทียบเลขเอง** |

  ```json
  {
    "mode": "scheduled",
    "follow_date": "2026-09-05",
    "is_late": true,
    "is_not_visited": true,
    "not_visited_label": "ไม่ได้เข้าพบลูกค้า",
    "is_cancelled": false,
    "cancel_reason": null,
    "follow_status_id": 3
  }
  ```

  > `is_not_visited` ดูผลคำขอล่าสุดควบกับ `follow_status_id` — นัดที่ถูกตีกลับก่อนระบบจะตั้งสถานะให้
  > (ข้อมูลเก่า) จึงได้ `true` เหมือนกัน แอปไม่ต้องไปเทียบ `late_request_status` เอง

  > นัดที่เป็น "ไม่ได้เข้าพบ" หรือถูกยกเลิก **ไม่ถูกนับเป็นงานค้างแล้ว** ทั้งในตัวนับงานวันนี้/ล่าช้า
  > และการแจ้งเตือนรายวัน — ถ้ายังต้องตามลูกค้ารายนั้นต่อ ต้องสร้างนัดใหม่

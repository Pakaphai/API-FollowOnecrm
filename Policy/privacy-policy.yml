docs: |
  # API — นโยบายความเป็นส่วนตัวฉบับปัจจุบัน (Active Privacy Policy)

  ดึงข้อมูลนโยบายความเป็นส่วนตัว (Privacy Policy) ฉบับที่มีผลบังคับใช้ในปัจจุบัน (`is_active = true`) สำหรับแสดงผลใน Mobile App หรือหน้าลงทะเบียน/ขอความยินยอม (Consent)

  ```
  GET /api/v1/privacy-policy
  Accept: application/json
  ```

  | | |
  |---|---|
  | Route | [`routes/api/api_v1.php`](../routes/api/api_v1.php) |
  | Controller | [`Api\ApiLegalController::privacy()`](../app/Http/Controllers/Api/ApiLegalController.php) |
  | สิทธิ์เข้าถึง | 🔓 สาธารณะ (Public — ไม่ต้องแนบ JWT Token) |

  ---

  ## 1. Parameters
  *ไม่มีพารามิเตอร์ (ดึงฉบับ active ล่าสุดอัตโนมัติ)*

  ---

  ## 2. Response (200 OK)

  ```json
  {
    "success": true,
    "data": {
      "id": 1,
      "type": "privacy_policy",
      "version": "1.0",
      "title": "นโยบายความเป็นส่วนตัว (Privacy Policy)",
      "content": "<h2>นโยบายความเป็นส่วนตัว</h2><p>...</p>",
      "content_format": "html",
      "content_hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
      "is_active": true,
      "effective_date": "2026-08-23T00:00:00.000000Z",
      "created_at": "2026-08-23T00:00:00.000000Z",
      "created_by": 1
    }
  }
  ```

  | ฟิลด์ | ชนิด | คำอธิบาย |
  |---|---|---|
  | `id` | integer | รหัสของนโยบายฉบับนี้ |
  | `type` | string | ประเภทนโยบาย (`privacy_policy`, `terms_of_service`, `cookie_policy`) |
  | `version` | string | เลขเวอร์ชัน เช่น `"1.0"`, `"1.1"` |
  | `title` | string | หัวข้อของนโยบาย |
  | `content` | string | เนื้อหาของนโยบาย (จัดรูปแบบตาม `content_format`) |
  | `content_format` | string | รูปแบบเนื้อหา เช่น `html`, `markdown` |
  | `content_hash` | string | SHA-256 hash ของเนื้อหา สำหรับตรวจสอบความถูกต้อง (Tamper Detection) |
  | `is_active` | boolean | สถานะเปิดใช้งานเป็นฉบับปัจจุบัน (`true`/`false`) |
  | `effective_date` | timestamp | วันและเวลาที่มีผลบังคับใช้ |

  ---

  ## 3. Error Response (404 Not Found)

  ```json
  {
    "success": false,
    "message": "Policy not found"
  }
  ```

docs: |
  # API — นโยบายความเป็นส่วนตัวตามเวอร์ชัน (Privacy Policy by Version)

  ดึงข้อมูลนโยบายความเป็นส่วนตัว (Privacy Policy) ตามเลขเวอร์ชันที่ระบุ เพื่อดูฉบับย้อนหลังหรือตรวจสอบข้อตกลงที่ผู้ใช้เคยยินยอมไว้

  ```
  GET /api/v1/privacy-policy/v/{version}
  Accept: application/json
  ```

  | | |
  |---|---|
  | Route | [`routes/api/api_v1.php`](../routes/api/api_v1.php) |
  | Controller | [`Api\ApiLegalController::privacy()`](../app/Http/Controllers/Api/ApiLegalController.php) |
  | สิทธิ์เข้าถึง | 🔓 สาธารณะ (Public — ไม่ต้องแนบ JWT Token) |

  ---

  ## 1. Path Parameters

  | ฟิลด์ | บังคับ | ชนิด | ตัวอย่าง | คำอธิบาย |
  |---|:---:|---|---|---|
  | `version` | ✅ | string | `1.0` | เลขเวอร์ชันของนโยบายที่ต้องการดู |

  ---

  ## 2. Response (200 OK)

  ```json
  {
    "success": true,
    "data": {
      "id": 1,
      "type": "privacy_policy",
      "version": "1.0",
      "title": "นโยบายความเป็นส่วนตัว (Privacy Policy)",
      "content": "<h2>นโยบายความเป็นส่วนตัว</h2><p>...</p>",
      "content_format": "html",
      "content_hash": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
      "is_active": true,
      "effective_date": "2026-08-23T00:00:00.000000Z",
      "created_at": "2026-08-23T00:00:00.000000Z",
      "created_by": 1
    }
  }
  ```

  ---

  ## 3. Error Response (404 Not Found)

  ```json
  {
    "success": false,
    "message": "Policy not found"
  }
  ```

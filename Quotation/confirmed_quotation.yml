docs: |
  # API — อนุมัติใบเสนอราคา (open → confirmed)

  ```
  POST /api/v1/quotation/{id}/status/confirmed
  Authorization: Bearer <token>
  ```

  | | |
  |---|---|
  | Controller | `Api\ApiQuotationController::status_confirmed_api()` |
  | ผลที่เกิด | ใบเสนอราคา **และใบสั่งขายที่ผูกกัน** เปลี่ยนเป็น `confirmed` พร้อมกัน |

  ---

  ## 🔒 อนุมัติได้เฉพาะฝ่ายขาย

  การอนุมัติใบเสนอราคาเป็นหน้าที่ของ **ฝ่ายขาย** (`users.level = 2`) เท่านั้น
  เพราะคนที่คุยกับลูกค้าและรู้ว่าตกลงกันจบแล้วคือเซลส์เจ้าของใบ

  **แอดมิน / เจ้าของระบบ (`level 0` หรือ `1`) อนุมัติแทนไม่ได้ → `403`**

  ```json
  {
    "success": false,
    "message": "การอนุมัติใบเสนอราคาเป็นหน้าที่ของฝ่ายขาย ผู้ดูแลระบบไม่สามารถอนุมัติแทนได้"
  }
  ```

  กติกานี้บังคับทุกเส้นทางที่เขียนสถานะ ไม่ใช่แค่ซ่อนปุ่ม — รวมถึง
  `POST quotation/create` ที่ส่ง `status=confirmed` มาด้วย (ได้ `403` เหมือนกัน)
  และหน้าเลื่อนสถานะฝั่งเว็บของแอดมิน

  > แอดมินยังทำขั้นที่เหลือได้ครบตั้งแต่ "เปิดบิล" เป็นต้นไป กติกานี้ล็อกเฉพาะขั้นแรกขั้นเดียว

  ---

  ## Error

  | HTTP | เงื่อนไข | body |
  |:---:|---|---|
  | `403` | ผู้เรียกเป็นแอดมิน/เจ้าของระบบ | `{success: false, message}` |
  | `409` | ใบปิดการขายหรือยกเลิกไปแล้ว | `{success: false, final_status, message}` |
  | `200` | สำเร็จ | `{message}` |

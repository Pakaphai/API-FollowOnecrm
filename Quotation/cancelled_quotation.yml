docs: |
  # API — ยกเลิกใบเสนอราคา

  ```
  POST /api/v1/quotation/{id}/status/cancelled
  Authorization: Bearer <token>
  ```

  | | |
  |---|---|
  | Controller | `Api\ApiQuotationController::status_cancel_api()` |

  ---

  ## เกิดอะไรขึ้นเมื่อยกเลิก

  ทั้งหมดนี้อยู่ใน transaction เดียว พังกลางทางถอยทั้งชุด

  1. ใบเสนอราคา **และใบสั่งขายที่ผูกกัน** เปลี่ยนเป็น `cancelled`
  2. บรรทัดสินค้าของทั้งสองใบถูกตั้ง `is_delete = true`
  3. ตัดใบนี้ออกจากยอดสินค้าค้างส่ง (`stock_shortage_logs`)
  4. **คืนยอดจองสต๊อก** ของใบที่เปิดบิลไปแล้ว (`products.reserved_qty` ลดลง)
  5. **คืนของที่ตัดไปแล้ว** กลับเข้าคลัง ถ้าใบเดินไปถึงขั้นที่ของออกจากคลังแล้ว

  > 📦 ข้อ 4 เพิ่มเข้ามาพร้อมฟีเจอร์จองสต๊อก — ก่อนหน้านี้ใบที่ยกเลิกตอนอยู่ช่วง
  > "เปิดบิลแล้วแต่ยังไม่ส่งของ" จะกันของไว้ค้างถาวร ยอดขายได้ของสินค้านั้นหายไป
  > โดยไม่มีใบไหนถือไว้จริง

  ---

  ## Error

  | HTTP | เงื่อนไข | body |
  |:---:|---|---|
  | `409` | ใบปิดการขายหรือยกเลิกไปแล้ว | `{success: false, final_status, message}` |
  | `500` | ข้อผิดพลาดอื่น (rollback แล้ว) | `{message: "เกิดข้อผิดพลาดในการยกเลิกใบเสนอราคา"}` |
  | `200` | สำเร็จ | `{message: "ยกเลิกใบเสนอราคาเรียบร้อยแล้ว"}` |

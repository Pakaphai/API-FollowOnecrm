  ## ตัวแปรใน response คืออะไร

  ### ระดับ `data`

  | ฟิลด์ | คืออะไร |
  |---|---|
  | `price_mode` | โหมดราคา/ภาษีที่ **ใช้คิดจริง** (`price` ไม่มีภาษี · `novat` แยกภาษี 7% · `vat` รวมภาษี) — ค่าที่ส่งมาอาจถูกปรับเป็นโหมดบริษัท · ส่งค่านี้กลับไปที่ `quotation/create` |
  | `price_mode_label` | ชื่อโหมดภาษาไทยแบบเดียวกับหัวเอกสารบนเว็บ |
  | `quotation_date` | วันที่ที่ใช้เลือกโปรโมชัน (ค่าที่ส่งมา หรือวันนี้เวลาไทย) → โชว์ "วันที่เอกสาร" |
  | `lines[]` | ตัวเลขรายบรรทัด เรียงตาม `quotation_lines[]` ที่ส่งมา → ตารางรายการสินค้า |
  | `summary` | ตัวเลขกล่องสรุปท้ายบิล |
  | `display` | แถวสรุปไหนหน้าเว็บโชว์/ซ่อนในกรณีนี้ → ให้แอปโชว์เหมือนเว็บ |
  | `usd_rate` | อัตราแลกเปลี่ยนที่ใช้ `{rate, rate_used, as_of, last_updated, fetched_at, source, display}` · `null` = ไม่ได้ใช้ราคา USD · โชว์ `display` เช่น "1 USD = ฿34.00" |

  ### `lines[]` — รายบรรทัด (ไล่ตามคอลัมน์บนเว็บ: ลำดับ → สินค้า → หน่วย/จำนวน → ราคา → รวม → ส่วนลด → สุทธิ)

  | ฟิลด์ | คืออะไร |
  |---|---|
  | `line_index` | ตำแหน่งใน `quotation_lines[]` ที่ส่งมา (เริ่ม 0) ใช้จับคู่กลับแถวบนจอ · เลขลำดับที่โชว์ = +1 |
  | `product_id` | รหัสสินค้า (`products.id`) ส่งกลับตอนบันทึก |
  | `product_code` | รหัสสินค้าที่ผู้ใช้เห็น เช่น "P-15-00-00-0001" → คอลัมน์ "รหัส" |
  | `product_name` | ชื่อสินค้า (อ่านจากฐานข้อมูล ณ ตอนเรียก) → คอลัมน์ "สินค้า" |
  | `uom_code` | รหัสหน่วยนับที่ใช้คิดราคา (ตัดช่องว่างท้ายแล้ว) → คอลัมน์ "หน่วย" |
  | `qty` | จำนวนที่คิดจริง (ตัวเลข) → คอลัมน์ "จำนวน" |
  | `list_price` | **ราคาที่ตั้งไว้** ในตารางราคาสินค้าสำหรับหน่วยนี้ (บาท) — ไว้เทียบว่าราคาที่ใช้ถูกแก้หรือไม่ (ตั้ง 600 ใช้ 550) |
  | `min_price` | **ราคาขายขั้นต่ำ** (บาท) · `null` = ไม่ได้ตั้ง → ขายต่ำกว่า `list_price` ไม่ได้ · ให้แอปเตือนก่อนส่ง (ต่ำกว่านี้ได้ 422) |
  | `unit_price` | **ราคาสินค้าล้วน** ที่เซิร์ฟเวอร์ใช้จริง (บาท): ไม่ส่ง `unit_price` มา = `list_price` · ส่งมา = ราคาที่แก้ · ส่ง `usd_price` = บาทที่แปลงแล้ว · ส่งค่านี้กลับเข้าเส้นบันทึกได้ตรง ๆ ตัวเลือกไม่ถูกบวกซ้ำ |
  | `options_price` | ราคาตัวเลือกรวมของบรรทัด (บาท) `0` เมื่อไม่มี `option_ids` |
  | `unit_price_total` | ราคาต่อหน่วยที่ **ใช้คิดยอดจริง** = `unit_price` + `options_price` (= ค่าที่จะถูกบันทึก) → คอลัมน์ "ราคา/หน่วย" |
  | `usd_price` | ราคาสินค้าล้วนสกุล USD ที่ใช้จริง **หลังปัดขึ้นเต็มดอลลาร์** (42.5 → 43) · `null` = คิดเป็นบาท |
  | `usd_price_total` | ราคา USD ต่อหน่วยรวมตัวเลือก · `null` = คิดเป็นบาท → โชว์ "$43/หน่วย" |
  | `line_sum_price` | จำนวน × `unit_price_total` ก่อนหักส่วนลด → คอลัมน์ "รวม" |
  | `promotion` | ก้อนโปรโมชันของบรรทัด (ดูตารางถัดไป) → คอลัมน์ "ส่วนลด" ใช้ `promotion.label` |
  | `promotion_discount` | ส่วนลดโปรโมชันที่ได้จริง (บาท) `0` = ไม่มีโปร/ยังไม่ถึงขั้นต่ำ (= `promotion.discount_amount`) |
  | `special_discount` | ส่วนลดพิเศษ **ที่คิดเป็นบาทแล้ว** (กรอก `5` แบบ percent ของ 1,650 → `82.5`) `0` ถ้าไม่ส่ง `discount_type` |
  | `special_discount_type` | `amount` · `percent` · `null` (ไม่ได้ให้ส่วนลดพิเศษ) → หน่วยของช่องส่วนลดพิเศษ |
  | `special_discount_input` | ค่าที่ผู้ใช้กรอกในช่องส่วนลดพิเศษ **หลังบีบไม่เกิน 100%** → เติมกลับช่องกรอก |
  | `total_discount` | ส่วนลดรวมของบรรทัด = โปรโมชัน + พิเศษ (ไม่เกิน `line_sum_price`) → คอลัมน์ "ส่วนลด" (ยอดเงิน) |
  | `discount_capped` | `true` = ส่วนลดเกินยอดบรรทัด ถูกบีบลงมาเท่ายอดบรรทัด (`total_line` = 0) ควรเตือนผู้ใช้ |
  | `total_line` | **ยอดสุทธิบรรทัด** = `line_sum_price` − `total_discount` → คอลัมน์ "ราคาสุทธิ" |
  | `total_line_usd` | ยอดสุทธิบรรทัดเทียบ USD (ปัดขึ้นเต็มดอลลาร์) · `null` = ไม่ได้ใช้ราคา USD → "≈ $…" |
  | `options[]` | ตัวเลือกที่คิดรวมอยู่ใน `unit_price_total` แล้ว `{id, group_name, name, price (บาท), usd}` → แถวย่อยใต้ชื่อสินค้า เช่น "สี: ดำ +50.00" |

  ### `lines[].promotion`

  | ฟิลด์ | คืออะไร |
  |---|---|
  | `has_promotion` | `true` = มีโปรและ **ผ่านเงื่อนไขขั้นต่ำแล้ว** (ได้ส่วนลดจริง) |
  | `discount_type` / `discount_value` | ชนิดและค่าที่ตั้งไว้ในโปรที่ใช้ (`percent` → %, `amount` → บาท) · `null`/`0` เมื่อไม่ได้ส่วนลด |
  | `discount_amount` | จำนวนเงินที่ลดได้จริงของบรรทัด (บาท) = `promotion_discount` |
  | `discount_percent` | สัดส่วนที่ลดได้จริงเทียบ `line_sum_price` (%) — โปรแบบบาทก็คิดเป็น % ให้ |
  | `label` | ข้อความคอลัมน์ "ส่วนลด" บนเว็บ: `"10 %"` · `"500 ฿"` · `"-"` |
  | `condition` | `null` = ไม่มีโปรที่เกี่ยวกับสินค้า/หมวดนี้เลย · มีค่า = `{is_qualified, source, product_type_name, discount_type, discount_value, label, min_qty, min_value, max_discount_value}` ไว้บอกผู้ใช้ว่า "ซื้อครบ 3 ชิ้น ลด 10%" แม้ตอนนี้ยังไม่ได้ส่วนลด (`min_qty` มาก่อน `min_value`) |

  ### `summary` — กล่องสรุปท้ายบิล (เรียงตามลำดับที่ระบบคิด)

  | ฟิลด์ | คืออะไร | แถวบนเว็บ |
  |---|---|---|
  | `total_line_sum` | ผลรวม `line_sum_price` ทุกบรรทัด (ก่อนส่วนลดใด ๆ) | — |
  | `promotion_discount` | ผลรวมส่วนลดโปรโมชันทุกบรรทัด | แยกให้เห็นว่าลดจากโปรเท่าไร |
  | `special_discount` | ผลรวมส่วนลดพิเศษทุกบรรทัด | แยกให้เห็นว่าพนักงานให้เองเท่าไร |
  | `total_line_discount` | ผลรวม `total_discount` ทุกบรรทัด | "ส่วนลด" |
  | `total_before_discount` | ผลรวม `total_line` ทุกบรรทัด — หักส่วนลดรายการแล้ว ยังไม่หักท้ายบิล | "รวมเป็นเงิน" |
  | `header_discount` | ส่วนลดท้ายบิล **เป็นบาทเสมอ** (กรอกเป็น % เซิร์ฟเวอร์คิดให้แล้ว) | "ส่วนลดท้ายบิล" |
  | `header_discount_type` / `header_discount_percent` | ผู้ใช้กรอกมาแบบไหน (`percent` → เปอร์เซ็นต์ที่ใช้ · `amount` → `null`) | "(10%)" ท้ายแถว |
  | `total_after_header_discount` | `total_before_discount` − `header_discount` (ต่ำสุด 0) = **ฐานภาษี** | "ยอดรวมหลังหักส่วนลด" |
  | `total_exclude_vat` | มูลค่าก่อนภาษี — เท่าช่องบนในโหมด price/novat · โหมด vat ถอดภาษีแฝงออก | "มูลค่าก่อนภาษี" (เฉพาะโหมด vat) |
  | `vat_rate` | อัตราภาษี `7` (novat/vat) · `0` (price) | ข้อความ "ภาษีมูลค่าเพิ่ม 7%" |
  | `vat_amount` | ภาษีมูลค่าเพิ่มจากฐานภาษี · `0` ในโหมด price | "ภาษีมูลค่าเพิ่ม 7%" |
  | `total_after_discount` | **จำนวนเงินรวมทั้งสิ้น** (novat: ฐาน + VAT · price/vat: = ฐาน · ใบ USD ปัดขึ้นเต็มบาท) | "จำนวนเงินรวมทั้งสิ้น" |
  | `total_after_discount_usd` | ยอดรวมเทียบ USD · `null` = ไม่ได้ใช้ราคา USD | "≈ $…" |
  | `usd_rounded_up` | `true` = ยอดรวมถูกปัดขึ้นเต็มบาทเพราะมีบรรทัด USD | อธิบายเศษสตางค์ที่หาย |
  | `has_usd_lines` | ใบนี้มีบรรทัดราคา USD อย่างน้อยหนึ่งบรรทัด | สลับโชว์คอลัมน์ USD |

  ### `display`

  | ฟิลด์ | โชว์เมื่อ |
  |---|---|
  | `show_header_discount_row` | `header_discount` > 0 — แถว "ส่วนลดท้ายบิล" |
  | `show_after_discount_row` | `header_discount` > 0 — แถว "ยอดรวมหลังหักส่วนลด" |
  | `show_vat_breakdown_row` | โหมด `vat` และมีภาษี — แถว "มูลค่าก่อนภาษี" |
  | `show_vat_row` | `vat_amount` > 0 — แถว "ภาษีมูลค่าเพิ่ม 7%" |

  ## Error

  | HTTP | `code` / `errors` | สาเหตุ |
  |:---:|---|---|
  | `422` | `errors["quotation_lines"]` ฯลฯ | validation ไม่ผ่าน — คีย์เดียวกับ `quotation/create` |
  | `422` | `errors["quotation_lines.N.unit_price"]` | ราคาต่อหน่วยต่ำกว่าที่ขายได้ — บันทึกไม่ผ่านแน่ จึงตีกลับตั้งแต่พรีวิว เช่น สินค้า 44 ส่ง `unit_price: 450` → "ราคาต่อหน่วยของ \"กระเป๋า 2\" ต้องไม่ต่ำกว่าราคาขายขั้นต่ำ 500.00 บาท" |
  | `422` | `errors["quotation_lines.N.qty"]` | หน่วยนับชิ้น (EA, BX, SET …) กรอกทศนิยม |
  | `422` | `quotation_lines_disabled` | บริษัทปิดโหมดกรอกรายการสินค้า |
  | `422` | `usd_pricing_disabled` / `usd_rate_unavailable` | ส่ง `usd_price` มาแต่ใช้ราคา USD ไม่ได้ |

  > ยอดที่ตอบกลับคิดจากราคาสินค้า/โปรโมชัน/อัตราแลกเปลี่ยน **ณ ตอนเรียก** — ถ้ากดบันทึกข้ามวัน
  > หรือมีคนแก้ราคาสินค้าระหว่างนั้น ยอดที่บันทึกจริงอาจต่างได้ ให้ยึดตัวเลขจาก response ของ `quotation/create`

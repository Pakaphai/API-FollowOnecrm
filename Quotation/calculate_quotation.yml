http:
  method: POST
  url: "{{sale_uat}}/api/v1/quotation/calculate"
  body:
    type: json
    data: |
      {
        "quotation_date": "2026-10-05",
        "price_mode": "novat",
        "header_discount": "500",
        "header_discount_type": "amount",
        "quotation_lines": [
          { "product_id": 43, "qty": 2,   "uom_code": "EA",  "manual_discount": "100", "discount_type": "amount" },
          { "product_id": 44, "qty": 3,   "uom_code": "EA",  "unit_price": "550", "manual_discount": "5", "discount_type": "percent" },
          { "product_id": 53, "qty": 12,  "uom_code": "BOT" },

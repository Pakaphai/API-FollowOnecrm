docs: |
  # API Specification: POST /api/v1/quotation/create

  สร้างใบเสนอราคา (Quotation) ใหม่ 1 ใบ พร้อมสร้าง **ใบสั่งขาย (Sale Order) คู่ขนาน** ที่ผูกกันให้อัตโนมัติใน Database Transaction เดียวกัน

  ---

  ## 1. ภาพรวมและกระบวนการทำงาน (Business Process & Workflow)

  ```
  [ผู้ใช้ส่งคำขอสร้างใบเสนอราคา]
                │
                ▼
  [1. ตรวจสอบสิทธิ์และการตั้งค่าระบบ]
       ├─ ตรวจสอบ Token (ApiAuth Middleware)
       ├─ ตรวจสอบโควตาการใช้งาน (Seat Limit & Subscription Status)
       └─ ตรวจสอบโหมดเอกสารที่บริษัทอนุญาต (InputModeGuard: รายการสินค้า / แนบรูป)
                │
                ▼
  [2. ตรวจสอบความถูกต้องของข้อมูล (Validation & Normalization)]
       ├─ ตัดเครื่องหมายคอมมาออกจากตัวเลขการเงิน (NormalizeMoneyInputs)
       ├─ ตรวจสอบรูปแบบวันที่ (DocumentDate: ปี ค.ศ. เท่านั้น)
       └─ ตรวจสอบรายการสินค้า, หน่วยนับ, สิทธิ์ของลูกค้า
                │
                ▼
  [3. เริ่ม Database Transaction]
       ├─ บันทึกหัวใบเสนอราคา (quotation_headers)
       ├─ คำนวณราคา, โปรโมชัน, ส่วนลดพิเศษ, ภาษี (QuotationLines)
       ├─ บันทึกตัวเลือกสินค้า (quotation_line_options)
       ├─ บันทึกอัตราแลกเปลี่ยนยึดตามเอกสาร (usd_rate_logs)
       ├─ สร้างใบสั่งขายคู่ขนาน (orders + order_lines + order_line_options)
       ├─ บันทึกเงื่อนไขท้ายเอกสาร (quotation_conditions + order_conditions)
       └─ อัปเดตสถานะแผนการติดต่อลูกค้า (relationship.is_quotation_created = 1)
                │
                ▼
  [4. DB Commit และส่ง Response 201 Created]
  ```

  ---

  ## 2. พจนานุกรมตัวแปร Request (Request Parameters Dictionary)

  ### 2.1 ข้อมูลระดับหัวเอกสาร (Header Parameters)

  | ชื่อตัวแปร | ชนิดข้อมูล | จำเป็น | ค่าเริ่มต้น | รายละเอียดและคำอธิบายทางธุรกิจ |
  |---|---|:---:|---|---|
  | `customer_id` | integer | ✅ | - | รหัสลูกค้า (`customers.id`) ต้องเป็นลูกค้าที่ยังไม่ถูกลบ (`is_delete = 0`) |
  | `quotation_date` | string (date) | ✅ | - | วันที่ออกเอกสาร รูปแบบ `YYYY-MM-DD` (ต้องเป็นปี **ค.ศ.** เช่น `2026-09-11` ห้ามใส่ พ.ศ. 2569) มีผลต่อการค้นหาโปรโมชันที่ Active ในวันนั้น |
  | `price_mode` | string (enum) | | `price` | โหมดภาษีมูลค่าเพิ่มของทั้งใบ: <br>• `price` = ราคาสินค้าไม่มีภาษี (ไม่บวก VAT ท้ายบิล)<br>• `vat` = ราคาสินค้ารวมภาษีมูลค่าเพิ่ม 7% (คำนวณแยกภาษีออกและแสดง VAT ท้ายบิล)<br>• `novat` = ราคาสินค้าแยกภาษีมูลค่าเพิ่ม 7% (บวก VAT 7% เพิ่มจากยอดสินค้าท้ายบิล) |
  | `header_discount` | numeric | | `0` | ส่วนลดท้ายบิล ระบุเป็นตัวเลขจำนวนเงินหรือเปอร์เซ็นต์ (ตาม `header_discount_type`) รองรับตัวเลขมีคอมมา เช่น `"1,000.00"` |
  | `header_discount_type` | string (enum) | | `amount` | ประเภทของส่วนลดท้ายบิล: <br>• `amount` = คิดเป็นจำนวนเงินบาทเต็ม เช่น กรอก `100` คือลด `100.00` บาท<br>• `percent` = คิดเป็นเปอร์เซ็นต์ 0–100 เช่น กรอก `10` คือลด `10%` ของยอดรวมหลังหักส่วนลดสินค้า |
  | `note` | string | | `null` | หมายเหตุท้ายเอกสารใบเสนอราคา (ความยาวไม่จำกัด) |
  | `status` | string (enum) | | `open` | สถานะเริ่มต้นของเอกสาร: <br>• `open` = รอการยืนยัน/เสนอราคา<br>• `confirmed` = ยืนยันการสั่งซื้อ (ส่งได้เฉพาะฝ่ายขาย Level 2 เท่านั้น แอดมินส่งจะได้ 403) |
  | `conditions` | array\<int\> | | `[]` | รายการรหัสเงื่อนไขท้ายเอกสาร (`conditions.id`) ส่งเป็น Array เช่น `conditions[0]=1&conditions[1]=3` |
  | `relationship_id` | integer | | `null` | รหัสแผนการติดต่อลูกค้า (`relationships.id`) หากระบุ ระบบจะปรับสถานะแผนงานเป็นสร้างใบเสนอราคาแล้วอัตโนมัติ |
  | `additional_amount` | numeric | | `0` | ยอดรวมสุทธิสำหรับ **โหมดแนบรูปภาพ** (ใช้เฉพาะกรณีไม่มีการส่ง `quotation_lines`) |
  | `quotation_image` | file | | `null` | ไฟล์รูปภาพใบเสนอราคา (jpg, jpeg, png, gif, webp ขนาดไม่เกิน 5MB) เก็บลง Private S3 Bucket |

  ---

  ### 2.2 ข้อมูลระดับรายการสินค้า (`quotation_lines[]`)

  | ชื่อตัวแปร | ชนิดข้อมูล | จำเป็น | รายละเอียดและคำอธิบายทางธุรกิจ |
  |---|---|:---:|---|
  | `quotation_lines[N][product_id]` | integer | ✅ | รหัสสินค้า (`products.id`) ต้องมีอยู่ในระบบและไม่ถูกลบ |
  | `quotation_lines[N][qty]` | numeric | ✅ | จำนวนที่สั่งซื้อ (ขั้นต่ำ `0.01` สำหรับหน่วยทศนิยม, ขั้นต่ำ `1` สำหรับหน่วยนับจำนวนเต็ม เช่น `EA`, `BX`, `SET`) |
  | `quotation_lines[N][uom_code]` | string | ✅ | รหัสหน่วยนับ (`uoms.uom_code`) เช่น `EA`, `BX`, `SET`, `HRS` |
  | `quotation_lines[N][unit_price]` | numeric | | ราคาต่อหน่วย (บาท) — หากไม่ระบุ ระบบจะดึงราคามาตรฐานจาก `product_prices` ตาม `price_mode` และหน่วยนับ (ระบบตรวจไม่ให้ต่ำกว่า Min Price) |
  | `quotation_lines[N][usd_price]` | numeric | | ราคาต่อหน่วย (USD) — หากระบุ ระบบจะใช้ราคานี้แปลงเป็นบาทตามอัตราแลกเปลี่ยน ธปท. วันนั้นทันที (ข้ามการตรวจ Min Price บาท) |
  | `quotation_lines[N][manual_discount]` | numeric | | ส่วนลดพิเศษที่พนักงานขายกรอกเอง (ไม่ส่ง = `0`) |
  | `quotation_lines[N][discount_type]` | string (enum) | | ประเภทส่วนลดพิเศษ: `amount` (บาท) หรือ `percent` (% ของยอดก่อนลดของบรรทัดนั้น) |
  | `quotation_lines[N][option_ids][]` | array\<int\> | | รายการรหัส Option สินค้าที่เลือก (`product_options.id`) ราคา Option จะถูกนำไปบวกเพิ่มในราคาต่อหน่วยอัตโนมัติ |

  ---

  ## 3. ขั้นตอนและสูตรการคำนวณราคา (Step-by-Step Calculation Formula)

  ```
  [1. ราคาต่อหน่วย (Unit Price)]
      ├─ กรณีขายเป็น USD: Unit Price = ceil(usd_price + Σ Option_USD) × Exchange_Rate_Used
      └─ กรณีขายเป็น บาท: Unit Price = Max(unit_price, Min_Price) + Σ Option_THB

  [2. ยอดก่อนหักส่วนลด (Line Subtotal)]
      Line_Subtotal = Qty × Unit Price

  [3. ส่วนลดรายบรรทัด (Line Discount)]
      Promotion_Discount = คำนวณตามเงื่อนไขโปรโมชันที่ตรงกับสินค้าในวันที่ระบุ
      Manual_Discount    = ตามที่เซลส์ระบุ (บาท หรือ % ของ Line_Subtotal)
      Total_Line_Discount = Min(Promotion_Discount + Manual_Discount, Line_Subtotal)
      Line_Total_Net      = Line_Subtotal - Total_Line_Discount

  [4. ยอดรวมทั้งเอกสาร (Document Totals)]
      Total_Before_Discount = Σ Line_Total_Net
      Total_Line_Discounts  = Σ Total_Line_Discount

  [5. ส่วนลดท้ายบิล (Header Discount)]
      หาก header_discount_type == 'percent':
          Header_Discount_Amount = Total_Before_Discount × (header_discount / 100)
      หาก header_discount_type == 'amount':
          Header_Discount_Amount = header_discount

  [6. ภาษีมูลค่าเพิ่มและยอดสุทธิ (VAT & Grand Total)]
      VAT_Amount = คำนวณตาม price_mode (7% ในโหมด vat/novat, 0 ในโหมด price)
      Total_After_Discount = ceil(Total_Before_Discount + VAT_Amount - Header_Discount_Amount)
  ```

  ---


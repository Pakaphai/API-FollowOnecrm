            "total_line_usd": 60,
            "promotion": { "has_promotion": false, "discount_type": null, "discount_value": 0,
                           "discount_amount": 0, "discount_percent": 0, "label": "-" },
            "is_delete": false,
            "created_at": "2026-08-18T09:04:13.000000Z",
            "created_by": 2,
            "updated_at": null,
            "updated_by": null
          }
        ]
      },
      "usd_rate": { "rate": 33.2264, "rate_used": 34, "as_of": "2026-08-17",
                    "source": "bot", "display": "1 USD = ฿34.00" },
      "quotationLines": [ ... ],
      "order": { "id": 3, "order_number": "PO-260818-0002", "status": "open" }
    }
  }
  ```

  ### รายการสินค้าอยู่ 2 ที่ — ข้อมูลชุดเดียวกันเป๊ะ

  | path | ใช้ยังไง |
  |---|---|
  | `data.quotation.quotationLines` | **ตำแหน่งที่ควรอ่าน** — อยู่ในตัวใบเสนอราคา ไม่ต้องประกอบเองจากสอง key |
  | `data.quotationLines` | ตำแหน่งเดิม **ยังส่งเหมือนเดิม** ไม่ได้ถอดออก แอปที่ปล่อยไปแล้วจึงไม่พัง |

  เป็น array ตัวเดียวกัน (ไม่ได้ query ซ้ำ) จะอ่านจากที่ไหนก็ได้ค่าเท่ากันเสมอ — ของใหม่ให้ใช้ path บน

  ### ลำดับคีย์ในแต่ละบรรทัด

  เรียงตามลำดับที่ไล่อ่านตามได้ ไม่ใช่ลำดับคอลัมน์ในฐานข้อมูล — เหมือนกันทั้ง `create` และ [`update`](api-quotation-update.md)

  ```
  ตัวระบุ    id · quotation_id · product_id
  สินค้า     uom_code
  จำนวน      qty
  ราคา       unit_price · usd_price
  ส่วนลด     manual_discount · discount_type · discount
  ยอดรวม     total_line · total_line_usd
  โปรโมชัน   promotion            ← เฉพาะเส้นนี้ ไม่มีใน update
  ข้อมูลกำกับ is_delete · created_at · created_by · updated_at · updated_by
  ```

  ### ⚠️ หน่วยเงินไม่เหมือนกันในสอง block

  | block | หน่วย | ตัวอย่าง |
  |---|---|---|
  | `data.quotation` (ช่องยอดรวม) | **บาท** (หารกลับให้แล้ว) | `total_after_discount: 54944` = ฿54,944.00 |
  | `quotationLines[]` (ทั้งสอง path) | **สตางค์** (แถวดิบจากฐานข้อมูล) | `unit_price: 102000` = ฿1,020.00 |
  | `quotationLines[].qty` | **×100** | `200` = 2 ชิ้น |
  | `usd_price` · `total_line_usd` · `total_after_discount_usd` | **ดอลลาร์** | `60` = $60 |

  ### ฟิลด์ที่ต้องอธิบายเพิ่ม

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `quotation_number` | `QT-<ปี ค.ศ.>-<running 4 หลัก>` เดินเลขต่อรายปี — เกิน 9999 ใบ/ปี จะได้ `null` |
  | `order.order_number` | `PO-<YYMMDD>-<running 4 หลัก>` เดินเลขต่อ**รายวัน** |
  | `quotation_image` | path บน S3 (ไม่ใช่ URL) — ขอ presigned URL ได้จาก `quotation/list` |
  | `usd_rate` | อัตราที่ใบนี้ยึดไว้ · `null` = ใบนี้ไม่ได้ผูกกับอัตราใด |
  | `total_after_discount_usd` | ยอดสุทธิเทียบ USD ปัดขึ้นเป็นดอลลาร์เต็ม |
  | `quotationLines[].usd_price` | ราคา USD ที่ใช้จริง · **`null` = บรรทัดนี้คิดเป็นเงินบาท** ← ใช้เช็คว่าเส้นทาง USD ทำงานจริงไหม |
  | `quotationLines[].discount` | ส่วนลดรวมของบรรทัด (โปรฯ + พิเศษ) หน่วยสตางค์ |
  | `promotion` | โปรฯ ที่ใช้จริงกับบรรทัดนั้น พร้อม `label` ที่แสดงได้เลย |
  | `uom_code` | ตัดช่องว่างให้แล้ว (`"EA"`) — คอลัมน์จริงเป็น `char(3)` ที่เก็บเป็น `"EA "` |


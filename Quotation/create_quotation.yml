info:
  name: create_quotation
  type: http
  seq: 1

http:
  method: POST
  url: "{{sale_uat}}/api/v1/quotation/create"
  body:
    type: multipart-form
    data:
      - name: customer_id
        type: text
        value: "2"
      - name: quotation_date
        type: text
        value: 2026-08-19
      - name: price_mode
        type: text
        value: price
      - name: quotation_lines[0][product_id]
        type: text
        value: "1"
      - name: quotation_lines[0][qty]
        type: text
        value: "1"
      - name: quotation_lines[0][uom_code]
        type: text
        value: EA
      - name: quotation_lines[0][manual_discount]
        type: text
        value: "0"
      - name: quotation_lines[0][discount_type]
        type: text
        value: amount
      # ── ราคาต่อหน่วย ─────────────────────────────────────────────────────────
      # ส่งได้อย่างใดอย่างหนึ่ง — usd_price มาแล้ว unit_price จะถูกมองข้ามทั้งหมด
      #
      #   unit_price  หน่วยบาท  ถูกบีบไม่ให้ต่ำกว่าราคาขายขั้นต่ำของสินค้า
      #   usd_price   หน่วยดอลลาร์  เซิร์ฟเวอร์คิดเป็นบาทให้เอง:
      #               ceil(usd) x อัตราขาย ธปท. ที่ปัดขึ้นเป็นบาทเต็ม
      #               (ไม่เอาราคาขั้นต่ำเงินบาทมาบีบ เพราะคนละสกุล)
      #
      # ราคานี้ต้อง "รวมราคาตัวเลือกสินค้าแล้ว" — เซิร์ฟเวอร์ไม่บวกให้อัตโนมัติ
      #   ตัวอย่างการบวก  ราคาสินค้า $92,995 + ตัวเลือก $7,495 + $16,195 = $116,685
      #   (ตัวเลขจริงของแต่ละสินค้าอ่านจาก product_price / product_options ใน preload)
      - name: quotation_lines[0][usd_price]
        type: text
        value: "116685"
      # บริษัทที่ขายเป็นเงินบาท ใช้ช่องนี้แทน แล้วลบ usd_price ออก
      # - name: quotation_lines[0][unit_price]
      #   type: text
      #   value: "3850605"
      # ตัวเลือกสินค้าที่ลูกค้าเลือก — ส่งเฉพาะ id (ดู product_options ใน preload)
      # ไม่ส่งคีย์นี้ตอน update = คงตัวเลือกเดิมไว้
      - name: quotation_lines[0][option_ids][]
        type: text
        value: "2"
      - name: quotation_lines[0][option_ids][]
        type: text
        value: "6"
      - name: quotation_image
        type: file
        value:
          - C:\Users\Softa-P\Pictures\image33.png
        contentType: image/png
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # API — สร้างใบเสนอราคา (Quotation Create)

  สร้างใบเสนอราคา 1 ใบ พร้อม **สร้างใบสั่งขายที่ผูกกันให้อัตโนมัติ** ในคำขอเดียว

  ```
  POST /api/v1/quotation/create
  Authorization: Bearer <token>
  Accept: application/json
  Content-Type: application/json          ← หรือ multipart/form-data เมื่อแนบรูป
  ```

  | | |
  |---|---|
  | Route | [`routes/api/api_v1.php`](../routes/api/api_v1.php) — อยู่ในกลุ่ม `auth_api` |
  | Controller | [`Api\ApiQuotationController::quotation_create_api()`](../app/Http/Controllers/Api/ApiQuotationController.php) |
  | ตารางที่ถูกเขียน | `quotation_headers` · `quotation_lines` · `orders` · `order_lines` · `quotation_conditions` · `order_conditions` · `usd_rate_logs` |
  | ข้อมูลตั้งต้นของฟอร์ม | [api-quotation-preload.md](api-quotation-preload.md) |
  | แก้ไขเอกสารที่สร้างแล้ว | [api-quotation-update.md](api-quotation-update.md) |
  | เวอร์ชันราคา USD | [`POST quotation/usd/create`](api-reference.md) — บังคับให้ทุกบรรทัดมี `usd_price` |

  > ทุกอย่างอยู่ใน **transaction เดียว** — พลาดตรงไหนก็ rollback ทั้งหมด ไม่มีเอกสารค้างครึ่งใบ

  ---

  ## 1. สองโหมดของเอกสาร

  | โหมด | ใช้เมื่อไหร่ | ต้องส่งอะไร |
  |---|---|---|
  | **มีรายการสินค้า** | ปกติ — คีย์สินค้าทีละบรรทัด | `quotation_lines[]` อย่างน้อย 1 บรรทัด |
  | **แนบรูปแทน** | ใบเสนอราคาที่ทำนอกระบบแล้วเอามาแนบ | `quotation_image` + `additional_amount` |

  **ต้องมีอย่างน้อยหนึ่งอย่าง** — ไม่มีทั้งสินค้าและรูป จะได้ `422`

  ```json
  {"errors":{"quotation_lines":["กรุณาเพิ่มรายการสินค้าอย่างน้อย 1 รายการ หรือแนบรูปภาพใบเสนอราคา"]}}
  ```

  ส่งมาทั้งคู่ก็ได้ — ระบบจะคิดยอดจากรายการสินค้า แล้วเก็บรูปแนบไว้ด้วย

  ---

  ## 2. พารามิเตอร์ระดับหัวเอกสาร

  | ฟิลด์ | บังคับ | ชนิด | หมายเหตุ |
  |---|:---:|---|---|
  | `customer_id` | ✅ | integer | ต้องมีจริงใน `customers` |
  | `quotation_date` | ✅ | date | `YYYY-MM-DD` · ต้องเป็น **ค.ศ.** ปี 2000 ขึ้นไป และล่วงหน้าไม่เกิน 1 ปี |
  | `price_mode` | | string | `price` · `vat` · `novat` — ดูข้อ 4 |
  | `header_discount` | | numeric ≥0 | ส่วนลดท้ายบิล **หน่วยบาท** |
  | `note` | | string | หมายเหตุท้ายเอกสาร |
  | `status` | | string | `open` (ค่าเริ่มต้น) หรือ `confirmed` — ค่าอื่นได้ `422` |
  | `conditions` | | array | array ของ `conditions.id` |
  | `relationship_id` | | integer | ผูกกับแผนการติดต่อ → ตั้ง `is_quotation_created = 1` ให้แผนนั้น |
  | `quotation_image` | | file | jpeg,png,jpg,gif,webp ≤5MB → เก็บบน S3 แบบ private |
  | `additional_amount` | | numeric ≥0 | **ยอดรวมสุทธิของโหมดแนบรูป** (ใช้เฉพาะตอนไม่มีรายการสินค้า) |

  > ช่องยอดเงินรับค่าที่มีคอมมาได้ — `"1,000.00"` ระบบตัดให้ก่อนตรวจ (`normalizeMoneyInputs`)

  ## 3. พารามิเตอร์รายบรรทัด — `quotation_lines[]`

  | ฟิลด์ | บังคับ | ชนิด | หมายเหตุ |
  |---|:---:|---|---|
  | `product_id` | ✅ | integer | ต้องมีจริงใน `products` |
  | `qty` | ✅ | numeric ≥1 | หน่วยที่นับเป็นชิ้น (`EA` `BX` `SET` …) ต้องเป็นจำนวนเต็ม |
  | `uom_code` | ✅ | string ≤3 | ต้องมีใน `uoms` |
  | `unit_price` | | numeric ≥0 | ราคาต่อหน่วย **หน่วยบาท** — ไม่ส่ง = ใช้ราคาที่ตั้งไว้ที่สินค้า |
  | `usd_price` | | numeric ≥0 | ราคาต่อหน่วย **หน่วยดอลลาร์** — ส่งมาแล้วจะ**ใช้แทน** `unit_price` |
  | `manual_discount` | | numeric ≥0 | ส่วนลดพิเศษที่พนักงานกรอกเอง — ไม่ส่ง = `0` |
  | `discount_type` | | enum | `amount` (บาท) หรือ `percent` (%) — คู่กับ `manual_discount` |
  | `option_ids` | | array\<int\> | id ของตัวเลือกสินค้าที่ลูกค้าเลือก (จาก `product_options` ใน preload) — ดูหัวข้อ "ตัวเลือกสินค้า" |

  > `manual_discount` แบบ `amount` คือ **ลดทั้งบรรทัด** ไม่ใช่ลดต่อหน่วย
  > สามช่องบนสุดขาดไม่ได้ ขาดเมื่อไรได้ `422` ที่ระบุบรรทัดชัดเจน — ส่วนสองช่องล่างเว้นได้


  ### ตัวเลือกสินค้า — `option_ids`

  สินค้าที่มีตัวเลือก (ดู `product_options` ใน `quotation/preload`) เลือกได้**หลายหมวดหมู่**
  และหมวดหนึ่ง**เลือกได้หลายตัวเลือก** ส่งเป็นอาเรย์ของ id รวมกันในบรรทัดเดียว

  ```json
  "quotation_lines": [
    { "product_id": 126, "uom_code": "EA", "qty": 1, "usd_price": 137470,
      "option_ids": [2, 6] }
  ]
  ```

  | เรื่อง | รายละเอียด |
  |---|---|
  | ส่งอะไร | **เฉพาะ id** — ชื่อกับราคาเซิร์ฟเวอร์อ่านจากฐานข้อมูลเอง ไม่รับค่าจากแอป |
  | ลำดับ | เก็บตามลำดับที่ส่งมา (ลงคอลัมน์ `sort_order`) แสดงผลตามนั้นทุกที่ |
  | ราคา | **ไม่ได้บวกให้อัตโนมัติ** — แอปต้องบวกราคาตัวเลือกเข้ากับ `unit_price` / `usd_price` เอง |
  | ไม่ส่งคีย์นี้ | ตอน **create** = ไม่มีตัวเลือก · ตอน **update** = **คงของเดิมไว้** (แอปเวอร์ชันเก่าจึงไม่ทำข้อมูลหาย) |
  | ส่ง `[]` | ล้างตัวเลือกของบรรทัดนั้นทิ้งทั้งหมด |
  | id ไม่มีจริง | `422` ที่คีย์ `quotation_lines.N.option_ids.M` |
  | id เป็นของสินค้าตัวอื่น | `422` ที่คีย์ `<lines>.N.option_ids.M` — ตัวเลือกต้องสังกัดสินค้าในบรรทัดนั้น |

  > ⚠️ ราคาที่บันทึกเป็น **สำเนา ณ วันที่ออกเอกสาร** ไม่ได้อ่านสดจากตัวสินค้า
  > แก้ชื่อหรือราคาตัวเลือกที่หน้าสินค้าภายหลัง เอกสารเก่าจะยังแสดงค่าเดิมเสมอ

  ### ส่งแบบ multipart/form-data (ตอนแนบรูป)

  `quotation_lines` เป็น **array ของ object** เสมอ ต่อให้ส่งเป็น form-data ก็ต้องคงรูปนั้นไว้ — ชื่อ key ต้องมี **เลขบรรทัด** กำกับ

  ```
  customer_id                        4
  quotation_date                     2026-08-19
  price_mode                         price
  quotation_lines[0][product_id]     119
  quotation_lines[0][qty]            1
  quotation_lines[0][uom_code]       EA
  quotation_lines[0][manual_discount] 9
  quotation_lines[0][discount_type]  amount
  quotation_image                    <file>
  ```

  บรรทัดที่ 2 ขึ้นไปก็เปลี่ยนเลขในวงเล็บแรกเป็น `[1]` `[2]` … ไปเรื่อย ๆ

  > ⚠️ **ส่ง `product_id` / `qty` / `uom_code` แบบแบน ๆ (ไม่มี `quotation_lines[0]` นำหน้า) เซิร์ฟเวอร์จะมองไม่เห็นเลย**
  > ถ้าแนบ `quotation_image` มาด้วย คำขอจะ**ผ่าน `201`** เพราะเข้าเงื่อนไข "โหมดแนบรูป" แต่ได้ใบเปล่า:
  > `quotationLines: []` · ยอดทุกช่องเป็น `0` · `price_mode` กลายเป็น `null` (เซิร์ฟเวอร์เก็บ `price_mode` เฉพาะใบที่มีรายการสินค้า)
  > เจออาการนี้เมื่อไร แปลว่าชื่อ key ผิด ไม่ใช่ข้อมูลผิด

  ---

  ## 4. `price_mode` — โหมดภาษีของทั้งใบ

  | ค่า | ป้ายบนหน้าเว็บ | ราคาตั้งต้นที่เซิร์ฟเวอร์ใช้ | บวก VAT 7% ท้ายบิล |
  |---|---|---|:---:|
  | `price` | ราคาสินค้า (ไม่มีภาษี) | `product_price` | ไม่ |
  | `vat` | ราคาสินค้า (รวมภาษีมูลค่าเพิ่ม 7%) | `product_price_exclude_vat` | ✅ |
  | `novat` | ราคาสินค้า (แยกภาษีมูลค่าเพิ่ม 7%) | `product_price_include_vat` | ✅ |

  ⚠️ **ชื่อค่าสวนทางกับป้าย** — `vat` = "รวมภาษี" · `novat` = "แยกภาษี" อย่าเดาจากชื่อ
  ⚠️ โหมด `novat` หน้าเว็บกับเซิร์ฟเวอร์ใช้คอลัมน์คนละตัวอยู่ (ดู [preload § 11](api-quotation-preload.md))

  ไม่ส่ง `price_mode` มา = ราคาตั้งต้นเป็น `0` ทุกบรรทัด ต้องส่ง `unit_price` หรือ `usd_price` มาเองทุกบรรทัด

  ---

  ## 5. เซิร์ฟเวอร์คำนวณอะไรบ้าง — ทีละขั้น

  ใช้ payload จริงนี้เป็นตัวอย่าง (อัตรา ธปท. ที่ปัดแล้ว = ฿34):

  ```json
  {
    "customer_id": 4,
    "quotation_date": "2026-08-18",
    "header_discount": 1000,
    "price_mode": "price",
    "note": "ใบเสนอราคาหลายรายการ",
    "quotation_lines": [
      {"product_id":119,"qty":2,"manual_discount":0, "discount_type":"amount", "uom_code":"EA"},
      {"product_id":121,"qty":1,"manual_discount":10,"discount_type":"percent","uom_code":"EA"},
      {"product_id":120,"qty":1,"manual_discount":0, "discount_type":"amount", "uom_code":"EA"}
    ],
    "conditions": []
  }
  ```

  ### ขั้นที่ 1 — หาราคาต่อหน่วย

  1. หยิบราคาตั้งต้นจาก `product_prices` ตาม `price_mode` + `uom_code`
  2. **ถ้าส่ง `usd_price` มา** → `ceil(usd) × อัตราที่ปัดแล้ว` แล้วข้ามขั้นที่ 3 ไปเลย
  3. **ถ้าไม่ได้ส่ง** → ใช้ `unit_price` ที่ส่งมา แต่**บีบไม่ให้ต่ำกว่าราคาขั้นต่ำ**
     - สินค้าที่ตั้ง `min_price` ไว้ → ห้ามต่ำกว่านั้น
     - สินค้าที่**ไม่ได้ตั้ง** → ห้ามต่ำกว่าราคาที่ตั้งไว้เลย
     - ต่ำกว่า = `422` ที่คีย์ `quotation_lines.N.unit_price` (ไม่บันทึกทั้งใบ)
     - ขายแพงกว่าราคาที่ตั้งไว้ได้เสมอ ไม่มีเพดาน

  ### ขั้นที่ 2 — ส่วนลดของบรรทัด

  ```
  ยอดก่อนลด   = qty × ราคาต่อหน่วย
  ส่วนลดโปรฯ  = โปรโมชันที่ active ณ "วันที่บนเอกสาร" (สินค้าก่อน → หมวดหมู่ทีหลัง)
  ส่วนลดพิเศษ = manual_discount  (amount = บาท / percent = % ของยอดก่อนลด)
  ส่วนลดรวม   = โปรฯ + พิเศษ      ← ลดได้มากสุดเท่ายอดก่อนลด ยอดสุทธิต่ำสุดคือ 0
  ยอดสุทธิ    = ยอดก่อนลด − ส่วนลดรวม
  ```

  | บรรทัด | ราคา/หน่วย | จำนวน | ยอดก่อนลด | ส่วนลด | ยอดสุทธิ |
  |---|---|---|---|---|---|
  | 119 | ฿1,020.00 | 2 | 2,040.00 | 0 | **2,040.00** |
  | 121 | ฿17,204.00 | 1 | 17,204.00 | 10% = 1,720.40 | **15,483.60** |
  | 120 | ฿38,420.00 | 1 | 38,420.00 | 0 | **38,420.00** |

  ### ขั้นที่ 3 — ยอดรวมทั้งใบ

  ```
  total_before_discount = ผลรวมยอดสุทธิของทุกบรรทัด          = 55,943.60
  total_discount        = ผลรวมส่วนลดของทุกบรรทัด            =  1,720.40
  vat_amount            = 7% ของยอดสุทธิแต่ละบรรทัด (โหมด vat/novat) = 0
  total_after_discount  = total_before_discount + vat_amount − header_discount
                        = 55,943.60 + 0 − 1,000.00 = 54,943.60
                        → ปัดขึ้นเป็นบาทเต็ม        = 54,944.00
  ```

  > ⚠️ **`total_before_discount` ชื่อหลอก** — มันคือยอด**หลัง**หักส่วนลดรายบรรทัดแล้ว
  > (ตรงกับช่อง "รวมราคาสินค้า" บนหน้าเว็บ) ส่วนที่ยังไม่ได้หักคือ **ส่วนลดท้ายบิล** เท่านั้น

  > **`total_after_discount` ปัดขึ้นเป็นบาทเต็มเสมอ** เพราะเป็นยอดที่เก็บเงินจริง
  > ยอดย่อยยังคงเศษสตางค์ไว้ → ผลบวกของยอดย่อยต่างจากยอดรวมได้ไม่เกิน 1 บาท **อย่าเขียนโค้ดเช็คว่าต้องเท่ากันเป๊ะ**

  ### โหมดแนบรูป

  ไม่มี `quotation_lines` → ข้ามทั้งหมดข้างบน `total_after_discount = additional_amount` ตรง ๆ
  (**ไม่ปัดขึ้น** เพราะผู้ใช้ตั้งใจพิมพ์เลขนั้นมาเอง) ส่วน `total_before_discount` · `total_discount` · `vat_amount` · `price_mode` เก็บเป็น `null`

  ---

  ## 6. ⚠️ ฟิลด์ที่ส่งไปแล้วเซิร์ฟเวอร์ไม่ได้ใช้

  เซิร์ฟเวอร์**คำนวณเองทั้งหมด** ไม่เชื่อยอดที่ไคลเอนต์ส่งมา — ส่งไปก็ไม่ผิด แต่ไม่มีผล

  | ฟิลด์ | เกิดอะไรขึ้น |
  |---|---|
  | `vat_amount` | ผ่าน validation แต่ถูกคำนวณทับ |
  | `total_after_discount` | ผ่าน validation แต่ **ไม่ถูกใช้เลยทั้งสองโหมด** (โหมดแนบรูปใช้ `additional_amount`) |
  | `total_before_discount` · `total_discount` | ไม่ได้อยู่ใน validation ด้วยซ้ำ |
  | `quotation_lines[].total_line` | ถูกคำนวณทับ |
  | `quotation_lines[].unit_price` | ใช้เป็น "ราคาที่เสนอ" แต่ถูกบีบด้วยราคาขั้นต่ำ · **ถูกมองข้ามทั้งหมดถ้าส่ง `usd_price` มาด้วย** |

  ---

  ## 7. ราคาสกุล USD

  ใส่ `usd_price` รายบรรทัดได้เลยในเส้นนี้ — บรรทัดที่ไม่ใส่จะคิดเป็นเงินบาทตามปกติ (ปนกันได้)

  ```
  $42.50 → ปัดขึ้นเป็นดอลลาร์เต็ม $43 × ฿34 = ฿1,462.00 ต่อหน่วย
  ```

  - **ราคาขั้นต่ำเงินบาทไม่ถูกนำมาบีบ**บรรทัดที่ขายเป็น USD (ยึดตัวเลขที่เสนอลูกค้าเป็นหลัก)
  - อัตราที่ใช้ถูกยึดไว้กับตัวเอกสาร + บันทึกลง `usd_rate_logs` เปิดใบเดิมวันหลังได้ตัวเลขชุดเดิมเสมอ
  - ส่ง `usd_price` มาแต่บริษัทไม่ได้เปิดฟีเจอร์ / ดึงอัตราไม่ได้ → `422` พร้อม `code`

  > **อยากขายเป็น USD ทั้งใบให้ใช้ [`POST quotation/usd/create`](api-reference.md)** — เส้นนี้ปล่อยให้ลืมใส่ `usd_price` บางบรรทัดได้
  > แล้วบรรทัดนั้นจะเงียบ ๆ กลับไปใช้ราคาบาทของสินค้าแทน ซึ่งจับได้ยากมากถ้าราคาสองสกุลบังเอิญใกล้กัน


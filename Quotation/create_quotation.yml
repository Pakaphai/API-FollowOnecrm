  ## 9. สิ่งที่ถูกสร้างพร้อมกันโดยอัตโนมัติ

  | อะไร | รายละเอียด |
  |---|---|
  | **ใบสั่งขาย 1 ใบ** | ยอดชุดเดียวกับใบเสนอราคา · `commission_status = 1` · สถานะตามใบเสนอราคา |
  | **บรรทัดใบสั่งขาย** | คัดลอกจาก `quotation_lines` ทั้งหมด |
  | **เงื่อนไข** | เขียนทั้ง `quotation_conditions` และ `order_conditions` |
  | **แถว `usd_rate_logs`** | ประวัติอัตราที่ใช้ (เฉพาะเมื่อมีอัตรา) — ล้มเหลวแล้วไม่ล้มการบันทึก |
  | **อัปเดตแผนการติดต่อ** | เมื่อส่ง `relationship_id` มา |

  > ไม่มีทางสร้างใบเสนอราคาโดยไม่สร้างใบสั่งขาย — ถ้าต้องการแค่ใบเสนอราคา ให้ปล่อยใบสั่งขายไว้สถานะ `open`


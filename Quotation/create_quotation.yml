  ## 11. กับดักที่เหลืออยู่

  ทั้งหมดนี้เป็น **ข้อตกลงของ API ที่แก้ไม่ได้** เพราะแอปที่ปล่อยไปแล้วอ่านค่าแบบนี้อยู่
  (รายการที่เคยเป็นข้อผิดพลาดจริงถูกแก้ไปแล้ว — ดูข้อ 12)

  | # | เรื่อง | ต้องทำอะไร |
  |:---:|---|---|
  | 1 | ช่องยอดรวมใน `quotation` เป็นบาท แต่ `quotationLines` เป็นสตางค์ — **ถึงจะย้ายเข้าไปอยู่ใน `quotation` แล้วก็ยังคนละหน่วยกันอยู่** | อย่าใช้ parser ตัวเดียวกับทั้งสองส่วน |
  | 2 | `qty` ใน response คูณ 100 มา | `200` = 2 ชิ้น |
  | 3 | `total_before_discount` คือยอด**หลัง**ส่วนลดรายบรรทัด | ชื่อหลอก อ่านข้อ 5 |
  | 4 | ผลบวกยอดย่อย ≠ `total_after_discount` (ต่างได้ ≤1 บาท) | เกิดจากการปัดยอดรวมขึ้นเป็นบาทเต็ม เป็นพฤติกรรมที่ตั้งใจ |
  | 5 | ลืม `usd_price` แล้วระบบไม่เตือน | เช็ค `quotationLines[].usd_price` ต้องไม่เป็น `null` หรือใช้ `quotation/usd/create` |
  | 6 | สร้างสำเร็จ = มีใบสั่งขายเกิดขึ้นด้วยเสมอ | เผื่อไว้ในโฟลว์ฝั่งแอป |
  | 7 | ส่งรายการสินค้าผิดรูปแบบ + แนบรูป = ได้ `201` ใบเปล่า ไม่มี error | ตรวจ `quotationLines` ใน response ว่าไม่ว่าง และ `price_mode` ไม่เป็น `null` — ดูรูปแบบ key ที่ข้อ 3 |

  ## 12. สิ่งที่แก้ไปแล้ว

  ### 2026-08-19 — เพิ่มอย่างเดียว ไม่มีอะไรหาย

  | เดิม | ตอนนี้ |
  |---|---|
  | รายการสินค้าอยู่ที่ `data.quotationLines` ที่เดียว | เพิ่ม `data.quotation.quotationLines` เข้ามาด้วย ชุดเดียวกันเป๊ะ · **ของเดิมยังอยู่ครบ** |

  ### 2026-08-18

  | เดิม | ตอนนี้ |
  |---|---|
  | ไม่ส่ง `product_id` / `qty` / `uom_code` ในบรรทัด → **`500`** โดยไม่บอกว่าผิดตรงไหน | **`422`** ระบุบรรทัดและช่องที่ขาด |
  | `status` ค่าที่ไม่รู้จักถูกเปลี่ยนเป็น `open` เงียบ ๆ | **`422`** `"สถานะต้องเป็น open หรือ confirmed"` |
  | `uom_code` ใน response มีช่องว่างต่อท้าย (`"EA "`) | ตัดให้แล้ว (`"EA"`) ทุกเส้นของใบเสนอราคา |

  > ⚠️ สองข้อแรกทำให้คำขอที่**เคยผ่าน** (แบบผิด ๆ) กลายเป็น `422` — ถ้าแอปเคยส่ง `status` แปลก ๆ
  > หรือส่งบรรทัดที่ข้อมูลไม่ครบมา ต้องแก้ฝั่งแอปด้วย


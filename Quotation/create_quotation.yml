  ## 5. รหัสข้อผิดพลาดและ HTTP Status (Error Handling Guide)

  | HTTP Code | Error Key / Code | สาเหตุและแนวทางแก้ไข |
  |:---:|---|---|
  | `401` | `token_expired` / `token_invalid` | Token หมดอายุหรือไม่ถูกต้อง ให้เรียก `/api/v1/refresh` หรือ Login ใหม่ |
  | `403` | `subscription_expired` | บริษัทหมดอายุการใช้งานเกิน 3 วัน ต้องติดต่อแอดมินเพื่อต่อแพ็กเกจ |
  | `403` | `unauthorized_status` | ผู้ใช้ระดับผู้ดูแลระบบ (Admin) ส่ง `status: confirmed` (ระบบสงวนให้ฝ่ายขายเป็นผู้ยืนยันเท่านั้น) |
  | `422` | `quotation_lines_disabled` | บริษัทตั้งค่าปิดโหมดกรอกรายการสินค้า ต้องใช้โหมดแนบรูปภาพแทน |
  | `422` | `usd_pricing_disabled` | มีการส่ง `usd_price` แต่บริษัทยังไม่ได้เปิดฟีเจอร์ราคาสกุล USD |
  | `422` | `Validation failed` | ข้อมูลไม่ผ่านเกณฑ์ เช่น ไม่ระบุลูกค้า, จำนวนชิ้นไม่เป็นจำนวนเต็ม, หรือราคาต่ำกว่าเกณฑ์ขั้นต่ำ |

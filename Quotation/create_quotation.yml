  ## 10. Error

  | HTTP | เมื่อไหร่ | รูปแบบ |
  |:---:|---|---|
  | `401` | token หาย/หมดอายุ | `{status, message, code}` |
  | `403` | แพ็กเกจหมดอายุเกิน 3 วัน | `{code: "subscription_expired"}` |
  | `422` | validation ไม่ผ่าน | `{message: "Validation failed.", errors: {...}}` |
  | `422` | ราคาต่อหน่วยต่ำกว่าขั้นต่ำ | `{message: "Validation failed.", errors: {"quotation_lines.0.unit_price": [...]}}` |
  | `422` | ส่ง `usd_price` แต่ใช้ไม่ได้ | `{success: false, code: "usd_pricing_disabled" \| "usd_rate_unavailable"}` |
  | `500` | ข้อผิดพลาดอื่น (rollback แล้ว) | `{success: false, message, error}` |

  ข้อความ error ที่เจอบ่อย:

  ```json
  {"errors":{
    "quotation_lines.0.product_id":["กรุณาเลือกสินค้า"],
    "quotation_lines.0.uom_code":["กรุณาระบุหน่วยนับ"],
    "quotation_lines.0.qty":["จำนวนของหน่วยนับ EA ต้องเป็นจำนวนเต็ม (กรอกมา 2.5)"],
    "quotation_lines.1.unit_price":["สินค้า \"Apple AirTag\" ยังไม่ได้กำหนดราคาขายขั้นต่ำ จึงขายต่ำกว่าราคาที่ตั้งไว้ 1,020.00 บาท ไม่ได้"],
    "quotation_date":["วันที่ใบเสนอราคาระบุปี 2569 ซึ่งดูเหมือนเป็นปี พ.ศ. กรุณากรอกเป็นปี ค.ศ. (พ.ศ. 2569 = ค.ศ. 2026)"],
    "status":["สถานะต้องเป็น open หรือ confirmed"]
  }}
  ```


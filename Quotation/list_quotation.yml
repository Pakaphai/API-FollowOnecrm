info:
  name: list_quotation
  type: http
  seq: 4

http:
  method: GET
  url: "{{sale_uat}}/api/v1/quotation/list?page=1&per_page=20&q="
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
    - name: q
      value: ""
      type: query
    - name: customer_id
      value: "4"
      type: query
      disabled: true
    - name: status
      value: open
      type: query
      disabled: true
    - name: start_date
      value: 2026-01-01
      type: query
      disabled: true
    - name: end_date
      value: 2026-12-31
      type: query
      disabled: true
    - name: price_mode
      value: price
      type: query
      disabled: true
    - name: is_usd
      value: "1"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## ค่าคอมมิชชั่นของเอกสาร (`commission`) — เพิ่ม 22/09/2569

  ในแต่ละ `quotation_headers[]` มี `commission` รูปแบบเดียวกับ `GET order/list`:

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `is_issued` | ออกใบค่าคอมสำหรับเอกสารนี้แล้วหรือไม่ |
  | `document_numbers` | เลขที่ใบค่าคอม เช่น `CM-202609-0002` |
  | `rate_percent` | อัตราคอมมิชชั่นจริง เช่น `10` = 10% |
  | `before_withholding` | ค่าคอมก่อนหัก ณ ที่จ่าย (บาท) |
  | `withholding_tax` | ภาษีหัก ณ ที่จ่าย (บาท) |
  | `net_commission` | ค่าคอมสุทธิ (บาท) |

  ## การแบ่งหน้า (pagination)

  เส้นนี้แบ่งหน้าเสมอ ไม่ส่งอะไรมาก็ได้ 20 รายการแรก

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >= 1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <= 100 | - |
  | `customer_id` | integer | - |
  | `status` | string | - |
  | `start_date` / `end_date` | date | - |
  | `price_mode` | string | - |
  | `is_usd` | boolean (0/1) | - |

  ส่ง `per_page` เกิน 200 หรือ `q` ยาวเกิน 100 ตัว จะได้ 422

  ## การค้นหา (q)

  `q` ถูกส่งไปกรองที่ฐานข้อมูล **ก่อน** แบ่งหน้า จึงค้นเจอทุกรายการที่ตรงคีย์เวิร์ด
  ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว ค้นแบบไม่แยกตัวพิมพ์เล็กใหญ่ (ILIKE) และมีคำนี้อยู่ตรงไหนก็ได้

  ค้นจาก: เลขที่ใบเสนอราคา - ชื่อลูกค้า - รหัสลูกค้า - ชื่อผู้ติดต่อ

  meta ที่แนบกลับมาทุกครั้ง (ระดับเดียวกับ key ของรายการ):

  ```json
  { "page": 1, "size": 20, "total_elements": 137, "total_pages": 7,
    "has_next": true, "has_prev": false }
  ```

  ต้องวนดึงต่อตาม `has_next` / `total_pages` ถ้าอยากได้ครบทุกรายการ
  รายละเอียดทั้งหมดอยู่ที่ docs/api-reference.md หัวข้อ "การแบ่งหน้า (pagination)"

  ## ป้ายสถานะ (`status` / `status_en`)

  `status_en` คือคีย์อังกฤษ ส่วน `status` คือป้ายภาษาไทยชุดเดียวกับฝั่งเว็บ (`OrderModel::STATUS_LABELS`)

  **สถานะของใบเสนอราคาเดินได้ทั้งสายแล้ว ไม่ได้หยุดที่ `confirmed`** — ระบบซิงก์สถานะใบเสนอราคา
  ให้เดินตามใบสั่งขายที่ผูกกันทุกครั้งที่ใบสั่งขายเปลี่ยนขั้น จึงเจอค่าอย่าง `pending_billing`
  `dispatch` `shipped` `completed` ในเส้นนี้ได้

  ## เลขที่ใบลดหนี้ (`credit_note_numbers`)

  แต่ละใบมี `credit_note_numbers` — เลขที่ใบลดหนี้ (`SR-xxxxxx-xxxx`) ของใบสั่งขายที่ผูกกับใบเสนอราคานี้
  ชุดเดียวกับที่เว็บโชว์ใต้เลขที่เอกสารในตาราง `/all-quotation` ให้แอปแสดงเป็นบรรทัดรองใต้เลขที่ใบเสนอราคาได้เลย

  - เป็น array เสมอ เรียงตามลำดับที่ออก (ใบสั่งขายหนึ่งใบมีใบลดหนี้ได้หลายใบ)
  - ตัดใบที่ยกเลิก (`cancelled`) / ไม่อนุมัติ (`rejected`) ออก — ใบที่รออนุมัติยังแสดง
  - `[]` = ไม่มีใบลดหนี้ หรือใบเสนอราคายังไม่ถูกยืนยันเป็นใบสั่งขาย

  ```json
  { "id": 7, "quotation_number": "QT-202608-0007", "credit_note_numbers": ["SR-202608-0004"], ... }
  ```

  ## วันเครดิตของลูกค้า (`credit_days`) — เพิ่ม 23/09/2569

  จำนวนวันเครดิตที่ให้ลูกค้ารายนั้น (`customers.credit`) · `0` = ไม่ได้ให้เครดิต (ขายสด)

  ชื่อคีย์ตรงกับ `due.credit_days` ของ `GET order/list` แต่เส้นใบเสนอราคายังไม่มีวันครบกำหนดชำระ
  เพราะนับจากวันส่งของซึ่งยังไม่เกิดขึ้น — ใช้ค่านี้บอกเงื่อนไขการชำระเงินในหน้ารายละเอียดได้เลย

  ## สีป้ายสถานะ (`status_color`) — เพิ่ม 23/09/2569

  สี hex ของ badge ชุดเดียวกับเว็บ (`OrderModel::STATUS_COLORS`) เช่น `"#FF9F43"` สำหรับ "เปิดใบเสนอราคา"
  เอาไปทาสีป้ายในแอปได้เลยไม่ต้อง map เอง · สถานะที่ระบบไม่รู้จักจะได้สีเทา `#969191`

  ## ยอดในกล่องสรุป (เพิ่ม 23/09/2569)

  เดิมแอปต้องคำนวณยอดกลาง ๆ เองจาก `total_before_discount` กับ `header_discount`
  ตอนนี้เซิร์ฟเวอร์คิดมาให้ครบ ตรงกับกล่องสรุปในแผงรายละเอียดฝั่งเว็บบรรทัดต่อบรรทัด
  (ชุดเดียวกับ `GET order/list`)

  | ฟิลด์ | บรรทัดบนเว็บ | ความหมาย |
  |---|---|---|
  | `total_before_discount` | รวมเป็นเงิน | ยอดรวมหลังหักส่วนลดรายบรรทัดแล้ว |
  | `header_discount` | ส่วนลดท้ายบิล | จำนวนเงินที่ลด (บาท) แม้กรอกมาเป็น % |
  | `header_discount_percent` | ตัวเลขในวงเล็บ | เช่น `10` = ส่วนลดท้ายบิล (10%) · `null` = กรอกเป็นบาท |
  | `total_after_bill_discount` | ยอดรวมหลังหักส่วนลด | `total_before_discount - header_discount` |
  | `total_before_vat` | มูลค่าก่อนภาษี | ฐานภาษีของใบนี้ — **ไม่เท่ากันทุกโหมด ดูด้านล่าง** |
  | `vat_amount` | ภาษีมูลค่าเพิ่ม (7%) | ภาษีของทั้งใบ |
  | `vat_rate` | ตัวเลขในวงเล็บของบรรทัด VAT | `7` หรือ `0` เมื่อใบนี้ไม่คิดภาษี |
  | `total_after_discount` | จำนวนเงินรวมทั้งสิ้น | ยอดสุทธิที่ลูกค้าต้องจ่าย |

  เงินทุกช่องเป็น **บาท** แล้ว

  ### ฐานภาษีต่างกันตามโหมดราคา

  `total_before_vat` **ไม่ใช่** `total_after_bill_discount - vat_amount` เสมอไป ขึ้นกับ `price_mode` ของใบ

  | `price_mode` | `price_mode_label` | ฐานภาษี | ยอดสุทธิ |
  |---|---|---|---|
  | `novat` | ราคาแยกภาษีมูลค่าเพิ่ม 7% (Exclude) | = ยอดรวมหลังหักส่วนลด | ฐาน **+** VAT |
  | `vat` | ราคารวมภาษีมูลค่าเพิ่ม 7% (Include) | = ยอดรวมหลังหักส่วนลด **−** VAT (ถอด 7/107) | = ยอดรวมหลังหักส่วนลด |
  | `price` | ราคาไม่มีภาษี | = ยอดรวมหลังหักส่วนลด | = ยอดรวมหลังหักส่วนลด (VAT = 0) |

  ระวังชื่อ: `novat` คือ **แยกภาษี** ไม่ใช่ "ไม่มีภาษี" — ใบที่ไม่คิดภาษีคือ `price`
  `price_mode_label` คือป้ายภาษาไทยของโหมดนั้น ตรงกับบรรทัด "รูปแบบราคา" บนเว็บ

  ```json
  "price_mode": "novat", "price_mode_label": "ราคาแยกภาษีมูลค่าเพิ่ม 7% (Exclude)",
  "total_before_discount": 900.00, "header_discount": 90.00, "header_discount_percent": 10,
  "total_after_bill_discount": 810.00, "total_before_vat": 810.00,
  "vat_amount": 56.70, "vat_rate": 7, "total_after_discount": 866.70
  ```

  เว็บซ่อนบรรทัด "มูลค่าก่อนภาษี" ในโหมด `novat` / `price` เพราะจะซ้ำกับบรรทัดเหนือมัน
  แอปทำแบบเดียวกันได้ — แสดงบรรทัดนี้เฉพาะเมื่อ `price_mode === "vat"` และ `vat_amount > 0`

  ## 3. คำอธิบายตัวแปรใน Response

  ### ข้อมูลหัวเอกสาร (`quotation_headers[]`):
  * **`id`**: รหัสใบเสนอราคา (Quotation ID)
  * **`customer_id`**: รหัสลูกค้าที่เปิดใบเสนอราคาให้
  * **`quotation_number`**: เลขที่ใบเสนอราคา (เช่น `QT-2026-0010`)
  * **`quotation_date`**: วันที่ที่ระบุในใบเสนอราคา
  * **`status`**: ข้อความสถานะภาษาไทย (เช่น `เปิดใบเสนอราคา`, `ยืนยันใบเสนอราคา`, `ยกเลิก`)
  * **`status_en`**: รหัสสถานะภาษาอังกฤษ (`open`, `confirmed`, `cancelled`)
  * **`total_before_discount`**: ยอดรวมราคาสินค้าก่อนหักส่วนลด (บาท)
  * **`header_discount`**: ส่วนลดท้ายเอกสาร (บาท)
  * **`total_discount`**: ส่วนลดรวมทั้งหมด (ส่วนลดรายการ + ส่วนลดท้ายบิล) (บาท)
  * **`total_after_discount`**: ยอดรวมสุทธิหลังหักส่วนลด (บาท)
  * **`total_after_discount_usd`**: ยอดรวมสุทธิแปลงเป็นเงินดอลลาร์ USD (คำนวณตามอัตราแลกเปลี่ยนของใบนี้)
  * **`usd_rate_used`**: อัตราแลกเปลี่ยน USD ที่ใช้คำนวณในเอกสารนี้ (เช่น `34.00`)
  * **`usd_rate_from_document`**: บ่งบอกว่าอัตรานี้ถูกตรึงและบันทึกไว้ในเอกสารแล้วหรือไม่ (`true` = เป็นอัตราเดิมของใบนี้)
  * **`note`**: หมายเหตุท้ายใบเสนอราคา
  * **`customer_name`**: ชื่อลูกค้า/บริษัทพร้อมคำนำหน้า
  * **`customer_code`**: รหัสอ้างอิงลูกค้า
  * **`contact_name`**: ชื่อผู้ติดต่อ
  * **`customer_phone`**: เบอร์โทรศัพท์ลูกค้า
  * **`tax_id`**: เลขประจำตัวผู้เสียภาษี 13 หลัก
  * **`customer_address` / `province_name` / `district_name` / `subdistrict_name` / `zip_code`**: ข้อมูลที่อยู่ลูกค้า
  * **`quotation_image`**: URL รูปภาพกรณีสร้างใบเสนอราคาแบบแนบรูปภาพ

  ### ข้อมูลรายการสินค้าในใบเสนอราคา (`quotation_lines[]`):
  * **`id`**: รหัสรายการสินค้า (Quotation Line ID)
  * **`product_id`**: รหัสสินค้า
  * **`qty`**: จำนวนสินค้าที่สั่ง
  * **`uom_code`**: หน่วยนับสินค้า (เช่น `EA`, `BOX`, `SET`)
  * **`discount_type`**: ประเภทส่วนลด (`amount` = ลดเป็นบาท, `percent` = ลดเป็นเปอร์เซ็นต์)
  * **`manual_discount`**: มูลค่าส่วนลดที่กรอก
  * **`unit_price`**: ราคาต่อหน่วยของตัวสินค้าพื้นฐาน (ไม่รวมราคา Option) (บาท)
  * **`unit_price_total`**: ราคาต่อหน่วยที่รวมราคา Option แล้ว (ราคาที่ลูกค้าจ่ายจริงต่อหน่วย) (บาท)
  * **`discount`**: จำนวนเงินส่วนลดที่คำนวณได้ของบรรทัดนี้ (บาท)
  * **`total_line`**: ยอดรวมของรายการนี้หลังหักส่วนลด (บาท)
  * **`usd_price`**: ราคาต่อหน่วยเฉพาะสินค้าในสกุล USD
  * **`usd_price_total`**: ราคาต่อหน่วยรวม Option ในสกุล USD
  * **`total_line_usd`**: ยอดรวมของรายการนี้แปลงเป็นสกุล USD
  * **`main_image_url`**: URL รูปภาพหลักของสินค้า
  * **`options[]`**: รายการตัวเลือกสินค้า (Option) ที่ลูกค้าเลือกในบรรทัดนี้
    * `id`: รหัส Option
    * `group_name`: ชื่อกลุ่มตัวเลือก (เช่น สี, ขนาด)
    * `name`: ชื่อตัวเลือก (เช่น สีแดง, XL)
    * `price`: ราคาเพิ่มของตัวเลือก (บาท)
    * `usd`: ราคาเพิ่มของตัวเลือกในสกุล USD

  ### ข้อมูลเงื่อนไขท้ายเอกสาร (`quotation_conditions[]`):
  * **`condition_id`**: รหัสเงื่อนไข
  * **`name`**: หัวข้อเงื่อนไข (เช่น เงื่อนไขการชำระเงิน, เงื่อนไขการจัดส่ง)
  * **`detail`**: รายละเอียดของเงื่อนไข

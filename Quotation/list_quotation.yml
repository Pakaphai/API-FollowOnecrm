http:
  method: GET
  url: "{{sale_uat}}/api/v1/quotation/list?page=1&per_page=20&q="
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
    - name: q
      value: ""
      type: query
    - name: customer_id
      value: "4"
      type: query
      disabled: true
    - name: status
      value: open
      type: query
      disabled: true
    - name: start_date
      value: 2026-01-01
      type: query
      disabled: true
    - name: end_date
      value: 2026-12-31
      type: query
      disabled: true
    - name: price_mode
      value: price
      type: query

docs: |
  # API Specification: POST /api/v1/quotation/usd/create

  สร้างใบเสนอราคาที่ **บังคับกำหนดราคาต่อหน่วยเป็นสกุลเงินดอลลาร์สหรัฐ (USD)** ทุกบรรทัด โดยระบบจะแปลงเป็นเงินบาทตามอัตราแลกเปลี่ยนทางการของธนาคารแห่งประเทศไทย (ธปท.) ณ วันที่ออกเอกสาร พร้อมบันทึกลงตารางประวัติอัตราแลกเปลี่ยนและสร้างใบสั่งขายให้อัตโนมัติ

  ---

  ## 1. ภาพรวมและกระบวนการทำงานสกุลเงิน USD (USD Workflow)

  ```
  [ผู้ใช้ส่งคำขอสร้างใบเสนอราคา USD]
                │
                ▼
  [1. ตรวจสอบเงื่อนไขฟีเจอร์ USD (USD Guard)]
       ├─ ตรวจสอบว่าบริษัทเปิดใช้งานฟีเจอร์ USD Pricing หรือไม่ (usd_pricing_disabled)
       ├─ ตรวจสอบอัตราแลกเปลี่ยน BOT ล่าสุด (usd_rate_unavailable)
       └─ ตรวจสอบว่าทุกบรรทัดสินค้ามีค่า usd_price ครบถ้วน
                │
                ▼
  [2. การแปลงค่าเงินและการคิดราคาต่อหน่วย (USD Conversion)]
       ├─ ดึง Option USD ที่เลือกมาบวกเพิ่ม: USD_Total = ceil(usd_price + Σ Option_USD)
       ├─ แปลงเป็นเงินบาท: Unit_Price_THB = USD_Total × BOT_Rate_Used (ปัดขึ้นเป็นบาทเต็ม)
       └─ ข้ามการตรวจสอบ Min Price ในสกุลเงินบาท (เนื่องจากยึดตามราคาดอลลาร์ที่ตกลงกับลูกค้า)
                │
                ▼
  [3. บันทึกประวัติและผูกอัตราแลกเปลี่ยน]
       ├─ บันทึกอัตราแลกเปลี่ยน snapshot ลงในหัวเอกสาร (quotation_headers)
       ├─ เพิ่มประวัติใน usd_rate_logs (action = create)
       └─ สร้าง Order และ OrderLines คู่ขนานที่มีข้อมูล USD ครบถ้วน
                │
                ▼
  [4. DB Commit และส่ง Response 201 Created]
  ```

  ---

  ## 2. พจนานุกรมตัวแปร Request (Parameters Dictionary)

  ### 2.1 ข้อมูลระดับหัวเอกสาร (Header Parameters)

  | ชื่อตัวแปร | ชนิดข้อมูล | จำเป็น | รายละเอียดและคำอธิบาย |
  |---|---|:---:|---|
  | `customer_id` | integer | ✅ | รหัสลูกค้า (`customers.id`) |
  | `quotation_date` | string (date) | ✅ | วันที่ออกเอกสาร รูปแบบ `YYYY-MM-DD` (ปี ค.ศ.) |
  | `price_mode` | string (enum) | | โหมดภาษี: `price` (ไม่คิดภาษี), `vat` (รวมภาษี 7%), `novat` (แยกภาษี 7%) |
  | `header_discount` | numeric | | ส่วนลดท้ายบิล (บาท หรือ %) |
  | `header_discount_type` | string (enum) | | `amount` (บาท) หรือ `percent` (% ของยอดรวม) |
  | `note` | string | | หมายเหตุท้ายเอกสาร |
  | `status` | string (enum) | | `open` หรือ `confirmed` |
  | `conditions` | array\<int\> | | รายการรหัสเงื่อนไขท้ายเอกสาร |
  | `relationship_id` | integer | | รหัสแผนงานติดต่อลูกค้า |

  ### 2.2 ข้อมูลระดับรายการสินค้า (`quotation_lines[]`)

  | ชื่อตัวแปร | ชนิดข้อมูล | จำเป็น | รายละเอียดและคำอธิบาย |
  |---|---|:---:|---|
  | `quotation_lines[N][product_id]` | integer | ✅ | รหัสสินค้า (`products.id`) |
  | `quotation_lines[N][qty]` | numeric | ✅ | จำนวนสินค้า (หน่วยชิ้นต้องเป็นจำนวนเต็ม) |
  | `quotation_lines[N][uom_code]` | string | ✅ | รหัสหน่วยนับ (`EA`, `BX`, `SET` ฯลฯ) |
  | `quotation_lines[N][usd_price]` | numeric | ✅ | **ราคาต่อหน่วยในสกุลเงิน USD (บังคับต้องระบุทุกบรรทัด)** |
  | `quotation_lines[N][manual_discount]` | numeric | | ส่วนลดพิเศษ (บาท หรือ %) |
  | `quotation_lines[N][discount_type]` | string (enum) | | `amount` (บาท) หรือ `percent` (%) |
  | `quotation_lines[N][option_ids][]` | array\<int\> | | รหัส Option สินค้าที่เลือก (Option USD จะถูกบวกในดอลลาร์ก่อนแปลง) |

  ---

  ## 3. กฎการปัดเศษและการคำนวณ USD (Rounding & Precision Rules)

  1. **ราคา USD ต่อหน่วย (`usd_price`)**: หากส่งเป็นทศนิยม ระบบจะปัดขึ้นเป็นจำนวนเต็มดอลลาร์ก่อนแปลง เช่น `$129.50` -> `$130.00`
  2. **อัตราแลกเปลี่ยนที่ใช้จริง (`rate_used`)**: อัตราขายถัวเฉลี่ยจาก ธปท. จะถูกปัดขึ้นเป็นบาทเต็มก่อนนำมาใช้ เช่น `33.2108` -> `฿34.00`
  3. **การแปลงยอดต่อหน่วยเป็นบาท**: `฿ Unit Price = $ USD Price × ฿ Rate Used`
  4. **ยอดรวมสุทธิ USD ในหัวเอกสาร (`total_after_discount_usd`)**: คำนวณจากยอดสุทธิบาทแปลงกลับเป็น USD แล้วปัดขึ้นเป็นดอลลาร์เต็ม

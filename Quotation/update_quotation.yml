docs: |
  # API Specification: POST /api/v1/quotation/update/{id}

  แก้ไขใบเสนอราคาที่มีอยู่เดิม พร้อมทำการ **ซิงก์และคำนวณยอดใบสั่งขาย (Order) ที่ผูกกันใหม่อัตโนมัติทั้งใบ**

  ---

  ## 1. ภาพรวมและกระบวนการแก้ไขเอกสาร (Quotation Update Lifecycle)

  ```
  [ผู้ใช้ส่งคำขอแก้ไขใบเสนอราคา]
                │
                ▼
  [1. ตรวจสอบสิทธิ์และสถานะเอกสาร]
       ├─ ตรวจสอบว่าใบเสนอราคาอยู่ในสถานะที่แก้ไขได้หรือไม่ (QuotationHeadersModel::SALE_EDITABLE_STATUSES)
       ├─ เอกสารที่ยืนยันแล้วหรือยกเลิกแล้วจะถูกปฏิเสธด้วย HTTP 403 Forbidden
       └─ อัปเดตสถานะเอกสารกลับเป็น 'open' เสมอหลังแก้ไขสำเร็จ
                │
                ▼
  [2. การซิงก์รายการสินค้าแบบ Full Replacement (ไม่ใช่ Partial Update)]
       ├─ ตรวจจับคู่บรรทัดสินค้าเดิมด้วย: product_id + uom_code
       ├─ บรรทัดที่ส่งมา: ทำการอัปเดตราคา, จำนวน, ส่วนลด, ตัวเลือกสินค้า (Option)
       ├─ บรรทัดที่เพิ่มใหม่: สร้างแถวใหม่ใน quotation_lines และ order_lines
       └─ บรรทัดเดิมที่ไม่ได้ส่งมาใน Payload: ทำ Soft Delete (is_delete = true) ทั้ง Quotation และ Order
                │
                ▼
  [3. การคำนวณยอดรวมใหม่ทั้งใบ (Recalculation)]
       ├─ คำนวณโปรโมชันใหม่ตามวันที่บนเอกสาร (quotation_date) ที่ส่งมารอบนี้
       ├─ อัปเดตประวัติอัตราแลกเปลี่ยน USD (usd_rate_logs, action = update)
       ├─ คำนวณส่วนลดท้ายบิลตาม header_discount_type (amount หรือ percent)
       └─ ปัดเศษยอดรวมสุทธิ (total_after_discount) ขึ้นเป็นจำนวนเต็มบาท
                │
                ▼
  [4. DB Commit และส่ง Response 201 Created]
  ```

  ---

  ## 2. พจนานุกรมตัวแปร Request (Parameters Dictionary)

  ### 2.1 ข้อมูลระดับหัวเอกสาร (Header Parameters)

  | ชื่อตัวแปร | ชนิดข้อมูล | จำเป็น | รายละเอียดและคำอธิบาย |
  |---|---|:---:|---|
  | `customer_id` | integer | ✅ | รหัสลูกค้า (`customers.id`) สามารถเปลี่ยนลูกค้าเจ้าของเอกสารได้ |
  | `quotation_date` | string (date) | ✅ | วันที่ออกเอกสาร `YYYY-MM-DD` (ปี ค.ศ.) มีผลต่อการคิดโปรโมชันใหม่ |
  | `price_mode` | string (enum) | | โหมดภาษี: `price` (ไม่มีภาษี), `vat` (รวมภาษี 7%), `novat` (แยกภาษี 7%) |
  | `header_discount` | numeric | | ส่วนลดท้ายบิล (ระบุเป็นจำนวนเงินบาท หรือเปอร์เซ็นต์ตาม `header_discount_type`) |
  | `header_discount_type` | string (enum) | | ประเภทส่วนลดท้ายบิล: `amount` (บาท) หรือ `percent` (% ของยอดสินค้า 0–100) |
  | `note` | string | | หมายเหตุท้ายเอกสาร |
  | `conditions` | array\<int\> | | รายการรหัสเงื่อนไขท้ายเอกสาร (`conditions.id`) |
  | `relationship_id` | integer | | รหัสแผนงานติดต่อลูกค้าที่ต้องการผูก |

  ### 2.2 ข้อมูลระดับรายการสินค้า (`quotation_lines[]`)

  | ชื่อตัวแปร | ชนิดข้อมูล | จำเป็น | รายละเอียดและคำอธิบาย |
  |---|---|:---:|---|
  | `quotation_lines` | array | ✅ | **รายการสินค้าทั้งหมดของเอกสารหลังแก้ไข (ต้องส่งอย่างน้อย 1 รายการ)** |
  | `quotation_lines[N][product_id]` | integer | ✅ | รหัสสินค้า (`products.id`) |
  | `quotation_lines[N][qty]` | numeric | ✅ | จำนวนสินค้า (หน่วยนับชิ้นต้องเป็นจำนวนเต็ม) |
  | `quotation_lines[N][uom_code]` | string | ✅ | รหัสหน่วยนับ (`EA`, `BX`, `SET` ฯลฯ) |
  | `quotation_lines[N][unit_price]` | numeric | | ราคาต่อหน่วย (บาท) — ตรวจสอบไม่ให้ต่ำกว่า Min Price |
  | `quotation_lines[N][usd_price]` | numeric | | ราคาต่อหน่วย (USD) — หากขายเป็น USD ต้องส่งค่านี้กลับมาเพื่อคงราคา USD |
  | `quotation_lines[N][manual_discount]` | numeric | | ส่วนลดพิเศษ (ไม่ส่ง = `0`) |
  | `quotation_lines[N][discount_type]` | string (enum) | | ประเภทส่วนลดพิเศษ: `amount` (บาท) หรือ `percent` (%) |
  | `quotation_lines[N][option_ids]` | array\<int\> | | รหัส Option สินค้า (**ไม่ส่งคีย์นี้ = คง Option เดิมไว้**, ส่ง `[]` = ลบ Option ทั้งหมด) |

  ---

  ## 3. ข้อควรระวังและกับดักสำคัญ (Critical Pitfalls)

  1. **ห้ามส่งเฉพาะบรรทัดที่ต้องการแก้ (No Partial Update)**: สินค้าที่ไม่ได้อยู่ใน Payload จะถูกลบออกจากระบบทันที ต้องส่งรายการสินค้าครบทุกตัว
  2. **การขายเป็นสกุลเงิน USD**: หากเอกสารเดิมขายเป็น USD ตอนแก้ไขต้องส่ง `usd_price` มาด้วยทุกครั้ง มิฉะนั้นระบบจะมองว่าขายเป็นเงินบาทและดึงราคาบาทมาตรฐานมาแทน
  3. **การรีเซ็ตสถานะ**: การแก้ไขใบเสนอราคาจะทำให้สถานะของทั้ง Quotation และ Order ถูกรีเซ็ตกลับเป็น `open` เสมอ

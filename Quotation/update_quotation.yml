  ## 8. ตัวอย่างการยิง

  ```bash
  BASE="https://silvercolorcupslt.followonecrm.com/api/v1"
  AUTH="Authorization: Bearer $TOKEN"

  curl -s -X POST "$BASE/quotation/update/3" \
    -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/json" \
    -d '{
      "customer_id": 4,
      "quotation_date": "2026-08-18",
      "header_discount": 1000,
      "price_mode": "price",
      "note": "แก้ไขราคาตามที่ตกลงใหม่",
      "quotation_lines": [
        {"product_id":119,"qty":2,"usd_price":29.99,"manual_discount":0,"discount_type":"amount","uom_code":"EA"},
        {"product_id":121,"qty":1,"usd_price":505.60,"manual_discount":0,"discount_type":"amount","uom_code":"EA"}
      ],
      "conditions": []
    }' | jq '.data.quotationLines[] | {product_id, unit_price, total_line, usd_price, total_line_usd}'
  ```

  ```json
  {"product_id":119,"unit_price":102000,"total_line":204000,"usd_price":30,"total_line_usd":60}
  {"product_id":121,"unit_price":1720400,"total_line":1720400,"usd_price":506,"total_line_usd":506}
  ```

  > ตัวอย่างนี้ส่งมา 2 บรรทัด — ถ้าเอกสารเดิมมี 3 บรรทัด **สินค้าตัวที่ 3 จะถูกลบทิ้ง**

  ---

  ## 9. กับดัก

  | # | เรื่อง | ต้องทำอะไร |
  |:---:|---|---|
  | 1 | **ไม่รองรับ partial update** | ส่งรายการสินค้ามาให้ครบทุกครั้ง ไม่งั้นของที่ไม่ได้ส่งหายหมด |
  | 2 | บรรทัดจับคู่ด้วย `product_id` + `uom_code` | ส่งสินค้า+หน่วยซ้ำกันเป๊ะ ๆ สองบรรทัดยังทับกัน — รวมเป็นบรรทัดเดียวก่อนส่ง |
  | 3 | สถานะถูกรีเซ็ตเป็น `open` เสมอ | ใบที่ยืนยันแล้วแก้ไม่ได้อยู่แล้ว (`403`) |
  | 4 | อัตรา USD ถูกเขียนทับด้วยอัตราวันที่แก้ | ยอดของบรรทัด USD เปลี่ยนตามอัตราใหม่ — ดูประวัติที่ `usd_rate_logs` |
  | 5 | เงื่อนไขที่เอาออกไม่ถูกลบ | ต่างจากบรรทัดสินค้า — ยังต้องลบเองถ้าจำเป็น |
  | 6 | คืน `201` ไม่ใช่ `200` | ตัดสินสำเร็จจากช่วง 2xx อย่าเทียบ `=== 200` |
  | 7 | `quotation` เป็นบาท / `quotationLines` เป็นสตางค์ | อย่าใช้ parser ตัวเดียวกับทั้งสอง block |
  | 8 | ลืม `usd_price` แล้วระบบไม่เตือน | เช็ค `quotationLines[].usd_price` ต้องไม่เป็น `null` |

  ## 10. สิ่งที่แก้ไปแล้ว

  ### 2026-08-19

  | เดิม | ตอนนี้ |
  |---|---|
  | แถวจับคู่ด้วย `product_id` อย่างเดียว — สินค้าเดียวกันคนละหน่วยนับ **บรรทัดหลังทับบรรทัดแรก** ผลบวกของบรรทัดจึงไม่ตรงกับยอดรวม | จับคู่ด้วย `product_id` + `uom_code` ขายสินค้าเดียวกันหลายหน่วยในใบเดียวได้แล้ว |

  ### 2026-08-18

  | เดิม | ตอนนี้ |
  |---|---|
  | บรรทัดที่เอาออกจาก payload **ค้างอยู่ในฐานข้อมูล** — ยอดรวมคิดจาก payload แต่รายการยังมีของเก่า ผลบวกจึงไม่ตรงกับยอดรวม | ตั้ง `is_delete = true` ให้บรรทัดที่หายไป ทั้งใบเสนอราคาและใบสั่งขาย |
  | response ไม่มีข้อมูล USD รายบรรทัด | เพิ่ม `usd_price` + `total_line_usd` |
  | `uom_code` มีช่องว่างต่อท้าย (`"EA "`) | ตัดให้แล้ว (`"EA"`) |
  | `message` เขียนว่า `"สร้างใบเสนอราคาสำเร็จ"` | `"แก้ไขใบเสนอราคาสำเร็จ"` |
  | `quotation/list` แสดงบรรทัดที่ถูกลบไปแล้วด้วย | กรอง `is_delete = false` ใน join |

  > ⚠️ ถ้าแอปเคยแสดงข้อความจาก `message` ตรง ๆ ข้อความจะเปลี่ยนไป


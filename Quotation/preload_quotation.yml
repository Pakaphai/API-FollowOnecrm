  ## 11. สรุปข้อควรระวัง — แยก "ข้อตกลงของ API" กับ "บั๊กจริง"

  ### 🟢 ไม่ใช่บั๊ก — เป็นข้อตกลง/การออกแบบที่ต้องรู้ไว้

  | # | เรื่อง | ต้องทำอะไร |
  |:---:|---|---|
  | 1 | key สะกดผิด `pomotionLines` | ใช้ชื่อผิดตามนั้น อย่าแก้ — แก้เมื่อไรแอปที่ปล่อยไปแล้วพังทันที |
  | 2 | ไม่มี wrapper `{success, data}` | อ่าน field ที่ระดับบนสุดตรง ๆ (เส้นเก่าหลายเส้นเป็นแบบนี้) |
  | 3 | ไม่มีการแบ่งหน้า | เรียกครั้งเดียวแล้ว cache — บริษัทที่สินค้าเยอะ response จะใหญ่ |
  | 4 | `product_price` เป็น object ไม่ใช่ array | เข้าถึงด้วย `product_price[String(productId)]` — หรือใช้ `products[].prices` ที่เป็น array อยู่แล้ว |
  | 5 | `main_image_url` หมดอายุ 10 นาที | เป็นกลไกความปลอดภัยของ S3 — เปิดหน้าค้างนานต้องโหลด preload ใหม่ |
  | 6 | ราคาก้อนนี้เป็น **บาท** แต่ `productlist` ใช้ **สตางค์** | คนละเส้นคนละหน่วย อย่าสลับกัน |

  ### 🔴 บั๊กจริง — ทำให้ยอดเงิน/ส่วนลดผิดได้

  | # | เรื่อง | อาการที่เกิดขึ้นจริง |
  |:---:|---|---|
  | 7 | **โหมด `novat` หน้าเว็บกับเซิร์ฟเวอร์ใช้คอลัมน์ราคาคนละตัว** | หน้าเว็บใช้ `product_price` เซิร์ฟเวอร์ใช้ `product_price_include_vat` → สินค้าที่ตั้งราคาแบบ "ยังไม่รวม VAT" กดบันทึกแล้วได้ `422` ว่าราคาต่ำกว่าที่ขายได้ ทั้งที่กรอกตามที่ระบบเติมให้ |
  | 8 | **โปรฯ กรองด้วย "วันนี้" แต่ตอนบันทึกกรองด้วยวันที่เอกสาร** | ผู้ใช้ย้อน/เลื่อนวันที่ใบเสนอราคา → ส่วนลดที่แสดงบนหน้าจอกับที่บันทึกจริงคนละตัว |
  | 9 | **`applied_promotion` เลือกมาโดยไม่ดู `uom_code`** | โปรฯ ผูกไว้กับหน่วย `BX` แต่ผู้ใช้เลือก `EA` → หน้าจอโชว์ว่าได้ส่วนลด แต่ตอนบันทึกไม่ได้ |
  | 10 | **`min_qty` / `min_value` / `max_discount_value` ไม่ถูกบังคับ** | แอดมินตั้งเงื่อนไข "ซื้อครบ 3 ชิ้นถึงลด" ไว้ แต่ระบบลดให้ตั้งแต่ชิ้นแรก และไม่มีเพดานส่วนลด |

  > ข้อ 7–10 เป็นพฤติกรรมของระบบ ณ ปัจจุบัน **ฝั่งแอปแก้เองไม่ได้ทั้งหมด** — ข้อ 8–9 แอปเลี่ยงได้ด้วยการกรอง `promotions[]` เอง
  > และเรียก `GET promotion/check` ให้เซิร์ฟเวอร์คำนวณให้ ส่วนข้อ 7 กับ 10 ต้องแก้ที่ฝั่งเซิร์ฟเวอร์


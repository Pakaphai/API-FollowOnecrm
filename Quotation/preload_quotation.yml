docs: |
  # API — ข้อมูลตั้งต้นฟอร์มใบเสนอราคา (Quotation Preload)

  ยิงครั้งเดียวได้ทุกอย่างที่ต้องใช้เปิดหน้า "สร้างใบเสนอราคา" — รายชื่อลูกค้า, สินค้า, ราคาแยกตามหน่วยนับ, โปรโมชันที่ใช้ได้วันนี้, เงื่อนไขท้ายเอกสาร, ข้อมูลผู้ขาย และอัตราแลกเปลี่ยน USD

  ```
  GET /api/v1/quotation/preload
  Authorization: Bearer <token>
  Accept: application/json
  ```

  | | |
  |---|---|
  | Route | [`routes/api/api_v1.php`](../routes/api/api_v1.php) — อยู่ในกลุ่ม `auth_api` |
  | Controller | [`Api\ApiQuotationController::quotation_preload_api()`](../app/Http/Controllers/Api/ApiQuotationController.php) |
  | ตารางหลัก | `customers` · `products` · `product_prices` · `uoms` · `promotion_headers` + `promotion_lines` · `conditions` |
  | พารามิเตอร์ | **ไม่มีเลย** — ไม่รับ query string ไม่รับ body |

  > เส้นนี้ **ไม่มี wrapper** `{success, message, data}` — คืน object ระดับบนสุดตรง ๆ ต่างจากเส้นอื่นหลายเส้น

  ---

  ## 1. ภาพรวม — ก้อนข้อมูล 9 ก้อน

  ```json
  {
    "customers":              [ ... ],
    "products":               [ ... ],
    "user":                   { ... },
    "product_price":          { "12": [ ... ], "13": [ ... ] },
    "product_options":        { "126": [ ... ] },
    "pomotionLines":          [ ... ],
    "conditions":             [ ... ],
    "whole_number_uom_codes": ["EA", "BX", "PK", "CT", "RL", "DZ", "SET", "PR", "PCS"],
    "usd_pricing":            true,
    "usd_rate":               { ... }
  }
  ```

  | key | คืออะไร | ใช้ทำอะไรในฟอร์ม |
  |---|---|---|
  | `customers` | ลูกค้า **ของตัวเองเท่านั้น** | dropdown "ลูกค้า" ด้านหัวเอกสาร |
  | `products` | สินค้าทั้งหมด + โปรโมชันที่ติดอยู่ | dropdown "สินค้า" ของแต่ละบรรทัด |
  | `product_price` | ราคาแยกตามหน่วยนับ **จัดกลุ่มตาม product_id** | พอเลือกสินค้า → ได้ตัวเลือกหน่วยนับ + ราคาที่เติมให้อัตโนมัติ |
  | `product_options` | ตัวเลือกสินค้า (หมวดหมู่ + ตัวเลือก) **จัดกลุ่มตาม product_id** | ให้ผู้ใช้ติ๊กเลือก แล้วบวกราคาเข้ากับราคาต่อหน่วย — ดูข้อ 4.5 |
  | `user` | ชื่อ-เบอร์ของผู้ขายที่ล็อกอิน | แสดงหัวเอกสาร "ผู้เสนอราคา" |
  | `pomotionLines` | ตาราง `promotion_lines` **ดิบทั้งตาราง** | ปกติ**ไม่ต้องใช้** — ดูข้อ 6 |
  | `conditions` | เงื่อนไขท้ายใบเสนอราคา | checkbox ให้ติ๊กเลือก |
  | `whole_number_uom_codes` | หน่วยที่ห้ามกรอกจำนวนเป็นทศนิยม | เผื่อเจอหน่วยที่ไม่ได้มากับ `product_price` |
  | `usd_pricing` / `usd_rate` | ฟีเจอร์ราคาสกุล USD + อัตรา ธปท. | แสดง/ซ่อนช่องราคา USD |

  > ⚠️ **ไม่มีการแบ่งหน้า** — คืนลูกค้าและสินค้าทั้งหมดในครั้งเดียว บริษัทที่มีสินค้าหลักพันรายการ response จะใหญ่พอสมควร ควรเรียกตอนเปิดหน้าฟอร์มแล้ว cache ไว้ ไม่ใช่เรียกซ้ำทุกครั้งที่เพิ่มบรรทัด

  ---

  ## 2. `customers` — รายชื่อลูกค้า

  **กรองไว้แล้วสองชั้น**: `is_delete = false` และ `user_id = ผู้ที่ล็อกอิน` → เซลส์เห็นเฉพาะลูกค้าที่ตัวเองรับผิดชอบ

  ```json
  {
    "id": 42,
    "user_id": 7,
    "business_type_id": 3,
    "customer_code": "C-0042",
    "customer_name": "ตัวอย่างเทรดดิ้ง",
    "formatted_name": "บริษัท ตัวอย่างเทรดดิ้ง จำกัด",
    "customer_tel": "021234567",
    "customer_address": "99/1 หมู่ 2",
    "province": "10", "province_name": "กรุงเทพมหานคร",
    "district": "1003", "district_name": "บางรัก",
    "subdistrict": "100301", "subdistrict_name": "สีลม",
    "subdistrict_zip_code": "10500",
    "tax_id": "0105500000000",
    "credit": 30
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `id` | ส่งค่านี้เป็น `customer_id` ตอนบันทึก |
  | `customer_name` | ชื่อดิบที่พิมพ์ไว้ตอนสร้างลูกค้า (ยังไม่มีคำนำหน้านิติบุคคล) |
  | `formatted_name` | **ชื่อพร้อมแสดง** — ประกอบคำนำหน้าจาก `business_type_id` ให้แล้ว ใช้ตัวนี้โชว์ใน dropdown |
  | `business_type_id` | ประเภทนิติบุคคล — `2` ห้างหุ้นส่วนจำกัด · `3` บริษัท…จำกัด · `4` บริษัท…จำกัด (มหาชน) · `5` สหกรณ์…จำกัด · `6` ห้างหุ้นส่วนสามัญ · อื่น ๆ = ใช้ชื่อเดิม |
  | `province` / `district` / `subdistrict` | **รหัส** ที่อยู่ (ใช้ยิงต่อ/บันทึก) |
  | `province_name` / `district_name` / `subdistrict_name` | **ชื่อภาษาไทย** ของรหัสข้างบน (ใช้แสดงผล) |
  | `subdistrict_zip_code` | รหัสไปรษณีย์ที่ผูกกับตำบล |
  | `tax_id` | เลขประจำตัวผู้เสียภาษี — ขึ้นหัวใบเสนอราคา |
  | `credit` | **เครดิตเป็น "จำนวนวัน"** ค่าที่เป็นไปได้: `0` `30` `60` `90` `120` (`0` = เงินสด) หน้าเว็บแสดงว่า "เครดิต: 30 วัน" |

  > ที่อยู่ในก้อนนี้คือ**ที่อยู่ของลูกค้า** เอาไปเติมหัวเอกสารได้เลย ไม่ต้องยิง `getCustomer-detail` ซ้ำ

  ---

  ## 3. `products` — รายการสินค้า + โปรโมชัน

  ```json
  {
    "id": 12,
    "code": "P-02-00-00-0001",
    "name": "Anker Magnetic Power Bank 10000mAh",
    "product_type_id": 4,
    "main_image_url": "https://s3.../product/xxx.jpg?X-Amz-Expires=600...",
    "stock_qty": 42,
    "min_stock_level": 42,
    "prices": [ ... ],
    "has_promotion": true,
    "promotions": [ ... ],
    "applied_promotion": { ... }
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `id` | ส่งเป็น `quotation_lines[].product_id` ตอนบันทึก |
  | `code` | รหัสสินค้า — ใน dropdown นิยมแสดงเป็น `code - name` |
  | `name` | ชื่อสินค้า |
  | `product_type_id` | หมวดหมู่สินค้า — ใช้จับคู่โปรโมชันระดับหมวดหมู่ |
  | `main_image_url` | **ลิงก์ชั่วคราวอายุ 10 นาที** (S3 presigned) `null` = สินค้านี้ไม่มีรูปหลัก |
  | `stock_qty` | **จำนวนคงเหลือในสต๊อก** หน่วยเป็นชิ้นเต็ม (ไม่ได้คูณ 100) **ติดลบได้** เพราะระบบยอมให้ขายเกินของที่มี |
  | `min_stock_level` | ค่าเดียวกับ `stock_qty` เป๊ะ ๆ — ชื่อคอลัมน์จริงใน DB เก็บไว้ให้ตรงกับ `product/list` |
  | `prices` | ราคาแยกตามหน่วยนับ**ของสินค้าตัวนี้** — array แถวเดียวกับ `product_price[id]` เป๊ะ ๆ (`[]` = ยังไม่ได้ตั้งราคา) ดูรายละเอียดฟิลด์ที่ข้อ 4 |
  | `has_promotion` | `true` = สินค้านี้มีโปรฯ ที่ใช้ได้วันนี้อย่างน้อย 1 ตัว |
  | `promotions` | โปรฯ **ทุกตัว**ที่เข้าเงื่อนไขวันนี้ (ทั้งระดับสินค้าและระดับหมวดหมู่) |
  | `applied_promotion` | โปรฯ **ตัวเดียว**ที่ระบบเลือกใช้ (`null` = ไม่มี) |

  > ⚠️ ชื่อ `min_stock_level` ชวนเข้าใจผิดว่าเป็น "จุดสั่งซื้อขั้นต่ำ" — **ไม่ใช่** มันคือยอดคงเหลือจริงที่ทั้งระบบใช้ตัดสต๊อก (ดู `StockDeductionService`) หน้าเว็บก็อ่านช่องเดียวกันไปโชว์คงเหลือใต้ช่องจำนวน

  > สต๊อก**ไม่บล็อกการขาย** — สั่งเกินคงเหลือก็บันทึกใบเสนอราคาได้ปกติ ค่านี้จึงมีไว้ให้แอป**เตือนผู้ใช้**เท่านั้น ของที่สั่งเกินจะถูกบันทึกไว้ที่ `stock_shortage_logs`

  > `main_image_url` หมดอายุใน 10 นาที — ถ้าผู้ใช้เปิดฟอร์มค้างไว้นานรูปจะโหลดไม่ขึ้น ต้องเรียก preload ใหม่

  ### รูปแบบของ `promotions[]` / `applied_promotion`

  ```json
  {
    "promotion_id": 9,
    "promotion_name": "ลดรับสงกรานต์",
    "level": "product",
    "uom_code": "BX",
    "discount_type": "percent",
    "discount_value": 5,
    "label": "5 %",
    "min_qty": 3,
    "min_value": null,
    "max_discount_value": 500,
    "applied": true
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `promotion_id` / `promotion_name` | หัวโปรโมชัน (`promotion_headers`) |
  | `level` | `product` = ตั้งไว้ที่สินค้าตัวนี้ตรง ๆ · `product_type` = ตั้งไว้ที่หมวดหมู่ |
  | `uom_code` | โปรฯ นี้ใช้ได้กับ**หน่วยนับไหน** (`null` = ไม่ระบุ) — สำคัญมาก ดูกับดักข้างล่าง |
  | `discount_type` | `percent` = ลดเป็น % · `amount` = ลดเป็นจำนวนเงิน **ต่อทั้งบรรทัด ไม่ใช่ต่อหน่วย** |
  | `discount_value` | ค่าที่ตั้งไว้ **แปลงหน่วยให้แล้ว** — `percent` = เปอร์เซ็นต์ (5 = 5%) · `amount` = บาท |
  | `label` | ข้อความพร้อมแสดง `"5 %"` หรือ `"1000 ฿"` เอาไปโชว์ได้เลย |
  | `min_qty` | จำนวนขั้นต่ำที่ตั้งไว้ (หน่วยเป็นชิ้น ไม่ได้คูณ 100) |
  | `min_value` | ยอดขั้นต่ำที่ตั้งไว้ **หน่วยบาท** |
  | `max_discount_value` | เพดานส่วนลดที่ตั้งไว้ **หน่วยบาท** |
  | `applied` | `true` = ตัวนี้คือตัวที่ระบบเลือกใช้ (ตรงกับ `applied_promotion`) |

  **กติกาการเลือกตัวที่ใช้จริง**: โปรฯ ระดับ `product` มาก่อนเสมอ ถ้าไม่มีจึงตกไปใช้ระดับ `product_type`

  ### ⚠️ กับดัก 3 ข้อของโปรโมชันในเส้นนี้

  1. **`applied_promotion` ยังไม่รู้ว่าผู้ใช้จะเลือกหน่วยนับอะไร**
     ตอนบันทึกจริง เซิร์ฟเวอร์จับคู่โปรฯ ระดับสินค้าด้วย `uom_code` ด้วย — ถ้าโปรฯ ผูกไว้กับ `BX` แต่ผู้ใช้เลือก `EA` โปรฯ นั้นจะไม่ถูกใช้ แอปจึงควรกรอง `promotions[]` ด้วย `uom_code` ที่ผู้ใช้เลือกเอง แทนการเชื่อ `applied_promotion` ตรง ๆ
     (โปรฯ ระดับ `product_type` ไม่ดู `uom_code`)

  2. **คิดจาก "วันนี้" ไม่ใช่ `quotation_date`**
     preload กรองช่วงวันที่ด้วยวันที่ปัจจุบัน แต่ตอนบันทึกเซิร์ฟเวอร์กรองด้วย **วันที่บนเอกสาร** — ถ้าผู้ใช้ย้อน/เลื่อนวันที่ใบเสนอราคา โปรฯ ที่ได้จริงอาจไม่ตรงกับที่ preload บอก

  3. **`min_qty` · `min_value` · `max_discount_value` ยังไม่ถูกบังคับตอนคิดเงิน**
     เซิร์ฟเวอร์คำนวณส่วนลดโดยไม่ตรวจสามค่านี้ ส่งมาเพื่อให้แอป**แสดงเงื่อนไขให้ผู้ใช้อ่าน**เท่านั้น อย่านำไปคาดหวังว่าระบบจะบล็อกให้

  > อยากได้ส่วนลดที่เซิร์ฟเวอร์คำนวณให้แน่ ๆ ต่อ 1 บรรทัด → ใช้ `GET promotion/check` แทน

  ---

  ## 4. `product_price` — ราคาแยกตามหน่วยนับ (ก้อนสำคัญที่สุด)

  **เป็น object ไม่ใช่ array** — คีย์คือ `product_id` (เป็น string ใน JSON) ค่าคือ array ของราคาแต่ละหน่วยนับ

  > 💡 ข้อมูลชุดเดียวกันนี้ถูกฝังไว้ใน `products[].prices` ด้วยแล้ว (แถวเดียวกัน ฟิลด์เดียวกัน) — ของใหม่ควรอ่านจาก `products[].prices` ตรง ๆ จะได้ไม่ต้องไล่หาข้าม key ส่วน `product_price` ระดับบนสุด**ยังส่งเหมือนเดิม** ไม่ได้ถอดออก ของเดิมที่ใช้อยู่จึงไม่พัง

  ```json
  {
    "12": [
      {
        "product_id": 12,
        "uom_code": "BX",
        "uom_desc": "กล่อง",

        "product_price": 1462.00,
        "product_price_exclude_vat": 1366.36,
        "product_price_include_vat": 1462.00,
        "product_vat_amount": 95.64,
        "vat_7_percent": 102.34,

        "min_price": 1200.00,
        "has_min_price": true,
        "min_unit_price": 1200.00,
        "min_unit_price_exclude_vat": 1121.50,

        "usd_price": 43,

        "is_whole_number": true,
        "qty_step": 1,
        "qty_min": 1,
        "qty_decimals": 0
      }
    ]
  }
  ```

  > **ราคาทุกตัวในก้อนนี้เป็น "บาท" แปลงมาให้แล้ว** (ฐานข้อมูลเก็บเป็นสตางค์) ต่างจาก `GET productlist` ที่พารามิเตอร์ราคาเป็นสตางค์ — อย่าสลับกัน

  ### 4.1 ราคา 4 ตัว — ใช้ตัวไหนขึ้นกับ `price_mode`

  `price_mode` คือโหมดภาษีของ**ทั้งใบ** ที่ผู้ใช้เลือกหัวเอกสาร ส่งไปพร้อมตอนบันทึก ป้ายที่ผู้ใช้เห็นบนเว็บคือ:

  | `price_mode` | ป้ายบนหน้าจอ |
  |---|---|
  | `price` | ราคาสินค้า (ไม่มีภาษี) |
  | `vat` | ราคาสินค้า (รวมภาษีมูลค่าเพิ่ม 7%) |
  | `novat` | ราคาสินค้า (แยกภาษีมูลค่าเพิ่ม 7%) |

  > ⚠️ **ชื่อค่าสวนทางกับป้าย** — `vat` = "รวมภาษี" ส่วน `novat` = "แยกภาษี" อ่านตารางนี้ทุกครั้ง อย่าเดาจากชื่อ
  > ทั้งสองโหมดจะบวก VAT 7% ของยอดสุทธิแต่ละบรรทัดเข้าไปในยอดรวมของเอกสาร (`vat_amount`)

  **คอลัมน์ราคาที่ใช้เป็นราคาตั้งต้นของแต่ละโหมด:**

  | `price_mode` | หน้าเว็บใช้ | เซิร์ฟเวอร์ใช้ |
  |---|---|---|
  | `price` | `product_price` | `product_price` |
  | `vat` | `product_price_exclude_vat` | `product_price_exclude_vat` |
  | `novat` | `product_price` | ⚠️ `product_price_include_vat` — **ไม่ตรงกับหน้าเว็บ** |

  **ราคาที่บันทึกจริงคือค่าที่แอปส่งมาใน `unit_price`** ไม่ใช่คอลัมน์ข้างบนโดยตรง คอลัมน์นี้ถูกใช้ 2 อย่าง:

  1. **ราคาที่เติมให้** เมื่อ**ไม่ได้ส่ง** `unit_price` มา
  2. **ฐานคำนวณราคาต่ำสุด** ที่ยอมรับ — ส่งราคาต่ำกว่านี้ = `422`
     (สินค้าที่ไม่ได้ตั้ง `min_price` → ราคาต่ำสุด = ราคาฐานของโหมดนั้นเลย)

  > ⚠️ **จุดที่ต้องระวังในโหมด `novat`**: หน้าเว็บกับเซิร์ฟเวอร์ใช้คอลัมน์คนละตัว
  > สินค้าที่ `product_price` ≠ `product_price_include_vat` (คือสินค้าที่ตั้งราคาแบบ "ยังไม่รวม VAT")
  > จะโดนเซิร์ฟเวอร์ตีกลับ `422` ว่าราคาต่ำกว่าที่ขายได้ ทั้งที่กรอกตามราคาที่หน้าจอเติมให้
  > สินค้าที่ตั้งราคาแบบ "รวม VAT แล้ว" สองคอลัมน์นี้เท่ากัน จึงไม่มีปัญหา — ดูข้อ 11

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `product_price` | ราคาที่พนักงานกรอกไว้ตอนตั้งสินค้า — "ราคาป้าย/ฐาน" |
  | `product_price_exclude_vat` | ราคาก่อน VAT |
  | `product_price_include_vat` | ราคารวม VAT แล้ว |
  | `product_vat_amount` | ส่วนต่างภาษีของราคานั้น = `include − exclude` (`0` = สินค้าตั้งไว้แบบไม่มีภาษี) |
  | `vat_7_percent` | 7% ของ `product_price` เฉย ๆ — **ค่าคำนวณสำเร็จรูปไว้โชว์** ไม่ใช่ตัวที่ใช้คิดยอดจริง |

  ### 4.2 ราคาขั้นต่ำ — กันเซลส์ขายต่ำกว่าที่กำหนด

  เซลส์แก้ราคาต่อหน่วยเองได้ **ขายแพงกว่าได้เสมอ แต่ต่ำกว่าขั้นต่ำไม่ได้** ถ้าต่ำกว่า เซิร์ฟเวอร์ตอบ `422` ที่คีย์ `quotation_lines.N.unit_price`

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `has_min_price` | `true` = สินค้านี้ตั้งราคาขั้นต่ำไว้ · `false` = **ไม่ได้ตั้ง → ห้ามขายต่ำกว่าราคาที่ตั้งไว้เลย** |
  | `min_price` | ราคาขั้นต่ำที่ตั้งไว้ที่ตัวสินค้า (`0` เมื่อไม่ได้ตั้ง) |
  | `min_unit_price` | **ราคาต่ำสุดที่ขายได้จริง** — มีขั้นต่ำก็ใช้ขั้นต่ำ ไม่มีก็ใช้ `product_price` เอาไปใส่ `min` ของช่องกรอกได้เลย |
  | `min_unit_price_exclude_vat` | ตัวเดียวกันแต่ฐานราคาก่อน VAT — ใช้คู่กับ `price_mode = vat` |

  > ไม่มี "เพดาน" ราคา — ขายสูงกว่าราคาที่ตั้งไว้เท่าไรก็ได้

  ### 4.3 `usd_price` — ราคาตั้งต้นสกุล USD

  ราคาขายสกุลดอลลาร์ที่ตั้งไว้รายหน่วยนับ **หน่วยเป็นดอลลาร์ ไม่ใช่เซนต์** และ **ปัดขึ้นเป็นดอลลาร์เต็มมาให้แล้ว** (`505.6` → `506`)

  - `null` = สินค้า/หน่วยนี้ไม่ได้ตั้งราคา USD ไว้ → ให้กรอกเป็นเงินบาทตามปกติ
  - เอาไปเติมช่อง "ราคาต่อหน่วย (USD)" แล้วส่งกลับเป็น `quotation_lines[].usd_price` ตอนบันทึก
  - ปัดขึ้นตั้งแต่ตรงนี้เพราะเซิร์ฟเวอร์ก็ปัดขึ้นตอนคิดเป็นเงินบาทอยู่ดี ตัวเลขบนหน้าจอจึงตรงกับยอดที่บันทึกจริงเสมอ

  ### 4.4 กติกาการกรอก "จำนวน" (4 ฟิลด์ท้าย)

  แนบมากับทุกแถวราคาเพื่อให้ตั้งค่า input ได้ตรง ๆ โดยไม่ต้องรู้กติกาเอง

  | ฟิลด์ | `EA` `BX` `SET` … (นับเป็นชิ้น) | `KG` `L` … (ชั่ง/ตวง) |
  |---|---|---|
  | `is_whole_number` | `true` | `false` |
  | `qty_step` | `1` | `0.01` |
  | `qty_min` | `1` | `0.01` |
  | `qty_decimals` | `0` | `2` |

  > ที่มา: ขายสินค้าหน่วย "ชิ้น" 3.14 ชิ้นไม่มีความหมายทางธุรกิจ — **เซิร์ฟเวอร์ตรวจซ้ำตอนบันทึก** ถ้าฝ่าฝืนจะได้ `422` ที่คีย์ `quotation_lines.N.qty`

  ---

  ---

  ## 4.5 `product_options` — ตัวเลือกสินค้า (ของเสริมที่บวกราคาเพิ่ม)

  สินค้า 1 ตัวมีได้**หลายหมวดหมู่** และหมวดหนึ่ง**ติ๊กได้หลายตัวเลือก** ราคาของทุกตัวที่ติ๊ก
  จะถูกบวกเข้ากับราคาต่อหน่วยของบรรทัดนั้น

  **สินค้าที่ไม่มีตัวเลือกจะไม่มีคีย์อยู่ในก้อนนี้เลย** (ไม่ใช่ `[]`) — เช็คด้วย
  `product_options[product_id]` แล้วซ่อนส่วนเลือกตัวเลือกไปถ้าไม่เจอ

  ```json
  "product_options": {
    "126": [
      {
        "id": 1,
        "name": "Through-Spindle Coolant",
        "options": [
          { "id": 2, "name": "TSC",       "price": 24733500, "usd": "7495.0000" },
          { "id": 3, "name": "TSC-READY", "price": 4933500,  "usd": "1495.0000" }
        ]
      },
      { "id": 2, "name": "Spindle", "options": [ ... ] }
    ]
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `id` (ระดับนอก) | id ของ**หมวดหมู่** — ใช้จัดกลุ่มบนหน้าจอเท่านั้น ไม่ต้องส่งกลับ |
  | `name` (ระดับนอก) | ชื่อหมวดหมู่ เช่น "สี", "ขนาด", "Spindle" |
  | `options[].id` | **id ที่ต้องส่งกลับใน `option_ids`** ตอนสร้าง/แก้ไขเอกสาร |
  | `options[].price` | ราคาที่บวกเพิ่ม หน่วยเป็น **สตางค์** (24733500 = ฿247,335.00) |
  | `options[].usd` | ราคาที่บวกเพิ่มสกุล USD (`null` = ตัวเลือกนี้ไม่ได้ตั้งราคา USD ไว้) |

  > ⚠️ `price` เป็น**สตางค์** ต่างจาก `product_price` ในก้อนราคาที่หารร้อยมาให้แล้ว
  > ต้องหาร 100 เองก่อนเอาไปแสดง

  ### วิธีคิดราคาต่อหน่วยเมื่อมีตัวเลือก

  ```
  ราคาต่อหน่วย = ราคาสินค้าตามหน่วยนับ + ผลรวมราคาของตัวเลือกที่ติ๊กไว้
  ```

  บริษัทที่ตั้งราคาเป็นดอลลาร์ให้บวกที่ฝั่ง **USD** แล้วปล่อยให้เซิร์ฟเวอร์คิดเป็นเงินบาทให้
  (ปัดขึ้นเป็นดอลลาร์เต็ม × อัตราที่ปัดขึ้นเป็นบาทเต็ม) ไม่ใช่บวกเงินบาทเอง ไม่งั้นยอดจะไม่ตรง
  กับที่เซิร์ฟเวอร์บันทึก

  ตอนส่งกลับให้ใส่ `option_ids` ไว้ในบรรทัดนั้น — ส่งแค่ **id** เท่านั้น
  ชื่อกับราคาเซิร์ฟเวอร์อ่านจากฐานข้อมูลเองแล้วเก็บเป็น**สำเนา**ติดไปกับบรรทัดเอกสาร
  เอกสารเก่าจึงอ่านได้เหมือนวันที่ออกเสมอแม้ภายหลังจะไปแก้ชื่อหรือราคาตัวเลือกที่หน้าสินค้า

  ```json
  "quotation_lines": [
    { "product_id": 126, "uom_code": "EA", "qty": 1, "unit_price": 4536510,
      "option_ids": [2, 6] }
  ]
  ```

  ## 5. `whole_number_uom_codes`

  ```json
  ["EA", "BX", "PK", "CT", "RL", "DZ", "SET", "PR", "PCS"]
  ```

  รายชื่อหน่วยที่ต้องกรอกจำนวนเป็นจำนวนเต็ม — เป็น **ตัวสำรอง** เผื่อแอปเจอหน่วยนับที่ไม่ได้มากับ `product_price` (เช่นดึงมาจากที่อื่น) ปกติใช้ `is_whole_number` ในแถวราคาสะดวกกว่า

  ต้องตรงกับ `UomRules::WHOLE_NUMBER_CODES` ฝั่งเซิร์ฟเวอร์เสมอ — หน่วยที่ผู้ใช้สร้างเองและไม่อยู่ในลิสต์นี้ ถือว่ากรอกทศนิยมได้

  ---

  ## 6. `pomotionLines` — ⚠️ ปกติไม่ต้องใช้

  ตาราง `promotion_lines` **ทั้งตารางแบบดิบ ไม่กรองอะไรเลย** — รวมโปรฯ ที่หมดอายุแล้วและที่ปิดใช้งานอยู่

  - ค่าตัวเลขยัง**ไม่แปลงหน่วย**: `discount_value` · `min_value` · `max_discount_value` ถูกเก็บแบบ **×100** (`500` = 5.00%, `100000` = 1,000.00 บาท) ส่วน `min_qty` ไม่ได้คูณ
  - ไม่มีวันเริ่ม/วันสิ้นสุดติดมาด้วย (อยู่ที่ `promotion_headers` ซึ่งไม่ได้ส่งมา) จึงบอกไม่ได้ว่าตัวไหนยังใช้ได้

  **ใช้ `products[].promotions` แทน** — กรองวันที่ + แปลงหน่วย + ใส่ label มาให้เรียบร้อยแล้ว

  > ชื่อ key สะกดว่า `pomotionLines` (ตก `r`) — เป็นชื่อจริงใน response **อย่าแก้ฝั่งแอปให้ถูก** จะพังทันที

  ---

  ## 7. `conditions` — เงื่อนไขท้ายเอกสาร

  ```json
  [{ "id": 1, "name": "การชำระเงิน", "detail": "ชำระภายใน 30 วันนับจากวันที่ส่งของ" }]
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `id` | ส่งกลับเป็นสมาชิกของ array `conditions[]` ตอนบันทึก |
  | `name` | หัวข้อเงื่อนไข (ใช้เป็น label ของ checkbox) |
  | `detail` | ข้อความเต็มที่จะไปขึ้นท้ายใบเสนอราคา |

  กรอง `is_delete = false` มาแล้ว · เลือกกี่ข้อก็ได้ · ไม่เลือกเลยก็ได้

  ---

  ## 8. `user` — ผู้ขายที่ล็อกอินอยู่

  ```json
  { "firstname": "สมชาย", "lastname": "ใจดี", "phone": "0812345678" }
  ```

  มีแค่ 3 ฟิลด์ สำหรับขึ้นหัวเอกสารช่อง "ผู้เสนอราคา" — **ไม่มี `id`** (ถ้าต้องการข้อมูลผู้ใช้เต็ม ๆ ใช้ `GET profileUser`)

  ---

  ## 9. `usd_pricing` / `usd_rate` — ราคาสกุล USD

  ```json
  {
    "usd_pricing": true,
    "usd_rate": {
      "rate": 33.2264,
      "rate_used": 34,
      "as_of": "2026-08-17",
      "last_updated": "2026-08-17",
      "fetched_at": "2026-08-18 09:00:00",
      "source": "bot",
      "display": "1 USD = ฿34.00"
    }
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `usd_pricing` | บริษัทนี้เปิดฟีเจอร์ราคา USD ไว้หรือไม่ — `false` = **ซ่อนช่อง USD ทั้งหมด** |
  | `usd_rate` | อัตราของวันนี้ · **`null` = ไม่มีอัตราให้ใช้** (ปิดฟีเจอร์ หรือดึงจาก ธปท. ไม่ได้) ต้องซ่อนช่อง USD เหมือนกัน |
  | `rate` | อัตราขายดิบตามที่ ธปท. ประกาศ — ไว้แสดงที่มาเท่านั้น |
  | `rate_used` | **อัตราที่ใช้คิดเงินจริง** ปัดขึ้นเป็นบาทเต็มแล้ว — แอปต้องใช้ตัวนี้เท่านั้น |
  | `as_of` | งวดของอัตราที่หยิบมาใช้ (ธปท. ไม่ประกาศวันหยุด ระบบย้อนหางวดล่าสุดที่มีค่า) |
  | `source` | `bot` = จาก ธปท. · `fallback` = อัตราสำรองใน `.env` |
  | `display` | ข้อความพร้อมแสดง `"1 USD = ฿34.00"` |

  **สูตรที่ต้องใช้ให้ตรงกับเซิร์ฟเวอร์** — ปัดขึ้นสองชั้น:

  ```
  ราคา USD ที่กรอก $42.50
    → ปัดขึ้นเป็นดอลลาร์เต็ม $43
    × rate_used ฿34
    = ฿1,462.00 ต่อหน่วย
  ```

  รายละเอียดเต็ม + เส้นสำหรับดึงอัตราแยกต่างหาก → [api-reference.md § 12 Exchange Rate](api-reference.md)

  ---

  ## 10. เอาไปประกอบร่างเป็นฟอร์มยังไง

  ```
  1. เปิดหน้าฟอร์ม        → GET quotation/preload  (ครั้งเดียว แล้ว cache)
  2. เลือกลูกค้า          → customers[].formatted_name   → เก็บ id ไว้เป็น customer_id
                            เติมที่อยู่/tax_id/เครดิต จากก้อนเดียวกันได้เลย
  3. เลือกโหมดภาษี        → price_mode = price | vat | novat
  4. เพิ่มบรรทัดสินค้า     → products[]                   → เก็บ id เป็น product_id
  5. เลือกหน่วยนับ        → products[].prices[]          → ได้ uom_code + uom_desc
                          (หรือ product_price[product_id][] ก็ได้ ข้อมูลชุดเดียวกัน)
  6. เติมราคาอัตโนมัติ     → หยิบคอลัมน์ตาม price_mode (ตารางข้อ 4.1)
                            usd_pricing = true และ usd_price ไม่ null → เติมช่อง USD แทน
  7. ตั้งค่าช่องจำนวน      → qty_step / qty_min / qty_decimals ของแถวราคานั้น
  8. ตั้งค่าช่องราคา       → min = min_unit_price (หรือ min_unit_price_exclude_vat เมื่อ price_mode=vat)
  9. แสดงส่วนลดโปรฯ       → promotions[] ที่ uom_code ตรงกับที่เลือก
  10. ติ๊กเงื่อนไข         → conditions[].id
  11. บันทึก              → POST quotation/create  (หรือ quotation/usd/create เมื่อขายเป็น USD)
  ```

  📄 **ขั้นที่ 11 อธิบายละเอียดอยู่ที่ [api-quotation-create.md](api-quotation-create.md)** — พารามิเตอร์ทั้งหมด วิธีที่เซิร์ฟเวอร์คิดยอดทีละขั้น และรูปแบบ response


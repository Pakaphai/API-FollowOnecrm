  ---

  ## 3. คำอธิบายฟิลด์ใน Response

  ### ระดับ Root
  | ตัวแปร | ชนิด | คำอธิบาย |
  |---|---|---|
  | `success` | boolean | สถานะการทำงานของ API (`true` = สำเร็จ) |
  | `date` | string | วันที่ที่ถูกนำมาใช้กรองโปรโมชัน (YYYY-MM-DD) |
  | `count` | integer | จำนวนรายการเงื่อนไขโปรโมชันทั้งหมดที่ active |
  | `promotions` | array | รวมรายการเงื่อนไขโปรโมชันทั้งหมดเป็น Array List |
  | `by_product` | object | แตกกลุ่มตาม `product_id` (Key คือ ID สินค้า) ใช้ค้นหาโปรโมชันระดับสินค้ารวดเร็วแบบ `O(1)` |
  | `by_product_type` | object | แตกกลุ่มตาม `product_type_id` (Key คือ ID หมวดหมู่) ใช้เมื่อสินค้านั้นไม่มีโปรฯ ระดับสินค้า |

  ### รายละเอียดฟิลด์ใน Object แต่ละรายการโปรโมชัน
  | ตัวแปร | ชนิด | คำอธิบาย |
  |---|---|---|
  | `promotion_id` | integer | รหัส Header ของโปรโมชัน (`promotion_headers.id`) |
  | `promotion_name` | string | ชื่อโปรโมชันหลัก |
  | `item_type` | string | ขอบเขตของโปรโมชัน: `"product"` (รายสินค้า) หรือ `"product_type"` (รายหมวดหมู่) |
  | `item_id` | integer | รหัส ID ตาม `item_type` (`product_id` หรือ `product_type_id`) |
  | `item_name` | string \| null | ชื่อของสินค้า หรือ ชื่อของหมวดหมู่ |
  | `uom_code` | string \| null | รหัสหน่วยนับที่กำหนดเงื่อนไขโปรโมชัน เช่น `"PCS"`, `"BOX"` (หากเป็น `null` หมายถึงใช้ได้กับทุกหน่วยนับ) |
  | `discount_type` | string | ประเภทส่วนลด: `"percent"` (ลดเป็น %) หรือ `"amount"` (ลดเป็นจำนวนเงิน) |
  | `discount_value` | float | มูลค่าส่วนลด (แปลงจากฐานข้อมูลเรียบร้อย เช่น 10.00) |
  | `min_qty` | float \| null | **เงื่อนไขจำนวนขั้นต่ำ**: ต้องสั่งซื้อสินค้านี้อย่างน้อยกี่ชิ้นจึงจะได้โปรฯ (หากไม่มีกำหนดเป็น `null`) |
  | `min_value` | float \| null | **เงื่อนไขยอดเงินขั้นต่ำ**: ยอดซื้อสินค้านี้ (บาท) ก่อนลด ต้องถึงเท่าใดจึงจะได้โปรฯ (หากไม่มีกำหนดเป็น `null`) |
  | `max_discount_value` | float \| null | **เพดานส่วนลดสูงสุด**: ส่วนลดที่ได้รับจะต้องไม่เกินกี่บาท (มักใช้คุมส่วนลดแบบ `percent`) |
  | `start_date` | string | วันที่เริ่มต้นโปรโมชัน (YYYY-MM-DD) |
  | `end_date` | string | วันที่สิ้นสุดโปรโมชัน (YYYY-MM-DD) |

  ---

  ## 4. ตรรกะการคำนวณและนำไปใช้งานฝั่ง Mobile App / Frontend

  เมื่อผู้ใช้เพิ่มสินค้าในใบเสนอราคาหรือใบสั่งขาย:
  1. **ค้นหาโปรโมชันที่ตรงกัน (Priority):**
     - ตรวจสอบใน `by_product[product_id]` ก่อน: หาตัวที่ `uom_code` ตรงกับหน่วยที่เลือก (หรือตัวที่ `uom_code == null`)
     - หากไม่มีในระดับสินค้า ให้ค้นหาใน `by_product_type[product_type_id]` ของหมวดหมู่นั้น
  2. **ตรวจสอบเงื่อนไขความถูกต้อง (Qualification):**
     - `qty >= min_qty` (ถ้ามี `min_qty`)
     - `(qty * unit_price) >= min_value` (ถ้ามี `min_value`)
  3. **คำนวณมูลค่าส่วนลด (Discount Calculation):**
     - **แบบ Amount:** ส่วนลด = `discount_value`
     - **แบบ Percent:** ส่วนลด = `(ยอดก่อนลด * discount_value) / 100`
       - หากมี `max_discount_value` และยอดส่วนลดที่คำนวณได้เกินเพดาน ให้ตัดเหลือเท่ากับ `max_discount_value`
  4. **เปรียบเทียบโปรที่ดีที่สุด:**
     - หากมีหลายโปรโมชันที่ผ่านเงื่อนไข ระบบจะเลือกโปรโมชันที่ให้ส่วนลดสูงสุด (`bestDiscountAmount`)

docs: |
  # API — รายการโปรโมชันที่กำลังใช้งานทั้งหมด (Preload Active Promotions)

  ดึงโปรโมชันที่เปิดใช้งาน (`is_active = 1`) และอยู่ในช่วงวันที่ที่กำหนดทั้งหมด (`start_date <= date <= end_date`) มาให้แอปเก็บเป็น Cache สำหรับคำนวณส่วนลดแบบออฟไลน์ หรือแสดงป้ายโปรโมชันในรายการสินค้า/ใบเสนอราคา โดยไม่ต้องยิงเช็คทีละรายการสินค้า

  ```
  GET /api/v1/promotion/active?date=YYYY-MM-DD
  Authorization: Bearer <token>
  Accept: application/json
  ```

  | | |
  |---|---|
  | Route | `routes/api/api_v1.php` — อยู่ในกลุ่ม `auth_api` |
  | Controller | `App\Http\Controllers\Api\ApiPromotionController::activePromotions()` |
  | สิทธิ์เข้าถึง | 🔒 ต้องมี JWT Token |

  ---

  ## 1. Query Parameters

  | ฟิลด์ | บังคับ | ชนิด | ค่าเริ่มต้น | คำอธิบาย |
  |---|:---:|---|---|---|
  | `date` | | date (YYYY-MM-DD) | วันนี้ (Current Server Date) | วันที่ใช้ตรวจสอบสถานะโปรโมชัน (`start_date <= date <= end_date`) |

  ---


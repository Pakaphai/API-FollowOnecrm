    ## 13. Sales Document Setting 🔒

    ค่าตั้งระดับ **บริษัท** ที่บอกว่าหน้าสร้างเอกสารต้องแสดงปุ่มอะไร และให้กรอกด้วยวิธีไหนได้บ้าง
    ค่าชุดเดียวกับหน้าเว็บ "ตั้งค่าระบบ → ตั้งค่าเอกสารขาย" (เก็บใน `data` JSON ของ tenant)

    ### `GET sales-document-setting`

    ไม่รับพารามิเตอร์ · อ่านได้ทุกคนที่ล็อกอิน

    ```json
    { "success": true,
      "data": {
        "document_actions": { "pending": true, "order": false },
        "allowed_statuses": ["open"],
        "default_status": "open",
        "is_order_only": false,
        "document_label": "ใบเสนอราคา",
        "input_modes": { "lines": true, "image": false },
        "display": { "actions_summary": "...", "modes_summary": "..." }
      } }
    ```

    | ฟิลด์ | ใช้ทำอะไร |
    |---|---|
    | `document_actions` | `pending` = แสดงปุ่ม "รออนุมัติ" · `order` = แสดงปุ่ม "ส่งออเดอร์" |
    | `allowed_statuses` | ค่าที่ส่งไปกับ `quotation/create` ได้ (`open` / `confirmed`) |
    | `document_label` | คำที่ใช้เรียกเอกสาร — `"ใบเสนอราคา"` หรือ `"ออเดอร์"` |
    | `input_modes` | `lines` = แสดงตารางสินค้า · `image` = แสดงช่องแนบรูป |

    ### `POST sales-document-setting`

    **เฉพาะแอดมิน** (`level` 0/1) ไม่ใช่แอดมิน → `403` `code: forbidden`

    | ฟิลด์ | หมายเหตุ |
    |---|---|
    | `allow_pending` · `allow_direct_order` | ปุ่มบันทึก — ต้องเปิดอย่างน้อย 1 |
    | `allow_lines` · `allow_image` | วิธีกรอก — ต้องเปิดอย่างน้อย 1 |

    ⚠️ **ไม่ส่งช่องไหนมา = คงค่าเดิม** ไม่ใช่ปิดทิ้ง · ปิดทั้งคู่ในกลุ่มเดียวกัน → `422`

    ### เซิร์ฟเวอร์บังคับค่านี้ตอนบันทึกเอกสาร

    | กรณี | ผลลัพธ์ |
    |---|---|
    | ส่ง `quotation_lines` แต่ปิด `lines` ไว้ | `422` `code: quotation_lines_disabled` |
    | แนบ `quotation_image` แต่ปิด `image` ไว้ | `422` `code: quotation_image_disabled` |
    | ส่ง `status` นอก `allowed_statuses` | **แปลงให้เงียบ ๆ** ไม่ตีกลับ |

    📄 **อธิบายทุกฟิลด์ + เหตุผลของแต่ละพฤติกรรม → [api-sales-document-setting.md](api-sales-document-setting.md)**


    ## 3. Notifications 🔒

    | Path | Response |
    |---|---|
    | `GET notifications` | `{status:"success", data: <paginator 20/หน้า>}` |
    | `GET notifications/unread-count` | `{status:"success", data:{unread_count}}` |
    | `POST notifications/{id}/read` | `{status:"success", message}` · ไม่พบ = **404** |
    | `POST notifications/read-all` | `{status:"success", message}` |

    ใช้ Laravel notifications มาตรฐาน (`user->notifications()`) — `{id}` เป็น **UUID** ไม่ใช่ integer


    ## 9. Quotation 🔒

    ### `GET quotation/preload`
    → `{customers, products, user, product_price, pomotionLines, conditions, ...}` + รายการหน่วยนับที่ต้องกรอกจำนวนเป็นจำนวนเต็ม (ต้องตรงกับ `UomRules::WHOLE_NUMBER_CODES` — server ตรวจซ้ำตอนบันทึก)

    > ราคาแยกตามหน่วยนับถูกฝังไว้ใน `products[].prices` แล้ว (แถวเดียวกับ `product_price[id]`) ส่วน `product_price` ระดับบนสุดยังส่งเหมือนเดิม

    📄 **อธิบายทุกฟิลด์แบบละเอียด → [api-quotation-preload.md](api-quotation-preload.md)**

    > key สะกดว่า `pomotionLines` (ตก r) — เป็นชื่อจริงใน response อย่าแก้ฝั่งแอปให้ถูก

    ฟิลด์ที่เกี่ยวกับราคาสกุล USD:

    | key | ความหมาย |
    |---|---|
    | `usd_pricing` | บริษัทนี้เปิดฟีเจอร์ราคา USD ไว้หรือไม่ — `false` = ซ่อนช่อง USD ทั้งหมด |
    | `usd_rate` | อัตราปัจจุบัน `{rate, rate_used, as_of, source, display}` (`null` = ไม่มีอัตราให้ใช้) |
    | `product_price[].usd_price` | ราคาขายสกุล USD ที่ตั้งไว้รายหน่วยนับ (ดอลลาร์ **ไม่ใช่สตางค์**) — **ปัดขึ้นเป็นดอลลาร์เต็มมาแล้ว** `505.6` → `506` · `null` = สินค้าตัวนี้ไม่ได้ตั้งราคา USD |

    ### `POST quotation/create` · `multipart/form-data`

    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `customer_id` | ✅ | ต้องมีจริง |
    | `quotation_date` | ✅ | date + `DocumentDate` (ห้ามย้อน/ล่วงหน้าเกินกำหนด) |
    | `quotation_lines` | | array ≥1 |
    | `quotation_lines.*.product_id` | ✅ | ต้องมีจริง (บังคับเมื่อมีบรรทัดนั้น) |
    | `quotation_lines.*.qty` | ✅ | ≥1 |
    | `quotation_lines.*.unit_price` | | ≥0 |
    | `quotation_lines.*.usd_price` | | ≥0 — ราคาต่อหน่วยสกุล USD **ส่งมาแล้วจะใช้แทน `unit_price` ของบรรทัดนั้น** |
    | `quotation_lines.*.manual_discount` | | ≥0 |
    | `quotation_lines.*.discount_type` | | `amount` · `percent` |
    | `quotation_lines.*.uom_code` | ✅ | ≤3 + ต้องมีใน `uoms` |
    | `status` | | `open` (ค่าเริ่มต้น) · `confirmed` — ค่าอื่นได้ 422 |
    | `header_discount` · `vat_amount` · `additional_amount` · `total_after_discount` | | ≥0 (**ห้ามติดลบ**) |
    | `quotation_image` | | image ≤5MB |
    | `conditions` | | array ของ condition id |
    | `note` · `price_mode` | | string |

    ยอดเงินรับค่าที่มีคอมมาได้ (`normalizeMoneyInputs`) · server ตรวจราคาซ้ำอีกชั้น ผิดคืน 422 พร้อม `errors`

    📄 **อธิบายทุกพารามิเตอร์ + วิธีคิดยอดทีละขั้น → [api-quotation-create.md](api-quotation-create.md)**

    → `{success, message, data:{quotation:{id, quotation_number, quotation_date, status, ..., quotationLines:[...]}}}`

    data ยังมี `usd_rate` (อัตราที่ใบนี้ยึดไว้) · `quotation.total_after_discount_usd` · `quotationLines[].usd_price` + `.total_line_usd`

    > รายการสินค้าส่งมา **2 ที่ ชุดเดียวกันเป๊ะ** — `data.quotation.quotationLines` (ใช้ตัวนี้) และ `data.quotationLines` ตำแหน่งเดิมที่ยังส่งเหมือนเดิม

    ### `POST quotation/usd/create` · `multipart/form-data`

    ใบเสนอราคาที่ **ตั้งราคาเป็นสกุล USD** — พารามิเตอร์และ response เหมือน `quotation/create` ทุกอย่าง
    ต่างกันแค่ **บังคับให้ทุกบรรทัดต้องมี `usd_price`** และตีกลับทันทีถ้าใช้ราคา USD ไม่ได้

    ทิศทางการคำนวณ — **USD เป็นตัวตั้ง แล้วแปลงกลับเป็นบาท**:

    ```
    $42.50  → ปัดขึ้นเป็นดอลลาร์เต็ม $43
            × อัตราขาย ธปท. ที่ปัดขึ้นเป็นบาทเต็ม ฿34 (จาก 33.2264)
            = ฿1,462.00 ต่อหน่วย   ← ค่านี้คือ unit_price ที่ถูกบันทึกลงฐานข้อมูล
    ```

    - **ราคาขั้นต่ำเงินบาทของสินค้าไม่ถูกนำมาบีบ** บรรทัดที่ขายเป็น USD (ยึดตัวเลขที่เสนอลูกค้าเป็นหลัก) — ต่างจาก `quotation/create` ที่บรรทัดราคาบาทยังโดนบีบตามปกติ
    - ส่วนลด / โปรโมชัน / VAT / ส่วนลดท้ายบิล คิดต่อจากราคาบาทที่แปลงแล้ว เหมือนใบปกติทุกประการ
    - อัตราที่ใช้ถูก **ยึดไว้กับตัวเอกสาร** (`quotation_headers.usd_rate_used`) + บันทึกลง `usd_rate_logs` เปิดใบเดิมวันหลังจึงได้ตัวเลขชุดเดิมเสมอ ต่อให้อัตราวันนี้เปลี่ยนไปแล้ว

    | HTTP | เงื่อนไข |
    |:---:|---|
    | `422` | บรรทัดไหนไม่มี `usd_price` → `errors["quotation_lines.N.usd_price"]` |
    | `422` | บริษัทไม่ได้เปิดฟีเจอร์ → `{code: "usd_pricing_disabled"}` |
    | `422` | ดึงอัตราจาก ธปท. ไม่ได้ → `{code: "usd_rate_unavailable"}` |
    | `201` | เหมือน `quotation/create` |

    > ส่ง `usd_price` ไปที่ `quotation/create` ตรง ๆ ก็ได้ผลเหมือนกัน — เส้นนี้ต่างตรงที่บังคับให้ครบทุกบรรทัด
    > จึงไม่มีทางได้ใบที่ตั้งใจให้เป็น USD แต่บางบรรทัดกลับไปคิดเป็นราคาบาทของสินค้าแทน

    ### `POST quotation/update/{id}`
    เหมือน create แต่ **`quotation_lines` บังคับ** (`required|array|min:1`) — รับ `usd_price` รายบรรทัดเหมือนกัน และบันทึกอัตราใหม่ทับพร้อมเพิ่มแถวใน `usd_rate_logs`

    ⚠️ **ไม่รองรับ partial update** — `quotation_lines` คือรายการทั้งหมดหลังแก้ **บรรทัดที่ไม่ได้ส่งมาจะถูกลบ** (`is_delete = true`)
    เอกสารที่ยืนยัน/ยกเลิกแล้วแก้ไม่ได้ → `403` · สำเร็จแล้วสถานะกลับเป็น `open` เสมอ

    📄 **อธิบายทุกพารามิเตอร์ + กติกาการลบบรรทัด → [api-quotation-update.md](api-quotation-update.md)**

    ### `GET quotation/edit/{id}`
    ข้อมูลสำหรับฟอร์มแก้ไข — `quotation_headers` มี `usd_rate` (**อัตราของใบนี้** ไม่ใช่อัตราวันนี้), `usd_rate_from_document` (`false` = ใบเก่าที่ไม่ได้บันทึกอัตราไว้ ระบบยืมอัตราปัจจุบันมาแสดง) และแต่ละบรรทัดมี `usd_price` ถอดกลับมาให้แล้ว — ส่งค่านี้กลับไปที่ `quotation/update/{id}` ได้ตรง ๆ

    > `usd_price` รายบรรทัด**ถอดกลับมาให้เฉพาะใบที่บันทึกอัตราไว้กับตัวเอง** (`usd_rate_from_document: true`)
    > ใบเก่าที่ยืมอัตราปัจจุบันมาแสดงจะได้ `null` เพราะถ้าถอดเป็น USD แล้วส่งกลับมาบันทึก
    > ราคาจะถูกปัดขึ้นจนเพี้ยนไปจากราคาบาทเดิม (ฐานข้อมูลเก็บราคาเป็นบาท ไม่ได้เก็บ USD รายบรรทัด)

    ### `GET quotation/list`
    ใบเสนอราคาของลูกค้าที่ตัวเองรับผิดชอบ — จัดกลุ่ม header แล้วซ้อน lines + conditions เข้าไปข้างใน

    **แบ่งหน้า** (`page`, `per_page`) — นับเป็น "ใบ" ไม่ใช่ "บรรทัดสินค้า" ใบหนึ่งจะไม่ถูกตัดครึ่งคาหน้า
    เรียงจากใบใหม่ไปเก่า (`id` มากไปน้อย)

    ```json
    { "status": "success", "quotation_headers": [...],
      "page": 1, "size": 20, "total_elements": 13, "total_pages": 1,
      "has_next": false, "has_prev": false }
    ```

    แต่ละใบมี `total_after_discount_usd` (ยอดสุทธิเทียบ USD สำหรับแสดง `≈ $43.00` ใต้ยอดเงินบาท) + `usd_rate_used` + `usd_rate_from_document`

    ### `POST quotation/with-images/create` · `.../update/{id}`
    สำหรับใบเสนอราคาที่ **แนบรูปแทนการคีย์รายการสินค้า**

    | ฟิลด์ | บังคับ |
    |---|:---:|
    | `customer_id` | ✅ |
    | `quotation_date` | ✅ |
    | `quotation_image` | (image ≤5MB) |
    | `additional_amount` | ≥0 |
    | `note` | |

    ### `POST quotation/{id}/status/confirmed` · `.../cancelled`

    เปลี่ยนสถานะใบเสนอราคา **และใบสั่งขายที่ผูกกันไปพร้อมกัน**

    - `confirmed` → quotation + order = `confirmed`
    - `cancelled` → quotation + order = `cancelled` และ **ตั้ง `is_delete` ให้ทุกบรรทัดสินค้า**

    | HTTP | เงื่อนไข |
    |:---:|---|
    | `409` | สถานะปัจจุบันอยู่ใน `IRREVERSIBLE_STATUSES` (ปิดการขาย/ยกเลิกแล้ว) → `{success:false, final_status, message}` |
    | `200` | `{message}` |


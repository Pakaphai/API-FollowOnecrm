    ## 10. Order 🔒

    ### `GET order/list`
    → `{status:"success", orders:[...], page, size, total_elements, total_pages, has_next, has_prev}` · token ไม่ผ่าน = 401

    **แบ่งหน้า** (`page`, `per_page`) — นับเป็น "ใบ" ไม่ใช่ "บรรทัดสินค้า" · เรียงจากใบใหม่ไปเก่า

    > 🔻 **Breaking (2026-09-11)** — `order_number` เปลี่ยนมาคืน **เลข QT** ของใบเสนอราคาต้นทาง
    > ให้ตรงกับตารางเอกสารขายฝั่งเว็บ · ใบเก่าที่ไม่มีต้นทางยังคืนเลข PO เหมือนเดิม
    > แอปที่ต้องใช้เลข PO จริงให้ย้ายไปอ่าน `sale_order_number` ที่เพิ่มเข้ามาใหม่

    แต่ละใบมี `order_number` (เลขที่หลักสำหรับแสดง — เลข QT ก่อน ไม่มีจึงตกไปใช้เลข PO) · **`sale_order_number`** (เลข PO จริงของใบสั่งขาย) · **`quotation_number`** (เลข QT ของใบเสนอราคาต้นทาง · `null` = ใบเก่าที่ไม่มีต้นทาง) · **`invoice_number`** (เลขที่ใบกำกับภาษี กรอกตอนอนุมัติผ่านขั้น "เปิดบิล") · `status_en` (คีย์อังกฤษ) + `status` (ป้ายไทยชุดเดียวกับฝั่งเว็บ)

    ไฟล์ที่แอดมินแนบตอนเลื่อนสถานะ: **`invoice_attachment_url`** (ไฟล์ใบกำกับภาษี ขั้นเปิดบิล) · **`receipt_url`** (ไฟล์ใบเสร็จ ขั้นตรวจสอบการชำระเงิน · ค่าเดียวกับ `receipt`) — ลิงก์ S3 อายุ 10 นาที · `null` = ไม่ได้แนบ · ค้นหาด้วย `q` ได้ด้วย `invoice_number`

    **`documents`** (เพิ่ม 2026-09-17 · มีใน `order/list`, `order/edit-api` (ใน `quotation_header`), `billing/list`, `order/details`) — เอกสารแนบชุดเดียวกับส่วน "เอกสารแนบ" ในแผงรายละเอียดฝั่งเว็บ

    ```json
    "documents": {
      "invoice": { "number": "IV-2569-0123", "url": "https://…", "type": "pdf" },
      "receipt": { "url": "https://…", "type": "pdf" },
      "slips": [ { "id": 12, "url": "https://…", "type": "jpg", "amount": 1500.00, "uploaded_at": "2026-09-17 10:21:00" } ]
    }
    ```

    `url` = ลิงก์ S3 อายุ 10 นาที (`null` = ไม่ได้แนบ) · `type` = นามสกุลไฟล์ ใช้เลือกแสดงเป็นรูปหรือ PDF · `amount` เป็นบาท

    > 🔻 **Breaking (2026-09-17)** — ถอด `sales_document_no` / `sales_document_url` (เอกสารการขาย) ออกจาก `order/list`, `order/edit-api`, `billing/list` และ `order/details` แล้ว
    > ใช้ไฟล์ใบเสร็จ `receipt_url` แทน · ค้นหาด้วยเลขที่เอกสารการขายไม่ได้แล้ว

    ข้อมูลลูกค้าแนบมาด้วย: `customer_name` · **`contact_name`** (ชื่อผู้ติดต่อ) · **`customer_code`** (รหัสลูกค้า) · `customer_phone` · `tax_id` · ที่อยู่พร้อมชื่อตำบล/อำเภอ/จังหวัด · สองคีย์ที่ทำตัวหนาเคยคืน `null` ตลอดเพราะไม่ได้ถูก select มา แก้แล้ว (2026-09-11)

    **ยอดในกล่องสรุป** (เพิ่ม 2026-09-23 · มีทั้งใน `order/list` และ `quotation/list`) — เดิมแอปต้องคำนวณเองจาก `total_before_discount` กับ `header_discount` ตอนนี้ส่งมาให้ครบ ตรงกับกล่องสรุปฝั่งเว็บบรรทัดต่อบรรทัด

    | ฟิลด์ | บรรทัดบนเว็บ |
    |---|---|
    | `total_after_bill_discount` | ยอดรวมหลังหักส่วนลด (= `total_before_discount - header_discount`) |
    | `total_before_vat` | มูลค่าก่อนภาษี (ฐานภาษีของใบนี้) |
    | `vat_rate` | `7` · `0` เมื่อใบนี้ไม่คิดภาษี |
    | `price_mode` / `price_mode_label` | รูปแบบราคา + ป้ายไทย เช่น "ราคาแยกภาษีมูลค่าเพิ่ม 7% (Exclude)" |

    ⚠️ `total_before_vat` **ไม่ใช่** `total_after_bill_discount - vat_amount` เสมอไป — โหมด `vat` (รวมภาษี) เท่านั้นที่ถอดภาษีแฝงออก ส่วน `novat` (**แยกภาษี** ไม่ใช่ไม่มีภาษี) และ `price` (ไม่มีภาษี) ใช้ยอดหลังหักส่วนลดเป็นฐานตรง ๆ · เว็บซ่อนบรรทัด "มูลค่าก่อนภาษี" เมื่อไม่ใช่โหมด `vat`

    ```json
    "price_mode": "novat", "total_before_discount": 900.00, "header_discount": 90.00,
    "total_after_bill_discount": 810.00, "total_before_vat": 810.00,
    "vat_amount": 56.70, "vat_rate": 7, "total_after_discount": 866.70
    ```

    **ใบลดหนี้ · ยอดที่ต้องชำระ · วันครบกำหนด** (เพิ่ม 2026-09-23) — ชุดเดียวกับตารางเอกสารขายฝั่งเว็บ

    | ฟิลด์ | ความหมาย |
    |---|---|
    | `credit_note_numbers` | เลขที่ใบลดหนี้ (`SR-xxxxxx-xxxx`) · `[]` = ไม่มี |
    | `credit_note_total` | ยอดใบลดหนี้ที่อนุมัติแล้ว (บาท) |
    | `payable_amount` | ยอดที่ต้องชำระจริงหลังหักใบลดหนี้ · `null` = ไม่มีใบลดหนี้ ใช้ `total_after_discount` ได้เลย |
    | `due` | วันครบกำหนดชำระ — `{credit_days, due_date, text, days_remaining, days_overdue, is_overdue, level}` · `text: ""` = ไม่ต้องแสดง |
    | `status_color` | สี hex ของ badge ชุดเดียวกับเว็บ (`OrderModel::STATUS_COLORS`) |
    | `payment_status` | `unpaid` · `partial_paid` · `paid` |
    | `delivery_date` | วันส่งของ · `null` = ยังไม่ส่ง |
    | `reject_reason` | เหตุผลที่คลังแจ้งว่าสินค้าไม่เพียงพอ · `null` = ไม่ได้ถูกตีกลับ |

    `due` มีค่าเฉพาะใบที่ให้เครดิตไว้ + ยังไม่ชำระ + อยู่ขั้น `shipped` นับจากวันส่งของ (ไม่มีจึงใช้วันที่เอกสาร แล้วจึงวันที่สร้าง) — ตัวคำนวณตัวเดียวกับเว็บ (`OrderModel::creditDueInfo`) · `level` = `danger` (เลยกำหนด/ครบวันนี้) · `warning` (เหลือไม่เกิน 30% ของวันเครดิต) · `success`

    ### `GET order/edit-api/{id}`
    → `{success, message, data:{quotation_header:{..., quotation_lines:[...]}}, products, customers, conditions, order_conditions, user, usd_pricing, usd_rate}`

    ทั้งใบอยู่ใน `data.quotation_header` — รายการสินค้าอยู่ที่ `.quotation_lines` ในก้อนนั้น (ชื่อ key หลอก ทั้งคู่ เนื้อในคือใบสั่งขาย)
    ยอดเงินในเส้นนี้เป็น **บาท** ยกเว้น `vat_amount` ที่เป็นสตางค์ · ราคาสินค้าอยู่ใน `products[].prices`

    > 🔻 **Breaking (2026-08-19)** — คีย์หัวเอกสารแบบแบนที่ `data.*` · `data.quotation_lines` · `product_price` ระดับบนสุด **ย้าย/ถอดออกแล้ว**
    ไม่พบเอกสาร → `200` + `data: null` (ไม่ใช่ `404`)

    📄 **อธิบายทุกฟิลด์ + เรื่องอัตรา USD → [api-order-edit.md](api-order-edit.md)**

    ### `POST order/update-api/{id}` · `multipart/form-data`

    **เช็คสถานะก่อน** — ใบสั่งขายที่ไม่อยู่ในสถานะที่บทบาทของผู้เรียกแก้ได้ = **403**
    ฝ่ายขายแก้ได้เฉพาะ `open` · แอดมินแก้ได้ถึง `shipped` (ตรวจสอบการชำระเงิน) — ดู `App\Support\DocumentEditPolicy`

    แก้รูป (`quotation_image`) กับรายการสินค้า (`order_lines[]` — ส่งชื่อ `quotation_lines` มาก็ได้) พร้อมกันในคำขอเดียวได้ · รายการสินค้า = **แทนที่ทั้งชุด** สินค้าที่ไม่ได้ส่งมาถูกลบออกจากใบ · ไม่ส่งมาเลย = แตะแค่รูป ไม่ยุ่งกับสินค้าเดิม

    → `{success, message, data:{quotation_header:{..., quotation_lines:[...]}}}` — เอกสารทั้งใบหลังบันทึก รูปแบบเดียวกับ `order/edit-api`

    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `customer_id` | ✅ | ต้องมีจริง |
    | `order_date` | ✅ | date |
    | `order_lines` | ✅* | array ≥1 — *เป็น `nullable` ถ้าเป็นใบสั่งขายแบบแนบรูป |
    | `order_lines.*.product_id` | ✅ | ต้องมีจริง |
    | `order_lines.*.qty` | ✅ | ≥1 |
    | `order_lines.*.uom_code` | ✅ | ต้องมีใน `uoms` |
    | `order_lines.*.usd_price` | | ≥0 — ราคาต่อหน่วยสกุล USD **ส่งมาแล้วใช้แทนราคาบาทของสินค้า** |
    | `order_lines.*.manual_discount` | | ≥0 |
    | `order_lines.*.discount_type` | | `amount` · `percent` |
    | `quotation_id` | | ต้องมีจริง |
    | `header_discount` | | ≥0 |
    | `header_discount_type` | | `amount` (ค่าเริ่มต้น) · `percent` = `header_discount` เป็นเปอร์เซ็นต์ 0–100 |
    | `price_mode` | | `price` · `vat` · `novat` |
    | `reduction` | | ≥0 และ **≤ ยอดรวมของใบนั้น** |
    | `reduction_pdf` | | jpg,jpeg,png,pdf ≤5MB |
    | `quotation_image` | | jpeg,png,jpg,gif,webp,**pdf** ≤5MB |
    | `conditions` | | array ของ condition id |

    → `{message: "แก้ไขข้อมูลสำเร็จ", usd_rate, total_after_discount, total_after_discount_usd}`

    ⚠️ เส้นนี้ **ไม่อ่าน `unit_price` ที่ส่งมา** — คิดราคาจากคอลัมน์ราคาของสินค้าใหม่ทุกครั้ง
    ใบที่ขายเป็น USD ต้องส่ง `usd_price` กลับมาด้วย ไม่งั้นราคาเด้งกลับเป็นราคาบาทของสินค้า (ดู [api-order-edit.md](api-order-edit.md))

    ### `POST order/uploade/slip/{id}` · `multipart/form-data`

    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `path` | ✅ | **array ของไฟล์** jpg/jpeg/png ≤5MB ต่อไฟล์ |
    | `slip_amount` | | ≥0 |

    ยอดในสลิปเกินยอดคงเหลือ = **422** พร้อม `{remaining, input_amount}` ให้แอปแสดงได้เลย → สำเร็จ `{message}`

    > ชื่อเส้นสะกดว่า `uploade` (เกิน e) — เป็น path จริง

    ### `GET billing/list`
    → `{order_dispatch, total_unpaid, total_paid, page, size, total_elements, total_pages, has_next, has_prev}`

    **แบ่งหน้า** (`page`, `per_page`) เฉพาะ `order_dispatch` — ส่วน `total_unpaid` / `total_paid` เป็นยอดรวม
    ของ **ทุกรายการ** ไม่ใช่เฉพาะหน้าที่ขอมา จึงไม่เปลี่ยนตามขนาดหน้า

    แต่ละรายการมี `quotation_number` (เลขที่ใบเสนอราคาต้นทาง) และ `invoice_number` (เลขที่ใบกำกับภาษี) เพิ่มมาจากเลขใบสั่งขาย
    พร้อม `invoice_attachment_url` (ไฟล์ใบกำกับภาษี) / `receipt_url` (ไฟล์ใบเสร็จ) — ลิงก์ไฟล์ S3 อายุ 10 นาที · `null` = ไม่ได้แนบ · และ `documents` (เอกสารแนบทั้งชุด)

    ### `GET api/order/details/{id}`
    คืน **object ดิบ** ไม่มี wrapper — แต่ละบรรทัดใน `order_lines[]` มี `options_list[]`

    มี `invoice_number` มากับข้อมูลใบ และ `invoice_attachment_url` (ไฟล์ใบกำกับภาษี) / `receipt_url` (ไฟล์ใบเสร็จ) — ลิงก์ไฟล์ S3 · `null` = ไม่ได้แนบ · และ `documents` (เอกสารแนบทั้งชุด)
    **`seller_name`** = ชื่อพนักงานขายเจ้าของเอกสาร (`orders.user_id` → `created_by` → เซลส์ผู้ดูแลลูกค้า · ไม่มีชื่อ-นามสกุลใช้ชื่อผู้ใช้แทน)
    (ตัวเลือกที่ลูกค้าเลือกไว้ · `id` `group` `name` `price` เป็น**สตางค์** `usd`)

    เส้นนี้เป็นเส้นแสดงผล `unit_price` จึงเป็นราคา**รวมตัวเลือก**ตามที่เก็บในฐานข้อมูล
    ราคาสินค้าล้วนอยู่ที่ `base_unit_price` (สตางค์) ไม่ต้องไปลบเอง


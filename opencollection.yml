    ## ตารางสรุปทุกเส้น

    🔒 = ต้องแนบ JWT (อยู่ในกลุ่ม `auth_api`)

    ### 1. Auth & Session — 7 เส้น

    | | Method | Path | ใช้ทำอะไร |
    |:---:|---|---|---|
    | | `POST` | `proxy/auth/login` | proxy login ไป BukkhonID ตรง ๆ (ใช้ฝั่งเว็บ) |
    | | `GET` | `verify-company-code/{code}` | ตรวจ company code → คืน base URL ของบริษัท |
    | | `POST` | `login` | เข้าสู่ระบบด้วย username/password |
    | | `POST` | `login/google` | เข้าสู่ระบบด้วย Google (BukkhonID) |
    | | `GET` | `refresh` | ต่ออายุ token |
    | 🔒 | `GET` | `logout` | ออกจากระบบ + เคลียร์ fcm_token |
    | 🔒 | `POST` | `update-password` | เปลี่ยนรหัสผ่าน |
    | 🔒 | `POST` | `connect/google` | เชื่อม/ยกเลิกการเชื่อมบัญชี Google |


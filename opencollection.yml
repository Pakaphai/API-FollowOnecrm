    ## 2. User & Profile

    ### `GET profileUser` 🔒
    โปรไฟล์ตัวเอง — join จังหวัด/อำเภอ/ตำบล/ตำแหน่ง/แผนก

    ```json
    { "status": "success", "data": {...}, "orderCount": 12,
      "totalsByUserOrder": { "4": "45000.00", "7": "38200.50" } }
    ```

    > ⚠️ `totalsByUserOrder` เส้นนี้เป็น **object map ยอดขายของพนักงานทุกคน** ไม่ใช่ของตัวเอง — ต่างจาก `profilelist/{id}` ที่เป็น string ตัวเดียว
    > `profile_img_url` ใช้ `$disk->url()` (**URL ถาวร ไม่ใช่ presigned**) ต่างจาก `/login` ที่ใช้ presigned 10 นาที — ถ้า bucket เป็น private URL นี้จะเปิดไม่ได้
    > รายละเอียดทั้งหมด: [api-user-profile.md](api-user-profile.md)

    ### `POST user/update/{id}` 🔒 · `multipart/form-data`

    | ฟิลด์ | กติกา |
    |---|---|
    | `profile_img` | `image` · jpeg,png,jpg · ≤ 2MB |
    | `email` | `email` · ≤255 · **unique** (ยกเว้นตัวเอง) |
    | `tax_id` | ≤255 · ขีดกลางถูกตัดออกอัตโนมัติ |
    | `position_id` | integer |
    | `address` / `subdistrict` / `district` / `province` | string ≤255 |

    → `{success, message, data}` · ผิดกติกา = 422 พร้อม `errors`

    ### `GET profilelist/{id}` 🔒
    ```json
    { "users": {...}, "positions": [...], "totalsByUserOrder": "...", "orderCount": 0,
      "userRank": {...}, "userRanks": "ชื่อ rank", "rankImage": "...", "company": {...} }
    ```
    > `userRanks` / `rankImage` เป็นฟิลด์เก่า เก็บไว้เพื่อ backward-compat กับแอปเวอร์ชันเดิม — ของใหม่ใช้ `userRank`

    ### `DELETE delete-user/{id}` 🔒
    soft delete บัญชีพนักงาน (ลูกค้า/นัดหมายที่ผูกอยู่ยังคงอยู่)

    | HTTP | เงื่อนไข |
    |:---:|---|
    | `404` | ไม่พบผู้ใช้ |
    | `403` | เป็นแอดมินคนแรก **หรือ** ลบแล้วจะไม่เหลือแอดมินที่เคย login |
    | `200` | `{success, message}` |

    ### `POST device-token` 🔒
    `{fcm_token}` (required) → `{status, message}`

    ⚠️ มีตัวกันพลาด: ถ้าส่ง **JWT** มาแทน FCM token (ขึ้นต้น `eyJ` + 3 ส่วนคั่นจุด) จะได้ **422** `code: invalid_fcm_token`

    ### `GET user/dashboard` 🔒
    query: `date` (`YYYY-MM-DD`, ดีฟอลต์เดือนปัจจุบัน)

    ```
    {status: true, message, data: {
      user_id, selected_month, selected_year, available_months,
      customerCount, newCustomerCountThisMonth, repeatCustomers, existingCustomer,
      top5ProductsByUser, top5ProductsByUserTotal, top5ProductTypeByUser, top5ProductTypeByUserTotal,
      billingAmount, billingAmountCount, paidAmount, paidAmountCount,
      openSalesOrder, confirmedSalesOrder, approvedCount, waitingForBilling,
      shippingInProgress, accountingDocuments, completedCount, cancelledCount,
      contactList, salesRank }}
    ```

    ### `GET user/dashboard/admin` 🔒
    query: `month` + `year` (ส่งคู่กัน) · **level 2 (เซลส์) โดน 403**

    ```
    {status: true, message, data: {
      sales_users:{total,percent}, customers:{total,percent}, products:{total,percent},
      order_summary:{openSalesOrder, confirmedSalesOrder, approvedCount, pending_billing_Count,
                     pending_dispatch_Count, shippedCount, completedCount, cancelledCount},
      relationship_type_by_user, top6_user_sales_order, total_all_sales }}
    ```

    ### `GET sale-summary-user` 🔒
    ```
    {status: true, message, data: {chartData, salesThisYear, salesThisMonth, receivedAmount,
     outstandingAmount, totalCreditNoteThisMonth, successfulReturningCustomers,
     totalNewCustomersThisMonth, totalNewCustomers}}
    ```

    ### `GET contact-rank` / `GET sales-rank` 🔒
    query: `date` → `{success, month: "YYYY-MM", data: [...]}`


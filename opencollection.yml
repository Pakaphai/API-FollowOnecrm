    ## ตารางสรุปทุกเส้น

    🔒 = ต้องแนบ JWT (อยู่ในกลุ่ม `auth_api`)

    ### 1. Auth & Session — 7 เส้น

    | | Method | Path | ใช้ทำอะไร |
    |:---:|---|---|---|
    | | `POST` | `proxy/auth/login` | proxy login ไป BukkhonID ตรง ๆ (ใช้ฝั่งเว็บ) |
    | | `GET` | `verify-company-code/{code}` | ตรวจ company code → คืน base URL ของบริษัท |
    | | `POST` | `login` | เข้าสู่ระบบด้วย username/password |
    | | `POST` | `login/google` | เข้าสู่ระบบด้วย Google (BukkhonID) |
    | | `GET` | `refresh` | ต่ออายุ token |
    | | `POST` | `forgot-password/otp` | ลืมรหัสผ่าน — ขอรหัส OTP เข้าอีเมล |
    | | `POST` | `forgot-password/verify-otp` | ยืนยัน OTP → ได้ `reset_token` |
    | | `POST` | `forgot-password/reset` | ตั้งรหัสผ่านใหม่ด้วย `reset_token` |
    | | `GET` | `privacy-policy` | นโยบายความเป็นส่วนตัว (ฉบับ Active) |
    | | `GET` | `privacy-policy/v/{version}` | นโยบายความเป็นส่วนตัว ย้อนหลังตาม version |
    | 🔒 | `GET` | `logout` | ออกจากระบบ + เคลียร์ fcm_token |
    | 🔒 | `POST` | `update-password` | เปลี่ยนรหัสผ่าน |
    | 🔒 | `POST` | `connect/google` | เชื่อม/ยกเลิกการเชื่อมบัญชี Google |

    ### ลืมรหัสผ่าน — `forgot-password/*`

    3 ขั้น: `otp` → `verify-otp` → `reset` · **ข้ามขั้นไม่ได้** เพราะ `reset_token` ถูกออกให้
    ก็ต่อเมื่อ OTP ผ่านแล้วเท่านั้น (ระบบเช็ค `verified_at` ไม่ใช่แค่ว่าถือ token อยู่)

    - ยิงเข้า **subdomain ของบริษัท** เหมือน `login` — บัญชีอยู่ในฐานข้อมูลของแต่ละบริษัท
    - `email` รับ**อีเมลหรือเบอร์โทร**ก็ได้ แต่ OTP ส่งเข้าอีเมลของบัญชีนั้นเสมอ (ยังไม่มีช่องทาง SMS)
    - OTP อายุ 10 นาที · กรอกผิดได้ 5 ครั้ง · ขอรหัสได้ 5 ครั้ง/15 นาที/IP · `reset_token` อายุ 15 นาที ใช้ครั้งเดียว

    📄 **อธิบายทุกพารามิเตอร์ + รหัส error → [api-forgot-password.md](api-forgot-password.md)**

    ### 2. User & Profile — 11 เส้น

    | | Method | Path | ใช้ทำอะไร |
    |:---:|---|---|---|
    | 🔒 | `GET` | `profileUser` | โปรไฟล์ตัวเอง + ยอดขายสะสม |
    | 🔒 | `POST` | `user/update/{id}` | แก้ไขโปรไฟล์ (อัปโหลดรูปได้) |
    | 🔒 | `GET` | `profilelist/{id}` | โปรไฟล์ + rank + ข้อมูลบริษัท |
    | 🔒 | `DELETE` | `delete-user/{id}` | ปิดใช้งานบัญชีพนักงาน |
    | 🔒 | `POST` | `device-token` | บันทึก FCM token |
    | 🔒 | `GET` | `user/dashboard` | แดชบอร์ดเซลส์ |
    | 🔒 | `GET` | `user/dashboard/admin` | แดชบอร์ดแอดมิน (level 2 โดน 403) |

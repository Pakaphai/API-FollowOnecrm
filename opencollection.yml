    ## 6. Relationship 🔒

    รายละเอียดเต็ม ๆ พร้อมตัวอย่าง curl ที่ [api-relationship.md](api-relationship.md)

    ### `POST customer/relationship/create/{id}`
    `{id}` ใน URL = **customer_id**

    | ฟิลด์ | บังคับ |
    |---|:---:|
    | `customer_id` | ✅ (ต้องมีจริง) |
    | `product_type_id` | ✅ (ต้องมีจริง) |
    | `topic` | ✅ |
    | `relationship_date` | ✅ |

    → `{success, message, customer_id, relationship_id}`

    ### `POST customer/relationship/update/{id}`
    `{id}` = **relationship_id** · ฟิลด์เดียวกับ create → `{success, message, customer_id, data}`

    ### `GET customer/relationship/edit/{id}` · `DELETE customer/relationship/delete/{id}`
    edit คืนข้อมูลแผน · delete ลบแผน **พร้อม detail ที่ผูกอยู่ทั้งหมด** → `{success, message}` · ไม่พบ = 404

    ### `GET customer/relationship/{id}`
    → `{customer, relationships, defaultRel, relationship_details, counts_relationship_details}`

    ### `POST customer/contact/customer/store` · `multipart/form-data`
    **บันทึกการติดต่อด่วน** — สร้าง detail ที่ `mode = 'completed'` ทันที (ไม่ต้องนัดล่วงหน้า)

    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `customer_id` | ✅ | ต้องมีจริง |
    | `contact_type_id` | ✅ | numeric |
    | `product_type_id` | | ต้องมีจริง |
    | `relationship_status_id` / `visit_conclusion_id` | | numeric |
    | `visit_pic` | | image ≤5MB · jpeg,png,jpg,gif,svg,webp |
    | `contact_detail` | | ≤255 |
    | `latitude` / `longitude` | | numeric |

    → **201** `{success, message, data}` · เลข `visit_number` gen เอง (เต็มลำดับ = 500)

    ### `GET customer/contact/customer/{id}`
    → `{relationship_status, visit_conclusions, customer}`

    > ส่ง `{id}` ไม่ใช่ตัวเลข = **400** พร้อมข้อความเตือนให้เช็ค HTTP method


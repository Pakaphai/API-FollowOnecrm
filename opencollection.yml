    ## 7. Relationship Detail 🔒

    ฟีเจอร์นัดหมายล่าช้าดูเต็ม ๆ ที่ [api-late-appointment.md](api-late-appointment.md)
    รายละเอียดทุกเส้นของกลุ่มนี้ที่ [api-relationship.md](api-relationship.md)

    ### `POST relationship-detail/create-contact` · `multipart/form-data`

    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `contact_type_id` | ✅ | integer |
    | `follow_date` | ✅ | date |
    | `customer_id` | | ต้องมีจริง |
    | `time_start` / `time_end` | | `H:i` |
    | `relationship_status_id` / `visit_conclusion_id` | | integer |
    | `visit_pic` | | image ≤5MB · jpeg,jpg,png |
    | `contact_detail` | | ≤255 |
    | `latitude` / `longitude` | | numeric |

    → **201** `{success, customer_id, message, visit_pic}`

    > ⚠️ ตอน validation ล้มเหลวเส้นนี้คืน `"success": true` คู่กับ HTTP **422** (bug เล็ก ๆ) — เชื่อ status code

    ### `POST relationship-detail/update-contact/{id}`
    ฟิลด์เดียวกัน แต่ `customer_id` **บังคับ** → `{success, message, customer_id, image_path}`

    ### `POST relationship-detail/submit-contact/{id}` — ปิดงาน
    **เช็คความล่าช้าก่อน validate** — ถ้านัดเลยกำหนดและยังไม่มีคำขอที่อนุมัติแล้ว:

    ```json
    { "success": false, "message": "นัดหมายนี้ล่าช้าแล้ว...", "require_late_request": true }
    ```
    **422** → แอปเจอ `require_late_request: true` ให้เด้ง modal ขออนุมัติแทน

    ผ่านแล้ว → `{success, message, customer_id, image_path, relationship_status_id}`

    > `relationship_status_id` ในผลลัพธ์คืน **ทั้งก้อน `$data`** ไม่ใช่ตัวเลข — ชื่อ key ไม่ตรงกับค่าที่ส่ง

    ### `GET relationship-detail/late-status/{id}`
    ```json
    { "success": true, "relationship_detail_id": 1, "mode": "scheduled",
      "is_late": true, "can_submit": false, "can_request_late": true,
      "visit_pic": "crm/visit_pics/...", "visit_pic_url": "https://...",
      "late_request": { "id": 7, "status": "pending", "status_label": "รอพิจารณา", ... } }
    ```
    ไม่มีสิทธิ์ = **403** · `late_request` เป็น `null` ถ้าไม่เคยยื่น

    ### `POST relationship-detail/late-request/{id}` · `multipart/form-data`
    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `reason` | ✅ | ≤1000 |
    | `visit_pic` | | image ≤5MB |

    **รับแค่ 2 ฟิลด์นี้** — สถานะ/สรุปผล/รายละเอียดการติดต่อ ไม่รับแก้ตรงขั้นตอนนี้

    | HTTP | เงื่อนไข |
    |:---:|---|
    | `403` | ไม่มีสิทธิ์เข้าถึงบันทึกนี้ |
    | `422` | ปิดงานไปแล้ว / ยังไม่ล่าช้า / มีคำขอค้างอยู่ |
    | `201` | `{success, message, customer_id, image_path, late_request:{id,status,late_days,reason}}` |

    ### `DELETE relationship-detail/delete-contact/{id}` · `GET relationship-detail/{id}`
    delete → `{success, message}` · get → `{status:"success", data:{details}}`

    ### `GET getcustomer/detail/byid/{id}`
    เส้นหลักของหน้ารายละเอียดลูกค้า `{id}` = **customer_id**

    ```json
    { "status": "success", "data": {
        "customer": {...},
        "relationship_details_completed": [...],
        "relationship_details_scheduled": [...],
        "global_schedule": [...] }}
    ```
    นัดหมายแต่ละรายการมี flag ให้แอปเรนเดอร์ปุ่มได้เลย: `is_late`, `can_submit`, `can_request_late`, `late_request_status`, `late_request_note`


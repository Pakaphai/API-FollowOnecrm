    # ⚠️ หมายเหตุสำคัญ

    ## 1. `POST order/update/status/payment/{id}` — เส้นนี้พังแน่นอน

    ```php
    // routes/api/api_v1.php
    Route::post('order/update/status/payment/{id}', [ApiOrderController::class, 'updatePaymentStatus']);
    ```

    เมธอด `updatePaymentStatus` **มีอยู่แค่ใน [`Sale\OrderController`](../app/Http/Controllers/Sale/OrderController.php) ไม่มีใน `Api\ApiOrderController`** — ยิงเส้นนี้เมื่อไหร่จะได้ `BadMethodCallException` → **500** ทันที

    ทางเลือกในการแก้:
    - **ชี้ไป controller ฝั่งเว็บ** ถ้าตรรกะใช้ร่วมกันได้ (ระวังเรื่อง guard: ฝั่งเว็บใช้ `Auth::id()` ไม่ใช่ `auth('api')`)
    - **ย้าย/คัดลอกเมธอดมาไว้ใน `ApiOrderController`** แล้วปรับให้ใช้ `Auth::guard('api')`
    - **ลบ route ทิ้ง** ถ้าแอปไม่ได้ใช้แล้ว

    ตรวจได้ด้วย:
    ```bash
    php artisan route:list --path=api/v1/order
    ```

    ## 2. path ที่มี `api/` ซ้ำ

    สองเส้นนี้ประกาศไว้ในกลุ่มที่มี prefix `/api/v1` อยู่แล้ว แต่ยังใส่ `api/` นำหน้าอีก ทำให้ path จริงกลายเป็น:

    ```
    /api/v1/api/order/details/{id}
    /api/v1/api/customer/purchased-product/{id}
    ```

    ใช้งานได้ปกติ แต่ผิดรูปแบบจากเส้นอื่นทั้งหมด — ถ้าจะแก้ให้เป็น `/api/v1/order/details/{id}` ต้องแก้ฝั่งแอปพร้อมกัน (breaking change)

    ## 3. เส้นที่ไม่ตรวจความเป็นเจ้าของข้อมูล

    `DELETE customer/delete/{id}` และ `DELETE relationship-detail/delete-contact/{id}` **ไม่เช็คว่าข้อมูลนั้นเป็นของ user ที่ login หรือเปล่า** — เซลส์คนหนึ่งลบข้อมูลของเซลส์อีกคนในบริษัทเดียวกันได้ ต่างจาก `customer/edit/{id}` และ `getCustomer-detail` ที่กรอง `user_id` ไว้

    ถ้าต้องการปิด ให้เพิ่มเงื่อนไขแบบเดียวกับ `RelationshipDetailController::canManageDetail()` ที่เส้นนัดหมายล่าช้าใช้อยู่

    ## 4. `GET calendar` ไม่รับพารามิเตอร์เดือน

    โค้ดอ่าน `Carbon::now()` ตายตัว — แอปเปลี่ยนเดือนดูย้อนหลังไม่ได้ ถ้าต้องการให้เลือกเดือนได้ต้องเพิ่ม `$request->month/year` เข้าไปเอง (แบบเดียวกับ `user/dashboard/admin`)

    ## 5. รูปแบบ response ไม่เป็นมาตรฐาน

    ดูตารางในหัวข้อ [กติกาที่ใช้กับทุกเส้น](#-รูปแบบ-response-ไม่เป็นมาตรฐานเดียวกัน) — ถ้าจะทำให้เป็นมาตรฐานเดียวกันควรทำเป็น major version ใหม่ (`/api/v2`) ไม่ใช่แก้ทับของเดิม เพราะแอปที่ปล่อยไปแล้วจะพังทันที


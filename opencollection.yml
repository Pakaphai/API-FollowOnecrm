    ## 5. Customer 🔒

    ### `GET master-data`
    ข้อมูลตั้งต้นก้อนเดียวสำหรับฟอร์มทั้งแอป — เรียกครั้งเดียวตอนเปิดแอปแล้ว cache ไว้

    ```
    {contact_types, relationship_status, visit_conclusions, business_types, product_types,
     logo_aw_followonecrm_01..04, branner_1..4}
    ```

    > โลโก้/แบนเนอร์เป็น presigned URL **อายุแค่ 5 นาที** — cache ตัว list ได้ แต่ URL รูปต้องดึงใหม่

    ### `GET getCustomer-detail`
    ลูกค้าของตัวเอง เรียงตาม `customer_code` — **แบ่งหน้า** (`page`, `per_page`)

    ```json
    { "datas": [...], "user": 4,
      "page": 1, "size": 20, "total_elements": 42, "total_pages": 3,
      "has_next": true, "has_prev": false }
    ```

    แต่ละแถวมีฟิลด์คำนวณเพิ่ม: `customer_name_full` (เติมคำนำหน้าตามประเภทธุรกิจ), `customer_scope_label` (ชื่อไทย), `is_address_incomplete` (ที่อยู่ไม่ครบ)

    ### `POST create-customer` · `POST customer/update/{id}`

    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `customer_name` | ✅ | ≤255 + **จำกัดจำนวนไบต์** (`MaxBytes`) |
    | `contact_name` | ✅ | ≤255 + ตัวอักษรเท่านั้น (ห้ามตัวเลข/อักขระพิเศษ) + MaxBytes |
    | `customer_tel` | ✅ | รูปแบบเบอร์ไทย (`ThaiPhone::RULE`) |
    | `tax_id` | | `digits:13` — ขีดกลางถูกตัดออกให้อัตโนมัติ |
    | `business_type_id` | | ไม่ส่ง = **7** (บุคคลธรรมดา) · ไม่มีในระบบ = 404 |
    | `customer_scope` | | `domestic` \| `international` |
    | `customer_detail` | | ≤2000 |
    | `customer_address` | | ≤255 |
    | `province` / `district` / `subdistrict` | | integer (**code** ไม่ใช่ id) — ถ้าส่งครบ 3 ตัวจะตรวจว่าสัมพันธ์กันจริง ไม่งั้น 422 `"ที่อยู่ไม่ถูกต้อง"` |
    | `latitude` | | `-90..90` |
    | `longitude` | | `-180..180` |
    | `credit` | | `0` \| `30` \| `60` \| `90` |
    | `credit_type` | | `0` = เงินสด/โอน · `1` = เครดิต — **คำนวณเองจาก `credit`** ตอนสร้าง (credit=0 → 0) |

    `customer_code` ระบบ gen เอง (`CUS-YYYYMM-0001`) · เจ้าของ = user ที่ login

    > `customer/update/{id}` ไม่แตะ `customer_code` และไม่โอนเจ้าของ (`user_id`) — บันทึกแค่ `updated_by` · `credit_type` คำนวณจาก `credit` เสมอทั้งสองเส้น

    > 💡 **PostgreSQL SQL_ASCII**: `varchar(255)` เก็บได้ 255 **ไบต์** ภาษาไทยได้แค่ ~85 ตัว — จึงมี `MaxBytes` คู่กับ `max:255` เสมอ

    ### `GET customer/edit/{id}`
    คืนเฉพาะลูกค้าที่ `user_id = ตัวเอง` เท่านั้น (ไม่ใช่ = **404**) → `{customer, user_id}` · มี `province_name`/`district_name`/`subdistrict_name`/`subdistrict_zip_code` + `credit_type_name` + `customer_scope_label`

    ### `DELETE customer/delete/{id}`
    soft delete (`is_delete = true`) → `{success, message}`

    > ⚠️ **ไม่เช็คความเป็นเจ้าของ** — ส่ง id ของลูกค้าเซลส์คนอื่นในบริษัทเดียวกันก็ลบได้

    ### `GET api/customer/purchased-product/{id}`
    สินค้าที่ลูกค้ารายนี้เคยซื้อ นับเฉพาะ order ที่ `status = completed` **และ** `payment_status = paid` — รวม qty ต่อสินค้า เรียงมากไปน้อย → `{success, data: [{product_name, product_code, total_qty, uom_name}]}`

    ### `GET contact-type`
    → `{contact_types: [...]}`


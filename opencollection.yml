    ## 3. Notifications 🔒

    | Path | Response |
    |---|---|
    | `GET notifications` | `{status:"success", data: <paginator 20/หน้า>}` |
    | `GET notifications/unread-count` | `{status:"success", data:{unread_count}}` |
    | `POST notifications/{id}/read` | `{status:"success", message}` · ไม่พบ = **404** |
    | `POST notifications/read-all` | `{status:"success", message}` |
    | `DELETE notifications/{id}` | `{status:"success", message, data:{deleted_count, unread_count}}` · ไม่พบ/ของคนอื่น = **404** |
    | `DELETE notifications` | body: `ids[]` **หรือ** `only=read|all` · ไม่ระบุขอบเขต = **422** (ไม่ลบทั้งหมดให้เอง) |
    | `POST notifications/delete` | เหมือน `DELETE notifications` ทุกอย่าง |

    ใช้ Laravel notifications มาตรฐาน (`user->notifications()`) — `{id}` เป็น **UUID** ไม่ใช่ integer

    การลบทุกเส้นคืน `unread_count` หลังลบมาให้ด้วย เอาไปอัปเดตกระดิ่งได้เลยไม่ต้องยิง `unread-count` ซ้ำ
    ลบแล้วกู้คืนไม่ได้ (ไม่มี soft delete) → ดู [api-notification-delete.md](api-notification-delete.md)


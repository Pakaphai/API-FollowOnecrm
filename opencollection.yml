    # รายละเอียดรายเส้น

    ## 1. Auth & Session

    รายละเอียดเต็มอยู่ที่ [api-login.md](api-login.md) และ [api-login-google.md](api-login-google.md) — สรุปย่อ:

    ### `GET verify-company-code/{code}`
    ไม่ต้อง auth · คืน `{success, message, data:{is_valid, url}}` · ไม่พบ = **404** · โหมด standalone คืน host ตัวเอง

    ### `POST login`
    `{username, password}` → `{message, user_detail, first_login, seat_quota, token}` · ไม่พบ user = 404 · รหัสผิด = 401

    `seat_quota` เป็นฟิลด์ใหม่ — ถ้า `seat_quota.is_over_limit = true` ให้พาไปหน้าจัดการโควตาทันที ไม่ต้องรอโดน 403 (ดู [api-seat-quota.md](api-seat-quota.md)) · บัญชีที่ถูกระงับ / บริษัทเกินโควตา = **403** พร้อม `code`

    ### `POST login/google`
    `{id_token, device_id?}` → โครงสร้างเดียวกับ `/login`

    ### `GET refresh`
    แนบ token เดิม (หมดอายุแล้วก็ได้) → `{access_token, token_type, expires_in}` **แบบ flat** ไม่ห่อใน `token`

    ### `POST update-password` 🔒
    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `new_password` | ✅ | `min:8` + `confirmed` |
    | `new_password_confirmation` | ✅ | ต้องตรงกับด้านบน |

    → `{success, message}` · ไม่บังคับกรอกรหัสเดิม

    ### `POST proxy/auth/login`
    proxy ไป `{BUKKHONID_URL}/api/v1/auth/login` ตรง ๆ ด้วย `{email_or_phone, password, device_id?, program_code?}` แล้วคืน body ของ BukkhonID กลับมาทั้งก้อน (เติม `user.id`/`user.bukkhon_id` ให้ครบทั้งคู่) — **เส้นนี้ไม่ได้ออก JWT ของ CRM** ใช้ฝั่งเว็บ ไม่ใช่ mobile flow

    ---

    ## 2. User & Profile

    ### `GET profileUser` 🔒
    โปรไฟล์ตัวเอง — join จังหวัด/อำเภอ/ตำบล/ตำแหน่ง/แผนก

    ```json
    { "status": "success", "data": {...}, "orderCount": 12,
      "totalsByUserOrder": { "4": "45000.00", "7": "38200.50" } }
    ```

    > ⚠️ `totalsByUserOrder` เส้นนี้เป็น **object map ยอดขายของพนักงานทุกคน** ไม่ใช่ของตัวเอง — ต่างจาก `profilelist/{id}` ที่เป็น string ตัวเดียว
    > `profile_img_url` ใช้ `$disk->url()` (**URL ถาวร ไม่ใช่ presigned**) ต่างจาก `/login` ที่ใช้ presigned 10 นาที — ถ้า bucket เป็น private URL นี้จะเปิดไม่ได้
    > รายละเอียดทั้งหมด: [api-user-profile.md](api-user-profile.md)

    ### `POST user/update/{id}` 🔒 · `multipart/form-data`

    > 🔐 **สิทธิ์:** เจ้าของบัญชี `{id}` หรือแอดมิน (level 0/1) เท่านั้น · แอดมิน level 1 แก้บัญชี level 0 ไม่ได้
    > นอกนั้น **403** `{success: false, message: "ไม่มีสิทธิ์จัดการบัญชีผู้ใช้รายนี้"}`

    | ฟิลด์ | กติกา |
    |---|---|
    | `profile_img` | `image` · jpeg,png,jpg · ≤ 2MB |
    | `email` | `email` · ≤255 · **unique** (ยกเว้นตัวเอง) |
    | `tax_id` | ≤255 · ขีดกลางถูกตัดออกอัตโนมัติ |
    | `position_id` | integer |
    | `address` / `subdistrict` / `district` / `province` | string ≤255 |

    → `{success, message, data}` · ผิดกติกา = 422 พร้อม `errors`

    ### `GET profilelist/{id}` 🔒
    ```json
    { "users": {...}, "positions": [...], "totalsByUserOrder": "...", "orderCount": 0,
      "userRank": {...}, "userRanks": "ชื่อ rank", "rankImage": "...", "company": {...} }
    ```
    > 🔐 **ดูของคนอื่นได้ แต่ได้ข้อมูลไม่ครบ** — ถ้าคนดูไม่ใช่เจ้าของบัญชีและไม่ใช่แอดมิน
    > `users` จะไม่มี `tax_id` · `address` · `subdistrict` / `district` / `province` (+ `_name` และ `zip_code`)
    > · `commission_type` · `commission_rate` · `fcm_token` · `bukkhon_id` และ `bukkhon_connection` = `null`
    > `userRanks` / `rankImage` เป็นฟิลด์เก่า เก็บไว้เพื่อ backward-compat กับแอปเวอร์ชันเดิม — ของใหม่ใช้ `userRank`

    ### `DELETE delete-user/{id}` 🔒
    soft delete บัญชีพนักงาน (ลูกค้า/นัดหมายที่ผูกอยู่ยังคงอยู่)

    | HTTP | เงื่อนไข |
    |:---:|---|
    | `403` | **ไม่มีสิทธิ์** — ไม่ใช่บัญชีตัวเองและไม่ใช่แอดมิน (หรือแอดมิน level 1 สั่งลบบัญชี level 0) · ตรวจก่อนหา user จึงไม่ได้ 404 มาไล่เดา id |
    | `404` | ไม่พบผู้ใช้ |
    | `403` | เป็นแอดมินคนแรก **หรือ** ลบแล้วจะไม่เหลือแอดมินที่เคย login |
    | `200` | `{success, message}` |

    ### `POST device-token` 🔒
    `{fcm_token}` (required) → `{status, message}`

    ⚠️ มีตัวกันพลาด: ถ้าส่ง **JWT** มาแทน FCM token (ขึ้นต้น `eyJ` + 3 ส่วนคั่นจุด) จะได้ **422** `code: invalid_fcm_token`

    ### `GET user/dashboard` 🔒
    query: `date` (`YYYY-MM-DD`, ดีฟอลต์เดือนปัจจุบัน)

    ```
    {status: true, message, data: {
      user_id, selected_month, selected_year, available_months,
      customerCount, newCustomerCountThisMonth, repeatCustomers, existingCustomer,
      top5ProductsByUser, top5ProductsByUserTotal, top5ProductTypeByUser, top5ProductTypeByUserTotal,
      billingAmount, billingAmountCount, paidAmount, paidAmountCount,
      openSalesOrder, confirmedSalesOrder, approvedCount (เลิกใช้ = 0), waitingForBilling,
      shippingInProgress, accountingDocuments, completedCount, cancelledCount,
      contactList, salesRank }}
    ```

    ### `GET user/dashboard/admin` 🔒
    query: `month` + `year` (ส่งคู่กัน) · **level 2 (เซลส์) โดน 403**

    ```
    {status: true, message, data: {
      sales_users:{total,percent}, customers:{total,percent}, products:{total,percent},
      order_summary:{openSalesOrder, confirmedSalesOrder, approvedCount (เลิกใช้ = 0), pending_billing_Count,
                     pending_dispatch_Count, shippedCount, completedCount, cancelledCount},
      relationship_type_by_user, top6_user_sales_order, total_all_sales }}
    ```

    ### `GET user/dashboard/admin/sellers/{userId}/sales-breakdown` 🔒
    ที่มาของยอดขายเซลส์ 1 คน — ยอดมาจากลูกค้ารายไหน และติดต่อลูกค้ารายนั้นด้วยวิธีอะไรกี่ครั้ง
    ชุดเดียวกับ modal การ์ดอันดับยอดขายบนแดชบอร์ดแอดมินฝั่งเว็บ · **เฉพาะ level 0/1** อื่น ๆ โดน 403 · ไม่พบเซลส์ = 404

    ```
    {success: true, message, data: {
      seller:{id, name},
      summary:{total_sales, customer_count, order_count, total_contacts, customers_without_contact},
      contact_types:[{name, total}],
      customers:[{customer_id, customer_name, order_count, total_sales, last_order_date,
                  contacts:[{type, total}], total_contacts, last_contact_at}] }}
    ```
    ยอดขาย = ใบ `completed` + `paid` ทั้งหมด (ไม่กรองเดือน) เป็น**บาท** · นับการติดต่อเฉพาะนัดหมายที่ทำเสร็จแล้วและเซลส์คนนี้เป็นผู้บันทึก

    ### `GET sale-summary-user` 🔒
    ```
    {status: true, message, data: {chartData, salesThisYear, salesThisMonth, receivedAmount,
     outstandingAmount, totalCreditNoteThisMonth, successfulReturningCustomers,
     totalNewCustomersThisMonth, totalNewCustomers}}
    ```

    ### `GET contact-rank` / `GET sales-rank` 🔒
    query: `date` → `{success, month: "YYYY-MM", data: [...]}`


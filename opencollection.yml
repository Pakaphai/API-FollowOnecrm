    ## กติกาที่ใช้กับทุกเส้น

    ### Base URL — ต้องยิงเข้า subdomain ของบริษัท

    ```bash
    BASE="https://nicharpn.uat-followonecrm.com/api/v1"
    AUTH="Authorization: Bearer $TOKEN"
    ```

    [`InitializeTenancyIfSubdomain`](../app/Http/Middleware/InitializeTenancyIfSubdomain.php) resolve tenant จาก subdomain แล้วสลับ schema **ก่อน** เข้า controller — ยิงผิด subdomain = หาข้อมูลไม่เจอ, subdomain ไม่มีในระบบ = `abort(404)`

    ### Header ที่ต้องมี

    | Header | เมื่อไหร่ |
    |---|---|
    | `Accept: application/json` | **ทุกเส้น** — ไม่งั้น error 422/500 กลับมาเป็น HTML |
    | `Authorization: Bearer <token>` | ทุกเส้นในกลุ่ม `auth_api` (ดูคอลัมน์ 🔒 ในตาราง) |
    | `Content-Type: application/json` | เส้นที่ส่ง JSON body |
    | *(ไม่ต้องตั้ง)* | เส้นที่อัปโหลดไฟล์ — ใช้ `multipart/form-data` ให้ client จัดการเอง |

    ### รหัส error ของ token — [`ApiAuth`](../app/Http/Middleware/ApiAuth.php)

    `token_absent` · `token_expired` (→ เรียก `/refresh`) · `token_blacklisted` · `token_invalid` · `user_not_found` ทั้งหมดคืน **401** ส่วน `subscription_expired` คืน **403**

    ### ⚠️ รูปแบบ response ไม่เป็นมาตรฐานเดียวกัน

    controller แต่ละตัวเขียนคนละยุค ทำให้ key ระดับบนสุดต่างกัน — **อย่าเขียน parser กลางตัวเดียวแล้วคาดว่าใช้ได้ทุกเส้น**

    | รูปแบบ | ตัวอย่างเส้นที่ใช้ |
    |---|---|
    | `{status: "success", data: {...}}` | notifications, subscription, relationship-detail/{id} |
    | `{status: true, message, data: {...}}` | dashboard ทั้งหมด, sale-summary-user |
    | `{success: true, message, data}` | customer, quotation, debt-reduction |
    | key เฉพาะกิจ (ไม่มี wrapper) | `master-data`, `quotation/preload`, `contact-type`, `billing/list` |
    | array/object ดิบ | `debt-reduction/orders/{id}`, `api/order/details/{id}` |

    **คำแนะนำ:** ตัดสินสำเร็จ/ล้มเหลวจาก **HTTP status code** เท่านั้น

    ### การแบ่งหน้า (pagination)

    เส้นที่คืน "รายการ" จะแบ่งหน้าเสมอ ใช้พารามิเตอร์และ meta ชุดเดียวกันทั้งหมด — ดู [`App\Support\ApiPagination`](../app/Support/ApiPagination.php)

    | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
    |---|---|---|
    | `page` | integer ≥1 | 1 |
    | `per_page` | integer 1–200 | **20** |

    ส่งค่าเกิน 200 จะได้ `422` พร้อมข้อความบอกว่าผิดที่ฟิลด์ไหน

    meta ที่แนบกลับมาทุกครั้ง (อยู่ระดับเดียวกับ key ของรายการ ยกเว้น `productlist` ที่อยู่ใน `data`):

    ```json
    { "page": 1, "size": 20, "total_elements": 137, "total_pages": 7,
      "has_next": true, "has_prev": false }
    ```

    เส้นที่แบ่งหน้า: `productlist` · `notifications` · `quotation/list` · `order/list` · `billing/list` · `debt-reduction/list` · `getCustomer-detail`

    > 🔻 **Breaking (2026-08-21)** — 5 เส้นหลังในลิสต์เพิ่งเปลี่ยนมาแบ่งหน้า จากเดิมที่คืนทั้งตาราง
    > แอปที่ยังไม่ได้แก้จะเห็นข้อมูลแค่ 20 แถวแรก ต้องวนดึงตาม `has_next` / `total_pages`

    **เส้นที่ตั้งใจไม่แบ่งหน้า** เพราะแบ่งแล้วใช้งานไม่ได้:
    - `calendar/all/customer` — ปฏิทินต้องมีนัดหมายครบทั้งช่วงถึงจะวาดได้ถูก
    - `debt-reduction/list` → key `customers` — เป็นลิสต์ตัวเลือกตอนสร้างใบลดหนี้ ถ้าแบ่งหน้าจะเลือกลูกค้าที่อยู่หน้าอื่นไม่ได้ (เฉพาะ key `debtReductions` ที่แบ่งหน้า)

    ### หน่วยของเงินและจำนวน

    ทั้งระบบเก็บเงินเป็น **สตางค์ (จำนวนเต็ม ×100)** ใน DB — API ส่วนใหญ่หารกลับเป็นบาทให้แล้ว แต่ไม่ทุกเส้น ดูหมายเหตุรายเส้น จำนวนสินค้า (`qty`) ก็เก็บ ×100 เช่นกัน

    ### ยอดรวมสุทธิถูกปัดขึ้นเป็นบาทเต็มจำนวน

    `total_after_discount` ของใบเสนอราคาและใบสั่งขาย **ปัดขึ้นเป็นบาทเต็มเสมอ** — ฿54,943.60 → **฿54,944.00**
    เพราะเป็นยอดที่เก็บเงินจริง เศษสตางค์ทำให้ยอดบนเอกสารกับที่โอนจริงไม่ตรงกัน (ดู [`CapsLineDiscount::ceilTotalCents()`](../app/Traits/CapsLineDiscount.php))

    ยอดย่อย — `total_before_discount` · `total_discount` · `vat_amount` · `quotation_lines[].total_line` — **ยังคงเศษสตางค์ไว้ตามเดิม** เพื่อให้ตรวจย้อนได้ว่ายอดรวมมาจากไหน

    > ⚠️ **ผลบวกของยอดย่อยจึงต่างจาก `total_after_discount` ได้ไม่เกิน 1 บาท** — อย่าเขียนเช็คว่าต้องเท่ากันเป๊ะ
    > ข้อยกเว้น: เอกสารแบบ**แนบรูป** ที่ผู้ใช้พิมพ์ยอดเอง (`additional_amount`) จะไม่ถูกปัด เก็บตามที่กรอกมา

    ### รูปภาพจาก S3

    bucket เป็น private ทุกรูปคืนเป็น **presigned URL อายุ 5–10 นาที** (`visit_pic_url`, `profile_img`, `quotation_image_url`, ...) — **ห้าม cache ยาว** ต้องดึงใหม่เมื่อหมดอายุ


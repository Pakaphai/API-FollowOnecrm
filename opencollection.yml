    ## 8. Product & Promotion 🔒

    ### `GET productlist`

    | query | ค่า |
    |---|---|
    | `page` | ≥1 |
    | `per_page` | 1–200 (ดีฟอลต์ 20) |
    | `q` | ค้นหาจาก ชื่อสินค้า / รุ่น / แบรนด์ — ⚠️ **ส่งมาแล้ว 500** (อ้างคอลัมน์ `products.sku` ที่ไม่มีจริง) ดู [api-product-list.md](api-product-list.md) |
    | `brand_id` · `model_id` | integer |
    | `min_price` · `max_price` | numeric (หน่วย**สตางค์** — เทียบกับคอลัมน์ดิบ) |
    | `sort` | `price_asc` · `price_desc` · `created_asc` · `created_desc` (ดีฟอลต์) |
    | `low_stock` | boolean — เหลือเฉพาะสินค้าที่ **พร้อมขายต่ำกว่าจุดแจ้งเตือน** (เกณฑ์เดียวกับปุ่มบนหัวตารางฝั่งเว็บ) |

    คืน paginator มาตรฐาน แต่ละสินค้ามี `brand_name`, `model_name`, `product_price` (บาท), ตัวเลขสต๊อกสามช่อง `min_stock_level` (ของจริงบนชั้น) · `reserved_qty` (ของที่ใบอื่นจองไว้) · `stock_qty` = `available_qty` (**คงเหลือพร้อมขาย** = ของจริง − จอง ติดลบได้) พร้อม `low_stock_threshold` / `is_low_stock`, รูป (presigned 10 นาที เรียงรูปหลักก่อน) และรายการหน่วยนับพร้อมราคา/บาร์โค้ด/`usd_price` (หน่วยหลัก `is_current` มาก่อน)

    > `counts` สรุปจำนวนทั้งหมดของ `product_types`, `models`, `brands`, และ **`low_stock_products` (จำนวนสินค้าเหลือน้อยทั้งหมดในระบบ)**

    > 🔻 **`stock_qty` เปลี่ยนความหมาย** — เดิมเป็นของบนชั้นดิบ ๆ ตอนนี้เป็นยอดที่ขายได้ (หักยอดจองแล้ว) ตรงกับคอลัมน์ "คงเหลือ (พร้อมขาย)" ของตารางสินค้าฝั่งเว็บ · ของบนชั้นอ่านจาก `min_stock_level`

    > ระดับ `data` มี `usd_pricing` + `usd_rate` (ก้อนเดียวกับ `quotation/preload`) — `usd_pricing: false` เมื่อไรให้ซ่อนราคา USD ทิ้ง

    > รูปดึงแยกหลังแบ่งหน้า **จงใจไม่ join** เพราะสินค้าที่มีหลายรูปจะกลายเป็นหลายแถว ทำให้ `total` เพี้ยน

    ### `GET promotion/active`
    query: `date` (ดีฟอลต์วันนี้)

    ```json
    { "success": true, "date": "2026-08-11", "count": 12,
      "promotions": [...], "by_product": {...}, "by_product_type": {...} }
    ```

    **วิธีใช้:** เพิ่มสินค้า 1 บรรทัด → หาใน `by_product[product_id]` ที่ `uom_code` ตรงก่อน → ไม่มีค่อย fallback ไป `by_product_type[product_type_id]`

    ### `GET promotion/check`
    ให้ server คำนวณให้แทน (ผลตรงกับฝั่งเว็บ 100%)

    | query | บังคับ | ค่า |
    |---|:---:|---|
    | `product_id` | ✅ | ต้องมีจริง |
    | `uom_code` | ✅ | ≤3 ตัวอักษร |
    | `qty` | | ดีฟอลต์ 1 |
    | `price_mode` | | `price` · `vat` · `novat` (ดีฟอลต์ `price`) |
    | `special_discount` | | ส่วนลดที่ผู้ใช้กรอกเอง |
    | `discount_type` | | `amount` · `percent` |
    | `quotation_date` | | ดีฟอลต์วันนี้ |

    ```json
    { "success": true, "has_promotion": true,
      "promotion": {"source":"product","discount_type":"percent","discount_value":10,"min_qty":null},
      "calculation": {"price_mode":"price","unit_price":100,"qty":2,"line_amount":200,
                      "promo_discount":20,"special_discount":0,"total_discount":20,"net_price":180} }
    ```

    ไม่มีราคาสำหรับหน่วยนั้น = **422** · ทุกยอดคำนวณด้วย `bcmath` (ไม่ใช้ float) · `net_price` ไม่ติดลบ

    ---

    ## 9. Quotation 🔒

    ### `GET quotation/preload`
    → `{customers, products, user, product_price, pomotionLines, conditions, ...}` + รายการหน่วยนับที่ต้องกรอกจำนวนเป็นจำนวนเต็ม (ต้องตรงกับ `UomRules::WHOLE_NUMBER_CODES` — server ตรวจซ้ำตอนบันทึก)

    > ราคาแยกตามหน่วยนับถูกฝังไว้ใน `products[].prices` แล้ว (แถวเดียวกับ `product_price[id]`) ส่วน `product_price` ระดับบนสุดยังส่งเหมือนเดิม

    📄 **อธิบายทุกฟิลด์แบบละเอียด → [api-quotation-preload.md](api-quotation-preload.md)**

    > key สะกดว่า `pomotionLines` (ตก r) — เป็นชื่อจริงใน response อย่าแก้ฝั่งแอปให้ถูก

    ฟิลด์ที่เกี่ยวกับราคาสกุล USD:

    | key | ความหมาย |
    |---|---|
    | `usd_pricing` | บริษัทนี้เปิดฟีเจอร์ราคา USD ไว้หรือไม่ — `false` = ซ่อนช่อง USD ทั้งหมด |
    | `usd_rate` | อัตราปัจจุบัน `{rate, rate_used, as_of, source, display}` (`null` = ไม่มีอัตราให้ใช้) |
    | `product_price[].usd_price` | ราคาขายสกุล USD ที่ตั้งไว้รายหน่วยนับ (ดอลลาร์ **ไม่ใช่สตางค์**) — **ปัดขึ้นเป็นดอลลาร์เต็มมาแล้ว** `505.6` → `506` · `null` = สินค้าตัวนี้ไม่ได้ตั้งราคา USD |

    ### `POST quotation/create` · `multipart/form-data`

    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `customer_id` | ✅ | ต้องมีจริง |
    | `quotation_date` | ✅ | date + `DocumentDate` (ห้ามย้อน/ล่วงหน้าเกินกำหนด) |
    | `quotation_lines` | | array ≥1 |
    | `quotation_lines.*.product_id` | ✅ | ต้องมีจริง (บังคับเมื่อมีบรรทัดนั้น) |
    | `quotation_lines.*.qty` | ✅ | ≥1 |
    | `quotation_lines.*.unit_price` | | ≥0 |
    | `quotation_lines.*.usd_price` | | ≥0 — ราคาต่อหน่วยสกุล USD **ส่งมาแล้วจะใช้แทน `unit_price` ของบรรทัดนั้น** |
    | `quotation_lines.*.manual_discount` | | ≥0 |
    | `quotation_lines.*.discount_type` | | `amount` · `percent` |
    | `quotation_lines.*.uom_code` | ✅ | ≤3 + ต้องมีใน `uoms` |
    | `status` | | `open` (ค่าเริ่มต้น) · `confirmed` — ค่าอื่นได้ 422 |
    | `header_discount` · `vat_amount` · `additional_amount` · `total_after_discount` | | ≥0 (**ห้ามติดลบ**) |
    | `header_discount_type` | | `amount` (ค่าเริ่มต้น — `header_discount` เป็นบาท) · `percent` (`header_discount` เป็นเปอร์เซ็นต์ บีบให้อยู่ใน 0–100 คิดจากยอดรวมหลังหักส่วนลดรายการ) · ใช้ได้ทั้ง `quotation/create` และ `quotation/update/{id}` |
    | `quotation_image` | | image ≤5MB |
    | `conditions` | | array ของ condition id |
    | `note` · `price_mode` | | string |

    ยอดเงินรับค่าที่มีคอมมาได้ (`normalizeMoneyInputs`) · server ตรวจราคาซ้ำอีกชั้น ผิดคืน 422 พร้อม `errors`

    📄 **อธิบายทุกพารามิเตอร์ + วิธีคิดยอดทีละขั้น → [api-quotation-create.md](api-quotation-create.md)**

    → `{success, message, data:{quotation:{id, quotation_number, quotation_date, status, ..., quotationLines:[...]}}}`

    data ยังมี `usd_rate` (อัตราที่ใบนี้ยึดไว้) · `quotation.total_after_discount_usd` · `quotationLines[].usd_price` + `.total_line_usd`

    > รายการสินค้าส่งมา **2 ที่ ชุดเดียวกันเป๊ะ** — `data.quotation.quotationLines` (ใช้ตัวนี้) และ `data.quotationLines` ตำแหน่งเดิมที่ยังส่งเหมือนเดิม

    ### `GET quotation/preload`
    ข้อมูลตั้งต้นของฟอร์มใบเสนอราคา — นอกจากลูกค้า/สินค้า/ราคา ยังมี **`product_options`**
    (ตัวเลือกสินค้า จัดกลุ่มตาม `product_id` · ราคาเป็น**สตางค์**) ให้ผู้ใช้ติ๊กเลือก
    แล้วส่ง id กลับมาที่ `option_ids` ตอนสร้าง/แก้เอกสาร สินค้าที่ไม่มีตัวเลือกจะไม่มีคีย์ในก้อนนี้

    📄 **อธิบายทุกก้อน → [api-quotation-preload.md](api-quotation-preload.md)**

    ### `POST quotation/usd/create` · `multipart/form-data`

    ใบเสนอราคาที่ **ตั้งราคาเป็นสกุล USD** — พารามิเตอร์และ response เหมือน `quotation/create` ทุกอย่าง
    ต่างกันแค่ **บังคับให้ทุกบรรทัดต้องมี `usd_price`** และตีกลับทันทีถ้าใช้ราคา USD ไม่ได้

    ทิศทางการคำนวณ — **USD เป็นตัวตั้ง แล้วแปลงกลับเป็นบาท**:

    ```
    $42.50  → ปัดขึ้นเป็นดอลลาร์เต็ม $43
            × อัตราขาย ธปท. ที่ปัดขึ้นเป็นบาทเต็ม ฿34 (จาก 33.2264)
            = ฿1,462.00 ต่อหน่วย   ← ค่านี้คือ unit_price ที่ถูกบันทึกลงฐานข้อมูล
    ```

    - **ราคาขั้นต่ำเงินบาทของสินค้าไม่ถูกนำมาบีบ** บรรทัดที่ขายเป็น USD (ยึดตัวเลขที่เสนอลูกค้าเป็นหลัก) — ต่างจาก `quotation/create` ที่บรรทัดราคาบาทยังโดนบีบตามปกติ
    - ส่วนลด / โปรโมชัน / VAT / ส่วนลดท้ายบิล คิดต่อจากราคาบาทที่แปลงแล้ว เหมือนใบปกติทุกประการ
    - อัตราที่ใช้ถูก **ยึดไว้กับตัวเอกสาร** (`quotation_headers.usd_rate_used`) + บันทึกลง `usd_rate_logs` เปิดใบเดิมวันหลังจึงได้ตัวเลขชุดเดิมเสมอ ต่อให้อัตราวันนี้เปลี่ยนไปแล้ว

    | HTTP | เงื่อนไข |
    |:---:|---|
    | `422` | บรรทัดไหนไม่มี `usd_price` → `errors["quotation_lines.N.usd_price"]` |
    | `422` | บริษัทไม่ได้เปิดฟีเจอร์ → `{code: "usd_pricing_disabled"}` |
    | `422` | ดึงอัตราจาก ธปท. ไม่ได้ → `{code: "usd_rate_unavailable"}` |
    | `201` | เหมือน `quotation/create` |

    > ส่ง `usd_price` ไปที่ `quotation/create` ตรง ๆ ก็ได้ผลเหมือนกัน — เส้นนี้ต่างตรงที่บังคับให้ครบทุกบรรทัด
    > จึงไม่มีทางได้ใบที่ตั้งใจให้เป็น USD แต่บางบรรทัดกลับไปคิดเป็นราคาบาทของสินค้าแทน

    ### ตัวเลือกสินค้า — `option_ids` (ใช้กับทุกเส้นที่เขียนบรรทัดเอกสาร)

    `quotation/create` · `quotation/usd/create` · `quotation/update/{id}` · `order/update-api/{id}`
    รับ `option_ids` รายบรรทัดเป็นอาเรย์ของ id (จาก `product_options` ใน `quotation/preload`)

    | เรื่อง | รายละเอียด |
    |---|---|
    | ส่งอะไร | **เฉพาะ id** — ชื่อกับราคาเซิร์ฟเวอร์อ่านจากฐานข้อมูลเอง แล้วเก็บเป็น**สำเนา** ณ วันที่ออกเอกสาร |
    | ราคา | **เซิร์ฟเวอร์บวกราคาตัวเลือกให้เสมอ** — `unit_price`/`usd_price` ที่ส่งมาคือ**ราคาสินค้าล้วน** ไม่ต้องบวกเอง |
    | ไม่ส่งคีย์นี้ | ตอน create = ไม่มีตัวเลือก · ตอน update = **คงของเดิมไว้** |
    | ส่ง `[]` | ล้างตัวเลือกของบรรทัดนั้นทิ้ง |
    | id ไม่มีจริง | `422` ที่คีย์ `<lines>.N.option_ids.M` |
    | id เป็นของสินค้าตัวอื่น | `422` ที่คีย์เดียวกัน — ตัวเลือกต้องสังกัดสินค้าในบรรทัดนั้น |

    ### ราคาตัวเลือกถูกบวกให้เสมอ

    `unit_price` / `usd_price` ที่ส่งมา = **ราคาสินค้าล้วน** เซิร์ฟเวอร์บวกราคาตัวเลือกให้เอง
    แอปไม่ต้องคำนวณราคารวมเอง ส่งราคาสินค้าที่ได้จาก `quotation/preload` มาตรง ๆ ได้เลย

    | ส่งอะไรมาในบรรทัด | ราคาต่อหน่วยที่ถูกบันทึก |
    |---|---|
    | `option_ids` อย่างเดียว | ราคาที่ตั้งไว้ที่สินค้า **+ ราคาตัวเลือกทุกตัว** |
    | `option_ids` + `unit_price` | `unit_price` **+ ราคาตัวเลือกทุกตัว** |
    | `option_ids` + `usd_price` | (`usd_price` **+ ราคาตัวเลือกฝั่ง USD**) แล้วค่อยแปลงเป็นบาท |

    > บรรทัด USD บวกฝั่งดอลลาร์ก่อนแล้วค่อยแปลง ไม่ใช่แปลงทีละก้อนแล้วบวก
    > เพราะการแปลงปัดขึ้นเป็นดอลลาร์เต็ม ถ้าแปลงสองรอบจะปัดสองครั้งแล้วยอดเกินจริง

    ### อ่านราคากลับมาเป็นสองค่า

    ทุกเส้นที่คืนบรรทัดเอกสารพร้อม `options[]` ส่งราคามาสองชุด

    | ฟิลด์ | ความหมาย |
    |---|---|
    | `unit_price` · `usd_price` | **ราคาสินค้าล้วน** — ส่งกลับไปที่เส้นบันทึกได้ตรง ๆ ตัวเลือกไม่ถูกบวกซ้ำ |
    | `unit_price_total` · `usd_price_total` | **ราคาต่อหน่วยที่ลูกค้าจ่ายจริง** (สินค้า + ตัวเลือก) = ค่าที่เก็บในฐานข้อมูล |

    เอาไปวาดหน้าจอใช้ `*_total` · เอาไปยิงบันทึกต่อใช้ `unit_price`/`usd_price`
    อ่านมาแล้วส่งกลับไปดิบ ๆ ราคาจึงไม่บานขึ้นทุกครั้งที่กดบันทึก

    `total_line` / `total_line_usd` เป็นยอดเต็มของบรรทัด (รวมตัวเลือกแล้ว) ไม่เปลี่ยน

    > ⚠️ เอกสารที่ออกผ่าน API **ก่อน** คอมมิต `e1d4c9b` (เข้า `main` 22 ส.ค. 2026) เก็บราคาไว้
    > โดยไม่ได้บวกตัวเลือก — deploy โค้ดใหม่แล้วใบเก่าไม่ได้ถูกแก้ตามไปด้วย
    > ตรวจและซ่อมตาม [maintenance-line-options-price.md](maintenance-line-options-price.md)

    ฝั่งอ่าน (`quotation/edit/{id}` · `order/edit-api/{id}` · `api/order/details/{id}`)
    คืนตัวเลือกที่บันทึกไว้กลับมาในแต่ละบรรทัด — ส่ง `id` กลับไปที่ `option_ids` ได้ตรง ๆ

    เส้น **เขียน** (`quotation/create` · `quotation/usd/create` · `quotation/update/{id}`) ก็คืน
    `quotationLines[].options[]` กลับมาด้วย — `id` · `group_name` · `name` · `price` (**สตางค์**) · `usd`
    เอาไปกางแถวตัวเลือกใต้สินค้าได้ทันทีโดยไม่ต้องยิงอ่านซ้ำ
    (`order/update-api/{id}` คืนทั้งใบในรูปแบบเดียวกับ `order/edit-api` ซึ่งมี `options[]` อยู่แล้ว)

    > `options[].price` คือราคาตัวเลือกต่อหน่วย ซึ่ง**รวมอยู่ใน `unit_price_total` แล้ว**
    > ไม่ใช่ยอดที่ต้องเอาไปบวกเพิ่มอีกรอบตอนแสดงผล

    ### `POST quotation/update/{id}`
    เหมือน create แต่ **`quotation_lines` บังคับ** (`required|array|min:1`) — รับ `usd_price` รายบรรทัดเหมือนกัน และบันทึกอัตราใหม่ทับพร้อมเพิ่มแถวใน `usd_rate_logs`

    ⚠️ **ไม่รองรับ partial update** — `quotation_lines` คือรายการทั้งหมดหลังแก้ **บรรทัดที่ไม่ได้ส่งมาจะถูกลบ** (`is_delete = true`)
    เอกสารที่ยืนยัน/ยกเลิกแล้วแก้ไม่ได้ → `403` · สำเร็จแล้วสถานะกลับเป็น `open` เสมอ

    📄 **อธิบายทุกพารามิเตอร์ + กติกาการลบบรรทัด → [api-quotation-update.md](api-quotation-update.md)**

    ### `GET quotation/edit/{id}`
    ข้อมูลสำหรับฟอร์มแก้ไข — `quotation_headers` มี `usd_rate` (**อัตราของใบนี้** ไม่ใช่อัตราวันนี้), `usd_rate_from_document` (`false` = ใบเก่าที่ไม่ได้บันทึกอัตราไว้ ระบบยืมอัตราปัจจุบันมาแสดง) และแต่ละบรรทัดมี `usd_price` ถอดกลับมาให้แล้ว — ส่งค่านี้กลับไปที่ `quotation/update/{id}` ได้ตรง ๆ

    > `usd_price` รายบรรทัด**ถอดกลับมาให้เฉพาะใบที่บันทึกอัตราไว้กับตัวเอง** (`usd_rate_from_document: true`)
    > ใบเก่าที่ยืมอัตราปัจจุบันมาแสดงจะได้ `null` เพราะถ้าถอดเป็น USD แล้วส่งกลับมาบันทึก
    > ราคาจะถูกปัดขึ้นจนเพี้ยนไปจากราคาบาทเดิม (ฐานข้อมูลเก็บราคาเป็นบาท ไม่ได้เก็บ USD รายบรรทัด)

    ### `GET quotation/list`
    ใบเสนอราคาของลูกค้าที่ตัวเองรับผิดชอบ — จัดกลุ่ม header แล้วซ้อน lines + conditions เข้าไปข้างใน

    **แบ่งหน้า** (`page`, `per_page`) — นับเป็น "ใบ" ไม่ใช่ "บรรทัดสินค้า" ใบหนึ่งจะไม่ถูกตัดครึ่งคาหน้า
    เรียงจากใบใหม่ไปเก่า (`id` มากไปน้อย)

    ```json
    { "status": "success", "quotation_headers": [...],
      "page": 1, "size": 20, "total_elements": 13, "total_pages": 1,
      "has_next": false, "has_prev": false }
    ```

    แต่ละใบมี `total_after_discount_usd` (ยอดสุทธิเทียบ USD สำหรับแสดง `≈ $43.00` ใต้ยอดเงินบาท) + `usd_rate_used` + `usd_rate_from_document`

    **ยอดในกล่องสรุป + สีป้ายสถานะ** (เพิ่ม 2026-09-23 · ชุดเดียวกับ `order/list`) — ดูรายละเอียดที่หัวข้อ `GET order/list`
    `total_after_bill_discount` (ยอดรวมหลังหักส่วนลด) · `total_before_vat` (มูลค่าก่อนภาษี) · `vat_rate` · `price_mode_label` · `status_color`

    ### `POST quotation/with-images/create` · `.../update/{id}`
    สำหรับใบเสนอราคาที่ **แนบรูปแทนการคีย์รายการสินค้า**

    | ฟิลด์ | บังคับ |
    |---|:---:|
    | `customer_id` | ✅ |
    | `quotation_date` | ✅ |
    | `quotation_image` | (image ≤5MB) |
    | `additional_amount` | ≥0 |
    | `note` | |

    ### `POST quotation/{id}/status/confirmed` · `.../cancelled`

    เปลี่ยนสถานะใบเสนอราคา **และใบสั่งขายที่ผูกกันไปพร้อมกัน**

    - `confirmed` → quotation + order = `confirmed`
    - `cancelled` → quotation + order = `cancelled` และ **ตั้ง `is_delete` ให้ทุกบรรทัดสินค้า** · **คืนยอดจองสต๊อก** ของใบที่เปิดบิลไปแล้ว และคืนของที่ตัดไปแล้วกลับเข้าคลัง

    | HTTP | เงื่อนไข |
    |:---:|---|
    | `403` | **แอดมินกดอนุมัติ** (`confirmed`) — การอนุมัติใบเสนอราคาเป็นหน้าที่ของฝ่ายขาย → `{success:false, message}` |
    | `409` | สถานะปัจจุบันอยู่ใน `IRREVERSIBLE_STATUSES` (ปิดการขาย/ยกเลิกแล้ว) → `{success:false, final_status, message}` |
    | `200` | `{message}` |

    > 🔒 **อนุมัติได้เฉพาะฝ่ายขาย** (`users.level = 2`) — แอดมิน/เจ้าของระบบ (`level 0,1`) อนุมัติแทนไม่ได้ เพราะคนที่รู้ว่าตกลงกับลูกค้าจบแล้วคือเซลส์เจ้าของใบ (ดู `DocumentEditPolicy::allowsQuotationApproval`) · กติกาเดียวกันนี้บังคับที่ `quotation/create` ด้วย — ส่ง `status=confirmed` มาแล้วไม่มีสิทธิ์ = **403** เช่นกัน


    ## 11. Debt Reduction 🔒

    ### `GET debt-reduction/list`
    → `{customers, debtReductions, page, size, total_elements, total_pages, has_next, has_prev}`

    **แบ่งหน้าเฉพาะ `debtReductions`** ส่วน `customers` เป็นลิสต์ตัวเลือกตอนสร้างใบลดหนี้ จึงคืนมาครบเสมอ

    แต่ละใบมี `quotation_number` (เลขใบเสนอราคาต้นทางของใบสั่งขายที่อ้างอิง) และ `reference_number` (เลขที่ควรเอาไปแสดง — ใช้เลข QT ก่อน ไม่มีจึงตกไปใช้เลข PO) พร้อมความสัมพันธ์ `order.quotation`

    ข้อมูลที่แอดมินกรอกตอนอนุมัติ: **`credit_note_no`** (เลขที่ใบลดหนี้จากระบบบัญชี · คนละตัวกับ `document_no` ที่ระบบรัน) · **`attachment_url`** (ไฟล์ใบลดหนี้ ลิงก์ S3 อายุ 10 นาที) — ทั้งคู่ `null` = ไม่ได้กรอก/ไม่ได้แนบ

    > เลขใบลดหนี้เปลี่ยน prefix จาก `DR-` เป็น **`SR-`** แล้ว ใบเก่าถูกเปลี่ยนตาม (migration v0112)

    **VAT และยอดรวมของแต่ละใบ** (เพิ่ม 2026-09-23 · ชุดเดียวกับคอลัมน์ใหม่ในตาราง `/debt-reduction/list` และ `/admin/reduction` ฝั่งเว็บ) — `vat_amount` · `total_with_vat` · `show_vat` (`false` = ใบไม่คิดภาษี ให้แสดงขีดแทน `0.00`) · `price_mode` (โหมดของใบสั่งขายต้นทาง)

    แยกจาก `total_amount` ด้วยกฎ `price_mode`: `novat` บวก 7% เพิ่ม · `vat` ถอด 7/107 ออก (`total_with_vat = total_amount`) · `price` ไม่คิดภาษี

    > ⚠️ ยอดเงินในเส้นนี้เป็น **สตางค์** (เหมือน `total_amount` เดิม) ต่างจาก `GET debt-reduction/{id}` ที่เป็นบาทแล้ว

    ### `GET debt-reduction/{id}`
    → `{debt_reduction, customer, source_document, items, summary}`

    ใช้เปิดแผงรายละเอียดใบลดหนี้ โดย `summary` คืนยอดก่อนลด ยอดหลังลด VAT ยอดลดหนี้ และยอดคงเหลือ; `source_document` คืนเลข QT/PO/IV และรูปแบบราคา/ภาษี; ส่วน `debt_reduction` คืนเหตุผล หมายเหตุ สถานะ และไฟล์แนบ

    ### `GET debt-reduction/orders/{customer_id}`
    คืน **array ดิบ** ของใบสั่งขาย — มี `quotation_number` / `reference_number` มาให้แสดงด้วย แต่ค่าที่ส่งกลับตอนสร้างใบลดหนี้ยังเป็น `id` ของ **ใบสั่งขาย** เหมือนเดิม

    ### `GET debt-reduction/order-items/{order_id}`
    ```json
    { "items": [...], "quotation_image_url": "https://...",
      "total_after_discount_baht": 12000 }
    ```
    > `total_after_discount_baht` = ผลรวม (ราคาปกติ × จำนวน) **ไม่คิดส่วนลด/VAT** — ใช้ฐานเดียวกับใบลดหนี้

    ### `POST debt-reduction/store` · `multipart/form-data`

    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `customer_id` | ✅ | |
    | `order_id` | ✅ | |
    | `total_amount` | ✅ | numeric — **รับค่าที่มีคอมมาได้** (`1,200.00`) ระบบตัดให้ก่อนตรวจ |
    | `note` | | เว้นว่างหรือ null ได้ สูงสุด 255 ตัวอักษร |
    | `note_other` | เฉพาะเลือกอื่นๆ | ถ้า `note = "อื่นๆ"` ต้องกรอกเหตุผล สูงสุด 255 ตัวอักษร |
    | `is_returned` | | string `"Y"` = มีการคืนของ, `"N"` = ไม่มีการคืนของ (ค่าเริ่มต้นเมื่อไม่ส่ง) · บันทึก Y/N ในฐานข้อมูล · หลังสร้างอ่าน `data.is_returned` และในรายการอ่าน `debtReductions[].is_returned` |
    | `image` | | jpeg,png,jpg,gif ≤**2MB** |

    ไม่เลือกสินค้าเลย = 422 `"กรุณาเลือกรายการสินค้าอย่างน้อย 1 รายการ"`

    ⚠️ `items[].unit_price` ที่ส่งมา**ไม่ถูกใช้แล้ว** — ราคา/หน่วยของแต่ละรายการอ่านจากใบสั่งขาย (ราคาเดียวกับ `debt-reduction/order-items`) กติกาเดียวกับฝั่งเว็บ


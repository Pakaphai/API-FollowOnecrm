    ## 12. Exchange Rate 🔒

    อัตราแลกเปลี่ยนอ้างอิงจาก **ธนาคารแห่งประเทศไทย (ธปท.)** — ชุดเดียวกับที่หน้าเว็บใช้
    ([`BotExchangeRateService`](../app/Services/Currency/BotExchangeRateService.php))

    **กติกาการปัดสองชั้น** ที่ทั้งเว็บ/แอป/เซิร์ฟเวอร์ต้องใช้ให้ตรงกัน:

    1. อัตราขาย (selling) ของ ธปท. → **ปัดขึ้นเป็นบาทเต็ม** · 33.2264 → 34.00
    2. ราคา USD ที่กรอก → **ปัดขึ้นเป็นดอลลาร์เต็ม** ก่อนคูณอัตรา · $42.50 → $43

    > แอปต้องใช้ `rate_used` (อัตราที่ปัดแล้ว) คิดเงินเสมอ — ใช้ `rate` ดิบจะได้ยอดคนละชุดกับที่เซิร์ฟเวอร์บันทึก

    ### `GET exchange-rate/usd`

    ```json
    { "success": true,
      "data": {
        "enabled": true, "available": true, "reason": null,
        "rate": {
          "base_currency": "USD", "quote_currency": "THB",
          "rate": 33.2264, "rate_used": 34,
          "as_of": "2026-08-17", "last_updated": "2026-08-17",
          "fetched_at": "2026-08-18 09:00:00", "source": "bot",
          "display": { "summary": "1 USD = ฿34.00",
                       "detail": "ปัดขึ้นจากอัตราขาย ธปท. ฿33.2264 · งวด 2026-08-17" },
          "rounding": { "rate": "...", "price": "..." }
        } } }
    ```

    | key | ความหมาย |
    |---|---|
    | `enabled` | บริษัทนี้เปิดฟีเจอร์ราคา USD ไว้หรือไม่ (`Tenant::hasUsdPricing`) |
    | `available` | มีอัตราให้ใช้หรือไม่ — `false` แล้ว `rate` จะเป็น `null` |
    | `reason` | `feature_disabled` (ไม่ได้เปิดฟีเจอร์) · `rate_unavailable` (เปิดแล้วแต่ดึงอัตราไม่ได้) |
    | `rate` | อัตราขายดิบตามที่ ธปท. ประกาศ — ไว้อ้างอิง/แสดงที่มาเท่านั้น |
    | `rate_used` | **อัตราที่ระบบใช้คิดเงินจริง** ปัดขึ้นเป็นบาทเต็มแล้ว |
    | `as_of` | งวดของอัตราที่หยิบมาใช้ (ธปท. ไม่ประกาศวันหยุด ระบบจึงย้อนหางวดล่าสุดที่มีค่า) |
    | `source` | `bot` = จาก ธปท. · `fallback` = อัตราสำรองใน `.env` (`BOT_USD_RATE_FALLBACK`) |

    > **ดึงอัตราไม่ได้ = ยังตอบ `200`** (`available:false`) ไม่ใช่ 5xx — ออกแบบให้แอปแค่ซ่อนส่วน USD ทิ้ง ไม่ต้องขึ้นหน้าจอ error
    > อัตราถูก cache ไว้ตาม `BOT_RATE_CACHE_MINUTES` (ค่าเริ่มต้น 180 นาที) ยิงถี่ได้โดยไม่กระทบ ธปท.

    ### `GET exchange-rate/usd/convert`

    แปลงค่าตามสูตรของระบบ เพื่อให้แอปไม่ต้องปัดเศษเอง (ปัดคนละแบบ = ตัวเลขบนหน้าจอไม่ตรงกับยอดที่บันทึก)

    | query | บังคับ | กติกา |
    |---|:---:|---|
    | `usd` | ✅* | ≥0 — *ต้องมี `usd` หรือ `thb` อย่างน้อยหนึ่งค่า |
    | `thb` | ✅* | ≥0 — ทิศทางกลับ (บาท → USD) |
    | `qty` | | ≥0 (ไม่ส่ง = 1) ใช้คิดยอดรวมของบรรทัด |

    `GET exchange-rate/usd/convert?usd=42.50` →

    ```json
    { "success": true,
      "data": { "...": "ก้อน rate เหมือนเส้นบน",
        "conversion": {
          "usd_input": 42.5, "usd_used": 43, "rate_used": 34,
          "thb": 1462, "qty": 1, "thb_total": 1462,
          "formula": "$43.00 × ฿34.00 = ฿1,462.00" } } }
    ```

    ไม่มีอัตราให้ใช้ → `conversion: null` (ไม่คืนเลข 0 ให้เผลอเอาไปแสดงเป็นราคา)


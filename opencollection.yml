    ## 11. Debt Reduction 🔒

    ### `GET debt-reduction/list`
    → `{customers, debtReductions, page, size, total_elements, total_pages, has_next, has_prev}`

    **แบ่งหน้าเฉพาะ `debtReductions`** ส่วน `customers` เป็นลิสต์ตัวเลือกตอนสร้างใบลดหนี้ จึงคืนมาครบเสมอ

    ### `GET debt-reduction/orders/{customer_id}`
    คืน **array ดิบ** ของใบสั่งขาย

    ### `GET debt-reduction/order-items/{order_id}`
    ```json
    { "items": [...], "quotation_image_url": "https://...",
      "total_after_discount_baht": 12000 }
    ```
    > `total_after_discount_baht` = ผลรวม (ราคาปกติ × จำนวน) **ไม่คิดส่วนลด/VAT** — ใช้ฐานเดียวกับใบลดหนี้

    ### `POST debt-reduction/store` · `multipart/form-data`

    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `customer_id` | ✅ | |
    | `order_id` | ✅ | |
    | `total_amount` | ✅ | numeric — **รับค่าที่มีคอมมาได้** (`1,200.00`) ระบบตัดให้ก่อนตรวจ |
    | `note` / `note_other` | | ถ้า `note = "อื่นๆ"` จะใช้ `note_other` แทน |
    | `image` | | jpeg,png,jpg,gif ≤**2MB** |

    ไม่เลือกสินค้าเลย = 422 `"กรุณาเลือกรายการสินค้าอย่างน้อย 1 รายการ"`

    ### `DELETE debt-reduction/delete/{id}`


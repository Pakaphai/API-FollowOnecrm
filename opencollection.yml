    ### 12. Exchange Rate (อัตราแลกเปลี่ยน ธปท.) — 2 เส้น

    | | Method | Path | ใช้ทำอะไร |
    |:---:|---|---|---|
    | 🔒 | `GET` | `exchange-rate/usd` | อัตรา USD → THB ล่าสุดที่ระบบใช้คิดราคา |
    | 🔒 | `GET` | `exchange-rate/usd/convert` | แปลง USD ⇄ บาท ตามสูตรของระบบ |

    ### 13. Sales Document Setting (ตั้งค่าเอกสารขาย) — 2 เส้น

    | | Method | Path | ใช้ทำอะไร |
    |:---:|---|---|---|
    | 🔒 | `GET` | `sales-document-setting` | ปุ่มบันทึก + วิธีกรอกที่บริษัทเปิดใช้ |
    | 🔒 | `POST` | `sales-document-setting` | แก้ค่าตั้ง — **เฉพาะแอดมิน** (level 0/1) |


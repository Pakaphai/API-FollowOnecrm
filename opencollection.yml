    ## 14. Seat Quota 🔒

    ### `GET seats`

    สถานะโควตา + รายชื่อบัญชี · **ทุก level เรียกได้** แต่ `can_manage` บอกว่าแก้ได้หรือแค่ดู

    - `can_manage: true` (level 0/1) → มี `users[]` ครบ พร้อม `role_label`, `customer_count`,
      `is_active_seat` (ค่าเริ่มต้นของช่องติ๊ก) และ `is_self` (**ล็อกช่องนี้ไว้**)
    - `can_manage: false` (level 2–4) → **ไม่มี `users[]`** โดยตั้งใจ · มี `message` เมื่อบริษัทเกินโควตา

    `users[]` เรียงมาให้แล้ว — แอดมินก่อน แล้วคนที่เคยล็อกอิน คนที่ยังไม่เคยล็อกอินอยู่ท้ายสุด

    ### `POST seats`

    `{active_ids: [1, 2, 13]}` — **ชุดเต็ม** ของบัญชีที่จะใช้งานต่อ ไม่ใช่เฉพาะที่เปลี่ยน
    · ส่งซ้ำได้ผลเดิม (idempotent) · id ที่ไม่มีอยู่จริงถูกตัดทิ้งเงียบ ๆ

    | กรณี | ผลลัพธ์ |
    |---|---|
    | เลือกเกิน `seats.limit` | `422` |
    | ไม่มี id ของตัวเองใน `active_ids` | `422` — กันแอดมินล็อกตัวเองออก |
    | ไม่เหลือบัญชี level 0/1 เลย | `422` — บริษัทจะติดตายทั้งบริษัท |
    | ผู้ยิงไม่ใช่ level 0/1 | `403` |

    ⚠️ ทุก error **ไม่เขียนอะไรลงฐานข้อมูลเลย** — ตรวจครบก่อนค่อยบันทึกในทรานแซกชันเดียว
    · ทุก response (รวม error) แนบ `seats` ล่าสุดมาด้วย ใช้รีเฟรชหน้าจอได้โดยไม่ต้องยิง `GET` ซ้ำ

    📄 **ครบทุกเคส + payload จริง + ลอจิกที่แอปต้องเขียน → [api-seat-quota.md](api-seat-quota.md)**


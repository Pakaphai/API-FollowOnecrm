    # รายละเอียดรายเส้น

    ## 1. Auth & Session

    รายละเอียดเต็มอยู่ที่ [api-login.md](api-login.md) และ [api-login-google.md](api-login-google.md) — สรุปย่อ:

    ### `GET verify-company-code/{code}`
    ไม่ต้อง auth · คืน `{success, message, data:{is_valid, url}}` · ไม่พบ = **404** · โหมด standalone คืน host ตัวเอง

    ### `POST login`
    `{username, password}` → `{message, user_detail, first_login, token}` · ไม่พบ user = 404 · รหัสผิด = 401

    ### `POST login/google`
    `{id_token, device_id?}` → โครงสร้างเดียวกับ `/login`

    ### `GET refresh`
    แนบ token เดิม (หมดอายุแล้วก็ได้) → `{access_token, token_type, expires_in}` **แบบ flat** ไม่ห่อใน `token`

    ### `POST update-password` 🔒
    | ฟิลด์ | บังคับ | กติกา |
    |---|:---:|---|
    | `new_password` | ✅ | `min:8` + `confirmed` |
    | `new_password_confirmation` | ✅ | ต้องตรงกับด้านบน |

    → `{success, message}` · ไม่บังคับกรอกรหัสเดิม

    ### `POST proxy/auth/login`
    proxy ไป `{BUKKHONID_URL}/api/v1/auth/login` ตรง ๆ ด้วย `{email_or_phone, password, device_id?, program_code?}` แล้วคืน body ของ BukkhonID กลับมาทั้งก้อน (เติม `user.id`/`user.bukkhon_id` ให้ครบทั้งคู่) — **เส้นนี้ไม่ได้ออก JWT ของ CRM** ใช้ฝั่งเว็บ ไม่ใช่ mobile flow


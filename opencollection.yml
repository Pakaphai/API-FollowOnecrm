    ## 4. Subscription & Calendar 🔒

    ### `GET subscription/status`
    ดู [api-subscription-status.md](api-subscription-status.md) — คืน `plan`, `usage`, `days_remaining`, `features`, `notice`

    ### `GET calendar`
    นัดหมาย **เดือนปัจจุบัน** ของลูกค้าที่ตัวเองรับผิดชอบ (`c.user_id = me`)

    ```json
    { "status": "success", "year": 2026, "month": "สิงหาคม", "count": 5, "data": [...] }
    ```

    > ⚠️ **ยึดเดือนปัจจุบันตายตัว** — โค้ดอ่าน `Carbon::now()` ไม่ได้รับ query param ส่ง `?month=` มาก็ไม่มีผล

    ### `GET calendar/all/customer`
    นัดหมาย **ทั้งบริษัท** ทุกเซลส์ ไม่กรองเดือน → `{global_schedule: [...]}` แต่ละแถวมี `formatted_name` (ชื่อบริษัทเติมคำนำหน้าตาม `business_type_id`) และ `visit_pic_url` (presigned 10 นาที)


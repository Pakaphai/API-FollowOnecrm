  ### 🔻 ฟิลด์เดิม → ฟิลด์ใหม่ (สำหรับแอปที่ใช้โครงสร้างก่อน 28/09/2569)

  | เดิม | ใหม่ | หมายเหตุ |
  |---|---|---|
  | `total_amount` (สตางค์) | `amount.total` (บาท) | หาร 100 แล้ว |
  | `vat_amount` · `total_with_vat` · `show_vat` (สตางค์) | `amount.vat` · `amount.total_with_vat` · `amount.show_vat` (บาท) | |
  | `price_mode` | `quotation.price_mode.code` | |
  | `quotation_number` / `order.quotation.quotation_number` | `reference_number` · `quotation.quotation_number` | |
  | `customer.formatted_name` | `customer.name` | |
  | `status` · `status_text` · `status_short` · `status_color` · `status_icon` | `status.code` · `.text` · `.short` · `.color` · `.icon` | |
  | `is_returned` `"Y"`/`"N"` | `is_returned` `true`/`false` + `is_returned_label` | |
  | `display_note` (`-` เมื่อว่าง) | `credit_note.reason` (`null` เมื่อว่าง) | |
  | `attachment_path` | — | ใช้ `attachment_url` (`null` = ไม่มีไฟล์) |
  | `order`, `customer.user`, `creator` (model ดิบ) | — | ตัดออก ไม่ควรส่งข้อมูลพนักงานออกไป |

  ## ใบที่แสดง — กติกาเดียวกับหน้าเว็บ

  "ใบของฉัน" = ใบของลูกค้าที่ฉันดูแลอยู่ **หรือ** ใบที่ฉันเป็นคนออก (`created_by`)
  เรียงจากใบที่สร้างล่าสุดขึ้นก่อน

  > key `customers` (ตัวเลือกตอนสร้างใบ) ตัดลูกค้าที่ออเดอร์ทุกใบมีใบลดหนี้สถานะ `pending` / `approved` / `commissioned` แล้ว
  > (เว็บตัดแค่ `pending` / `approved`) — เพราะ `debt-reduction/orders/{customer_id}` ก็ตัด `commissioned` เหมือนกัน เลือกไปก็ไม่มีออเดอร์ให้เลือกอยู่ดี

  ## การแบ่งหน้า (pagination)

  เส้นนี้แบ่งหน้าเสมอ ไม่ส่งอะไรมาก็ได้ 20 รายการแรก

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >= 1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <= 100 | - |

  ส่ง `per_page` เกิน 200 หรือ `q` ยาวเกิน 100 ตัว จะได้ 422

  ## การค้นหา (q)

  `q` ถูกส่งไปกรองที่ฐานข้อมูล **ก่อน** แบ่งหน้า จึงค้นเจอทุกรายการที่ตรงคีย์เวิร์ด
  ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว ค้นแบบไม่แยกตัวพิมพ์เล็กใหญ่ (ILIKE) และมีคำนี้อยู่ตรงไหนก็ได้

  ค้นจาก: เลขที่เอกสาร - ชื่อลูกค้า - รหัสลูกค้า - ชื่อผู้ติดต่อ

  > key `customers` (ลิสต์ตัวเลือกตอนสร้างใบลดหนี้) **ไม่ถูกกรองด้วย q** กรองเฉพาะ key `debtReductions`

  meta ที่แนบกลับมาทุกครั้ง (ระดับเดียวกับ key ของรายการ):

  ```json
  { "page": 1, "size": 20, "total_elements": 137, "total_pages": 7,
    "has_next": true, "has_prev": false }
  ```

  ต้องวนดึงต่อตาม `has_next` / `total_pages` ถ้าอยากได้ครบทุกรายการ

  ## เปิดรายละเอียดใบลดหนี้

  ข้อมูลรายละเอียด (`quotation` + `credit_note`) ติดมากับรายการแล้ว ไม่ต้องยิง `GET debt-reduction/{id}` ทีละใบ
  เส้นนั้นยังใช้ได้เหมือนเดิม (โครงสร้างของเส้นนั้นไม่เปลี่ยน)

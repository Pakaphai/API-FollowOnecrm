docs: |
  # API — รายการขอลดหนี้ (Debt Reduction List)

  ดึงรายการใบลดหนี้ (Debt Reductions / Credit Notes) ทั้งหมดของพนักงานขาย พร้อมรายชื่อลูกค้าที่มีสิทธิ์ขอลดหนี้ (`customers`) เรียงจากรายการล่าสุด (`created_at DESC`)

  ```
  GET /api/v1/debt-reduction/list
  Authorization: Bearer <token>
  Accept: application/json
  ```

  ---

  ## 1. พารามิเตอร์การค้นหาและแบ่งหน้า (Query String)

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น | รายละเอียด |
  |---|---|---|---|
  | `page` | integer ≥ 1 | `1` | หน้าที่ต้องการดูข้อมูล |
  | `per_page` | integer 1–200 | `20` | จำนวนรายการต่อหน้า (สูงสุด 200) |
  | `q` / `keyword` / `search` | string ≤ 100 | — | คำค้นหา (ค้นจาก **เลขที่ใบลดหนี้, ชื่อลูกค้า, รหัสลูกค้า, ชื่อผู้ติดต่อ, เบอร์โทรศัพท์, เลขประจำตัวผู้เสียภาษี**) ค้นแบบไม่แยกตัวพิมพ์เล็ก-ใหญ่ |

  ---

  ## 2. ตัวอย่าง Response (200 OK)


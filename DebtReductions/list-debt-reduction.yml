info:
  name: list-debt-reduction
  type: http
  seq: 1

http:
  method: GET
  url: "{{sale_uat}}/api/v1/debt-reduction/list?page=1&per_page=20&q="
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## โครงสร้าง response — ปรับใหม่ 28/09/2569 (🔻 Breaking)

  เส้นนี้ส่ง**เฉพาะข้อมูลที่หน้าเว็บ `/debt-reduction/list` แสดง** มาให้ จัดเป็น 3 ส่วนตามหน้าจอ
  ตัวเลขทุกช่องเป็น **บาท** แล้ว (เดิมระดับใบเป็นสตางค์) และ**ไม่ส่ง Eloquent model ดิบ**อีกต่อไป
  (เดิมลาก `customer.user` / `order.user` / `creator` ติดมาทั้งก้อน รวมอีเมล เบอร์ เลขภาษี fcm_token ของพนักงาน ซึ่งแอปไม่ได้ใช้)

  ```
  {
    "customers":      [ … ],           // ตัวเลือกลูกค้าตอนสร้างใบ (ไม่แบ่งหน้า ไม่ถูกกรองด้วย q)
    "debtReductions": [ { แถวตาราง + quotation + credit_note } ],
    "page", "size", "total_elements", "total_pages", "has_next", "has_prev"
  }
  ```

  แต่ละรายการใน `debtReductions[]` มี 3 ส่วน:

  | ส่วน | ตรงกับหน้าจอ |
  |---|---|
  | ฟิลด์ระดับบนสุด | **แถวในตาราง** — วันที่ · เลขที่ · ลูกค้า+อ้างอิง · ยอดลดหนี้ · VAT · รวม · รับคืน · สถานะ · ปุ่มจัดการ |
  | `quotation` | **การ์ด "ใบเสนอราคา"** ในแผงรายละเอียด — หัวใบ · รายการที่ขายจริง · ยอดท้ายใบ |
  | `credit_note` | **การ์ด "ใบลดหนี้"** ในแผงรายละเอียด — หัวใบ · เหตุผล · รายการที่ลดหนี้ · สรุปยอดคงเหลือ |

  ### 1) แถวในตาราง

  | ฟิลด์ | ชนิด | ความหมาย |
  |---|---|---|
  | `id` | int | รหัสใบลดหนี้ — ใช้กับ `debt-reduction/{id}` และ `DELETE debt-reduction/delete/{id}` |
  | `document_no` | string | เลขที่ใบลดหนี้ที่ระบบรัน (`SR-yyyymm-xxxx`) |
  | `reduction_date` | date | วันที่เอกสาร (`YYYY-MM-DD`) |
  | `reference_number` | string · null | เลขอ้างอิงใต้ชื่อลูกค้า = เลขใบเสนอราคาต้นทาง · ใบเก่าที่ไม่มีตกไปใช้เลขใบสั่งขาย |
  | `customer.id` · `customer_code` · `contact_name` | | ลูกค้า |
  | `customer.name` | string | ชื่อพร้อมคำนำหน้าประเภทธุรกิจ (`บริษัท … จำกัด (มหาชน)`) — เอาไปแสดงได้เลย |
  | `amount.total` | number | คอลัมน์ **ยอดลดหนี้** (ราคาที่เสนอลูกค้า) |
  | `amount.vat` | number | คอลัมน์ **VAT** |
  | `amount.total_with_vat` | number | คอลัมน์ **รวม** |
  | `amount.show_vat` | bool | `false` = ใบไม่คิดภาษี ให้แสดงขีด `-` ในช่อง VAT แทน `0.00` |
  | `is_returned` | bool | คอลัมน์ **รับคืน** (`true` = `Y`) — เดิมเป็น string `"Y"`/`"N"` |
  | `is_returned_label` | string | `รับคืนแล้ว` / `ไม่รับคืน` |
  | `status.code` | string | `pending` · `approved` · `rejected` · `cancelled` · `commissioned` |
  | `status.text` | string | ข้อความเต็ม เช่น `ออกคอมมิชชั่นแล้ว` (ใช้บนการ์ด) |
  | `status.short` | string | ข้อความสั้นบนป้ายในตาราง เช่น `ออกคอมแล้ว` |
  | `status.color` | string | โทนสี `warning` · `success` · `info` · `danger` · `secondary` |
  | `status.icon` | string | ชื่อไอคอน Remix Icon เช่น `ri-hand-coin-line` |
  | `attachment_url` | string · null | ปุ่ม 📎 — ไฟล์ใบลดหนี้ที่แอดมินแนบตอนอนุมัติ (S3 หมดอายุ 10 นาที) · `null` = ไม่มี |
  | `can_delete` | bool | แสดงปุ่มลบได้ไหม (ด่านเดียวกับ `DELETE debt-reduction/delete/{id}`) |

  | status.code | status.short | status.color | status.icon |
  |---|---|---|---|
  | `pending` | รออนุมัติ | warning | ri-time-line |
  | `approved` | อนุมัติแล้ว | success | ri-checkbox-circle-line |
  | `rejected` | ไม่อนุมัติ | danger | ri-close-circle-line |
  | `cancelled` | ยกเลิก | danger | ri-indeterminate-circle-line |
  | `commissioned` | ออกคอมแล้ว | info | ri-hand-coin-line |

  ### 2) `quotation` — การ์ด "ใบเสนอราคา"

  `null` = ใบลดหนี้ที่หาใบสั่งขายต้นทางไม่เจอ (ข้อมูลเก่า)

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `quotation_number` · `quotation_date` | หัวการ์ด + ช่อง "วันที่ใบเสนอราคา" · `null` = ใบสั่งขายเก่าที่ไม่ได้มาจากใบเสนอราคา |
  | `order_number` | เลขใบสั่งขายที่ใบลดหนี้ผูกอยู่จริง (ระบบเก็บใบลดหนี้ไว้กับ `orders.id`) |
  | `invoice_number` | ช่อง "เลขที่ใบกำกับภาษี" · `null` = ยังไม่กรอก |
  | `status.code` · `label` · `color` | ป้ายมุมขวาของการ์ด (สถานะเดินตามใบสั่งขาย เช่น `completed` / `การขายเสร็จสิ้น` / `#56ca00`) |
  | `price_mode.code` · `label` · `vat_rate` | ช่อง "รูปแบบราคา": `price` ราคาไม่มีภาษี (0) · `novat` แยกภาษี 7% · `vat` รวมภาษี 7% |
  | `lines[]` | รายการที่ขายจริง**ทุกบรรทัด** ของใบ (ไม่ใช่เฉพาะที่ลดหนี้) เรียงตามลำดับในใบ |
  | `lines[].product_code` · `product_name` | ชื่อสินค้า (บรรทัดบน) + รหัส (บรรทัดล่างสีเทา) |
  | `lines[].is_reduced` | `true` = บรรทัดนี้ถูกนำมาลดหนี้ → แสดงป้าย **ลดหนี้** |
  | `lines[].quantity` · `uom_label` | คอลัมน์ "จำนวน" เช่น `16` + `ชิ้น` |
  | `lines[].unit_price` · `discount` · `total` | ราคาต่อหน่วย · ส่วนลดรายการ · จำนวนเงิน |
  | `totals.subtotal` | รวมเป็นเงิน (ก่อนส่วนลดท้ายบิล) |
  | `totals.header_discount` · `header_discount_type` · `header_discount_percent` | ส่วนลดท้ายบิล (บาท) · `amount`/`percent` · % ที่กรอก — หน้าเว็บโชว์ `ส่วนลดท้ายบิล (10%)  -2,654.06` |
  | `totals.after_discount` | ยอดรวมหลังหักส่วนลด |
  | `totals.before_vat` · `vat` · `show_vat` | ฐานภาษี · ภาษี · `false` = ใบไม่คิดภาษี ไม่ต้องวาดบรรทัด VAT |
  | `totals.grand_total` | **ยอดรวมทั้งสิ้น** |
  | `image_url` | รูปใบเสนอราคาแบบแนบรูป (ใบที่ไม่ได้คีย์สินค้า จะมี `lines` ว่าง) · S3 10 นาที · `null` = ไม่มี |

  ### 3) `credit_note` — การ์ด "ใบลดหนี้"

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `document_no` | หัวการ์ด (ค่าเดียวกับระดับบน ใส่ซ้ำให้การ์ดวาดจากก้อนเดียวได้) |
  | `reduction_date` | ช่อง "วันที่เอกสาร" |
  | `customer_name` | ช่อง "ลูกค้า" (ชื่อพร้อมคำนำหน้า) |
  | `seller_name` | ช่อง "ชื่อผู้ขาย" — คนออกใบ ถ้าแอดมินออกให้จะเป็นเซลล์ของออเดอร์ต้นทาง · ไม่มีชื่อ-นามสกุลใช้ชื่อผู้ใช้ · `null` = หาไม่เจอ |
  | `credit_note_no` | ช่อง "เลขที่ใบลดหนี้ (บัญชี)" ที่แอดมินกรอกตอนอนุมัติ · **คนละตัวกับ** `document_no` · `null` = ยังไม่กรอก |
  | `is_returned` · `is_returned_label` | ช่อง "รับคืนสินค้า" |
  | `reason` | แถบ "เหตุผลที่ลดหนี้" = หมายเหตุแรกที่ไม่ว่างของรายการ · `null` = ไม่ได้ระบุ |
  | `items[]` | รายการที่ลดหนี้ (เฉพาะบรรทัดที่เลือกตอนสร้างใบ) · `[]` = ใบที่กรอกยอดมาตรง ๆ |
  | `items[].id` · `order_line_id` | รหัสบรรทัดลดหนี้ · รหัสบรรทัดขายที่อ้างอิง (ตรงกับ `quotation.lines[].id`) |
  | `items[].product_code` · `product_name` | สินค้า |
  | `items[].quantity` · `unit_price` | คอลัมน์ "จำนวน" · "ราคาต่อหน่วย" (ค่า 0 ระบบเติมจากบรรทัดขายเดิมให้แล้ว) |
  | `items[].amount` | คอลัมน์ **ยอดลดหนี้** ของบรรทัด (ราคาที่เสนอลูกค้า) |
  | `items[].vat` · `total` | ภาษี · คอลัมน์ **รวม** (แยกตาม `quotation.price_mode`) |
  | `items[].note` | หมายเหตุของบรรทัด |
  | `items[].image_url` | รูปประกอบของบรรทัดนี้ · S3 10 นาที · `null` = ไม่มี |
  | `summary.original` | **ยอดเดิมของใบเสนอราคา** (ก่อนภาษี หลังหักส่วนลดท้ายบิล) · `null` = ไม่มีต้นทาง |
  | `summary.reduction` | **ยอดลดหนี้** (ก่อนภาษี) — หน้าเว็บโชว์เป็นค่าลบสีแดง |
  | `summary.vat` · `reduction_with_vat` | ภาษีของยอดลดหนี้ · ยอดลดหนี้รวมภาษี (ใบไม่คิดภาษี = `reduction`) |
  | `summary.remaining` | **ยอดคงเหลือหลังลดหนี้** = `original - reduction` · `null` เมื่อไม่มี `original` |
  | `summary.show_vat` | `false` = ไม่ต้องวาดบรรทัด VAT |

  ตรวจทานตัวเลขได้จากตัวอย่างจริงด้านล่าง:
  `quotation.totals.after_discount 23,886.54` = `summary.original` → หัก `summary.reduction 2,064.66` → `summary.remaining 21,821.88`


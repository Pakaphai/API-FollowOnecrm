        "reason": "สินค้าเสียหายระหว่างจัดส่ง",
        "status": "pending",
        "status_text": "รออนุมัติใบลดหนี้",
        "display_note": "กล่องบรรจุภัณฑ์ชำรุด 2 กล่อง",
        "created_at": "2026-08-24T15:00:00.000000Z",
        "updated_at": "2026-08-24T15:00:00.000000Z",
        "customer": {

info:
  name: list-debt-reduction
  type: http
  seq: 1

http:
  method: GET
  url: "{{sale_uat}}/api/v1/debt-reduction/list?page=1&per_page=20&q="
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## รายละเอียดครบในเส้นเดียว — ปรับ 28/09/2569

  แต่ละรายการใน `debtReductions[]` มีข้อมูล**ชุดเดียวกับแผงรายละเอียดฝั่งเว็บ** (`/debt-reduction/list` → ปุ่มดูรายละเอียด)
  ติดมาด้วยแล้ว แอปวาดหน้ารายละเอียดได้จากเส้นนี้เส้นเดียว ไม่ต้องยิง `GET debt-reduction/{id}` ทีละใบ
  (เส้นนั้นยังใช้ได้เหมือนเดิม)

  > ⚠️ ตัวเลขใน `items[]` / `summary` / `source_document` เป็น **บาท** แล้ว
  > ต่างจาก `total_amount` / `vat_amount` / `total_with_vat` ระดับใบที่ยังเป็น **สตางค์** (คงไว้ไม่ให้แอปรุ่นเดิมพัง)

  | ฟิลด์ใหม่ | ความหมาย |
  |---|---|
  | `items[]` | รายการสินค้าที่ลดหนี้ — ดูตารางถัดไป · `[]` = ใบที่กรอกยอดมาตรง ๆ |
  | `summary` | สรุปยอดของใบ (บาท) — สูตรเดียวกับใบพิมพ์และแผงรายละเอียด |
  | `source_document` | **ใบเสนอราคา → ใบสั่งขายต้นทางทั้งใบ** พร้อมรายการที่ขายจริง · `null` = หาต้นทางไม่เจอ |
  | `quotation_image_url` | รูปใบเสนอราคาแบบแนบรูป (S3 10 นาที) · `null` = ไม่มี |
  | `seller_name` | ชื่อผู้ขาย — คนออกใบ ถ้าแอดมินออกให้จะเป็นเซลล์ของออเดอร์ต้นทาง · ไม่มีชื่อใช้ชื่อผู้ใช้ |
  | `reason` | เหตุผลการลดหนี้ = หมายเหตุแรกที่ไม่ว่าง · `null` = ไม่ได้ระบุ (ต่างจาก `display_note` ที่คืน `-`) |
  | `customer.province_name` · `district_name` · `subdistrict_name` · `subdistrict_zip_code` | ชื่อจังหวัด/อำเภอ/ตำบล + รหัสไปรษณีย์ของลูกค้า (เดิมมีแต่รหัส) |

  ### `items[]` — รายการสินค้าที่ลดหนี้

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `id` · `order_item_id` | รหัสบรรทัดลดหนี้ · รหัสบรรทัดขาย (`order_lines.id`) ที่อ้างอิง |
  | `product_code` · `product_name` | สินค้า |
  | `quantity_baht` · `unit_price_baht` · `subtotal_baht` | จำนวน · ราคา/หน่วย · ยอดลดหนี้ตามราคาที่เสนอ (ค่า 0 ตกไปใช้ค่าจากบรรทัดขายเดิม) |
  | `net_amount_baht` · `vat_amount_baht` · `total_line_baht` | ยอดก่อนภาษี · ภาษี · ยอดรวมของบรรทัด (แยกตาม `price_mode` ของใบสั่งขายต้นทาง) |
  | `note` | หมายเหตุ/เหตุผลของบรรทัด |
  | `image_url` | รูปประกอบของบรรทัดนี้ (S3 10 นาที) · `null` = ไม่มี · **ไม่** fallback เป็นรูปใบเสนอราคา |
  | `quantity` · `unit_price` · `subtotal` · `image_path` · `original_*` | ค่าดิบจากฐานข้อมูล (สตางค์) — ใช้ช่อง `*_baht` แทน |

  ### `summary` — สรุปยอด (บาท)

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `gross` | ยอดลดหนี้ตามราคาที่เสนอลูกค้า (ใบที่ไม่มีรายการใช้ `total_amount` ของหัวเอกสาร) |
  | `original` | ยอดขายเดิมก่อนภาษี (หลังหักส่วนลดท้ายบิล) · `null` = ไม่มีใบสั่งขายต้นทาง |
  | `correct` | ยอดที่ถูกต้องหลังลดหนี้ = `original - diff` · `null` เมื่อไม่มี `original` |
  | `diff` | ยอดลดหนี้ก่อนภาษี |
  | `vat` | ภาษีของยอดลดหนี้ |
  | `total` | ยอดลดหนี้รวมภาษี |
  | `show_vat` | `false` = ใบไม่คิดภาษี ให้แสดงขีดแทน `0.00` |

  ### `source_document` — ใบเสนอราคา / ใบสั่งขายต้นทาง (บาท)

  ก้อนเดียวกับที่แผงรายละเอียดฝั่งเว็บใช้ (`DebtReductionModel::sourceDocumentPayload`) คืนมา**ทั้งใบ** ไม่ใช่เฉพาะบรรทัดที่ถูกลดหนี้
  เพื่อให้เทียบได้ว่าลดหนี้ไปเท่าไรจากใบที่ขายจริงเท่าไร

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `quotation_number` · `quotation_date` | เลขที่ / วันที่ใบเสนอราคาต้นทาง · `null` = ใบเก่าที่ไม่ได้มาจากใบเสนอราคา |
  | `order_number` · `order_date` · `invoice_number` | เลขที่ / วันที่ใบสั่งขาย · เลขที่ใบกำกับภาษี |
  | `status` · `status_label` · `status_color` | สถานะใบสั่งขาย + ป้ายไทย + สี ชุดเดียวกับเว็บ |
  | `note` | หมายเหตุในใบ |
  | `price_mode` · `price_mode_label` · `vat_rate` | โหมดภาษี (`price` · `novat` · `vat`) + ป้ายไทย + อัตรา (`0` หรือ `7`) |
  | `total_before_discount` | ยอดก่อนส่วนลดท้ายบิล |
  | `header_discount` · `header_discount_type` · `header_discount_percent` | ส่วนลดท้ายบิล (บาท) · ชนิด (`amount` / `percent`) · เปอร์เซ็นต์ที่กรอก |
  | `total_after_bill_discount` | ยอดหลังหักส่วนลดท้ายบิล |
  | `total_before_vat` · `vat_amount` · `total_after_discount` | ฐานภาษี · ภาษี · ยอดสุทธิของใบ |
  | `lines[]` | รายการที่ขายจริงทุกบรรทัด: `id` `product_code` `product_name` `uom_code` `uom_label` `qty` `unit_price` `discount` `total_line` และ **`is_reduced`** (`true` = บรรทัดนี้ถูกนำมาลดหนี้ ใช้ไฮไลต์) |

  ตัวอย่างย่อ (ข้อมูลสมมติ ตัดฟิลด์เดิมออก):

  ```json
  {
    "id": 123, "document_no": "SR-202609-0007", "price_mode": "novat",
    "total_amount": 150000, "vat_amount": 10500, "total_with_vat": 160500,
    "reason": "สินค้าชำรุด", "seller_name": "สมชาย ใจดี", "quotation_image_url": null,
    "items": [
      { "id": 9, "order_item_id": 5351, "product_code": "P-15-00-00-0001", "product_name": "กระเป๋า 2",
        "quantity_baht": 2, "unit_price_baht": 600, "subtotal_baht": 1200,
        "net_amount_baht": 1200, "vat_amount_baht": 84, "total_line_baht": 1284,
        "note": "สินค้าชำรุด", "image_url": null }
    ],
    "summary": { "gross": 1500, "original": 9000, "correct": 7500, "diff": 1500, "vat": 105, "total": 1605, "show_vat": true },
    "source_document": {
      "quotation_number": "QT-2026-0059", "quotation_date": "2026-09-17",
      "order_number": "PO-2026-0031", "order_date": "2026-09-18", "invoice_number": "IV-2569-0123",
      "status": "completed", "status_label": "การขายเสร็จสิ้น", "status_color": "#28C76F",
      "price_mode": "novat", "price_mode_label": "แยกภาษี 7%", "vat_rate": 7,
      "total_before_discount": 10000, "header_discount": 1000, "header_discount_type": "amount", "header_discount_percent": null,
      "total_after_bill_discount": 9000, "total_before_vat": 9000, "vat_amount": 630, "total_after_discount": 9630,
      "lines": [
        { "id": 5351, "product_code": "P-15-00-00-0001", "product_name": "กระเป๋า 2", "uom_code": "EA", "uom_label": "ชิ้น",
          "qty": 10, "unit_price": 600, "discount": 0, "total_line": 6000, "is_reduced": true }
      ]
    }
  }
  ```

  ## ใบที่แสดง — กติกาเดียวกับหน้าเว็บ (ปรับ 28/09/2569)

  "ใบของฉัน" = ใบของลูกค้าที่ฉันดูแลอยู่ **หรือ** ใบที่ฉันเป็นคนออก (`created_by`)
  เดิม API ดูแค่ลูกค้าที่ดูแล พอลูกค้าถูกย้ายไปให้เซลส์คนอื่น ใบเก่าที่ตัวเองออกจะหายจากแอปทั้งที่ยังอยู่บนเว็บ ตอนนี้ตรงกันแล้ว

  > key `customers` (ตัวเลือกตอนสร้างใบ) ยังตัดลูกค้าที่ออเดอร์ทุกใบมีใบลดหนี้สถานะ `pending` / `approved` / `commissioned` แล้ว
  > (เว็บตัดแค่ `pending` / `approved`) — เพราะ `debt-reduction/orders/{customer_id}` ก็ตัด `commissioned` เหมือนกัน เลือกไปก็ไม่มีออเดอร์ให้เลือกอยู่ดี

  ## เปิดรายละเอียดใบลดหนี้ — เพิ่ม 22/09/2569

  เมื่อผู้ใช้กดรายการ ให้เรียก `GET /api/v1/debt-reduction/{id}` เพื่อรับสินค้า, เหตุผล, เอกสารอ้างอิง, รูปแบบราคา/ภาษี และยอดสรุปครบในครั้งเดียว
  (ตั้งแต่ 28/09/2569 ข้อมูลชุดนี้ติดมากับรายการใน `debt-reduction/list` แล้ว — ดูหัวข้อด้านบน)

  ## สถานะใบลดหนี้ (ชุดเดียวกับตารางฝั่งเว็บ)

  แต่ละรายการใน `debtReductions[]` มีฟิลด์สำหรับแสดงสถานะมาให้ครบ แอปไม่ต้อง map เอง

  | ฟิลด์ | ชนิด | ความหมาย |
  |---|---|---|
  | `status` | string | ค่าดิบ `pending` · `approved` · `rejected` · `cancelled` · `commissioned` |
  | `status_text` | string | ข้อความเต็ม เช่น `รออนุมัติใบลดหนี้` — ใช้ในหน้ารายละเอียด |
  | `status_short` | string | ข้อความสั้นสำหรับป้ายในรายการ เช่น `รออนุมัติ` · `ออกคอมแล้ว` |
  | `status_color` | string | โทนสีของป้าย: `warning` · `success` · `info` · `danger` · `secondary` |
  | `status_icon` | string | ชื่อไอคอน Remix Icon เช่น `ri-time-line` (แอปจะ map เป็นไอคอนของตัวเองก็ได้) |
  | `can_delete` | boolean | `true` = แสดงปุ่มลบได้ · ใช้กติกาเดียวกับ `DELETE debt-reduction/delete/{id}` |

  | status | status_short | status_color | status_icon |
  |---|---|---|---|
  | `pending` | รออนุมัติ | warning | ri-time-line |
  | `approved` | อนุมัติแล้ว | success | ri-checkbox-circle-line |
  | `rejected` | ไม่อนุมัติ | danger | ri-close-circle-line |
  | `cancelled` | ยกเลิก | danger | ri-indeterminate-circle-line |
  | `commissioned` | ออกคอมแล้ว | info | ri-hand-coin-line |

  > `commissioned` เปลี่ยนสีจาก `success` เป็น `info` เพื่อแยกจาก `approved` ให้เห็นชัด

  ตัวอย่าง (ข้อมูลสมมติ ตัดฟิลด์อื่นออก):

  ```json
  { "id": 123, "status": "pending", "status_text": "รออนุมัติใบลดหนี้",
    "status_short": "รออนุมัติ", "status_color": "warning",
    "status_icon": "ri-time-line", "can_delete": true }
  ```

  ## VAT และยอดรวมของแต่ละใบ — เพิ่ม 23/09/2569

  `total_amount` เป็น "ยอดลดหนี้" ก้อนเดียวที่ไม่ได้แยกภาษีไว้ ตอนนี้มี VAT กับยอดรวมมาให้ด้วย
  แยกด้วยกฎ `price_mode` ของ**ใบสั่งขายต้นทาง** — ชุดเดียวกับที่ตารางฝั่งเว็บและ `GET debt-reduction/{id}` ใช้

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `total_amount` | ยอดลดหนี้ (ราคาที่เสนอลูกค้า) |
  | `vat_amount` | ภาษีมูลค่าเพิ่มของใบนี้ |
  | `total_with_vat` | ยอดรวมของใบลดหนี้ |
  | `show_vat` | `false` = ใบนี้ไม่คิดภาษี ให้แสดงขีด `-` แทน `0.00` |
  | `price_mode` | โหมดภาษีของใบสั่งขายต้นทาง · `null` = ใบเก่าที่หาต้นทางไม่เจอ |

  > ⚠️ เส้นนี้ยอดเงินเป็น **สตางค์** (เหมือน `total_amount` เดิม) หาร 100 เองก่อนแสดง
  > ต่างจาก `GET debt-reduction/{id}` ที่เป็นบาทแล้ว

  ความสัมพันธ์ตามโหมด:

  | `price_mode` | ความหมาย | `vat_amount` | `total_with_vat` |
  |---|---|---|---|
  | `novat` | แยกภาษี 7% | `total_amount × 7%` | `total_amount + vat_amount` |
  | `vat` | รวมภาษี 7% | ถอด `7/107` ออกจาก `total_amount` | `= total_amount` (ภาษีแฝงอยู่แล้ว) |
  | `price` | ไม่มีภาษี | `0` (`show_vat: false`) | `= total_amount` |

  ```json
  { "document_no": "SR-202609-0007", "price_mode": "novat",
    "total_amount": 13500000, "vat_amount": 945000,
    "total_with_vat": 14445000, "show_vat": true }
  ```

  ยอดตั้งต้นยึดผลรวมรายการสินค้าในใบก่อน ใบที่ไม่มีรายการจึงตกไปใช้ `total_amount` ของหัวเอกสาร

  ## การคืนของ

  แต่ละรายการใน `debtReductions[]` มี `is_returned` เป็น string ที่บันทึกในฐานข้อมูล:
  - `"Y"` = มีการคืนของ
  - `"N"` = ไม่มีการคืนของ

  Mobile แสดงค่า `item.is_returned` ในคอลัมน์ "การคืนของ" ได้เลย
  ห้ามตรวจด้วย `if (item.is_returned)` เพราะ string "N" ก็เป็น truthy ให้ใช้ `item.is_returned === "Y"`

  ตัวอย่าง response ย่อ (ข้อมูลสมมติ ตัดฟิลด์อื่นและ pagination เพื่อให้อ่านง่าย):

  ```json
  {
    "debtReductions": [
      { "id": 123, "is_returned": "Y", "display_note": null },
      { "id": 124, "is_returned": "N", "display_note": "ปรับราคา" }
    ]
  }
  ```

  `display_note` อาจเป็น null เมื่อไม่ได้ระบุหมายเหตุ แสดงเป็น `-` ได้
  ค่า `is_returned` อยู่ระดับใบลดหนี้หนึ่งใบ ไม่ได้แยกตามสินค้าแต่ละรายการ

  ## การแบ่งหน้า (pagination)

  เส้นนี้แบ่งหน้าเสมอ ไม่ส่งอะไรมาก็ได้ 20 รายการแรก

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >= 1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <= 100 | - |

  ส่ง `per_page` เกิน 200 หรือ `q` ยาวเกิน 100 ตัว จะได้ 422

  ## การค้นหา (q)

  `q` ถูกส่งไปกรองที่ฐานข้อมูล **ก่อน** แบ่งหน้า จึงค้นเจอทุกรายการที่ตรงคีย์เวิร์ด
  ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว ค้นแบบไม่แยกตัวพิมพ์เล็กใหญ่ (ILIKE) และมีคำนี้อยู่ตรงไหนก็ได้

  ค้นจาก: เลขที่เอกสาร - ชื่อลูกค้า - รหัสลูกค้า - ชื่อผู้ติดต่อ

  > key `customers` (ลิสต์ตัวเลือกตอนสร้างใบลดหนี้) **ไม่ถูกกรองด้วย q** กรองเฉพาะ key `debtReductions`

  meta ที่แนบกลับมาทุกครั้ง (ระดับเดียวกับ key ของรายการ):

  ```json
  { "page": 1, "size": 20, "total_elements": 137, "total_pages": 7,
    "has_next": true, "has_prev": false }
  ```

  ต้องวนดึงต่อตาม `has_next` / `total_pages` ถ้าอยากได้ครบทุกรายการ
  รายละเอียดทั้งหมดอยู่ที่ docs/api-reference.md หัวข้อ "การแบ่งหน้า (pagination)"

  ## เลขเอกสารอ้างอิงของใบลดหนี้

  ใบลดหนี้อ้างอิง **เลขใบเสนอราคาต้นทาง** ไม่ใช่เลขใบสั่งขาย (กติกาเดียวกับฝั่งเว็บ)

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `quotation_number` | เลขที่ใบเสนอราคาต้นทางของใบสั่งขายที่อ้างอิง · `null` = ใบเก่าที่ไม่มีต้นทาง |
  | `reference_number` | **เลขที่ควรเอาไปแสดง** — ใช้เลข QT ก่อน ไม่มีจึงตกไปใช้เลข PO ไม่ปล่อยช่องว่าง |
  | `order.quotation` | ความสัมพันธ์ที่โหลดมาให้ด้วย (`quotation_number` อยู่ในนี้) |

  > ยังส่ง `order.order_number` มาเหมือนเดิม แอปรุ่นเดิมจึงไม่พัง

  ## ไฟล์ใบลดหนี้

  แอดมินแนบไฟล์ใบลดหนี้ (PDF / JPG / PNG) ได้ตอนกดอนุมัติบนเว็บ — ไม่บังคับ

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `attachment_url` | ลิงก์เปิดไฟล์ใบลดหนี้ (S3 แบบมีลายเซ็น **หมดอายุใน 10 นาที**) · `null` = ใบนี้ไม่มีไฟล์แนบ |
  | `attachment_path` | path ของไฟล์บน S3 — ไว้เช็คว่ามีไฟล์หรือไม่ ห้ามเอาไปต่อเป็นลิงก์เอง |

  > ลิงก์หมดอายุเร็ว ถ้าผู้ใช้เปิดหน้าค้างไว้นานให้ดึงรายการใหม่ก่อนเปิดไฟล์

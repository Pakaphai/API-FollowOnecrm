  ---

  ## 3. คำอธิบายตัวแปรใน Response

  ### ข้อมูลรายการใบลดหนี้ (`debtReductions[]`):
  * **`id`**: รหัสใบลดหนี้ (Debt Reduction ID)
  * **`document_no`**: เลขที่ใบลดหนี้ (เช่น `DR-260824-0001`)
  * **`customer_id`**: รหัสลูกค้าที่ขอลดหนี้
  * **`order_id`**: รหัสใบสั่งขายอ้างอิง
  * **`reason`**: สาเหตุที่ขอลดหนี้ (เช่น สินค้าชำรุด, สินค้าไม่ตรงตามสเปก)
  * **`status`**: รหัสสถานะภาษาอังกฤษ:
    * `pending`: รออนุมัติใบลดหนี้
    * `approved`: อนุมัติแล้ว
    * `rejected`: ไม่อนุมัติ
    * `cancelled`: ยกเลิก
    * `commissioned`: หักลบยอดในรอบคอมมิชชั่นแล้ว
  * **`status_text`**: ข้อความแสดงสถานะภาษาไทย นำไปแสดงผลบนหน้าจอได้ทันที
  * **`display_note`**: หมายเหตุประกอบของรายการสินค้าแรกในใบลดหนี้
  * **`customer`**: ข้อมูลลูกค้าที่ผูกกับใบลดหนี้ (`id`, `customer_name`, `customer_code`)
  * **`order`**: ข้อมูลคำสั่งซื้อที่อ้างอิง (`id`, `order_number`, `total_after_discount`)
  * **`created_at` / `updated_at`**: วันที่สร้างและแก้ไขใบลดหนี้

  ### ข้อมูลตัวเลือกลูกค้าตอนสร้างใบลดหนี้ (`customers[]`):
  * รายชื่อลูกค้าที่สามารถเลือกเพื่อนำมาเปิดใบลดหนี้ได้ (ระบบจะดึงเฉพาะลูกค้าที่มีใบสั่งขายสถานะ `completed` และยังไม่เคยขอลดหนี้เต็มจำนวน)
  * `customers` ส่วนนี้จะไม่ถูกตัดด้วย pagination เพื่อให้แอปนำไปแสดงใน Dropdown เลือกลูกค้าได้ครบถ้วน

  ### ข้อมูลการแบ่งหน้า (Pagination):
  * **`page`**: หน้าปัจจุบัน
  * **`size`**: จำนวนรายการต่อหน้า
  * **`total_elements`**: จำนวนใบลดหนี้ทั้งหมดที่ตรงตามเงื่อนไขค้นหา
  * **`total_pages`**: จำนวนหน้าทั้งหมด
  * **`has_next` / `has_prev`**: สถานะการมีหน้าถัดไป / หน้าก่อนหน้า

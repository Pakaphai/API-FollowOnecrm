info:
  name: list-debt-reduction
  type: http
  seq: 1

http:
  method: GET
  url: "{{sale_uat}}/api/v1/debt-reduction/list?page=1&per_page=20&q="
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## เปิดรายละเอียดใบลดหนี้ — เพิ่ม 22/09/2569

  เมื่อผู้ใช้กดรายการ ให้เรียก `GET /api/v1/debt-reduction/{id}` เพื่อรับสินค้า, เหตุผล, เอกสารอ้างอิง, รูปแบบราคา/ภาษี และยอดสรุปครบในครั้งเดียว

  ## สถานะใบลดหนี้ (ชุดเดียวกับตารางฝั่งเว็บ)

  แต่ละรายการใน `debtReductions[]` มีฟิลด์สำหรับแสดงสถานะมาให้ครบ แอปไม่ต้อง map เอง

  | ฟิลด์ | ชนิด | ความหมาย |
  |---|---|---|
  | `status` | string | ค่าดิบ `pending` · `approved` · `rejected` · `cancelled` · `commissioned` |
  | `status_text` | string | ข้อความเต็ม เช่น `รออนุมัติใบลดหนี้` — ใช้ในหน้ารายละเอียด |
  | `status_short` | string | ข้อความสั้นสำหรับป้ายในรายการ เช่น `รออนุมัติ` · `ออกคอมแล้ว` |
  | `status_color` | string | โทนสีของป้าย: `warning` · `success` · `info` · `danger` · `secondary` |
  | `status_icon` | string | ชื่อไอคอน Remix Icon เช่น `ri-time-line` (แอปจะ map เป็นไอคอนของตัวเองก็ได้) |
  | `can_delete` | boolean | `true` = แสดงปุ่มลบได้ · ใช้กติกาเดียวกับ `DELETE debt-reduction/delete/{id}` |

  | status | status_short | status_color | status_icon |
  |---|---|---|---|
  | `pending` | รออนุมัติ | warning | ri-time-line |
  | `approved` | อนุมัติแล้ว | success | ri-checkbox-circle-line |
  | `rejected` | ไม่อนุมัติ | danger | ri-close-circle-line |
  | `cancelled` | ยกเลิก | danger | ri-indeterminate-circle-line |
  | `commissioned` | ออกคอมแล้ว | info | ri-hand-coin-line |

  > `commissioned` เปลี่ยนสีจาก `success` เป็น `info` เพื่อแยกจาก `approved` ให้เห็นชัด

  ตัวอย่าง (ข้อมูลสมมติ ตัดฟิลด์อื่นออก):

  ```json
  { "id": 123, "status": "pending", "status_text": "รออนุมัติใบลดหนี้",
    "status_short": "รออนุมัติ", "status_color": "warning",
    "status_icon": "ri-time-line", "can_delete": true }
  ```

  ## VAT และยอดรวมของแต่ละใบ — เพิ่ม 23/09/2569

  `total_amount` เป็น "ยอดลดหนี้" ก้อนเดียวที่ไม่ได้แยกภาษีไว้ ตอนนี้มี VAT กับยอดรวมมาให้ด้วย
  แยกด้วยกฎ `price_mode` ของ**ใบสั่งขายต้นทาง** — ชุดเดียวกับที่ตารางฝั่งเว็บและ `GET debt-reduction/{id}` ใช้

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `total_amount` | ยอดลดหนี้ (ราคาที่เสนอลูกค้า) |
  | `vat_amount` | ภาษีมูลค่าเพิ่มของใบนี้ |
  | `total_with_vat` | ยอดรวมของใบลดหนี้ |
  | `show_vat` | `false` = ใบนี้ไม่คิดภาษี ให้แสดงขีด `-` แทน `0.00` |
  | `price_mode` | โหมดภาษีของใบสั่งขายต้นทาง · `null` = ใบเก่าที่หาต้นทางไม่เจอ |

  > ⚠️ เส้นนี้ยอดเงินเป็น **สตางค์** (เหมือน `total_amount` เดิม) หาร 100 เองก่อนแสดง
  > ต่างจาก `GET debt-reduction/{id}` ที่เป็นบาทแล้ว

  ความสัมพันธ์ตามโหมด:

  | `price_mode` | ความหมาย | `vat_amount` | `total_with_vat` |
  |---|---|---|---|
  | `novat` | แยกภาษี 7% | `total_amount × 7%` | `total_amount + vat_amount` |
  | `vat` | รวมภาษี 7% | ถอด `7/107` ออกจาก `total_amount` | `= total_amount` (ภาษีแฝงอยู่แล้ว) |
  | `price` | ไม่มีภาษี | `0` (`show_vat: false`) | `= total_amount` |

  ```json
  { "document_no": "SR-202609-0007", "price_mode": "novat",
    "total_amount": 13500000, "vat_amount": 945000,
    "total_with_vat": 14445000, "show_vat": true }
  ```

  ยอดตั้งต้นยึดผลรวมรายการสินค้าในใบก่อน ใบที่ไม่มีรายการจึงตกไปใช้ `total_amount` ของหัวเอกสาร

  ## การคืนของ

  แต่ละรายการใน `debtReductions[]` มี `is_returned` เป็น string ที่บันทึกในฐานข้อมูล:
  - `"Y"` = มีการคืนของ
  - `"N"` = ไม่มีการคืนของ

  Mobile แสดงค่า `item.is_returned` ในคอลัมน์ "การคืนของ" ได้เลย
  ห้ามตรวจด้วย `if (item.is_returned)` เพราะ string "N" ก็เป็น truthy ให้ใช้ `item.is_returned === "Y"`

  ตัวอย่าง response ย่อ (ข้อมูลสมมติ ตัดฟิลด์อื่นและ pagination เพื่อให้อ่านง่าย):

  ```json
  {
    "debtReductions": [
      { "id": 123, "is_returned": "Y", "display_note": null },
      { "id": 124, "is_returned": "N", "display_note": "ปรับราคา" }
    ]
  }
  ```

  `display_note` อาจเป็น null เมื่อไม่ได้ระบุหมายเหตุ แสดงเป็น `-` ได้
  ค่า `is_returned` อยู่ระดับใบลดหนี้หนึ่งใบ ไม่ได้แยกตามสินค้าแต่ละรายการ

  ## การแบ่งหน้า (pagination)

  เส้นนี้แบ่งหน้าเสมอ ไม่ส่งอะไรมาก็ได้ 20 รายการแรก

  | พารามิเตอร์ | ชนิด | ค่าเริ่มต้น |
  |---|---|---|
  | `page` | integer >= 1 | 1 |
  | `per_page` | integer 1-200 | 20 |
  | `q` | string <= 100 | - |

  ส่ง `per_page` เกิน 200 หรือ `q` ยาวเกิน 100 ตัว จะได้ 422

  ## การค้นหา (q)

  `q` ถูกส่งไปกรองที่ฐานข้อมูล **ก่อน** แบ่งหน้า จึงค้นเจอทุกรายการที่ตรงคีย์เวิร์ด
  ไม่ใช่เฉพาะหน้าที่โหลดมาแล้ว ค้นแบบไม่แยกตัวพิมพ์เล็กใหญ่ (ILIKE) และมีคำนี้อยู่ตรงไหนก็ได้

  ค้นจาก: เลขที่เอกสาร - ชื่อลูกค้า - รหัสลูกค้า - ชื่อผู้ติดต่อ

  > key `customers` (ลิสต์ตัวเลือกตอนสร้างใบลดหนี้) **ไม่ถูกกรองด้วย q** กรองเฉพาะ key `debtReductions`

  meta ที่แนบกลับมาทุกครั้ง (ระดับเดียวกับ key ของรายการ):

  ```json
  { "page": 1, "size": 20, "total_elements": 137, "total_pages": 7,
    "has_next": true, "has_prev": false }
  ```

  ต้องวนดึงต่อตาม `has_next` / `total_pages` ถ้าอยากได้ครบทุกรายการ
  รายละเอียดทั้งหมดอยู่ที่ docs/api-reference.md หัวข้อ "การแบ่งหน้า (pagination)"

  ## เลขเอกสารอ้างอิงของใบลดหนี้

  ใบลดหนี้อ้างอิง **เลขใบเสนอราคาต้นทาง** ไม่ใช่เลขใบสั่งขาย (กติกาเดียวกับฝั่งเว็บ)

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `quotation_number` | เลขที่ใบเสนอราคาต้นทางของใบสั่งขายที่อ้างอิง · `null` = ใบเก่าที่ไม่มีต้นทาง |
  | `reference_number` | **เลขที่ควรเอาไปแสดง** — ใช้เลข QT ก่อน ไม่มีจึงตกไปใช้เลข PO ไม่ปล่อยช่องว่าง |
  | `order.quotation` | ความสัมพันธ์ที่โหลดมาให้ด้วย (`quotation_number` อยู่ในนี้) |

  > ยังส่ง `order.order_number` มาเหมือนเดิม แอปรุ่นเดิมจึงไม่พัง

  ## ไฟล์ใบลดหนี้

  แอดมินแนบไฟล์ใบลดหนี้ (PDF / JPG / PNG) ได้ตอนกดอนุมัติบนเว็บ — ไม่บังคับ

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `attachment_url` | ลิงก์เปิดไฟล์ใบลดหนี้ (S3 แบบมีลายเซ็น **หมดอายุใน 10 นาที**) · `null` = ใบนี้ไม่มีไฟล์แนบ |
  | `attachment_path` | path ของไฟล์บน S3 — ไว้เช็คว่ามีไฟล์หรือไม่ ห้ามเอาไปต่อเป็นลิงก์เอง |

  > ลิงก์หมดอายุเร็ว ถ้าผู้ใช้เปิดหน้าค้างไว้นานให้ดึงรายการใหม่ก่อนเปิดไฟล์

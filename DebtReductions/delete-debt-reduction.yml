docs: |-
  ## 5. `DELETE /api/v1/debt-reduction/delete/{id}`

  ลบใบลดหนี้ — เป็น soft delete (`is_delete = true`) ทั้งตัวใบและรายการสินค้าในใบ

  > ⚠️ **เดิมไฟล์นี้ระบุ method เป็น `POST` ซึ่งผิด** — route จริงเป็น `DELETE` มาตลอด
  > ยิงด้วย POST จะได้ 405 Method Not Allowed

  ### คืน HTTP 200 เสมอ

  ทุกกรณีที่ลบไม่ได้คืน **200 พร้อม `success: false`** ไม่ใช่ 403/404
  แอปจึงใช้โค้ดชุดเดิมอ่านได้ ไม่ต้องเพิ่มเคสใหม่

  ```json
  { "success": true,  "message": "ลบใบลดยอดหนี้สำเร็จ" }
  { "success": false, "message": "ใบลดยอดหนี้ไม่พบ" }
  { "success": false, "message": "ใบลดหนี้เลขที่ SR-202608-0003 อยู่ในสถานะ \"อนุมัติแล้ว\" จึงลบไม่ได้ (ตัดยอดลูกหนี้ไปแล้ว) กรุณาติดต่อแอดมินให้ยกเลิกใบนี้ให้" }
  ```

  | เงื่อนไข | ผล |
  |---|---|
  | ใบของตัวเอง สถานะ `pending` · `rejected` · `cancelled` | ลบได้ |
  | สถานะ `approved` · `commissioned` | **ลบไม่ได้** — ตัดยอดลูกหนี้ไปแล้ว ต้องให้แอดมินยกเลิก |
  | ไม่พบใบ **หรือ** เป็นใบของเซลส์คนอื่น | `"ใบลดยอดหนี้ไม่พบ"` |

  > **"ไม่พบ" กับ "ไม่ใช่ใบของคุณ" คืนข้อความเดียวกันโดยตั้งใจ** — ถ้าแยกข้อความ
  > จะกลายเป็นช่องให้ไล่เดา id ว่าใบไหนมีอยู่จริงในระบบบ้าง

  แอดมิน (level 0/1) ลบได้ทุกใบทุกสถานะ

  ---

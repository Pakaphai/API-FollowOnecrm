http:
  method: POST
  url: "{{sale_uat}}/api/v1/debt-reduction/store"
  body:
    type: json
    data: |-
      {
          "customer_id": 4 ,
          "order_id": 4,
          "total_amount": 2997.00,
          "note": "สินค้าชำรุด",
          "items": [
            { "selected": "1", "order_item_id": 7, "quantity": 6, "unit_price": 1500 },
            { "selected": "0", "order_item_id": 8, "quantity": 6, "unit_price": 666 }
          
          ]
        }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## 4. `POST /api/v1/debt-reduction/store`

  สร้างใบลดหนี้ สถานะเริ่มต้น `pending` (รออนุมัติ) — ยังไม่ตัดยอดลูกหนี้จนกว่าแอดมินจะอนุมัติ

  | ฟิลด์ | บังคับ | กติกา |
  |---|:---:|---|
  | `customer_id` | ✅ | ต้องเป็นลูกค้าของผู้ใช้ที่ล็อกอิน |
  | `order_id` | ✅ | ต้องเป็นใบสั่งขาย**ของลูกค้ารายนั้น** |
  | `total_amount` | ✅ | numeric — รับค่าที่มีคอมมาได้ (`1,200.00`) ระบบตัดให้ก่อนตรวจ |
  | `note` / `note_other` | ✅ | ถ้า `note = "อื่นๆ"` จะใช้ `note_other` แทน |
  | `items[].order_item_id` | ✅ | id ของบรรทัดสินค้าจาก `order-items/{order_id}` |
  | `items[].quantity` | ✅ | **ห้ามเกินจำนวนในใบสั่งขาย** |
  | `items[].selected` | ✅ | `"1"` = เลือก · `"0"` = ไม่เลือก |
  | `items[].unit_price` | | **ไม่มีผลกับเพดาน** — เซิร์ฟเวอร์ใช้ราคาจริงเสมอ |
  | `image` | | jpeg,png,jpg,gif ≤ **2MB** |

  ### เพดานยอดลดหนี้

  เซิร์ฟเวอร์คิดเพดานจาก **ราคาจริงในใบสั่งขาย × จำนวนที่ขอลด** ไม่ใช่จากตัวเลขที่แอปส่งมา

  ```
  เพดาน = Σ (ราคาปกติของบรรทัด × items[].quantity)
  ```

  ราคาปกตินี้เป็นค่าเดียวกับ `unit_price_baht` ที่ `order-items/{order_id}` ส่งให้
  ยอดที่หน้าจอโชว์กับเพดานที่เซิร์ฟเวอร์ตรวจจึงตรงกันเสมอ

  > ⚠️ **ส่ง `unit_price` สูงกว่าความจริงไม่ช่วยให้เพดานสูงขึ้น** — เดิมเพดานคิดจาก
  > `quantity × unit_price` ที่แอปส่งมา ส่ง 12 × 10,000 ก็ได้เพดาน 120,000
  > ทั้งที่ใบสั่งขายมีสินค้าแค่ 10 ชิ้น ตอนนี้ปิดช่องนี้แล้ว

  ### 422 ที่เจอได้

  ```json
  { "message": "จำนวนที่ลดหนี้ของ \"รองเท้าวิ่ง Nik Air Zoom 50\" มากกว่าจำนวนในใบสั่งขาย (ลดได้สูงสุด 10)",
    "errors": { "items": ["...", "..."] } }
  ```

  | ข้อความ | เกิดเมื่อ |
  |---|---|
  | `จำนวนที่ลดหนี้ของ "…" มากกว่าจำนวนในใบสั่งขาย (ลดได้สูงสุด N)` | `quantity` เกินจำนวนจริง |
  | `จำนวนที่ลดหนี้ของ "…" ต้องมากกว่า 0` | `quantity` เป็น 0 หรือติดลบ |
  | `มีรายการสินค้าที่ไม่ได้อยู่ในใบสั่งขายที่เลือก` | `order_item_id` ไม่ใช่ของ order นี้ |
  | `ยอดลดหนี้สุทธิห้ามมากกว่ายอดของรายการที่เลือก (N บาท)` | `total_amount` เกินเพดาน |
  | `ยอดลดหนี้สุทธิควรกรอกจำเป็น และต้องมากกว่า 0` | `total_amount` ≤ 0 |
  | `ใบสั่งขายที่เลือกไม่ใช่ของลูกค้ารายนี้` | `order_id` ไม่ได้อยู่ใต้ `customer_id` |
  | `กรุณาเลือกรายการสินค้าอย่างน้อย 1 รายการ` | ไม่มี item ไหน `selected = "1"` |

  `errors.items` เป็น**อาร์เรย์** รองรับกรณีผิดหลายบรรทัดพร้อมกัน ส่วน `message` คือข้อความแรก
  ไว้แสดงใน dialog ได้ทันที — ทุกข้อความเป็นภาษาไทยพร้อมใช้ ไม่ต้อง map เอง

  ### 403

  ```json
  { "success": false, "status": false, "message": "คุณไม่มีสิทธิ์เข้าถึงใบสั่งขายนี้" }
  ```

  เกิดเมื่อ `order_id` เป็นของเซลส์คนอื่น — เดิมเส้นนี้ไม่ตรวจเจ้าของเลย

  ---

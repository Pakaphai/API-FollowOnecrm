docs: |
  # API — รายละเอียดใบลดหนี้

  ```
  GET /api/v1/debt-reduction/{id}
  Authorization: Bearer <token>
  Accept: application/json
  ```

  ใช้เมื่อกดเปิดแผงรายละเอียดใบลดหนี้จากรายการ โดยรวมข้อมูลที่ต้องใช้ในหน้าจอเดียว: ลูกค้า, เอกสารอ้างอิง, รายการลดหนี้, เหตุผล, สถานะ, ไฟล์แนบ และยอดสรุป

  ## สิทธิ์

  แอดมิน/ธุรการดูได้ทุกใบ ส่วนพนักงานขายดูได้เฉพาะใบลดหนี้ของตนเองเท่านั้น (`403` หากไม่มีสิทธิ์)

  ## Response สำคัญ

  เงินทุกฟิลด์เป็น **บาท** แล้ว

  ```json
  {
    "status": "success",
    "debt_reduction": {
      "id": 1,
      "document_no": "SR-202609-0010",
      "reduction_date": "2026-09-22",
      "status": "approved",
      "status_text": "อนุมัติแล้ว",
      "status_color": "success",
      "reason": "คืนของ",
      "attachment_url": "https://..."
    },
    "customer": {
      "id": 40,
      "name": "บริษัท ตัวอย่าง จำกัด",
      "contact_name": "สมชาย",
      "phone": "025892859"
    },
    "source_document": {
      "quotation_number": "QT-2026-0067",
      "order_number": "PO-260922-0006",
      "invoice_number": "IV-392/333",
      "price_mode": "novat"
    },
    "items": [
      { "product_name": "กระเป๋า 4", "quantity": 1, "unit_price": 15000, "subtotal": 15000, "note": "คืนของ" }
    ],
    "summary": {
      "gross_amount": 15000,
      "net_amount": 15000,
      "vat_amount": 1050,
      "reduction_amount": 16050,
      "remaining_amount": 114395
    }
  }
  ```

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `source_document.price_mode` | `price` = ไม่มี VAT, `novat` = แยก VAT 7%, `vat` = รวม VAT 7% |
  | `summary.gross_amount` | ยอดรายการก่อนแยก VAT |
  | `summary.net_amount` / `vat_amount` / `reduction_amount` | ยอดก่อน VAT / VAT / ยอดลดหนี้รวมตามรูปแบบราคา |
  | `attachment_url` | ลิงก์ไฟล์แนบ S3 แบบชั่วคราว; `null` คือไม่มีไฟล์ |

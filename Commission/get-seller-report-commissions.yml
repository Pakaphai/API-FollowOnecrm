docs: |
  # API — รายงานค่าคอมมิชชั่นพนักงานขาย

  ```
  GET /api/v1/reports/seller/commissions?year=2026&month=9
  Authorization: Bearer <token>
  Accept: application/json
  ```

  ใช้แสดงส่วนค่าคอมมิชชั่นของรายงานพนักงานขายตามเดือนที่เลือก

  | พารามิเตอร์ | ชนิด | รายละเอียด |
  |---|---|---|
  | `year` | integer | ค.ศ. เช่น `2026` |
  | `month` | integer 1–12 | เดือนที่ออกใบค่าคอม |
  | `user_id` | integer | ระบุพนักงานขายได้เฉพาะแอดมิน/ธุรการ (level 0/1) |

  ## สิทธิ์

  - level 0/1: ดูรายงานของตนเอง หรือระบุ `user_id` ของพนักงานขายคนอื่นได้
  - level 2: ดูได้เฉพาะข้อมูลของตนเอง การส่ง `user_id` ของคนอื่นจะได้ `403`
  - ระดับอื่น: `403 forbidden`

  ## Response สำคัญ

  เงินทุกฟิลด์เป็น **บาท** แล้ว ไม่ต้องหาร 100 ซ้ำ

  ```json
  {
    "seller": { "id": 12, "name": "พนักงานขาย" },
    "period": { "year": 2026, "month": 9 },
    "summary": {
      "document_count": 1,
      "base_amount": 282842.00,
      "commission_before_withholding": 28284.20,
      "withholding_tax": 848.53,
      "net_commission": 27435.67
    },
    "commissions": [
      {
        "id": 2,
        "commission_number": "CM-202609-0002",
        "issued_date": "2026-09-22",
        "rate_percent": 10,
        "base_amount": 282842.00,
        "commission_before_withholding": 28284.20,
        "withholding_tax": 848.53,
        "net_commission": 27435.67,
        "quotation_refer": "QT-2026-0067",
        "order_refer": "PO-260922-0006",
        "order_count": 1
      }
    ]
  }
  ```

  `net_commission` = `commission_before_withholding - withholding_tax`

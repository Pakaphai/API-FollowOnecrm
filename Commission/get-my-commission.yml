  ---

  ## 3. `data.summary` — การ์ด 4 ใบบนหัวหน้าจอ

  | ฟิลด์ | การ์ดบนเว็บ | ความหมาย |
  |---|---|---|
  | `commission` | **ค่าคอมปี 2569** | ค่าคอมรวมทั้งปีที่เลือก (ก่อนหักภาษี) |
  | `commission_this_month` | บรรทัดล่างของการ์ดแรก | ค่าคอมของ**เดือนปัจจุบัน**เท่านั้น |
  | `has_this_month` | - | `false` เมื่อดูปีย้อนหลัง → **ซ่อนบรรทัด "เดือนนี้"** (ค่าจะเป็น 0 เสมอ) |
  | `tax` | **หัก ณ ที่จ่าย** | ภาษีที่ถูกหักไว้รวมทั้งปี |
  | `net` | **ยอดสุทธิที่ได้รับ** | `commission - tax` |
  | `sales` | คอลัมน์ยอดขายรวม | ยอดขายรวมของใบค่าคอมทั้งปี |
  | `bill_count` | ป้าย "N ใบ" ข้างหัวตาราง | จำนวนใบค่าคอมในปีที่เลือก = `bills.length` |

  ---

  ## 4. `data.pending` — การ์ด "รออกค่าคอม"

  ใบสั่งขายของตัวเองที่ **ส่งของและเก็บเงินครบแล้ว แต่ฝ่ายบัญชียังไม่ได้ออกใบค่าคอมให้**

  | ฟิลด์ | ความหมาย |
  |---|---|
  | `count` | จำนวนใบสั่งขายที่ค้างอยู่ |
  | `sales_base` | ยอดขายรวมของใบที่ค้างอยู่ (บาท) |

  เงื่อนไขที่นับ: `status = completed` · `payment_status = paid` · `commission_status = 1`
  ชุดเดียวกับหน้า "ข้อมูลใบสั่งขาย" ของแอดมิน ตัวเลขที่เซลส์เห็นจึงตรงกับกองงานที่แอดมินเห็น

  > **ไม่มีตัวเงินค่าคอมที่จะได้** เพราะเรทจริงถูกเลือกตอนแอดมินออกใบ ไม่ได้ผูกตายกับตัวเซลส์
  > `sales_base` เป็นแค่ยอดขายอ้างอิง **ห้ามเอาไปคูณเรทเองแล้วโชว์ว่า "จะได้เท่านี้"**

  ---

  ## 5. `data.bills[]` — แต่ละใบค่าคอม

  | ฟิลด์ | หมายเหตุ |
  |---|---|
  | `id` | ใช้กับเส้น `my/commission/{id}` |
  | `commission_number` | เลขที่ใบ เช่น `CM-202608-0002` |
  | `issued_at` | ISO 8601 เวลาไทย (`+07:00`) — ใช้จัดเรียง/คำนวณ |
  | `issued_date` | `YYYY-MM-DD` (ค.ศ.) |
  | `issued_date_display` | `20/08/2569` — **พ.ศ.** พร้อมแสดงตรง ๆ เหมือนบนเว็บ |
  | `commission_rate` | เปอร์เซ็นต์จริง เช่น `10` |
  | `commission_rate_display` | `"10%"` — ตัดทศนิยม เหมือนป้ายเรทบนเว็บ |
  | `total_value` | ยอดขายรวมของใบ |
  | `total_discount` | ส่วนลดรวม |
  | `total_commission` | ค่าคอมก่อนหักภาษี |
  | `withholding_tax` | หัก ณ ที่จ่าย |
  | `net` | `total_commission - withholding_tax` |
  | `order_refer` | เอกสารอ้างอิงที่แอดมินกรอกไว้ตอนออกใบ (เก็บเลขใบสั่งขาย) · **ไม่มี = `null`** · คงไว้ให้แอปรุ่นเดิมไม่พัง |
  | `quotation_refer` | **เอกสารอ้างอิงที่ต้องโชว์** — เลขใบเสนอราคาต้นทางของทุกใบในใบค่าคอมนี้ คั่นด้วยจุลภาค · ไม่มีเลย = `null` |
  | `order_count` | จำนวนใบสั่งขายในใบนี้ = `orders.length` |
  | `orders[]` | ใบสั่งขายที่ถูกรวมอยู่ในใบค่าคอมนี้ — **รวมยอดต่อ 1 ใบแล้ว** |

  ### `bills[].orders[]`

  | ฟิลด์ | หมายเหตุ |
  |---|---|
  | `order_id` | `orders.id` — ยิงต่อที่ `api/order/details/{id}` ได้ |
  | `order_number` | เลขที่ใบสั่งขาย |
  | `quotation_number` | **เลขที่ใบเสนอราคาต้นทาง** — เลขที่ควรเอาไปแสดง · `null` = ใบเก่าที่ไม่มีต้นทาง ให้ตกไปใช้ `order_number` |
  | `order_date` | `YYYY-MM-DD` |
  | `customer_name` | **มีคำนำหน้านิติบุคคลประกอบมาแล้ว** (`บริษัท … จำกัด`) · ไม่มีชื่อ = `"—"` · อย่าประกอบซ้ำในแอป |
  | `total_value` · `total_commission` · `withholding_tax` | ยอดของใบสั่งขายใบนั้น (บาท) |

  > **ใบสั่งขายส่งมาพร้อมรายการเลย** ไม่ต้องยิงเส้น `{id}` ตอนกดดูรายละเอียด
  > ใบค่าคอมต่อปีมีไม่มาก หน้าเว็บก็ render รายละเอียดไว้ล่วงหน้าแบบเดียวกัน

  > `orders[]` **รวมยอดต่อ `order_id`** เพราะตาราง `commission_detail` มีได้หลายแถวต่อใบสั่งขายใบเดียว
  > (หน้าออกใบค่าคอมของแอดมินยิง `order_id` ซ้ำมาเท่าจำนวนบรรทัดสินค้า) `order_count` จึงเป็นจำนวนใบจริง

  ---

  ## 6. ปีที่ไม่มีข้อมูล

  ยังได้ **200** — `bills` เป็น `[]` และตัวเลขใน `summary` เป็น `0` ทั้งหมด
  `years` มีปีปัจจุบันเสมอแม้ยังไม่เคยได้ใบเลย (dropdown ต้องมีตัวเลือกให้เลือก)

  หน้าจอว่างควรบอกว่า *"ใบค่าคอมจะขึ้นที่นี่หลังฝ่ายบัญชีออกใบให้แล้ว"* เหมือนบนเว็บ — การ์ด `pending` ยังมีค่าอยู่ได้

  ---

  ## 7. หน่วยของตัวเลข — จุดที่พลาดง่าย

  | คอลัมน์ในฐานข้อมูล | เก็บเป็น | ที่ API ส่งออก |
  |---|---|---|
  | `total_value` · `total_discount` · `total_commission` · `withholding_tax` | **สตางค์** | บาท (÷100, ทศนิยม 2) |
  | `commission_rate` | **เปอร์เซ็นต์ × 100** (`1000` = 10%) | เปอร์เซ็นต์จริง (`10`) |
  | `created_at` | **UTC** | เวลาไทย `Asia/Bangkok` |

  `created_at` เป็น UTC ทำให้ใบที่ออกช่วงต้นปี/ปลายปีตกปีผิดได้ถ้าไม่แปลงโซนเวลาก่อนตัดปี
  ฝั่งเซิร์ฟเวอร์แปลงแล้วทั้งการกรองปีและวันที่ที่ส่งออก แอปใช้ `issued_at` / `issued_date_display` ได้ตรง ๆ

  ---

  ## 8. Error

  | HTTP | `code` | เมื่อไหร่ |
  |---|---|---|
  | **401** | - | ไม่มี token / token ใช้ไม่ได้ |
  | **403** | `forbidden` | `level` ไม่ใช่ 0/1/2 |

  ---


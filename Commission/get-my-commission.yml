info:
  name: get-my-commission
  type: http
  seq: 1

http:
  method: GET
  url: "{{sale_uat}}/api/v1/my/commission?year=2026"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # API — ค่าคอมของฉัน (My Commission)

  ค่าคอมมิชชั่นของ **ผู้ที่ล็อกอินอยู่** — ข้อมูลชุดเดียวกับหน้าเว็บ `/my/commission`

  ```
  GET /api/v1/my/commission?year=2026
  Authorization: Bearer <token>
  Accept: application/json
  ```

  เรียกได้เฉพาะ `level` 0 / 1 / 2 (แอดมิน + พนักงานขาย) ระดับอื่นได้ **403** `forbidden`

  > **ผูกกับผู้ที่ล็อกอินเสมอ — ไม่มีพารามิเตอร์ `user_id`**
  > ส่ง `user_id` มาก็ไม่มีผล หัวหน้าดูของลูกทีมผ่านเส้นนี้ไม่ได้ (ต้องเพิ่มด่านสิทธิ์ก่อน)

  > **ตัวเลขเงินใน response เป็นหน่วยบาทแล้ว** (หารด้วย 100 มาให้) และ `commission_rate` เป็นเปอร์เซ็นต์จริง
  > ต่างจากค่าที่เก็บในตาราง `commission` ที่เป็นสตางค์และเปอร์เซ็นต์คูณร้อย — **แอปห้ามหารซ้ำ**

  ---

  ## 1. พารามิเตอร์

  | ชื่อ | ชนิด | ค่าเริ่มต้น | หมายเหตุ |
  |---|---|---|---|
  | `year` | integer (**ค.ศ.**) | ปีปัจจุบัน | ส่งปีที่ไม่มีใน `data.years` มา ระบบดึงกลับเป็นปีปัจจุบันให้ ไม่ error |

  เป็น **ค.ศ.** ไม่ใช่ พ.ศ. — dropdown บนเว็บโชว์ พ.ศ. แต่ค่าที่ส่ง/รับเป็น ค.ศ.
  response แนบ `year_be` และ `label` มาให้แล้ว แอปไม่ต้องบวก 543 เอง

  ---


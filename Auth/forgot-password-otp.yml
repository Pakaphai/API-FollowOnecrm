docs: |
  # ลืมรหัสผ่าน ขั้นที่ 1 — ขอรหัส OTP

  ```
  POST /api/v1/forgot-password/otp
  Content-Type: application/json
  ```

  **ไม่ต้องมี token** — เส้นสาธารณะ แต่ **ต้องยิงเข้า subdomain ของบริษัท** เหมือน `POST login`
  เช่น `https://acme.followonecrm.com/api/v1/forgot-password/otp`
  บัญชีผู้ใช้อยู่ในฐานข้อมูลของแต่ละบริษัท ยิงเข้าโดเมนกลางจะหาบัญชีไม่เจอ

  | ฟิลด์ | บังคับ | หมายเหตุ |
  |---|:---:|---|
  | `email` | ✅ | **อีเมลหรือเบอร์โทรศัพท์** ก็ได้ — ใช้ค้นบัญชี |

  > OTP ส่งเข้า **อีเมลของบัญชีนั้นเสมอ** แม้จะกรอกเบอร์โทรมาค้นหา
  > ระบบยังไม่มีช่องทางส่ง SMS การกรอกเบอร์จึงเป็นแค่วิธีค้นบัญชี ไม่ใช่ปลายทางของรหัส

  ## สำเร็จ `200`

  ```json
  {
    "success": true,
    "message": "ระบบได้ส่งรหัส OTP ไปที่อีเมล pe*****@gmail.com แล้ว",
    "masked_email": "pe*****@gmail.com",
    "expires_in": 600
  }
  ```

  - `masked_email` เอาไปแสดงให้ผู้ใช้รู้ว่ารหัสไปที่ไหน โดยไม่เผยอีเมลเต็ม
  - `expires_in` อายุ OTP หน่วย **วินาที** (600 = 10 นาที) เอาไปนับถอยหลังบนหน้าจอ

  ## ไม่สำเร็จ

  | HTTP | เมื่อไร |
  |:---:|---|
  | `422` | รูปแบบไม่ใช่ทั้งอีเมลและเบอร์โทร 10 หลัก |
  | `404` | ไม่พบบัญชีที่ตรงกับอีเมล/เบอร์นี้ |
  | `422` | บัญชีมีอยู่แต่ไม่ได้ระบุอีเมลไว้ — ส่ง OTP ไปไหนไม่ได้ |
  | `429` | ขอถี่เกินไป — **5 ครั้ง / 15 นาที ต่อ IP** |
  | `500` | ส่งอีเมลไม่ออก (SMTP ล่ม) — คำขอถูกลบทิ้ง ให้ลองใหม่ |

  ---

  ปุ่ม "ขอรหัสใหม่" บนหน้าจอเรียกเส้นนี้ซ้ำได้เลย — ขอใบใหม่เมื่อไร OTP ใบเก่าใช้ไม่ได้ทันที

  📄 ภาพรวมทั้ง 3 ขั้น → [api-forgot-password.md](api-forgot-password.md)

docs: |
  # ลืมรหัสผ่าน ขั้นที่ 1 — ขอรหัส OTP

  ```
  POST /api/v1/forgot-password/otp
  Content-Type: application/json
  ```

  **ไม่ต้องมี token** — เส้นสาธารณะ แต่ **ต้องยิงเข้า subdomain ของบริษัท** เหมือน `POST login`
  เช่น `https://acme.followonecrm.com/api/v1/forgot-password/otp`
  บัญชีผู้ใช้อยู่ในฐานข้อมูลของแต่ละบริษัท ยิงเข้าโดเมนกลางจะหาบัญชีไม่เจอ

  | ฟิลด์ | บังคับ | หมายเหตุ |
  |---|:---:|---|
  | `email_or_phone` | ✅ | **อีเมลหรือเบอร์โทรศัพท์** ก็ได้ — ใช้ค้นบัญชี (ชื่อฟิลด์เดิมคือ `email` ยังใช้ได้อยู่เพื่อ backward compat แต่แนะนำให้ใช้ชื่อนี้) |

  > ช่องทางส่งขึ้นกับสิ่งที่กรอกมาค้นหาบัญชี **กรอกอีเมล → ส่งอีเมล, กรอกเบอร์มือถือ → ส่ง SMS**
  > (ผ่าน ThaiBulkSMS) เบอร์บ้าน/สำนักงานรับ SMS ไม่ได้ ให้ใช้อีเมลของบัญชีแทน

  ## สำเร็จ `200` (ช่องทางอีเมล)

  ```json
  {
    "success": true,
    "message": "ระบบได้ส่งรหัส OTP ไปที่อีเมล pe*****@gmail.com แล้ว",
    "channel": "email",
    "masked_email": "pe*****@gmail.com",
    "masked_phone": null,
    "expires_in": 600
  }
  ```

  ## สำเร็จ `200` (ช่องทาง SMS)

  ```json
  {
    "success": true,
    "message": "ระบบได้ส่งรหัส OTP ไปที่เบอร์ 081*****67 แล้ว",
    "channel": "sms",
    "masked_email": null,
    "masked_phone": "081*****67",
    "expires_in": 600
  }
  ```

  - `channel` เป็น `"email"` หรือ `"sms"` — ใช้เลือกข้อความ/ไอคอนที่แสดงบนหน้าจอ
  - `masked_email` / `masked_phone` ปิดบังไว้ — เอาไปแสดงให้ผู้ใช้รู้ว่ารหัสไปที่ไหน โดยไม่เผยข้อมูลเต็ม (อีกฟิลด์เป็น `null`)
  - `expires_in` อายุ OTP หน่วย **วินาที** (600 = 10 นาที) เอาไปนับถอยหลังบนหน้าจอ

  ## ไม่สำเร็จ

  | HTTP | เมื่อไร |
  |:---:|---|
  | `422` | รูปแบบไม่ใช่ทั้งอีเมลและเบอร์โทร 10 หลัก |
  | `422` | กรอกเบอร์บ้าน/สำนักงาน — รับ SMS ไม่ได้ ต้องใช้เบอร์มือถือหรืออีเมล |
  | `404` | ไม่พบบัญชีที่ตรงกับอีเมล/เบอร์นี้ |
  | `422` | บัญชีมีอยู่แต่ไม่ได้ระบุอีเมลไว้ (เมื่อค้นด้วยอีเมล) — ส่ง OTP ไปไหนไม่ได้ |
  | `429` | ขอถี่เกินไป — **5 ครั้ง / 15 นาที ต่อ IP** |
  | `500` | ส่งอีเมล/SMS ไม่ออก (SMTP หรือ ThaiBulkSMS ล่ม/ยังไม่ตั้งค่า) — คำขอถูกลบทิ้ง ให้ลองใหม่ |

  ---

  ปุ่ม "ขอรหัสใหม่" บนหน้าจอเรียกเส้นนี้ซ้ำได้เลย — ขอใบใหม่เมื่อไร OTP ใบเก่าใช้ไม่ได้ทันที

  📄 ภาพรวมทั้ง 3 ขั้น → [api-forgot-password.md](api-forgot-password.md)

docs: |
  # ลืมรหัสผ่าน ขั้นที่ 2 — ยืนยัน OTP

  ```
  POST /api/v1/forgot-password/verify-otp
  Content-Type: application/json
  ```

  **ไม่ต้องมี token** · ยิงเข้า subdomain เดียวกับขั้นที่ 1

  | ฟิลด์ | บังคับ | หมายเหตุ |
  |---|:---:|---|
  | `email` | ✅ | ค่าเดียวกับที่ใช้ขอ OTP |
  | `otp` | ✅ | 6 หลัก — มีช่องว่าง/ขีดปนมาได้ ระบบตัดให้ก่อนเทียบ |

  ## สำเร็จ `200`

  ```json
  {
    "success": true,
    "message": "ยืนยันรหัส OTP เรียบร้อยแล้ว",
    "reset_token": "JSz1F4Xa2RcH...",
    "expires_in": 900
  }
  ```

  `reset_token` ยาว 64 ตัวอักษร · อายุ **15 นาที** · **ใช้ได้ครั้งเดียว**
  เก็บไว้ในหน่วยความจำของแอปพอ ไม่ต้องบันทึกลงเครื่อง แล้วส่งต่อไปที่ `forgot-password/reset`

  ## ไม่สำเร็จ

  | HTTP | เมื่อไร |
  |:---:|---|
  | `404` | ไม่พบคำขอ OTP ของบัญชีนี้ (ยังไม่ได้ขอ หรือขอใบใหม่ไปแล้ว) |
  | `422` | OTP หมดอายุ |
  | `422` | OTP ไม่ถูกต้อง — ข้อความบอกจำนวนครั้งที่เหลือ เช่น "เหลือโอกาสอีก 4 ครั้ง" |
  | `429` | กรอกผิดครบ **5 ครั้ง** ต่อหนึ่งคำขอ — ต้องกดขอรหัสใหม่ |

  ---

  ## ทำไมต้องมีขั้นนี้

  `reset_token` ถูกออกให้ **หลัง** ยืนยัน OTP เท่านั้น ระหว่างที่ยังไม่ยืนยันจึงไม่มี token
  ที่ใช้ตั้งรหัสผ่านได้ลอยอยู่เลย และเมื่อยืนยันผ่านแล้วรหัส OTP จะถูกล้างทิ้งทันที
  เอารหัสเดิมมายืนยันซ้ำไม่ได้

  📄 ภาพรวมทั้ง 3 ขั้น → [api-forgot-password.md](api-forgot-password.md)

info:
  name: forgot-password-reset
  type: http
  seq: 6

http:
  method: POST
  url: "{{sale_uat}}/api/v1/forgot-password/reset"
  body:
    type: json
    data: |
      {
        "reset_token": "วางค่า reset_token ที่ได้จากขั้นที่ 2",
        "password": "NewPass1234",
        "password_confirmation": "NewPass1234"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # ลืมรหัสผ่าน ขั้นที่ 3 — ตั้งรหัสผ่านใหม่

  ```
  POST /api/v1/forgot-password/reset
  Content-Type: application/json
  ```

  **ไม่ต้องมี token** (ใช้ `reset_token` ใน body แทน) · ยิงเข้า subdomain เดียวกับสองขั้นแรก

  | ฟิลด์ | บังคับ | กติกา |
  |---|:---:|---|
  | `reset_token` | ✅ | ค่าที่ได้จาก `forgot-password/verify-otp` |
  | `password` | ✅ | อย่างน้อย 8 ตัวอักษร |
  | `password_confirmation` | ✅ | ต้องตรงกับ `password` |

  ## สำเร็จ `200`

  ```json
  { "success": true, "message": "ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว" }
  ```

  **ไม่ได้คืน JWT** โดยตั้งใจ — ให้แอปพาผู้ใช้กลับไปหน้าเข้าสู่ระบบแล้วล็อกอินด้วยรหัสใหม่
  จะได้ยืนยันว่าจำรหัสที่เพิ่งตั้งได้จริง

  ## ไม่สำเร็จ

  | HTTP | เมื่อไร |
  |:---:|---|
  | `422` | `password` สั้นกว่า 8 ตัว หรือยืนยันไม่ตรง |
  | `422` | `reset_token` ผิด / หมดอายุ / **ถูกใช้ไปแล้ว** / **ยังไม่ผ่านขั้นยืนยัน OTP** |

  ---

  ## ข้ามขั้นไม่ได้

  ระบบตัดสินจาก `verified_at` ในฐานข้อมูล ไม่ใช่แค่ว่าผู้เรียกถือ token ที่ถูกต้องอยู่
  ต่อให้เดา `reset_token` ถูกแต่ไม่เคยยืนยัน OTP ก็ตั้งรหัสไม่ผ่าน

  ตั้งรหัสสำเร็จแล้วคำขอถูกประทับ `used_at` — token ใบเดิมใช้ซ้ำไม่ได้

  📄 ภาพรวมทั้ง 3 ขั้น → [api-forgot-password.md](api-forgot-password.md)
